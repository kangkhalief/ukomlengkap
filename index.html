<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UKOM Pajak DJP — Prioritas &amp; Reguler</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1e2430; --muted:#667085;
  --accent:#2457d9; --accent-dark:#163a9e;
  --prio:#dc2626; --prio-bg:#fdecec; --prio-border:#f5b5b0;
  --reg:#475569; --reg-bg:#eef1f5; --reg-border:#d6dde6;
  --sama:#b45309; --sama-bg:#fef3c7;
  --case:#7c3aed; --case-bg:#f3ecfd; --case-border:#d9c7f9;
  --good:#16a34a; --bad:#dc2626;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 80px;}
header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0;}
header.top h1{font-size:18px;font-weight:800;margin:0;}
header.top .sub{font-size:12px;color:var(--muted);}
.backlink{font-size:13px;color:var(--accent);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:4px;margin-bottom:14px;}
.backlink:hover{text-decoration:underline;}
.screen{display:none;}
.screen.active{display:block;}
.grid-files{display:grid;gap:14px;margin-top:10px;}
.file-card{background:var(--card);border-radius:var(--radius);padding:20px;cursor:pointer;border:1px solid #e3e7ee;box-shadow:0 1px 2px rgba(20,20,43,.04);transition:.15s;}
.file-card:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(36,87,217,.14);transform:translateY(-1px);}
.file-card h3{margin:0 0 6px;font-size:17px;font-weight:700;}
.file-card p{margin:0;font-size:13px;color:var(--muted);line-height:1.5;}
.file-card .tag{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--reg-bg);color:var(--reg);}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
@media (max-width:560px){.mode-grid{grid-template-columns:1fr;}}
.mode-card{background:var(--card);border-radius:var(--radius);padding:26px 18px;text-align:center;cursor:pointer;border:1px solid #e3e7ee;box-shadow:0 1px 2px rgba(20,20,43,.04);transition:.15s;}
.mode-card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 6px 18px rgba(36,87,217,.14);}
.mode-card .emoji{font-size:34px;}
.mode-card h3{margin:10px 0 4px;font-size:16px;}
.mode-card p{margin:0;font-size:12.5px;color:var(--muted);}
.toggle-row{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;}
.toggle-btn{flex:1;min-width:120px;padding:10px 14px;border-radius:12px;border:2px solid var(--reg-border);background:var(--card);font-weight:700;font-size:13px;cursor:pointer;color:var(--reg);text-align:center;}
.toggle-btn.active.prioritas{border-color:var(--prio);background:var(--prio-bg);color:var(--prio);}
.toggle-btn.active.reguler{border-color:var(--accent);background:#eaf0ff;color:var(--accent-dark);}
.toggle-btn.active.studikasus{border-color:var(--case);background:var(--case-bg);color:var(--case);}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:.3px;}
.badge.prioritas{background:var(--prio-bg);color:var(--prio);border:1px solid var(--prio-border);}
.badge.reguler{background:var(--reg-bg);color:var(--reg);border:1px solid var(--reg-border);}
.badge.studikasus{background:var(--case-bg);color:var(--case);border:1px solid var(--case-border);}
.badge.sama{background:var(--sama-bg);color:var(--sama);border:1px solid #fcd34d;margin-left:6px;}
.badge.page{background:#eef1f5;color:#94a0b3;font-weight:600;}
.q-text{white-space:pre-line;}
.r-card{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:12px;border:1px solid #e9ecf1;}
.r-card .r-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.r-card h4{margin:0;font-size:15px;font-weight:700;flex:1;}
.r-card .body{font-size:13.5px;line-height:1.65;color:#374151;}
.r-card .body ul,.r-card .body ol{margin:6px 0 6px 18px;padding:0;}
.r-card .body table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12.5px;}
.r-card .body th,.r-card .body td{border:1px solid #e3e7ee;padding:6px 8px;text-align:left;}
.r-card .body th{background:#f4f6f9;}
.count-row{display:flex;gap:10px;align-items:center;margin:10px 0 16px;font-size:12.5px;color:var(--muted);}
.qty-row{display:flex;gap:10px;margin:16px 0;}
.qty-btn{flex:1;padding:16px 8px;border-radius:14px;border:2px solid var(--reg-border);background:var(--card);font-weight:800;font-size:18px;cursor:pointer;color:var(--ink);text-align:center;}
.qty-btn span{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:2px;}
.qty-btn.active{border-color:var(--accent);background:#eaf0ff;color:var(--accent-dark);}
.btn-primary{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-primary:disabled{background:#c7cedb;cursor:not-allowed;}
.btn-ghost{display:block;width:100%;padding:12px;border:2px solid var(--reg-border);border-radius:12px;background:transparent;color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;margin-top:10px;}
.quiz-meta{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:14px;border:1px solid #e9ecf1;position:sticky;top:10px;z-index:5;}
.quiz-meta .progress-bar{height:8px;border-radius:99px;background:#e9ecf1;overflow:hidden;margin-top:8px;}
.quiz-meta .progress-fill{height:100%;background:var(--accent);transition:.25s;}
.q-card{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:14px;border:1px solid #e9ecf1;}
.q-card .q-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.q-card .q-num{font-weight:800;color:var(--muted);font-size:12.5px;}
.q-card .q-text{font-size:14.5px;font-weight:600;margin:4px 0 12px;line-height:1.55;}
.opt{display:block;width:100%;text-align:left;padding:10px 14px;border:2px solid #e3e7ee;border-radius:10px;background:#fbfcfe;font-size:13.5px;margin-bottom:8px;cursor:pointer;color:#374151;}
.opt:hover{border-color:var(--accent);}
.opt.correct{border-color:var(--good);background:#eefbf0;color:#15803d;font-weight:700;}
.opt.wrong{border-color:var(--bad);background:#fdecec;color:#b91c1c;font-weight:700;}
.opt.disabled-opt{cursor:default;}
.opt.disabled-opt:hover{border-color:#e3e7ee;}
.explain{margin-top:10px;padding:10px 12px;background:#f8fafc;border-left:3px solid var(--accent);border-radius:8px;font-size:12.5px;color:#334155;line-height:1.55;display:none;white-space:pre-line;}
.explain.show{display:block;}
.footer-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e3e7ee;padding:12px 16px;display:flex;gap:10px;justify-content:center;}
.footer-bar .inner{max-width:900px;width:100%;display:flex;gap:10px;align-items:center;}
.footer-bar .status{flex:1;font-size:13px;color:var(--muted);font-weight:600;}
.footer-bar button{padding:12px 20px;border-radius:10px;border:none;font-weight:700;cursor:pointer;font-size:13.5px;}
.footer-bar .btn-finish{background:var(--accent);color:#fff;}
.footer-bar .btn-finish:disabled{background:#c7cedb;}
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,30,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:18px;padding:28px 24px;max-width:380px;width:100%;text-align:center;}
.modal-box .score{font-size:44px;font-weight:800;color:var(--accent);margin:6px 0;}
.modal-box .score-sub{font-size:13px;color:var(--muted);margin-bottom:14px;}
.modal-box h3{margin:0 0 4px;font-size:17px;}
.empty-note{background:#fff8e6;border:1px solid #fcd34d;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#92400e;margin-bottom:14px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>UKOM Pajak DJP</h1>
      <div class="sub">Ringkasan &amp; Latihan Soal — Prioritas vs Reguler</div>
    </div>
  </header>

  <section id="screen-file" class="screen active">
    <div class="grid-files" id="file-grid"></div>
  </section>

  <section id="screen-mode" class="screen">
    <div class="backlink" onclick="goTo('screen-file')">&larr; Ganti File</div>
    <div class="mode-grid">
      <div class="mode-card" onclick="openRingkasan()">
        <div class="emoji">📖</div>
        <h3>Ringkasan Materi</h3>
        <p>Baca rangkuman per topik</p>
      </div>
      <div class="mode-card" onclick="openKuisSetup()">
        <div class="emoji">📝</div>
        <h3>Latihan Soal</h3>
        <p>Kuis dengan pembahasan</p>
      </div>
    </div>
  </section>

  <section id="screen-ringkasan" class="screen">
    <div class="backlink" onclick="goTo('screen-mode')">&larr; Kembali</div>
    <div id="ringkasan-toggle" class="toggle-row"></div>
    <div id="ringkasan-count" class="count-row"></div>
    <div id="ringkasan-list"></div>
  </section>

  <section id="screen-kuis-setup" class="screen">
    <div class="backlink" onclick="goTo('screen-mode')">&larr; Kembali</div>
    <div id="jenis-soal-toggle"></div>
    <h3 style="margin-top:0;" id="qty-heading">Pilih Jumlah Soal</h3>
    <div class="qty-row" id="qty-row"></div>
    <div id="kuis-info" class="count-row"></div>
    <button class="btn-primary" id="btn-start-kuis" onclick="startKuis()">Mulai Kuis</button>
  </section>

  <section id="screen-kuis-run" class="screen">
    <div class="backlink" onclick="goTo('screen-kuis-setup')">&larr; Atur Ulang</div>
    <div class="quiz-meta">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:700;">
        <span id="quiz-progress-text">0/0 terjawab</span>
        <span id="quiz-composition"></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="quiz-progress-fill" style="width:0%;"></div></div>
    </div>
    <div id="empty-note-holder"></div>
    <div id="quiz-list"></div>
  </section>
</div>

<div class="footer-bar" id="footer-bar" style="display:none;">
  <div class="inner">
    <div class="status" id="footer-status">0/0 terjawab</div>
    <button class="btn-ghost" style="width:auto;margin:0;" onclick="regenKuis()">🔄 Acak Soal Baru</button>
    <button class="btn-finish" id="btn-finish" onclick="finishKuis()">Selesai</button>
  </div>
</div>

<div class="modal-overlay" id="modal-result">
  <div class="modal-box">
    <h3 id="modal-title">Hasil Kuis</h3>
    <div class="score" id="modal-score">0%</div>
    <div class="score-sub" id="modal-sub">0 dari 0 benar</div>
    <button class="btn-primary" onclick="regenKuis(); closeModal();">🔄 Acak Soal Baru</button>
    <button class="btn-ghost" onclick="goTo('screen-mode'); closeModal();">Kembali ke Menu</button>
  </div>
</div>

<script>
const DATA = {"pemeriksaan": {"file": "pemeriksaan", "label": "Pemeriksaan", "ringkasan": [{"heading": "Kewenangan Melakukan Pemeriksaan", "p": 1, "html": "<p>Dasar hukum: <strong>Pasal 29 UU KUP</strong> jo. <strong>KEP-305/PJ/2024</strong> tentang Pelimpahan Kewenangan Direktur Jenderal Pajak kepada Para Pejabat di Lingkungan DJP.</p><ul><li>Direktur Jenderal Pajak <strong>berwenang</strong> melakukan Pemeriksaan untuk menguji kepatuhan pemenuhan kewajiban perpajakan dan/atau untuk tujuan lain.</li><li>Kewenangan tersebut <strong>dilimpahkan</strong> (didelegasikan) kepada <strong>Pemeriksa Pajak</strong> di lingkungan Kantor Pelayanan Pajak (KPP) melalui KEP-305/PJ/2024 (nomor urut 40 dalam lampiran keputusan).</li></ul>", "page": "hlm 4", "id": "pemeriksaan_r_0"}, {"heading": "Definisi Pemeriksaan", "p": 1, "html": "<p>Pemeriksaan adalah <strong>serangkaian kegiatan menghimpun dan mengolah data, keterangan, dan/atau bukti</strong> yang dilaksanakan secara <strong>objektif dan profesional berdasarkan suatu standar pemeriksaan</strong> untuk menguji kepatuhan pemenuhan kewajiban perpajakan dan/atau untuk tujuan lain dalam rangka melaksanakan ketentuan peraturan perundang-undangan perpajakan.</p><p>Unsur kunci: Menghimpun + Mengolah (data+keterangan+bukti) → Objektif + Profesional → Standar Pemeriksaan → berujung pada Menerbitkan SKP + Tujuan Lain.</p>", "page": "hlm 8-9", "id": "pemeriksaan_r_1"}, {"heading": "Kriteria Pemeriksaan Efektif (SE-15/PJ/2018)", "p": 1, "html": "<ul><li><strong>Pemeriksaan selesai dan pencairan optimal</strong> — tunggakan pemeriksaan diminimalisasi agar Pemeriksa Pajak optimal mengerjakan pemeriksaan tahun berjalan.</li><li><strong>Upaya hukum minimal</strong> — kualitas pemeriksaan ditingkatkan agar hasilnya lebih baik.</li><li><strong>Restitusi terkendali</strong> — melalui optimalisasi pengembalian pendahuluan sesuai Pasal 17C & 17D UU KUP serta Pasal 9 ayat (4c) UU PPN.</li><li><strong>Menciptakan kepatuhan berkelanjutan</strong> — terlihat dari dinamisasi SPT tahun-tahun setelah pemeriksaan, bukan hanya kepatuhan sesaat.</li></ul>", "page": "hlm 15", "id": "pemeriksaan_r_2"}, {"heading": "Standar Pelaksanaan Pemeriksaan", "p": 1, "html": "<p>Bagian tengah dari 3 jenis Standar Pemeriksaan (Umum, Pelaksanaan, Pelaporan) berdasarkan PER-23/PJ/2013. Standar Pelaksanaan Pemeriksaan mewajibkan Pemeriksa Pajak untuk:</p><ol type='a'><li>melakukan <strong>persiapan</strong> sesuai tujuan Pemeriksaan;</li><li>melakukan pengujian berdasarkan <strong>metode dan teknik</strong> Pemeriksaan;</li><li>mendasarkan temuan pada <strong>bukti yang kuat dan berkaitan</strong> serta berlandaskan ketentuan perpajakan;</li><li>melaksanakan Pemeriksaan di kantor DJP, tempat tinggal/kedudukan WP, tempat usaha, lokasi Objek Pajak PBB, dan/atau tempat lain yang dianggap perlu;</li><li>mendokumentasikan pelaksanaan dalam bentuk <strong>kertas kerja Pemeriksaan</strong>.</li></ol>", "page": "hlm 17", "id": "pemeriksaan_r_3"}, {"heading": "Persiapan Pemeriksaan (4 Langkah)", "p": 1, "html": "<ol><li><strong>Membuat KKP Identifikasi Masalah</strong>, berisi pos SPT atau turunan yang akan diperiksa.</li><li><strong>Membuat Usulan Rencana Pemeriksaan.</strong></li><li><strong>Menyusun Program Pemeriksaan</strong> berdasarkan Rencana Pemeriksaan, berisi teknik pemeriksaan serta buku/catatan/dokumen yang harus dipinjam.</li><li><strong>Menyusun Prosedur Pemeriksaan.</strong></li></ol>", "page": "hlm 18", "id": "pemeriksaan_r_4"}, {"heading": "Teknik Pemeriksaan yang Ditandai Prioritas", "p": 1, "html": "<p>Dari 16+ teknik pemeriksaan Metode Langsung, 4 teknik ditandai prioritas (kotak merah):</p><ul><li><strong>Pemanfaatan data/informasi</strong></li><li><strong>Ekualisasi/rekonsiliasi</strong></li><li><strong>Konfirmasi</strong></li><li><strong>Wawancara</strong></li></ul>", "page": "hlm 22", "id": "pemeriksaan_r_5"}, {"heading": "Pemanfaatan Data/Informasi DJP", "p": 1, "html": "<p>Sumber data/informasi utama Pemeriksa Pajak:</p><ul><li><strong>Sistem Informasi DJP</strong>: informasi WP, monitoring, data SPT, pengawasan kepatuhan, administrasi ketetapan pajak & penagihan, manajemen kasus.</li><li><strong>Aplikasi Portal DJP</strong>: data WP, data penerimaan, data unit kerja, aplikasi online & konfirmasi, data pihak ketiga, pengawasan.</li><li><strong>APPROWEB</strong>: Profil CRM WP, data pemicu, data faktur pajak, LHA, KKPt/LHPt, SP2DK/LHP2DK, notifikasi data, Ability to Pay (ATP).</li><li><strong>Document Management System (DMS)</strong>: pencarian dokumen, viewer dokumen, informasi dokumen, arsip digital, akses dokumen.</li></ul>", "page": "hlm 23-24", "id": "pemeriksaan_r_6"}, {"heading": "Perbandingan Metode Langsung dan Tidak Langsung", "p": 1, "html": "<p>Metode Tidak Langsung <strong>digunakan dalam hal Metode Langsung tidak dapat diterapkan</strong>, atau untuk mendukung penggunaan Metode Langsung/identifikasi masalah. <strong>Pemeriksa Pajak harus memiliki bukti</strong> bahwa Metode Langsung tidak dapat digunakan sebelum beralih ke Metode Tidak Langsung.</p>", "page": "hlm 26", "id": "pemeriksaan_r_7"}, {"heading": "Pembahasan Temuan Sementara dalam Alur Pemeriksaan", "p": 1, "html": "<p>Dalam Alur Proses Pemeriksaan, setelah pertemuan (entry meeting) dan pelaksanaan pemeriksaan, dilakukan <strong>Pembahasan Temuan Sementara</strong> paling lama 1 bulan sebelum SPHP disampaikan. WP dapat <strong>Menolak</strong> hadir, atau jika tidak merespons maka <strong>Dianggap Menolak</strong> — pemeriksaan tetap dilanjutkan ke tahap SPHP.</p>", "page": "hlm 32 (diagram alur)", "id": "pemeriksaan_r_8"}, {"heading": "Penghitungan Penghasilan Kena Pajak Secara Jabatan", "p": 1, "html": "<p>Dasar hukum: <strong>Pasal 31 ayat (3) UU KUP.</strong> Jika WP badan/OP yang menjalankan usaha/pekerjaan bebas yang diperiksa <strong>tidak memenuhi kewajibannya</strong> sehingga penghasilan kena pajak tidak dapat dihitung, maka penghasilan kena pajak <strong>dapat dihitung secara jabatan</strong>. DJP wajib menyampaikan SPHP kepada WP dan memberi hak hadir dalam PAHP. Dokumen yang dipertimbangkan terbatas pada dokumen peredaran usaha/penghasilan bruto dan dokumen kredit pajak.</p>", "page": "hlm 58", "id": "pemeriksaan_r_9"}, {"heading": "Penyegelan", "p": 1, "html": "<p>Dasar hukum: <strong>Pasal 30 ayat (1) UU KUP.</strong> Dilakukan jika WP tidak berada di tempat atau sengaja tidak memberi kesempatan pemeriksa memasuki tempat/ruang yang dipandang perlu. Objek penyegelan: tempat, ruang, benda bergerak dan/atau tidak bergerak. Penyegelan adalah <strong>upaya terakhir</strong> pemeriksa untuk mengamankan buku/catatan/dokumen termasuk data elektronik. <strong>Penyegelan data elektronik dilakukan sepanjang tidak menghentikan kelancaran operasional perusahaan</strong>, khususnya yang berkaitan dengan kepentingan masyarakat.</p>", "page": "hlm 60", "id": "pemeriksaan_r_10"}, {"heading": "Pemeriksaan Ulang", "p": 1, "html": "<p>Dilakukan atas instruksi/persetujuan Direktur Jenderal Pajak terhadap <strong>data baru</strong> (termasuk data yang semula belum terungkap). Tiga kemungkinan hasil:</p><ul><li><strong>SKPKBT</strong> — ada tambahan jumlah pajak dari ketetapan sebelumnya.</li><li><strong>LHP Sumir</strong> — tidak ada tambahan jumlah pajak.</li><li><strong>Keputusan Rugi Fiskal</strong> — tidak ada tambahan pajak tetapi terdapat perubahan jumlah rugi fiskal.</li></ul>", "page": "hlm 63", "id": "pemeriksaan_r_11"}, {"heading": "Pengecualian Kewajiban Pembukuan bagi WP OP", "p": 1, "html": "<p>WP OP yang melakukan kegiatan usaha/pekerjaan bebas dan Badan wajib menyelenggarakan pembukuan, kecuali:</p><ol><li>WP OP yang memilih menggunakan <strong>NPPN</strong> (Norma Penghitungan Penghasilan Neto);</li><li>WP OP yang <strong>tidak melakukan</strong> kegiatan usaha/pekerjaan bebas;</li><li>WP OP dengan <strong>kriteria tertentu berdasarkan peredaran bruto</strong> sesuai <strong>PMK 54/PMK.03/2021</strong>.</li></ol>", "page": "hlm 18 (bagian Pembukuan)", "id": "pemeriksaan_r_12"}, {"heading": "Surat Ketetapan Pajak Kurang Bayar (SKPKB)", "p": 1, "html": "<p>Dasar hukum: <strong>Pasal 13 ayat (1) UU KUP.</strong> Diterbitkan dalam jangka waktu <strong>5 tahun</strong> setelah saat terutangnya pajak berdasarkan hasil Pemeriksaan, antara lain jika: pajak terutang tidak/kurang dibayar; WP diterbitkan NPWP/dikukuhkan PKP secara jabatan; PKP tidak menyerahkan BKP/JKP namun telah mengkreditkan PM; SPT tidak disampaikan setelah ditegur; PPN/PPnBM salah dikompensasikan; kewajiban Pasal 28 & 29 tidak dipenuhi. Sanksi bervariasi: bunga per bulan (suku bunga acuan + uplift 15% atau 20% : 12, maks. 24 bulan) atau kenaikan 75%.</p>", "page": "hlm 69", "id": "pemeriksaan_r_13"}, {"heading": "Jenis-jenis Ketetapan Pajak", "p": 1, "html": "<p>Berdasarkan PMK Nomor 80 Tahun 2023, Direktur Jenderal Pajak berwenang menerbitkan 4 jenis Surat Ketetapan Pajak:</p><table><tr><th>Jenis</th><th>Berdasarkan</th></tr><tr><td>SKPKB</td><td>Hasil Pemeriksaan</td></tr><tr><td>SKPKBT</td><td>Hasil Pemeriksaan Ulang</td></tr><tr><td>SKPLB</td><td>Hasil Pemeriksaan / Hasil Penelitian</td></tr><tr><td>SKPN</td><td>Hasil Pemeriksaan</td></tr></table>", "page": "hlm 68", "id": "pemeriksaan_r_14"}, {"heading": "Surat Tagihan Pajak (STP)", "p": 1, "html": "<p>Dasar hukum: <strong>Pasal 14 UU KUP.</strong> DJP menerbitkan STP dalam hal antara lain: (a) PPh tahun berjalan tidak/kurang dibayar; (b) dari penelitian SPT terdapat kekurangan pembayaran akibat salah tulis/hitung; (c) WP dikenai sanksi denda dan/atau bunga; (d) pengusaha dikukuhkan PKP tidak membuat/terlambat membuat Faktur Pajak; (e) PKP tidak mengisi Faktur Pajak secara lengkap; (f) imbalan bunga yang seharusnya tidak diberikan; (g) jumlah pajak tidak/kurang dibayar dalam masa angsuran/penundaan.</p>", "page": "hlm 73", "id": "pemeriksaan_r_15"}, {"heading": "Ringkasan Sanksi Denda", "p": 1, "html": "<p>Sanksi denda sesuai Pasal 7 ayat (1) UU KUP untuk keterlambatan pelaporan SPT:</p><table><tr><th>Jenis SPT</th><th>Denda</th></tr><tr><td>SPT Masa PPN</td><td>Rp500.000</td></tr><tr><td>SPT Masa lainnya</td><td>Rp100.000</td></tr><tr><td>SPT Tahunan PPh OP</td><td>Rp100.000</td></tr><tr><td>SPT Tahunan PPh Badan</td><td>Rp1.000.000</td></tr></table>", "page": "hlm 74", "id": "pemeriksaan_r_16"}, {"heading": "Ringkasan Sanksi Bunga", "p": 1, "html": "<p>Sanksi bunga Pasal 13 ayat (2) dan (2b) UU KUP: berdasarkan hasil pemeriksaan, pajak terutang yang tidak/kurang dibayar dikenai bunga per bulan sebesar suku bunga acuan + <strong>uplift factor 15%</strong>, dibagi 12. Untuk Pengembalian Pajak Masukan dari PKP yang tidak berproduksi juga dikenai tarif yang sama.</p>", "page": "hlm 75", "id": "pemeriksaan_r_17"}, {"heading": "Ringkasan Sanksi Kenaikan", "p": 1, "html": "<p>Sanksi kenaikan Pasal 13 ayat (3) huruf c & d UU KUP: berdasarkan hasil pemeriksaan, PPN/PPnBM yang tidak/kurang dibayar, atau PPh yang dipotong/dipungut tapi tidak/kurang disetor, dikenai <strong>kenaikan sebesar 75%.</strong></p>", "page": "hlm 76", "id": "pemeriksaan_r_18"}, {"heading": "Keberatan — Persyaratan Permohonan", "p": 1, "html": "<p>Dasar hukum: <strong>Pasal 25 UU KUP.</strong> Persyaratan permohonan keberatan:</p><ol><li>1 keberatan harus diajukan terhadap <strong>1 jenis pajak dan 1 Masa/Tahun Pajak</strong>;</li><li>tertulis dalam bahasa Indonesia dan mengemukakan jumlah pajak yang terutang/dipotong/dipungut/rugi menurut WP;</li><li><strong>melunasi pajak</strong> yang masih harus dibayar paling sedikit sejumlah yang telah disetujui WP dalam pembahasan akhir hasil pemeriksaan.</li></ol><p>Tidak memenuhi persyaratan = tidak dipertimbangkan. Diajukan dalam 3 bulan; DJP memutus dalam 12 bulan. Jika ditolak/dikabulkan sebagian, dikenai sanksi denda <strong>30%.</strong></p>", "page": "hlm 93", "id": "pemeriksaan_r_19"}, {"heading": "Banding — Sanksi Denda 60%", "p": 1, "html": "<p>Dasar hukum: <strong>Pasal 27 UU KUP.</strong> Banding diajukan atas Surat Keputusan Keberatan, paling lama 3 bulan sejak SK Keberatan diterima, ke Badan Peradilan Pajak. Jumlah pajak yang belum dibayar belum merupakan pajak terutang sampai Putusan Banding terbit (inkracht). Jika permohonan banding ditolak atau dikabulkan sebagian, WP dikenai <strong>sanksi denda 60%.</strong></p>", "page": "hlm 95", "id": "pemeriksaan_r_20"}, {"heading": "Alat Bukti dalam Sengketa Pajak", "p": 1, "html": "<p>Dasar hukum: Pasal 86 & 88 ayat (1) UU 14/2002 tentang Pengadilan Pajak. 6 jenis alat bukti: surat/tulisan, keterangan saksi, keterangan ahli, pengakuan para pihak, pengetahuan hakim, alat bukti elektronik. <strong>Majelis Hakim wajib mempertimbangkan sekurang-kurangnya 2 (dua) alat bukti yang sah</strong> dalam membuat Putusan Pengadilan Pajak.</p>", "page": "infografis Alat Bukti", "id": "pemeriksaan_r_21"}, {"heading": "Wakil Wajib Pajak", "p": 1, "html": "<p>WP diwakili dalam hal: badan oleh <strong>pengurus</strong>; badan pailit oleh <strong>kurator</strong>; badan dalam pembubaran oleh yang ditugasi pemberesan; badan dalam likuidasi oleh <strong>likuidator</strong>; warisan belum terbagi oleh salah seorang ahli waris/pelaksana wasiat/pengurus harta peninggalan; anak belum dewasa/orang dalam pengampuan oleh <strong>wali/pengampu</strong>. Wakil bertanggung jawab secara pribadi dan/atau renteng atas pajak terutang, kecuali dapat membuktikan benar-benar tidak mungkin dibebani tanggung jawab tersebut.</p>", "page": "hlm 102", "id": "pemeriksaan_r_22"}, {"heading": "Kuasa Wajib Pajak", "p": 1, "html": "<p>Dasar hukum: <strong>Pasal 32 ayat (3) UU KUP.</strong> WP dapat menunjuk kuasa dengan surat kuasa khusus — kuasa dari keluarga (suami/istri/keluarga sedarah atau semenda s.d. derajat kedua) atau bukan keluarga (konsultan pajak/pihak lain yang memiliki kompetensi tertentu dalam aspek perpajakan). Kuasa <strong>tidak dapat</strong> menjalankan hak/kewajiban WP apabila menghalang-halangi pelaksanaan UU perpajakan, atau dipidana karena tindak pidana perpajakan/lainnya.</p>", "page": "hlm 103", "id": "pemeriksaan_r_23"}, {"heading": "Syarat Wajib Pajak di Indonesia", "p": 1, "html": "<p><strong>Syarat Subjektif</strong> (siapa jadi WP): orang pribadi bertempat tinggal di Indonesia, atau berada di Indonesia >183 hari dalam 12 bulan, atau berniat tinggal di Indonesia; badan didirikan/berkedudukan di Indonesia atau menjalankan kegiatan usaha di Indonesia.</p><p><strong>Kesimpulan</strong>: WP = (Orang Pribadi/Badan) + memenuhi Syarat Subjektif + memperoleh penghasilan objek pajak (Syarat Objektif) → ditetapkan sebagai WP dengan kewajiban perpajakan.</p>", "page": "infografis Syarat WP", "id": "pemeriksaan_r_24"}, {"heading": "Kewajiban Menandatangani SPT", "p": 1, "html": "<p>WP wajib: <strong>mengisi</strong> SPT dengan benar/lengkap/jelas, <strong>menandatangani</strong> (dapat oleh Wakil WP atau Kuasa), dan <strong>menyampaikan</strong> ke tempat terdaftar/dikukuhkan/tempat lain. \"Benar\" = benar dalam perhitungan & penerapan ketentuan serta sesuai keadaan sebenarnya; \"lengkap\" = memuat semua unsur objek pajak; \"jelas\" = melaporkan asal-usul objek pajak dan unsur lain.</p>", "page": "hlm 36", "id": "pemeriksaan_r_25"}, {"heading": "Batas Waktu SPT Tahunan PPh Badan", "p": 1, "html": "<p>Berdasarkan penyesuaian ketentuan PMK 243/PMK.03/2014: SPT Tahunan <strong>PPh Badan</strong> disampaikan paling lambat <strong>4 bulan</strong> setelah akhir Tahun Pajak atau akhir Bagian Tahun Pajak (berbeda dengan PPh OP yang 3 bulan).</p>", "page": "Batas Waktu Penyampaian SPT", "id": "pemeriksaan_r_26"}, {"heading": "Batas Waktu SPT Masa (PPh 21/26/25/Unifikasi & PPN)", "p": 1, "html": "<p>SPT Masa <strong>PPh Pasal 21/26, PPh Pasal 25, dan PPh Unifikasi</strong> (Pasal 15, 22, 23/26, 4(2)) disampaikan paling lambat <strong>20 hari setelah Masa Pajak berakhir.</strong> SPT Masa <strong>PPN</strong> disampaikan paling lambat <strong>akhir bulan berikutnya</strong> setelah Masa Pajak berakhir.</p>", "page": "Batas Waktu Penyampaian SPT", "id": "pemeriksaan_r_27"}, {"heading": "Sanksi Administrasi Telat/Tidak Lapor SPT", "p": 1, "html": "<p><em>Catatan: materi ini sama dengan \"Ringkasan Sanksi Denda\" Pasal 7 ayat (1) UU KUP di atas (SPT Masa PPN Rp500.000, SPT Masa lainnya Rp100.000, SPT Tahunan OP Rp100.000, SPT Tahunan Badan Rp1.000.000) — ditandai kotak merah pada dua slide berbeda dalam materi ini.</em></p>", "page": "hlm 43 (duplikat hlm 74)", "id": "pemeriksaan_r_28"}, {"heading": "Konsep World Wide Income", "p": 1, "html": "<p>Dasar hukum: <strong>Pasal 2 & 4 ayat (1) UU PPh.</strong> Penghasilan yang diterima/diperoleh WP, baik dari Indonesia maupun luar Indonesia, merupakan objek pajak di Indonesia — berlaku <strong>hanya untuk Subjek Pajak Dalam Negeri (SPDN)</strong>. SPDN dikenai pajak atas penghasilan dari manapun (world wide income); SPLN hanya dikenai pajak atas penghasilan bersumber dari Indonesia (source income). Pajak yang telah dibayar di luar negeri dapat dikreditkan sesuai Pasal 24 UU PPh (kredit pajak luar negeri) sepanjang memenuhi syarat P3B.</p>", "page": "infografis World Wide Income", "id": "pemeriksaan_r_29"}, {"heading": "Tarif PPh Orang Pribadi Progresif 2025", "p": 1, "html": "<table><tr><th>Lapisan PKP</th><th>Tarif</th></tr><tr><td>s.d. Rp60.000.000</td><td>5%</td></tr><tr><td>&gt;Rp60.000.000 s.d. Rp250.000.000</td><td>15%</td></tr><tr><td>&gt;Rp250.000.000 s.d. Rp500.000.000</td><td>25%</td></tr><tr><td>&gt;Rp500.000.000 s.d. Rp5.000.000.000</td><td>30%</td></tr><tr><td>&gt;Rp5.000.000.000</td><td>35%</td></tr></table><p>Tarif PPh Badan umum 22%; WP Badan dalam negeri dengan peredaran bruto s.d. Rp50 miliar mendapat tarif lebih rendah 19%.</p>", "page": "Tarif PPh 2025", "id": "pemeriksaan_r_30"}, {"heading": "PTKP Tahun Pajak 2026", "p": 1, "html": "<p>Besaran PTKP 2026 (sama dengan tahun sebelumnya, belum ada perubahan):</p><ul><li>Diri WP orang pribadi: <strong>Rp54.000.000</strong></li><li>Tambahan WP kawin: <strong>Rp4.500.000</strong></li><li>Tambahan tanggungan (keluarga sedarah/semenda garis lurus + anak angkat, maks. 3 orang): <strong>Rp4.500.000/orang</strong></li></ul><p>Rumus: PTKP = 54.000.000 + 4.500.000 (jika kawin) + 4.500.000 × jumlah tanggungan (maks. 3).</p>", "page": "PTKP 2026", "id": "pemeriksaan_r_31"}, {"heading": "PPh Final UMKM 0,5%", "p": 1, "html": "<p>Dasar hukum: Pasal 31E UU PPh, PP 55/2022, PMK 164/PMK.03/2022. Dikenakan atas peredaran bruto WP Badan (PT, CV, Koperasi, dll) yang memenuhi kriteria UMKM, dengan <strong>batasan peredaran bruto tidak melebihi Rp4.800.000.000 setahun</strong> (mencakup kriteria usaha mikro & kecil). PPh Final dihitung dari <strong>peredaran bruto (omzet)</strong>, bukan laba bersih, dan hanya berlaku sampai peredaran bruto tidak melebihi Rp4,8 miliar dalam 1 tahun pajak.</p>", "page": "PPh Final UMKM", "id": "pemeriksaan_r_32"}, {"heading": "Implikasi Pajak atas Dividen", "p": 1, "html": "<p><strong>Dividen diterima WP Badan DN</strong>: dapat dikecualikan dari objek PPh jika memenuhi syarat (kepemilikan saham ≥25% & dimiliki ≥1 tahun, ATAU <25% dengan syarat Pasal 4 ayat 3 huruf f UU PPh, dividen berasal dari laba setelah pajak). Jika tidak memenuhi syarat → menjadi objek PPh.</p><p><strong>Dividen diterima WP OP DN</strong>: dikenai <strong>PPh Final tarif 10%</strong> dari jumlah bruto dividen — bersifat final, tidak digabung penghasilan lain, tidak dapat dikreditkan, namun tetap wajib dilaporkan dalam SPT Tahunan.</p>", "page": "Implikasi Pajak atas Dividen", "id": "pemeriksaan_r_33"}, {"heading": "Objek PPN Pasal 16D", "p": 1, "html": "<p>PPN dikenakan atas penyerahan BKP berupa <strong>aktiva yang menurut tujuan semula tidak untuk diperjualbelikan</strong> oleh PKP, <strong>kecuali</strong> atas penyerahan aktiva yang Pajak Masukannya tidak dapat dikreditkan menurut Pasal 9 ayat (8) huruf b dan c UU PPN (tidak berhubungan langsung dengan kegiatan usaha, atau kendaraan sedan/station wagon kecuali barang dagangan/disewakan). PPN terutang = 11% × DPP, Faktur Pajak Kode 09.</p>", "page": "hlm 90", "id": "pemeriksaan_r_34"}, {"heading": "Yang Termasuk Penyerahan BKP", "p": 1, "html": "<p>Dasar hukum: <strong>Pasal 1A ayat (1) UU PPN.</strong> Termasuk penyerahan BKP: (a) penyerahan hak atas BKP karena perjanjian; (b) pengalihan BKP karena perjanjian sewa beli/sewa guna usaha (leasing); (c) penyerahan BKP kepada pedagang perantara/juru lelang; (d) pemakaian sendiri dan/atau pemberian cuma-cuma; (e) BKP berupa persediaan/aktiva yang masih tersisa saat pembubaran perusahaan; (f) penyerahan BKP antar pusat-cabang; (h) penyerahan BKP dalam skema pembiayaan syariah. <em>Catatan: \"penyerahan BKP secara konsinyasi\" (huruf g lama) sudah tidak masuk definisi sejak UU Cipta Kerja.</em></p>", "page": "hlm 91", "id": "pemeriksaan_r_35"}, {"heading": "Formula PPN atas Ekspor JKP", "p": 1, "html": "<p>PPN = DPP (Penggantian) × Tarif <strong>0%</strong>. Dasar hukum PMK 32/PMK.010/2019.</p>", "page": "hlm 94", "id": "pemeriksaan_r_36"}, {"heading": "Cakupan Ekspor Jasa Kena Pajak", "p": 1, "html": "<p>Kegiatan Ekspor JKP mencakup 3 kategori kegiatan pelayanan di dalam Daerah Pabean yang menyebabkan barang/fasilitas/kemudahan/hak tersedia untuk dimanfaatkan di luar Daerah Pabean: (a) melekat pada barang bergerak yang dikeluarkan untuk dimanfaatkan di luar Daerah Pabean; (b) melekat pada barang tidak bergerak yang berada di luar Daerah Pabean; (c) kegiatan pelayanan lain yang hasilnya diserahkan untuk dimanfaatkan di luar Daerah Pabean berdasarkan permintaan Penerima Ekspor JKP.</p>", "page": "hlm 95", "id": "pemeriksaan_r_37"}, {"heading": "Tarif PPN Sebelum dan Sesudah 1 April 2022", "p": 1, "html": "<table><tr><th>Uraian</th><th>Sebelum 1 April 2022</th><th>Setelah 1 April 2022</th></tr><tr><td>Tarif Normal</td><td>10%</td><td>11% (menjadi 12% paling lambat 1 Januari 2025)</td></tr><tr><td>Ekspor BKP/JKP/BKPTB</td><td>0%</td><td>0%</td></tr></table>", "page": "hlm 103", "id": "pemeriksaan_r_38"}, {"heading": "Saat Terutang PPN (Prinsip Akrual)", "p": 1, "html": "<p>Pemungutan PPN dan PPnBM menganut <strong>prinsip akrual</strong>: terutangnya pajak terjadi <strong>pada saat penyerahan</strong> BKP/JKP, meskipun pembayaran atas penyerahan tersebut belum diterima/belum sepenuhnya diterima, atau pada saat impor BKP.</p>", "page": "hlm 106", "id": "pemeriksaan_r_39"}, {"heading": "Saat Pembuatan Faktur Pajak", "p": 1, "html": "<p>Faktur Pajak wajib dibuat pada: saat <strong>penyerahan</strong> BKP/JKP; saat <strong>penerimaan pembayaran</strong> jika terjadi sebelum penyerahan; saat <strong>penerimaan pembayaran termin</strong> untuk penyerahan sebagian tahap pekerjaan; saat <strong>ekspor</strong> BKP berwujud/tidak berwujud/JKP; atau <strong>saat lain</strong> yang diatur dengan PMK tersendiri.</p>", "page": "hlm 110", "id": "pemeriksaan_r_40"}, {"heading": "Dokumen Tertentu yang Dipersamakan dengan Faktur Pajak", "p": 1, "html": "<p>Dirjen Pajak dapat menetapkan dokumen tertentu yang kedudukannya dipersamakan dengan Faktur Pajak, untuk faktur penjualan yang sudah dikenal luas, pihak yang seharusnya membuat Faktur Pajak berada di luar Daerah Pabean, atau dokumen untuk impor/ekspor. Contoh: bukti tagihan jasa telekomunikasi, Pemberitahuan Impor Barang (PIB), SSP untuk PPN atas penyerahan BKP melalui juru lelang. Dibuat melewati 3 bulan sejak seharusnya dibuat → dianggap tidak membuat dokumen tertentu, PPN tidak dapat dikreditkan.</p>", "page": "hlm 112", "id": "pemeriksaan_r_41"}, {"heading": "Persyaratan Formal dan Material Faktur Pajak", "p": 1, "html": "<p><strong>Persyaratan Formal</strong>: diisi secara benar, lengkap, dan jelas sesuai Pasal 13 ayat (5)/(6) UU PPN. <strong>Persyaratan Material</strong>: berisi keterangan yang sebenarnya/sesungguhnya mengenai penyerahan BKP/JKP, ekspor, impor, atau pemanfaatan BKP Tidak Berwujud/JKP dari luar Daerah Pabean.</p>", "page": "hlm 113", "id": "pemeriksaan_r_42"}, {"heading": "Saat Pengkreditan Pajak Masukan", "p": 1, "html": "<p>Dasar hukum: <strong>Pasal 9 ayat (2) & (9) UU PPN.</strong> PM dalam suatu Masa Pajak dikreditkan dengan PK dalam Masa Pajak yang sama. PM yang dapat namun belum dikreditkan pada Masa Pajak yang sama dapat dikreditkan pada Masa Pajak berikutnya, <strong>paling lama 3 Masa Pajak</strong> setelah berakhirnya Masa Pajak saat Faktur Pajak dibuat, sepanjang belum dibebankan sebagai biaya/belum dikapitalisasi.</p>", "page": "hlm 116", "id": "pemeriksaan_r_43"}, {"heading": "Kriteria Pajak Masukan Tidak Dapat Dikreditkan", "p": 1, "html": "<p>Pasal 9 ayat (8) UU PPN — pengkreditan PM tidak berlaku bagi pengeluaran untuk: (b) perolehan BKP/JKP yang <strong>tidak mempunyai hubungan langsung</strong> dengan kegiatan usaha; (f) perolehan yang Faktur Pajaknya <strong>tidak memenuhi ketentuan</strong> Pasal 13 ayat (5)/(9) atau tidak mencantumkan identitas pembeli; (g) pemanfaatan BKP Tidak Berwujud/JKP luar Daerah Pabean yang Faktur Pajaknya tidak memenuhi Pasal 13 ayat (6).</p>", "page": "hlm 117", "id": "pemeriksaan_r_44"}, {"heading": "Pengkreditan PM yang Ditemukan Saat Pemeriksaan / Ditagih dengan Ketetapan", "p": 1, "html": "<p>PM yang tidak dilaporkan dalam SPT Masa PPN namun <strong>ditemukan saat pemeriksaan</strong> tetap <strong>dapat dikreditkan</strong> sepanjang memenuhi ketentuan pengkreditan. PM yang <strong>ditagih dengan ketetapan pajak</strong> dapat dikreditkan sebesar jumlah <strong>pokok PPN</strong> dalam ketetapan, dengan syarat ketetapan telah dilunasi dan tidak dilakukan upaya hukum.</p>", "page": "hlm 118-119", "id": "pemeriksaan_r_45"}, {"heading": "Pemeriksa Pajak dan Dasar Hukumnya", "p": 0, "html": "<p>Pemeriksa Pajak adalah pegawai negeri sipil di lingkungan DJP atau tenaga ahli yang ditunjuk oleh Direktur Jenderal Pajak, yang diberi tugas, wewenang, dan tanggung jawab melaksanakan Pemeriksaan (<strong>PMK 15/2025</strong>). Unsur kegiatan Jabatan Fungsional Pemeriksa Pajak (<strong>PERMENPAN 66/2021</strong>) terdiri atas: (a) pengujian kepatuhan perpajakan (analisis ketentuan teknis, pengawasan, pemeriksaan kepatuhan); (b) penegakan hukum perpajakan (intelijen, bukper/penyidikan/investigasi, forensik digital, penagihan, penelaahan keberatan & sengketa).</p>", "page": "hlm 5-6", "id": "pemeriksaan_r_46"}, {"heading": "Kewenangan, Tujuan, dan Tipe Pemeriksaan", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 2 PMK 15/2025.</strong> Dirjen Pajak berwenang melakukan Pemeriksaan untuk 2 tujuan: (1) Menguji Kepatuhan, (2) Tujuan Lain. Tujuan tersebut terkait dengan 3 Tipe Pemeriksaan: <strong>Lengkap</strong> (seluruh pos SPT/SPOP, mendalam), <strong>Terfokus</strong> (satu/beberapa pos, mendalam), <strong>Spesifik</strong> (satu/beberapa pos, sederhana). Dirjen Pajak melimpahkan kewenangan administrasi Pemeriksaan dalam bentuk delegasi kepada pejabat di lingkungan DJP.</p>", "page": "hlm 10", "id": "pemeriksaan_r_47"}, {"heading": "Kriteria Pemeriksaan untuk Menguji Kepatuhan (Pasal 4 PMK 15/2025)", "p": 0, "html": "<p>Dilakukan dalam hal antara lain: (a) pengembalian LB Pasal 17B KUP; (b) SPT LB selain 17B; (c) SPT menyatakan rugi; (d) telah diberikan pengembalian pendahuluan; (e) perubahan tahun buku; (f) perubahan metode pembukuan; (g) penilaian kembali aktiva tetap; (h) WP penggabungan/peleburan/pemekaran/likuidasi/pembubaran/meninggalkan Indonesia selamanya; (i) PKP tidak menyerahkan BKP/JKP tapi telah mengkreditkan PM; (j) WP terpilih berdasarkan risiko kepatuhan; (k) pihak lain tidak melaksanakan kewajiban potput; (l) terdapat data konkret; (m) WP tidak menyampaikan SPOP (khusus PBB); (n) indikasi PBB lebih besar dari SPOP (khusus PBB).</p>", "page": "hlm 11", "id": "pemeriksaan_r_48"}, {"heading": "Kriteria Pemeriksaan untuk Tujuan Lain (Pasal 4 PMK 15/2025)", "p": 0, "html": "<p>Dilakukan dengan kriteria a-y, antara lain: pemberian/penghapusan NPWP secara jabatan; pengukuhan/pencabutan PKP secara jabatan; pendaftaran/pencabutan Objek PBB secara jabatan; penyelesaian keberatan; pengumpulan bahan norma penghitungan; pencocokan data; penentuan WP di daerah terpencil; penentuan tempat terutang PPN; penyelesaian penagihan; pemenuhan pertukaran informasi internasional; penyelesaian MAP; penyelesaian permohonan APA (kesepakatan harga transfer); pengujian kepatuhan UU Akses Informasi Keuangan; hingga kriteria lainnya (banyak kriteria ditandai \"NEW\" sebagai pembaruan dari ketentuan sebelumnya).</p>", "page": "hlm 12", "id": "pemeriksaan_r_49"}, {"heading": "Jangka Waktu Pemeriksaan (Pasal 6 PMK 15/2025)", "p": 0, "html": "<p>Jangka waktu <strong>pengujian</strong> (sejak S.Pemb disampaikan s.d. SPHP): Lengkap 5 bulan, Terfokus 3 bulan, Spesifik 1 bulan, Data Konkret 10 hari kerja — dapat diperpanjang 4 bulan untuk WP Grup/WP Transfer Pricing. Jangka waktu <strong>PAHP & Pelaporan</strong> (sejak SPHP disampaikan s.d. tanggal LHP): Lengkap/Spesifik/Terfokus 30 hari kerja, Data Konkret 10 hari kerja.</p>", "page": "hlm 13", "id": "pemeriksaan_r_50"}, {"heading": "Data Konkret (PER-18/PJ/2025)", "p": 0, "html": "<p>Data Konkret adalah data yang dimiliki/diperoleh DJP berupa: (a) <strong>Faktur Pajak</strong> yang telah disetujui melalui sistem DJP tetapi belum/tidak dilaporkan dalam SPT Masa PPN; (b) <strong>Bukti Potput PPh</strong> yang belum/tidak dilaporkan oleh penerbit bukti potput pada SPT Masa PPh; (c) <strong>Bukti Transaksi/Data Perpajakan</strong> yang dapat digunakan untuk menghitung kewajiban perpajakan WP. Data Konkret memerlukan pengujian sederhana → masuk kategori Pemeriksaan Spesifik.</p>", "page": "hlm 14", "id": "pemeriksaan_r_51"}, {"heading": "Pemeriksaan Rutin vs Pemeriksaan Khusus", "p": 0, "html": "<p><strong>Pemeriksaan Rutin</strong>: dilakukan sehubungan dengan pemenuhan hak dan/atau pelaksanaan kewajiban perpajakan WP. <strong>Pemeriksaan Khusus</strong> terbagi 2: (1) berdasarkan keterangan lain berupa data konkret (<em>audit based on data</em>) — indikasi ketidakpatuhan dari data konkret; (2) berdasarkan analisis risiko (<em>risk-based audit</em>) — indikasi ketidakpatuhan dari hasil analisis risiko.</p>", "page": "hlm 16", "id": "pemeriksaan_r_52"}, {"heading": "Standar Umum dan Standar Pelaporan Hasil Pemeriksaan", "p": 0, "html": "<p><strong>Standar Umum</strong>: Pemeriksa Pajak harus (a) mendapat pendidikan/pelatihan teknis cukup serta memiliki keterampilan; (b) memiliki integritas dan independensi. <strong>Standar Pelaporan Hasil Pemeriksaan</strong>: (a) LHP disusun berdasarkan kertas kerja Pemeriksaan; (b) LHP memuat pelaksanaan, simpulan, dan usulan Pemeriksa Pajak, dapat memuat pengungkapan informasi lain terkait Pemeriksaan.</p>", "page": "hlm 17", "id": "pemeriksaan_r_53"}, {"heading": "Definisi Metode, Teknik, dan Prosedur Pemeriksaan", "p": 0, "html": "<p><strong>Metode</strong>: teknik dan prosedur pemeriksaan terhadap buku/catatan/dokumen serta data/informasi/keterangan lain, terdiri atas Metode Langsung dan Metode Tidak Langsung. <strong>Teknik</strong>: cara-cara pengumpulan bukti, pengujian, dan/atau pembuktian yang dikembangkan Pemeriksa Pajak untuk meyakini kebenaran pos yang diperiksa. <strong>Prosedur</strong>: serangkaian langkah dalam suatu Teknik, berupa petunjuk rinci tertulis dalam bentuk perintah untuk dilakukan Pemeriksa Pajak.</p>", "page": "hlm 19-20", "id": "pemeriksaan_r_54"}, {"heading": "Metode Langsung dan Metode Tidak Langsung", "p": 0, "html": "<p><strong>Metode Langsung</strong>: menguji kebenaran pos-pos yang diperiksa secara langsung terhadap buku/catatan/dokumen terkait. <strong>Metode Tidak Langsung</strong>: menguji kebenaran pos-pos secara tidak langsung melalui pendekatan penghitungan tertentu, dengan 6 pendekatan: Transaksi Tunai & Bank, Sumber & Penggunaan Dana, Pertambahan Kekayaan Bersih, Penghitungan Rasio, Penghitungan Biaya Hidup, Satuan dan/atau Volume.</p>", "page": "hlm 21", "id": "pemeriksaan_r_55"}, {"heading": "Daftar Lengkap 16+ Teknik Pemeriksaan (Metode Langsung)", "p": 0, "html": "<p>Pengujian keabsahan, evaluasi, analisis angka, penelusuran angka, penelusuran bukti, pengujian keterkaitan, ekualisasi/rekonsiliasi, permintaan keterangan, konfirmasi, inspeksi, pengujian fisik, pengujian penghitungan, wawancara, sampling, TABK (Teknik Audit Berbantuan Komputer), teknik-teknik lainnya, dan pemanfaatan data/informasi.</p>", "page": "hlm 22", "id": "pemeriksaan_r_56"}, {"heading": "Alur Proses Pemeriksaan (Ringkasan Lengkap)", "p": 0, "html": "<p>Alur: Surat Pemberitahuan Pemeriksaan → pertemuan (entry meeting) → pelaksanaan pemeriksaan (pinjam/minta buku-catatan-dokumen, minta data/informasi/keterangan, penyegelan jika perlu) → Pembahasan Temuan Sementara → SPHP → tanggapan WP → PAHP (Pembahasan Akhir Hasil Pemeriksaan) → Risalah/Ikhtisar BA → QA → KKP → LHP → Nota Hitung → SKP (atau LHP Sumir jika tidak ada temuan tambahan). Untuk Pemeriksaan Spesifik, pertemuan serta hak & kewajiban disampaikan bersama S.Pemb dan Pembahasan Temuan Sementara tidak dilakukan.</p>", "page": "hlm 32", "id": "pemeriksaan_r_57"}, {"heading": "Definisi dan Ketentuan Pembukuan dan Pencatatan", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 28 UU KUP.</strong> Pembukuan: proses pencatatan teratur meliputi harta, kewajiban, modal, penghasilan, biaya, serta harga perolehan/penyerahan barang/jasa, ditutup dengan neraca & laporan laba rugi. Pencatatan: data yang dikumpulkan teratur tentang peredaran/penerimaan bruto dan/atau penghasilan bruto. Ketentuan Pembukuan: iktikad baik, diselenggarakan di Indonesia (huruf Latin, angka Arab, Rupiah, Bahasa Indonesia/asing yang diizinkan), taat asas (Stelsel Akrual/Kas), berdasarkan Standar Akuntansi Keuangan kecuali diatur lain.</p>", "page": "hlm 16-19", "id": "pemeriksaan_r_58"}, {"heading": "Kewajiban Wajib Pajak yang Diperiksa", "p": 0, "html": "<p>Dasar hukum: Pasal 13 ayat (3) PP 50/2022. WP yang diperiksa wajib: (1) memperlihatkan dan/atau meminjamkan buku/catatan/dokumen terkait penghasilan, kegiatan usaha, objek pajak; (2) memberikan kesempatan memasuki tempat/ruang yang dipandang perlu; (3) memberikan data, informasi, dan keterangan lain yang diperlukan — dapat berupa keterangan tertulis (surat pernyataan) atau keterangan lisan (wawancara).</p>", "page": "hlm 54-57", "id": "pemeriksaan_r_59"}, {"heading": "Peniadaan Kewajiban Merahasiakan dan Pengungkapan Ketidakbenaran SPT", "p": 0, "html": "<p><strong>Pasal 29 ayat (4) UU KUP</strong>: kewajiban merahasiakan data pembukuan/dokumen ditiadakan untuk keperluan pemeriksaan, mencegah dalih kerahasiaan menghalangi pemeriksaan. <strong>Pasal 8 ayat (4) UU KUP</strong>: selama SPHP belum disampaikan, WP dapat mengungkapkan ketidakbenaran pengisian SPT (Masa/Tahunan/Bagian Tahun) dalam laporan tersendiri secara sukarela; proses pemeriksaan tetap dilanjutkan sampai selesai, SSP pengungkapan menjadi kredit SKP.</p>", "page": "hlm 59, 64", "id": "pemeriksaan_r_60"}, {"heading": "Surat Ketetapan Pajak Nihil (SKPN)", "p": 0, "html": "<p>Dasar hukum: Pasal 17A UU KUP. Diterbitkan berdasarkan hasil Pemeriksaan apabila jumlah kredit pajak atau jumlah pajak yang dibayar sama dengan jumlah pajak yang terutang, atau pajak tidak terutang dan tidak ada kredit pajak atau tidak ada pembayaran pajak.</p>", "page": "hlm 71", "id": "pemeriksaan_r_61"}, {"heading": "Gambaran Umum Upaya Hukum Perpajakan", "p": 0, "html": "<p>Penyelesaian Sengketa Perpajakan terbagi 2 jalur: <strong>Administratif</strong> (di DJP) — Pembetulan (Ps.16, dapat berkali-kali), Pengurangan & Pembatalan (Ps.36(1), maks. 2 kali selain huruf d), Prosedur Persetujuan Bersama/MAP (Ps.27C, maks. 1 kali), Keberatan (Ps.25); dan <strong>Pengadilan</strong> — Banding (Ps.27, di Pengadilan Pajak), Gugatan (Ps.23, di Pengadilan Pajak), Peninjauan Kembali (Ps.27(5e), di Mahkamah Agung).</p>", "page": "hlm 87", "id": "pemeriksaan_r_62"}, {"heading": "Prosedur Persetujuan Bersama (MAP)", "p": 0, "html": "<p>DJP berwenang melakukan MAP untuk mencegah/menyelesaikan permasalahan penerapan P3B. Pihak yang dapat mengajukan: WP dalam negeri; Dirjen Pajak; pejabat berwenang negara/yurisdiksi mitra P3B; WNI melalui Dirjen Pajak terkait perlakuan diskriminatif. Permintaan MAP dapat diajukan bersamaan dengan keberatan/banding/pengurangan-pembatalan SKP. DJP menindaklanjuti hasil MAP dengan menerbitkan SK Persetujuan Bersama, yang menjadi dasar pengembalian atau penagihan pajak.</p>", "page": "hlm 94", "id": "pemeriksaan_r_63"}, {"heading": "Gugatan ke Pengadilan Pajak", "p": 0, "html": "<p>Objek Gugatan: pelaksanaan Surat Paksa/Surat Perintah Penyitaan/Pengumuman Lelang; keputusan pencegahan dalam rangka penagihan; keputusan terkait pelaksanaan keputusan perpajakan (selain Ps.25(1)/26); penerbitan ketetapan/SK Keberatan yang tidak sesuai prosedur. Jangka waktu: 14 hari sejak pelaksanaan penagihan, atau 30 hari sejak diterimanya keputusan yang digugat. Gugatan tidak menunda pelaksanaan penagihan.</p>", "page": "hlm 96", "id": "pemeriksaan_r_64"}, {"heading": "Peninjauan Kembali (PK)", "p": 0, "html": "<p>Upaya hukum luar biasa oleh WP atau Dirjen Pajak ke Mahkamah Agung, diajukan maksimal 1 kali (Pasal 89 UU Pengadilan Pajak). Alasan PK: putusan didasarkan kebohongan/tipu muslihat pihak lawan atau bukti yang kemudian dinyatakan palsu; ditemukan bukti tertulis baru yang menentukan; dikabulkan hal yang tidak/lebih dari yang dituntut; ada tuntutan belum diputus tanpa alasan; atau putusan nyata-nyata tidak sesuai ketentuan. Putusan PK terbit maksimal 2 tahun sejak PK diterima DJP, sanksi denda 60%.</p>", "page": "hlm 97", "id": "pemeriksaan_r_65"}, {"heading": "Penunjukan Pihak Lain sebagai Pemotong/Pemungut", "p": 0, "html": "<p>Bagian Ketentuan Khusus yang mengatur penunjukan pihak lain (selain WP sendiri) sebagai pemotong/pemungut pajak, melengkapi ketentuan Wakil WP dan Kuasa WP dalam pemenuhan kewajiban perpajakan.</p>", "page": "hlm 101", "id": "pemeriksaan_r_66"}, {"heading": "SPT dan Fungsinya", "p": 0, "html": "<p>Surat Pemberitahuan (SPT) adalah surat yang digunakan WP untuk melaporkan penghitungan dan/atau pembayaran pajak, objek pajak dan/atau bukan objek pajak, dan/atau harta dan kewajiban, sesuai ketentuan perpajakan. Isi laporan: pembayaran/pelunasan pajak sendiri maupun melalui potput pihak lain; penghasilan objek/bukan objek pajak; harta dan kewajiban; dan pembayaran dari pemotong/pemungut.</p>", "page": "hlm 34", "id": "pemeriksaan_r_67"}, {"heading": "Jenis dan Bentuk SPT", "p": 0, "html": "<p>Berdasarkan PMK 81/2024, SPT terdiri dari: <strong>SPT Masa</strong> (PPh, PPN, Bea Meterai, Pajak Karbon Masa), <strong>SPT Tahunan</strong> (PPh 1 Tahun Pajak/Bagian Tahun Pajak, Pajak Karbon Tahunan), dan <strong>SPOP</strong>. Bentuk SPT: formulir kertas (hardcopy) atau dokumen elektronik. Isi SPT paling sedikit memuat: jenis pajak, nama WP & NPWP, Masa/Bagian Tahun/Tahun Pajak, tanda tangan WP/kuasa, dilampiri laporan keuangan (termasuk konsolidasi jika punya cabang).</p>", "page": "hlm 37", "id": "pemeriksaan_r_68"}, {"heading": "Ketentuan Mata Uang Dolar Amerika Serikat", "p": 0, "html": "<p>WP Badan yang diizinkan menyelenggarakan pembukuan dengan bahasa Inggris dan mata uang dolar AS wajib menyampaikan SPT PPh Badan dalam bahasa Indonesia (kecuali lampiran laporan keuangan) dan menggunakan mata uang dolar AS. WP yang ditunjuk sebagai Pihak Lain di luar Daerah Pabean dan memilih kewajiban PPN PMSE dalam dolar AS wajib mengisi SPT Masa PPN dengan mata uang dolar AS.</p>", "page": "hlm 41", "id": "pemeriksaan_r_69"}, {"heading": "Perpanjangan Penyampaian SPT Tahunan", "p": 0, "html": "<p>WP dapat memperpanjang jangka waktu penyampaian SPT Tahunan PPh paling lama <strong>2 bulan</strong> sejak batas waktu penyampaian, dengan menyampaikan Pemberitahuan Perpanjangan (kertas/elektronik) sebelum batas waktu berakhir, dilampiri penghitungan sementara pajak terutang, laporan keuangan sementara, dan SSP/Bukti Penerimaan Negara jika ada kekurangan pembayaran.</p>", "page": "hlm 47", "id": "pemeriksaan_r_70"}, {"heading": "Pembetulan SPT dan Sanksinya", "p": 0, "html": "<p>WP dapat membetulkan SPT dengan pernyataan tertulis, syarat: DJP belum melakukan Pemeriksaan atau Pemeriksaan Bukti Permulaan secara terbuka. Jika pembetulan menyebabkan rugi/lebih bayar: paling lama 2 tahun sebelum daluwarsa; jika tidak, dapat dilakukan sampai daluwarsa. Pembetulan yang menyebabkan utang pajak lebih besar dikenai sanksi bunga: (Pajak Kurang Bayar) x (suku bunga acuan + 5%)/12 x jumlah bulan.</p>", "page": "hlm 48-49", "id": "pemeriksaan_r_71"}, {"heading": "Syarat Subjek Pajak: Orang Pribadi dan Badan", "p": 0, "html": "<p><strong>Orang Pribadi</strong> memenuhi syarat subjektif jika: bertempat tinggal di Indonesia; berada di Indonesia >183 hari dalam 12 bulan; atau berniat tinggal di Indonesia. <strong>Badan</strong> memenuhi syarat subjektif jika: didirikan/bertempat kedudukan di Indonesia; bertempat kedudukan di Indonesia untuk tujuan pajak; atau menjalankan kegiatan usaha/melakukan kegiatan di Indonesia.</p>", "page": "hlm 67", "id": "pemeriksaan_r_72"}, {"heading": "Objek Pajak dan Bukan Objek Pajak (Pasal 4 UU PPh)", "p": 0, "html": "<p><strong>Objek Pajak</strong> (Pasal 4 ayat 1): penghasilan dari pekerjaan, usaha, modal, pengalihan harta, dan penghasilan lain-lain — setiap tambahan kemampuan ekonomis dari manapun asalnya. <strong>Bukan Objek Pajak</strong> (Pasal 4 ayat 3), antara lain: bantuan/sumbangan tertentu, hibah tertentu, penerimaan asuransi tertentu, dividen tertentu (dengan syarat kepemilikan), imbalan bunga obligasi negara.</p>", "page": "hlm 67", "id": "pemeriksaan_r_73"}, {"heading": "Tarif PPh Badan", "p": 0, "html": "<p>Tarif umum PPh Badan (dalam negeri dan BUT): <strong>22%</strong> dari Penghasilan Kena Pajak. WP Badan dalam negeri dengan peredaran bruto sampai dengan Rp50 miliar mendapat tarif lebih rendah <strong>19%</strong> (berlaku sejak Tahun Pajak 2022), berdasarkan Pasal 31E UU PPh.</p>", "page": "hlm 82", "id": "pemeriksaan_r_74"}, {"heading": "Timeline Pelaporan Pengukuhan PKP", "p": 0, "html": "<p>Default mulai kewajiban PKP adalah Masa Pajak pertama Tahun Buku berikutnya sejak omzet melebihi Rp4,8 miliar. WP dapat memilih memulai kewajiban PKP lebih awal dengan menyampaikan pemberitahuan Masa Pajak. Jika WP wajib lapor PKP maksimal akhir Tahun Buku namun terlambat atau tidak lapor, pengukuhan dilakukan secara jabatan atau dianggap terlambat, dengan mulai kewajiban tetap Masa Pajak pertama Tahun Buku berikutnya (PMK 164/2023).</p>", "page": "hlm 88", "id": "pemeriksaan_r_75"}, {"heading": "Objek PPN Umum (Pasal 4(1) UU PPN)", "p": 0, "html": "<p>PPN dikenakan atas: (a) penyerahan BKP di dalam Daerah Pabean oleh Pengusaha; (b) impor BKP; (c) penyerahan JKP di dalam Daerah Pabean; (d) pemanfaatan BKP Tidak Berwujud dari luar Daerah Pabean; (e) pemanfaatan JKP dari luar Daerah Pabean; (f) ekspor BKP Berwujud oleh PKP; (g) ekspor BKP Tidak Berwujud oleh PKP; (h) ekspor JKP oleh PKP. PPN terutang 11% x DPP (ekspor tarif 0%).</p>", "page": "hlm 90", "id": "pemeriksaan_r_76"}, {"heading": "Kegiatan Membangun Sendiri (KMS)", "p": 0, "html": "<p>Dasar hukum: Pasal 16C UU PPN & PMK-61/PMK.03/2022. KMS adalah kegiatan membangun bangunan tidak dalam kegiatan usaha/pekerjaan oleh orang pribadi/badan yang hasilnya digunakan sendiri/pihak lain, dengan luas minimal 200 m². Saat terutang: sejak mulai dibangun sampai selesai; tempat terutang: tempat bangunan didirikan. PPN terutang = 20% x 11% x Biaya Pembangunan (tidak termasuk harga tanah).</p>", "page": "hlm 90", "id": "pemeriksaan_r_77"}, {"heading": "Ketentuan Ekspor Jasa Kena Pajak (PMK 32/PMK.010/2019)", "p": 0, "html": "<p>Jenis JKP yang dapat diekspor dengan tarif 0%: (a) melekat pada barang bergerak yang dikeluarkan untuk dimanfaatkan di luar Daerah Pabean (mis. Jasa Maklon — dengan syarat spesifikasi/bahan baku disediakan Penerima Ekspor JKP, kepemilikan hasil berada pada Penerima Ekspor, BKP dikirim dengan mekanisme ekspor; Jasa Perawatan & Perbaikan; Jasa Pengurusan Transportasi/freight forwarding terkait ekspor); (b) melekat pada barang tidak bergerak di luar Daerah Pabean (Jasa Konsultansi Konstruksi: pengkajian, perencanaan, perancangan); (c) kegiatan pelayanan lain yang hasilnya diserahkan untuk dimanfaatkan di luar Daerah Pabean berdasarkan permintaan Penerima Ekspor JKP (jasa teknologi informasi, litbang, persewaan alat angkut pesawat/kapal internasional, konsultansi bisnis/hukum/desain/SDM/akuntansi/pajak, perdagangan, interkoneksi/satelit/konektivitas data).</p>", "page": "hlm 96-99", "id": "pemeriksaan_r_78"}, {"heading": "Jasa Teknologi Informasi dan Jasa Interkoneksi yang Dapat Diekspor", "p": 0, "html": "<p><strong>Jasa teknologi & informasi</strong>: analisis & perancangan sistem komputer, pembuatan sistem/situs web, IT security, pusat kontak (contact center), dukungan teknik, cloud computing/web hosting (server di dalam Daerah Pabean), pembuatan konten (games, animasi, desain grafis). <strong>Jasa interkoneksi/satelit/konektivitas data</strong>: interkoneksi panggilan/SMS internasional, transmitter & responder satelit, pengendalian satelit, ketersambungan internet global — oleh penyelenggara dalam negeri kepada penyelenggara/penerima layanan luar negeri.</p>", "page": "hlm 99-100", "id": "pemeriksaan_r_79"}, {"heading": "Syarat Ekspor JKP agar Dikenai PPN 0%", "p": 0, "html": "<p>Harus didasarkan atas perikatan/perjanjian tertulis antara PKP dan Penerima Ekspor JKP yang mencantumkan jelas jenis, rincian kegiatan, dan nilai penyerahan JKP, DAN terdapat pembayaran disertai bukti pembayaran yang sah. Kegiatan pelayanan yang tidak memenuhi ketentuan dianggap sebagai penyerahan JKP di dalam Daerah Pabean yang dikenai PPN tarif normal. JKP yang dihasilkan dan dimanfaatkan di luar Daerah Pabean tidak dikenai PPN.</p>", "page": "hlm 102", "id": "pemeriksaan_r_80"}, {"heading": "Saat dan Tempat Terutang PPN atas Ekspor JKP", "p": 0, "html": "<p>Saat terutang PPN atas Ekspor JKP adalah <strong>saat Ekspor JKP</strong>, yaitu saat penggantian atas jasa yang diekspor dicatat/diakui sebagai piutang atau penghasilan. PKP yang melakukan Ekspor JKP wajib membuat Faktur Pajak berupa Pemberitahuan Ekspor BKP Tidak Berwujud/JKP, dilampiri invoice sebagai satu kesatuan dokumen; dibuat melalui Portal Wajib Pajak (PMK-81) sesuai format PMK-32.</p>", "page": "hlm 104", "id": "pemeriksaan_r_81"}, {"heading": "Formula Umum Penghitungan PPN", "p": 0, "html": "<p>Dasar hukum: Pasal 8A ayat (1) UU PPN. Formula umum: <strong>PPN = Tarif x DPP (Dasar Pengenaan Pajak)</strong>, di mana DPP dapat berupa Harga Jual, Penggantian, Nilai Impor, Nilai Ekspor, atau Nilai Lain yang ditetapkan Menteri Keuangan.</p>", "page": "hlm 105-108", "id": "pemeriksaan_r_82"}, {"heading": "Pajak Masukan — Definisi Umum", "p": 0, "html": "<p>Dasar hukum: Pasal 1 angka 24 UU PPN. Pajak Masukan adalah PPN yang seharusnya sudah dibayar oleh PKP karena: perolehan BKP dan/atau JKP; pemanfaatan BKP Tidak Berwujud dan/atau JKP dari luar Daerah Pabean; dan/atau impor BKP — dibuktikan dengan Faktur Pajak atau dokumen tertentu yang dipersamakan dengan Faktur Pajak.</p>", "page": "hlm 114", "id": "pemeriksaan_r_83"}], "soal": [{"q": "Kewenangan Direktur Jenderal Pajak untuk melakukan Pemeriksaan didelegasikan kepada Pemeriksa Pajak di lingkungan KPP melalui keputusan apa?", "o": ["KEP-305/PJ/2024", "PER-18/PJ/2025", "PMK 15/2025", "SE-15/PJ/2018"], "c": 0, "e": "Pelimpahan kewenangan Dirjen Pajak kepada pejabat di lingkungan DJP, termasuk ke Pemeriksa Pajak di KPP, diatur dalam KEP-305/PJ/2024.", "p": 1, "topic": "Kewenangan Pemeriksaan", "id": "pemeriksaan_q_0"}, {"q": "Dalam definisi Pemeriksaan, kegiatan \"menghimpun dan mengolah data, keterangan, dan/atau bukti\" harus dilaksanakan secara...", "o": ["Cepat dan efisien", "Objektif dan profesional berdasarkan standar pemeriksaan", "Rahasia dan tertutup", "Sesuai permintaan Wajib Pajak"], "c": 1, "e": "Definisi Pemeriksaan menekankan pelaksanaan secara objektif dan profesional berdasarkan suatu standar pemeriksaan.", "p": 1, "topic": "Definisi Pemeriksaan", "id": "pemeriksaan_q_1"}, {"q": "Manakah yang BUKAN termasuk kriteria Pemeriksaan Efektif menurut SE-15/PJ/2018?", "o": ["Pemeriksaan selesai dan pencairan optimal", "Upaya hukum minimal", "Restitusi terkendali", "Jumlah pemeriksaan sebanyak-banyaknya"], "c": 3, "e": "4 kriteria pemeriksaan efektif adalah: pemeriksaan selesai & pencairan optimal, upaya hukum minimal, restitusi terkendali, dan menciptakan kepatuhan berkelanjutan — bukan soal kuantitas pemeriksaan.", "p": 1, "topic": "Kriteria Pemeriksaan Efektif", "id": "pemeriksaan_q_2"}, {"q": "Kepatuhan berkelanjutan sebagai indikator pemeriksaan efektif dapat terlihat dari...", "o": ["Jumlah SKP yang terbit", "Dinamisasi SPT pada tahun-tahun setelah pemeriksaan", "Besarnya sanksi yang dikenakan", "Lamanya proses pemeriksaan"], "c": 1, "e": "Kepatuhan berkelanjutan terlihat dari dinamisasi SPT WP pada tahun-tahun setelah dilakukan pemeriksaan, bukan hanya kepatuhan sesaat.", "p": 1, "topic": "Kriteria Pemeriksaan Efektif", "id": "pemeriksaan_q_3"}, {"q": "Standar Pelaksanaan Pemeriksaan mewajibkan Pemeriksa Pajak mendokumentasikan pelaksanaan pemeriksaan dalam bentuk...", "o": ["Laporan Hasil Pemeriksaan", "Kertas kerja Pemeriksaan", "Surat Pemberitahuan Pemeriksaan", "Nota perhitungan"], "c": 1, "e": "Standar Pelaksanaan Pemeriksaan huruf e mewajibkan pendokumentasian pelaksanaan Pemeriksaan dalam bentuk kertas kerja Pemeriksaan.", "p": 1, "topic": "Standar Pemeriksaan", "id": "pemeriksaan_q_4"}, {"q": "Langkah pertama dalam Persiapan Pemeriksaan adalah...", "o": ["Menyusun Prosedur Pemeriksaan", "Membuat Usulan Rencana Pemeriksaan", "Membuat KKP Identifikasi Masalah", "Menyusun Program Pemeriksaan"], "c": 2, "e": "Urutan Persiapan Pemeriksaan: (1) KKP Identifikasi Masalah, (2) Usulan Rencana Pemeriksaan, (3) Program Pemeriksaan, (4) Prosedur Pemeriksaan.", "p": 1, "topic": "Persiapan Pemeriksaan", "id": "pemeriksaan_q_5"}, {"q": "Dari 16+ teknik pemeriksaan Metode Langsung, manakah 4 teknik yang ditandai sebagai prioritas dalam materi ini?", "o": ["Inspeksi, sampling, TABK, evaluasi", "Pemanfaatan data/informasi, ekualisasi/rekonsiliasi, konfirmasi, wawancara", "Penelusuran bukti, pengujian fisik, pengujian keabsahan, analisis angka", "Penelusuran angka, permintaan keterangan, pengujian keterkaitan, pengujian penghitungan"], "c": 1, "e": "4 teknik yang ditandai kotak merah/prioritas: pemanfaatan data/informasi, ekualisasi/rekonsiliasi, konfirmasi, dan wawancara.", "p": 1, "topic": "Teknik Pemeriksaan", "id": "pemeriksaan_q_6"}, {"q": "Aplikasi DJP yang digunakan Pemeriksa Pajak untuk melihat Profil CRM Wajib Pajak guna mendukung penentuan prioritas pengawasan adalah...", "o": ["Document Management System (DMS)", "APPROWEB", "Sistem Informasi DJP", "Aplikasi Portal DJP"], "c": 1, "e": "APPROWEB menyediakan fitur Profil CRM Wajib Pajak untuk mendukung penentuan prioritas pengawasan, selain data pemicu, data faktur pajak, LHA, dsb.", "p": 1, "topic": "Pemanfaatan Data/Informasi", "id": "pemeriksaan_q_7"}, {"q": "Document Management System (DMS) dalam pemeriksaan pajak digunakan untuk...", "o": ["Menghitung sanksi administrasi", "Pencarian dokumen, viewer dokumen, dan arsip digital", "Mengelola SP2DK dan LHP2DK", "Melihat profil CRM Wajib Pajak"], "c": 1, "e": "DMS mendukung pencarian dokumen, viewer dokumen (melihat hasil pindaian SPT), informasi dokumen, arsip digital, dan akses dokumen.", "p": 1, "topic": "Pemanfaatan Data/Informasi", "id": "pemeriksaan_q_8"}, {"q": "Metode Tidak Langsung dalam pemeriksaan digunakan dalam hal...", "o": ["WP meminta digunakannya metode tersebut", "Metode Langsung tidak dapat diterapkan, dan Pemeriksa Pajak harus memiliki bukti atas hal tersebut", "Pemeriksaan bersifat rutin", "Jangka waktu pemeriksaan hampir habis"], "c": 1, "e": "Metode Tidak Langsung digunakan dalam hal Metode Langsung tidak dapat diterapkan, dan Pemeriksa Pajak wajib memiliki bukti bahwa Metode Langsung memang tidak dapat digunakan.", "p": 1, "topic": "Metode Pemeriksaan", "id": "pemeriksaan_q_9"}, {"q": "Dalam Alur Proses Pemeriksaan, jika WP tidak merespons undangan Pembahasan Temuan Sementara, maka statusnya adalah...", "o": ["Pemeriksaan dibatalkan", "Dianggap Menolak, pemeriksaan tetap dilanjutkan ke SPHP", "Jangka waktu pemeriksaan diperpanjang otomatis", "WP dikenai sanksi pidana"], "c": 1, "e": "Jika WP tidak merespons, statusnya Dianggap Menolak dan pemeriksaan tetap dilanjutkan dengan penyampaian SPHP.", "p": 1, "topic": "Alur Proses Pemeriksaan", "id": "pemeriksaan_q_10"}, {"q": "Penghitungan Penghasilan Kena Pajak secara jabatan dilakukan terhadap WP yang...", "o": ["Mengajukan keberatan", "Tidak memenuhi kewajibannya sehingga penghasilan kena pajak tidak dapat dihitung", "Menyampaikan SPT lebih awal", "Memilih menggunakan NPPN"], "c": 1, "e": "Sesuai Pasal 31 ayat (3) UU KUP, jika WP tidak memenuhi kewajiban sehingga penghasilan kena pajak tidak dapat dihitung, maka dapat dihitung secara jabatan.", "p": 1, "topic": "Penetapan Secara Jabatan", "id": "pemeriksaan_q_11"}, {"q": "Penyegelan dalam pemeriksaan pajak merupakan...", "o": ["Langkah pertama yang dilakukan Pemeriksa Pajak", "Upaya terakhir Pemeriksa untuk mengamankan buku, catatan, dokumen termasuk data elektronik", "Sanksi pidana bagi WP", "Prosedur wajib pada setiap pemeriksaan"], "c": 1, "e": "Penyegelan merupakan upaya terakhir pemeriksa untuk mengamankan bukti agar tidak dipindahkan/dihilangkan/dimusnahkan/diubah/dirusak/ditukar/dipalsukan.", "p": 1, "topic": "Penyegelan", "id": "pemeriksaan_q_12"}, {"q": "Penyegelan atas data elektronik dalam pemeriksaan pajak dilakukan dengan syarat...", "o": ["Harus menghentikan seluruh operasional perusahaan", "Sepanjang tidak menghentikan kelancaran operasional perusahaan, khususnya terkait kepentingan masyarakat", "Hanya dapat dilakukan pada hari kerja", "Memerlukan izin pengadilan"], "c": 1, "e": "Penyegelan data elektronik dilakukan sepanjang tidak menghentikan kelancaran kegiatan operasional perusahaan, khususnya yang berkaitan dengan kepentingan masyarakat.", "p": 1, "topic": "Penyegelan", "id": "pemeriksaan_q_13"}, {"q": "Pemeriksaan Ulang yang menghasilkan tambahan jumlah pajak dari ketetapan sebelumnya akan diterbitkan dalam bentuk...", "o": ["SKPKBT", "LHP Sumir", "Keputusan Rugi Fiskal", "SKPN"], "c": 0, "e": "Pemeriksaan Ulang yang menghasilkan tambahan atas jumlah pajak yang telah ditetapkan sebelumnya diterbitkan sebagai SKPKBT.", "p": 1, "topic": "Pemeriksaan Ulang", "id": "pemeriksaan_q_14"}, {"q": "WP Orang Pribadi berikut ini DIKECUALIKAN dari kewajiban menyelenggarakan pembukuan, KECUALI...", "o": ["WP OP yang memilih menggunakan NPPN", "WP OP yang tidak melakukan kegiatan usaha/pekerjaan bebas", "WP OP dengan peredaran bruto tertentu sesuai PMK 54/PMK.03/2021", "WP OP Badan dengan peredaran bruto di atas Rp50 miliar"], "c": 3, "e": "WP Badan bukan WP OP, dan bukan termasuk pengecualian pembukuan — pengecualian hanya berlaku untuk 3 kategori WP OP tertentu.", "p": 1, "topic": "Pembukuan", "id": "pemeriksaan_q_15"}, {"q": "SKPKB diterbitkan dalam jangka waktu berapa tahun setelah saat terutangnya pajak berdasarkan hasil Pemeriksaan?", "o": ["3 tahun", "5 tahun", "10 tahun", "1 tahun"], "c": 1, "e": "Sesuai Pasal 13 ayat (1) UU KUP, SKPKB diterbitkan dalam jangka waktu 5 tahun setelah saat terutangnya pajak berdasarkan hasil Pemeriksaan.", "p": 1, "topic": "SKPKB", "id": "pemeriksaan_q_16"}, {"q": "Surat Ketetapan Pajak Kurang Bayar Tambahan (SKPKBT) diterbitkan berdasarkan...", "o": ["Hasil Penelitian", "Hasil Pemeriksaan Ulang", "Hasil Pemeriksaan pertama", "Permohonan WP"], "c": 1, "e": "Sesuai PMK Nomor 80 Tahun 2023, SKPKBT diterbitkan berdasarkan hasil Pemeriksaan Ulang, berbeda dengan SKPKB yang berdasarkan hasil Pemeriksaan (pertama).", "p": 1, "topic": "Jenis Ketetapan Pajak", "id": "pemeriksaan_q_17"}, {"q": "Surat Ketetapan Pajak Lebih Bayar (SKPLB) dapat diterbitkan berdasarkan...", "o": ["Hanya hasil Pemeriksaan", "Hanya hasil Penelitian", "Hasil Pemeriksaan maupun hasil Penelitian", "Hasil Pemeriksaan Bukti Permulaan"], "c": 2, "e": "Berbeda dengan SKPKB/SKPKBT/SKPN yang hanya berdasarkan Pemeriksaan, SKPLB dapat diterbitkan berdasarkan hasil Pemeriksaan ATAU hasil Penelitian.", "p": 1, "topic": "Jenis Ketetapan Pajak", "id": "pemeriksaan_q_18"}, {"q": "Direktur Jenderal Pajak menerbitkan Surat Tagihan Pajak (STP) dalam hal pengusaha yang telah dikukuhkan sebagai PKP...", "o": ["Tidak membuat Faktur Pajak atau terlambat membuatnya", "Mengajukan permohonan restitusi", "Melaporkan SPT Masa tepat waktu", "Mengajukan keberatan"], "c": 0, "e": "Salah satu kriteria penerbitan STP (Pasal 14 UU KUP) adalah pengusaha yang telah dikukuhkan PKP tidak membuat Faktur Pajak atau terlambat membuat Faktur Pajak.", "p": 1, "topic": "Surat Tagihan Pajak", "id": "pemeriksaan_q_19"}, {"q": "Denda keterlambatan pelaporan SPT Tahunan PPh Wajib Pajak Badan menurut Pasal 7 ayat (1) UU KUP adalah...", "o": ["Rp100.000", "Rp500.000", "Rp1.000.000", "Rp2.000.000"], "c": 2, "e": "Denda keterlambatan pelaporan SPT Tahunan PPh WP Badan adalah Rp1.000.000, berbeda dari SPT Tahunan OP (Rp100.000), SPT Masa PPN (Rp500.000), dan SPT Masa lainnya (Rp100.000).", "p": 1, "topic": "Sanksi Denda", "id": "pemeriksaan_q_20"}, {"q": "Sanksi bunga berdasarkan hasil pemeriksaan atas pajak terutang yang tidak/kurang dibayar (Pasal 13 ayat 2 UU KUP) menggunakan uplift factor sebesar...", "o": ["5%", "10%", "15%", "20%"], "c": 2, "e": "Pasal 13 ayat (2) UU KUP mengenakan bunga per bulan sebesar suku bunga acuan ditambah uplift factor 15%, dibagi 12.", "p": 1, "topic": "Sanksi Bunga", "id": "pemeriksaan_q_21"}, {"q": "Sanksi kenaikan sebesar 75% dikenakan berdasarkan hasil pemeriksaan untuk pelanggaran...", "o": ["Keterlambatan lapor SPT Masa", "PPN/PPnBM yang tidak/kurang dibayar, atau PPh dipotong/dipungut tapi tidak/kurang disetor", "Pengajuan banding yang ditolak", "Permohonan pengurangan SKP"], "c": 1, "e": "Pasal 13 ayat (3) huruf c dan d UU KUP mengenakan kenaikan 75% atas PPN/PPnBM yang tidak/kurang dibayar dan PPh yang dipotong/dipungut tetapi tidak/kurang disetor berdasarkan hasil pemeriksaan.", "p": 1, "topic": "Sanksi Kenaikan", "id": "pemeriksaan_q_22"}, {"q": "Salah satu persyaratan formal pengajuan permohonan keberatan adalah...", "o": ["Diajukan terhadap seluruh jenis pajak sekaligus", "Melunasi pajak yang masih harus dibayar paling sedikit sejumlah yang telah disetujui WP dalam pembahasan akhir", "Harus didampingi pengacara", "Diajukan secara lisan"], "c": 1, "e": "Salah satu syarat keberatan adalah melunasi pajak yang masih harus dibayar paling sedikit sejumlah yang telah disetujui WP dalam pembahasan akhir hasil pemeriksaan; jika tidak dipenuhi maka tidak dipertimbangkan.", "p": 1, "topic": "Keberatan", "id": "pemeriksaan_q_23"}, {"q": "Jika permohonan Banding ditolak atau dikabulkan sebagian oleh Pengadilan Pajak, WP dikenai sanksi denda sebesar...", "o": ["30%", "50%", "60%", "100%"], "c": 2, "e": "Sanksi administratif atas permohonan Banding yang ditolak/dikabulkan sebagian adalah denda 60%, lebih besar dari sanksi Keberatan (30%).", "p": 1, "topic": "Banding", "id": "pemeriksaan_q_24"}, {"q": "Dalam membuat putusan atas sengketa pajak, Majelis Hakim Pengadilan Pajak wajib mempertimbangkan sekurang-kurangnya berapa alat bukti yang sah?", "o": ["1 alat bukti", "2 alat bukti", "3 alat bukti", "Tidak ada batasan minimal"], "c": 1, "e": "Berdasarkan Pasal 88 ayat (1) UU Pengadilan Pajak, Majelis Hakim wajib mempertimbangkan sekurang-kurangnya 2 (dua) alat bukti yang sah dalam membuat putusan.", "p": 1, "topic": "Alat Bukti Sengketa Pajak", "id": "pemeriksaan_q_25"}, {"q": "Badan yang dinyatakan pailit diwakili dalam pemenuhan kewajiban perpajakan oleh...", "o": ["Direktur utama", "Kurator", "Likuidator", "Komisaris"], "c": 1, "e": "Badan yang dinyatakan pailit diwakili oleh kurator, berbeda dengan badan dalam likuidasi yang diwakili oleh likuidator.", "p": 1, "topic": "Wakil Wajib Pajak", "id": "pemeriksaan_q_26"}, {"q": "Wakil Wajib Pajak bertanggung jawab secara pribadi dan/atau secara renteng atas pajak yang terutang, KECUALI jika...", "o": ["WP memberi kuasa tertulis", "Wakil dapat membuktikan dan meyakinkan DJP bahwa benar-benar tidak mungkin dibebani tanggung jawab tersebut", "Pajak terutang di bawah Rp1 juta", "Wakil mengundurkan diri"], "c": 1, "e": "Wakil bertanggung jawab pribadi/renteng kecuali dapat membuktikan dan meyakinkan Direktur Jenderal Pajak bahwa dalam kedudukannya benar-benar tidak mungkin dibebani tanggung jawab.", "p": 1, "topic": "Wakil Wajib Pajak", "id": "pemeriksaan_q_27"}, {"q": "Kuasa Wajib Pajak dari golongan \"bukan keluarga\" harus memenuhi syarat...", "o": ["Memiliki hubungan sedarah dengan WP", "Memiliki kompetensi tertentu dalam aspek perpajakan (konsultan pajak/pihak lain)", "Merupakan pegawai DJP", "Berdomisili sama dengan WP"], "c": 1, "e": "Kuasa dari golongan bukan keluarga adalah konsultan pajak atau pihak lain yang memiliki kompetensi tertentu dalam aspek perpajakan.", "p": 1, "topic": "Kuasa Wajib Pajak", "id": "pemeriksaan_q_28"}, {"q": "Kuasa Wajib Pajak TIDAK DAPAT menjalankan hak dan kewajiban perpajakan WP apabila...", "o": ["Kuasa tidak memiliki NPWP", "Kuasa menghalang-halangi pelaksanaan UU perpajakan, atau dipidana karena tindak pidana perpajakan/lainnya", "Kuasa berasal dari luar daerah", "Kuasa adalah konsultan pajak"], "c": 1, "e": "Kuasa tidak dapat menjalankan hak/kewajiban WP yang dikuasakan apabila menghalang-halangi pelaksanaan ketentuan UU perpajakan, atau dipidana karena tindak pidana perpajakan atau tindak pidana lainnya.", "p": 1, "topic": "Kuasa Wajib Pajak", "id": "pemeriksaan_q_29"}, {"q": "Syarat subjektif untuk menentukan orang pribadi sebagai Wajib Pajak dalam negeri terpenuhi apabila, KECUALI...", "o": ["Bertempat tinggal di Indonesia", "Berada di Indonesia lebih dari 183 hari dalam jangka waktu 12 bulan", "Memiliki niat untuk bertempat tinggal di Indonesia", "Memperoleh penghasilan dari luar negeri"], "c": 3, "e": "Syarat subjektif berkaitan dengan status keberadaan/domisili di Indonesia, bukan sumber penghasilan — sumber penghasilan termasuk dalam syarat objektif.", "p": 1, "topic": "Syarat Wajib Pajak", "id": "pemeriksaan_q_30"}, {"q": "Seseorang/badan ditetapkan sebagai Wajib Pajak apabila memenuhi kombinasi...", "o": ["Syarat subjektif saja", "Syarat objektif saja", "Syarat subjektif DAN memperoleh penghasilan yang menjadi objek pajak (syarat objektif)", "Memiliki NPWP"], "c": 2, "e": "Kesimpulan penetapan sebagai WP: orang pribadi/badan + memenuhi syarat subjektif + memperoleh penghasilan objek pajak (syarat objektif) → ditetapkan sebagai WP.", "p": 1, "topic": "Syarat Wajib Pajak", "id": "pemeriksaan_q_31"}, {"q": "SPT yang ditandatangani WP, kriteria \"benar\" dalam pengisian SPT mencakup...", "o": ["Hanya kebenaran perhitungan matematis", "Benar dalam perhitungan, penerapan ketentuan, penulisan, dan sesuai keadaan sebenarnya", "Ditulis dengan huruf kapital", "Disampaikan tepat waktu"], "c": 1, "e": "\"Benar\" mencakup benar dalam perhitungan termasuk penerapan ketentuan perundang-undangan perpajakan, dalam penulisan, dan sesuai dengan keadaan yang sebenarnya.", "p": 1, "topic": "Kewajiban SPT", "id": "pemeriksaan_q_32"}, {"q": "Batas waktu penyampaian SPT Tahunan PPh Wajib Pajak Badan adalah...", "o": ["3 bulan setelah akhir Tahun Pajak", "4 bulan setelah akhir Tahun Pajak", "6 bulan setelah akhir Tahun Pajak", "20 hari setelah akhir Tahun Pajak"], "c": 1, "e": "SPT Tahunan PPh Badan disampaikan paling lambat 4 bulan setelah akhir Tahun Pajak atau Bagian Tahun Pajak, berbeda dengan WP OP yang 3 bulan.", "p": 1, "topic": "Batas Waktu SPT", "id": "pemeriksaan_q_33"}, {"q": "Batas waktu penyampaian SPT Masa PPN adalah...", "o": ["20 hari setelah Masa Pajak berakhir", "Akhir bulan berikutnya setelah Masa Pajak berakhir", "15 hari setelah Masa Pajak berakhir", "10 hari setelah Masa Pajak berakhir"], "c": 1, "e": "SPT Masa PPN disampaikan paling lambat akhir bulan berikutnya setelah Masa Pajak berakhir, berbeda dengan PPh 21/25/Unifikasi (20 hari) dan Bea Meterai (15 hari).", "p": 1, "topic": "Batas Waktu SPT", "id": "pemeriksaan_q_34"}, {"q": "World Wide Income adalah konsep yang berlaku untuk...", "o": ["Subjek Pajak Luar Negeri (SPLN) saja", "Subjek Pajak Dalam Negeri (SPDN) saja", "Seluruh WP tanpa memandang status subjek pajak", "BUT saja"], "c": 1, "e": "Konsep world wide income hanya berlaku untuk Subjek Pajak Dalam Negeri — seluruh penghasilan baik dari Indonesia maupun luar negeri menjadi objek pajak di Indonesia.", "p": 1, "topic": "World Wide Income", "id": "pemeriksaan_q_35"}, {"q": "Berapa tarif PPh Orang Pribadi progresif untuk lapisan PKP di atas Rp5 miliar menurut tarif 2025?", "o": ["30%", "35%", "25%", "15%"], "c": 1, "e": "Lapisan tertinggi tarif progresif PPh OP (>Rp5.000.000.000) dikenai tarif 35%.", "p": 1, "topic": "Tarif PPh", "id": "pemeriksaan_q_36"}, {"q": "Besaran PTKP untuk diri Wajib Pajak orang pribadi pada Tahun Pajak 2026 adalah...", "o": ["Rp36.000.000", "Rp54.000.000", "Rp58.500.000", "Rp60.000.000"], "c": 1, "e": "PTKP untuk diri WP orang pribadi Tahun Pajak 2026 adalah Rp54.000.000, dengan tambahan Rp4.500.000 jika kawin dan Rp4.500.000 per tanggungan (maks. 3 orang).", "p": 1, "topic": "PTKP", "id": "pemeriksaan_q_37"}, {"q": "PPh Final UMKM 0,5% hanya dapat digunakan Wajib Pajak Badan sepanjang peredaran bruto tidak melebihi...", "o": ["Rp2.000.000.000 setahun", "Rp4.800.000.000 setahun", "Rp15.000.000.000 setahun", "Rp50.000.000.000 setahun"], "c": 1, "e": "Batasan peredaran bruto agar dapat menggunakan tarif PPh Final UMKM 0,5% adalah tidak melebihi Rp4.800.000.000 dalam 1 Tahun Pajak.", "p": 1, "topic": "PPh Final UMKM", "id": "pemeriksaan_q_38"}, {"q": "PPh Final UMKM 0,5% dihitung dari...", "o": ["Laba bersih setelah pajak", "Laba kena pajak", "Peredaran bruto (omzet)", "Modal usaha"], "c": 2, "e": "PPh Final UMKM 0,5% dihitung dari peredaran bruto (omzet), bukan dari laba bersih.", "p": 1, "topic": "PPh Final UMKM", "id": "pemeriksaan_q_39"}, {"q": "Dividen yang diterima Wajib Pajak Orang Pribadi dalam negeri dikenai PPh Final dengan tarif...", "o": ["5%", "10%", "15%", "20%"], "c": 1, "e": "Dividen yang diterima WP OP dalam negeri dikenai PPh Final tarif 10% dari jumlah bruto dividen yang diterima — bersifat final dan tidak dapat dikreditkan.", "p": 1, "topic": "Pajak atas Dividen", "id": "pemeriksaan_q_40"}, {"q": "Agar dividen yang diterima WP Badan dalam negeri dapat dikecualikan dari objek PPh, salah satu syaratnya adalah kepemilikan saham...", "o": ["Minimal 10% dimiliki minimal 6 bulan", "Minimal 25% dan dimiliki minimal 1 tahun (atau <25% dengan syarat tertentu)", "Minimal 51% tanpa batas waktu kepemilikan", "Tidak ada syarat kepemilikan saham"], "c": 1, "e": "Salah satu syarat pengecualian dividen WP Badan DN dari objek PPh adalah kepemilikan saham minimal 25% yang dimiliki minimal 1 tahun, atau di bawah 25% dengan syarat tertentu sesuai Pasal 4 ayat (3) huruf f UU PPh.", "p": 1, "topic": "Pajak atas Dividen", "id": "pemeriksaan_q_41"}, {"q": "PPN dikenakan atas penyerahan aktiva yang menurut tujuan semula tidak untuk diperjualbelikan (Pasal 16D UU PPN), KECUALI...", "o": ["Jika aktiva tersebut berupa kendaraan", "Jika Pajak Masukan atas aktiva tersebut tidak dapat dikreditkan menurut Pasal 9 ayat (8) huruf b dan c", "Jika penyerahan dilakukan di akhir tahun", "Jika aktiva telah disusutkan penuh"], "c": 1, "e": "PPN Pasal 16D dikecualikan atas penyerahan aktiva yang Pajak Masukannya tidak dapat dikreditkan menurut Pasal 9 ayat (8) huruf b (tidak berhubungan langsung dengan usaha) dan huruf c (kendaraan sedan/station wagon kecuali barang dagangan/disewakan).", "p": 1, "topic": "Objek PPN Pasal 16D", "id": "pemeriksaan_q_42"}, {"q": "Manakah berikut ini yang TERMASUK dalam definisi penyerahan BKP menurut Pasal 1A ayat (1) UU PPN?", "o": ["Penyerahan BKP secara konsinyasi", "Pemakaian sendiri dan/atau pemberian cuma-cuma BKP", "Peminjaman BKP tanpa pengalihan
