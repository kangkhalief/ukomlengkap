eral logam/bukan logam/batuan/batubara) dibandingkan dengan Harga Patokan rata-rata (HPM Logam/HPM Bukan Logam/Harga Patokan Batuan/HPB). Jika harga jual <strong>lebih rendah</strong> dari harga patokan, atau tidak ada harga jual rata-rata, maka dipakai harga patokan; jika keduanya tidak ada, dihitung oleh Penilai Pajak. Harga Patokan ditentukan dari <strong>FOB vessel</strong> dan <strong>lokasi tambang</strong>; untuk batubara jenis/keperluan tertentu formula ditetapkan Kementerian ESDM.</p>", "page": "hlm 187-188", "id": "pengawasan_r_108"}, {"heading": "Penetapan NJOP Bumi Sektor Lainnya (Pasal 12,33)", "p": 0, "html": "<table><tr><th>Objek</th><th>Terdapat Hasil Produksi</th><th>Tidak Terdapat Hasil Produksi</th></tr><tr><td>Perikanan Tangkap/Pembudidayaan Ikan</td><td>Nilai Jual Pengganti</td><td>NJOP/m² × Luas Bumi (Kep. Dirjen Pajak)</td></tr><tr><td>Jaringan Pipa/Kabel, Ruas Jalan Tol, Fasilitas Penyimpanan</td><td colspan=\"2\">NJOP/m² × Luas Bumi (NJOP/m² ditetapkan Kep. Dirjen Pajak)</td></tr></table>", "page": "hlm 198", "id": "pengawasan_r_109"}, {"heading": "Penetapan NJOP Perikanan Tangkap &amp; Pembudidayaan Ikan (Pasal 33-35)", "p": 0, "html": "<p>NJP = Pendapatan Bersih × Angka Kapitalisasi. Pendapatan kotor = produksi per jenis ikan tahun terakhir × harga jual rata-rata per satuan berat; biaya produksi = rasio (Kep. Dirjen Pajak) × pendapatan kotor. Luas bumi perikanan tangkap = jumlah kapal × luas areal penangkapan per kapal (ditetapkan Kep. Dirjen Pajak); luas bumi pembudidayaan = luas yang tercantum dalam izin.</p>", "page": "hlm 199", "id": "pengawasan_r_110"}, {"heading": "Tata Cara Penetapan NJOP Bangunan P5L", "p": 0, "html": "<p>NJOP Bangunan = <strong>Nilai Perolehan Baru</strong> = menghitung seluruh biaya yang dikeluarkan untuk memperoleh objek − penyusutan berdasarkan kondisi fisik. Berlaku untuk bangunan di semua sektor P5L (Perkebunan, Perhutanan, Migas, Panas Bumi, Minerba, Lainnya).</p>", "page": "hlm 200 (Pasal 14,15,17,19,21,33)", "id": "pengawasan_r_111"}, {"heading": "Siklus Penetapan NJOP PBB — Lama vs Baru", "p": 0, "html": "<p><strong>Lama</strong>: NJOP → usulan KMK NJOP ke Kanwil → SK Kanwil NJOP → penerbitan SPPT (berjenjang). <strong>Baru</strong>: NJOP → langsung ditetapkan Kepala KPP melalui penerbitan SPPT (lebih sederhana, tanpa usulan ke Kanwil).</p>", "page": "hlm 204", "id": "pengawasan_r_112"}, {"heading": "Penetapan NJOP PBB Berdasarkan Kontrak/Perjanjian/IUPK-OP", "p": 0, "html": "<p>Dasar hukum Pasal 13, 37, 38. WP pemegang Kontrak Karya, PKP2B, atau IUPK-OP menyampaikan SPOP kepada KPP; penghitungan NJOP PBB mengikuti ketentuan dalam kontrak karya/PKP2B/IUPK-OP yang bersangkutan (bukan tabel umum), hasilnya diterbitkan SPPT.</p>", "page": "hlm 205", "id": "pengawasan_r_113"}, {"heading": "Pengenaan PBB — SPPT vs SKP PBB (Pasal 38)", "p": 0, "html": "<p>Penetapan PBB terutang dilakukan melalui <strong>SPPT</strong> (paling lama 5 tahun setelah berakhirnya Tahun Pajak PBB terutang; khusus Ipeda dalam PKP2B Gen-I melalui SPPT juga) atau <strong>SKP PBB</strong> (mengikuti ketentuan PMK Tata Cara Penerbitan SKP PBB).</p>", "page": "hlm 206", "id": "pengawasan_r_114"}, {"heading": "Penerbitan Kembali &amp; Cetak Ulang SPPT (Pasal 39)", "p": 0, "html": "<p>Penerbitan kembali SPPT dilakukan jika terdapat: SK Pemberian Pengurangan PBB, SK Pembetulan, SK Pengurangan SPPT Tidak Benar, SK Keberatan, Putusan Banding, Putusan Gugatan, atau Putusan PK. <strong>SPPT sebelumnya dinyatakan tidak berlaku dan SPPT hasil penerbitan kembali TIDAK dapat diajukan keberatan.</strong> Cetak ulang dilakukan atas permohonan WP/wakil/kuasa.</p>", "page": "hlm 207", "id": "pengawasan_r_115"}, {"heading": "Penyampaian SPPT &amp; Jatuh Tempo Pelunasan (Pasal 40)", "p": 0, "html": "<p>KPP menerbitkan SPPT untuk 1 Tahun Pajak, disampaikan secara langsung (tanda terima), melalui pos/ekspedisi/kurir (bukti pengiriman), atau saluran elektronik (bukti pengiriman DJP). WP wajib melunasi <strong>selambat-lambatnya 6 bulan</strong> sejak tanggal diterima SPPT; jika tidak/kurang dibayar setelah jatuh tempo, diterbitkan STP PBB.</p>", "page": "hlm 208", "id": "pengawasan_r_116"}, {"heading": "Ketentuan Pengembalian Seluruh Wilayah Kerja Migas/Pabum (Pasal 41)", "p": 0, "html": "<p>WP mengajukan surat pengajuan pengembalian seluruh WK Migas/Pabum + surat keterangan tidak sedang memanfaatkan WK kepada SKK Migas/Kementerian ESDM (bukan DJP), dan memberitahukan secara tertulis ke KPP (tanpa perlu mengisi SPOP). Jika permohonan <strong>ditolak</strong> oleh Kementerian ESDM, Dirjen Pajak menetapkan PBB terutang sejak Tahun Pajak setelah keputusan penolakan; jika diterima, KPP tidak menerbitkan SPPT.</p>", "page": "hlm 209", "id": "pengawasan_r_117"}, {"heading": "Pendaftaran Objek Pajak PBB — Syarat Subjektif (SKT PBB)", "p": 0, "html": "<p>Setiap WP wajib mendaftar ke KPP paling lama 1 bulan setelah terpenuhinya persyaratan subjektif, diberikan Surat Keterangan Terdaftar (SKT) Objek Pajak PBB memuat Nomor Objek Pajak (NOP). Saat terpenuhi persyaratan subjektif berbeda per sektor: tanggal izin usaha/HGU (Perkebunan), tanggal penugasan/izin (Perhutanan), tanggal efektif Kontrak Kerja Sama (Migas), tanggal izin/kontrak (Pabum/Minerba), tanggal izin usaha perikanan (Lainnya).</p>", "page": "hlm 212", "id": "pengawasan_r_118"}, {"heading": "Skema Pendaftaran Objek Pajak PBB", "p": 0, "html": "<p>Permohonan WP → kelengkapan dokumen → penelitian administrasi Kepala KPP → keputusan (<strong>10 hari kerja</strong>) → terima (terbit SKT) atau tolak (surat penolakan). Jika 10 hari kerja terlampaui tanpa keputusan, permohonan <strong>dianggap dikabulkan</strong> dan SKT diterbitkan paling lama 1 hari kerja setelahnya. Secara jabatan: pemeriksaan/penelitian administrasi → terbit SKT → dikirim ke WP maks. 3 hari kerja.</p>", "page": "hlm 213", "id": "pengawasan_r_119"}, {"heading": "Perubahan Data &amp; Pencabutan SKT Objek Pajak PBB", "p": 0, "html": "<p>Kepala KPP dapat ubah data SKT berdasarkan permohonan WP atau jabatan. Pencabutan SKT dilakukan terhadap Objek Pajak yang sudah tidak memenuhi persyaratan subjektif — keputusan diterbitkan dalam 6 bulan; jika terlampaui tanpa keputusan, dianggap dikabulkan dan surat keputusan pencabutan diterbitkan maks. 1 bulan setelahnya.</p>", "page": "hlm 214", "id": "pengawasan_r_120"}, {"heading": "Penerbitan SPT Pajak Terutang/SKP PBB atas Data Baru", "p": 0, "html": "<p>Jika diperoleh data/informasi yang menunjukkan kewajiban PBB yang belum dipenuhi WP — baik sebelum maupun sesudah SKT diberikan/dicabut — DJP dapat menerbitkan Surat Pemberitahuan Pajak Terutang, SKP PBB, dan/atau STP PBB. SPPT dan SKP PBB dapat diterbitkan dalam jangka waktu 5 tahun.</p>", "page": "hlm 215", "id": "pengawasan_r_121"}, {"heading": "Pelaporan Objek Pajak PBB — Jadwal per Sektor (Pasal 84)", "p": 0, "html": "<p>DJP menyampaikan Surat Pemberitahuan Objek Pajak kepada WP pada tanggal <strong>1 Februari</strong> Tahun Pajak terutang untuk sektor Perkebunan, Migas, dan Panas Bumi; pada tanggal <strong>31 Maret</strong> untuk sektor Perhutanan, Minerba, dan Lainnya. SPOP wajib diisi jelas/benar/lengkap, ditandatangani, disampaikan paling lama <strong>30 hari</strong> setelah tanggal diterimanya.</p>", "page": "hlm 217", "id": "pengawasan_r_122"}, {"heading": "Dokumen Pendukung Isian SPOP per Sektor", "p": 0, "html": "<p>Tiap sektor memiliki dokumen pendukung wajib: Perkebunan (izin usaha+laporan perkembangan &amp; peta tahun tanam), Perhutanan (izin/penugasan+RKU/RKT+peta), Migas (Kontrak Kerja Sama+peta WK+AFE &amp; FQR triwulan IV+kontrak jual beli gas), Panas Bumi (izin/kuasa/kontrak+peta WK+RKAB), Minerba (izin/kontrak+RKAB), Lainnya (izin kementerian terkait+dokumen lain). Simbol: tidak perlu dilampirkan ulang jika sudah dilampirkan saat pendaftaran/pelaporan sebelumnya, atau jika tidak ada perubahan.</p>", "page": "hlm 218-220", "id": "pengawasan_r_123"}, {"heading": "Penundaan Penyampaian SPOP &amp; Surat Teguran (Pasal 85)", "p": 0, "html": "<p>Jika 30 hari tidak terpenuhi, WP dapat mengajukan penundaan (diterima sebelum 30 hari berakhir, maks. 7 hari tambahan). Jika SPOP tetap belum disampaikan setelah 30/37 hari dan tanpa pemberitahuan penundaan, Kepala KPP menerbitkan <strong>Surat Teguran</strong> melalui Akun WP; WP wajib menyampaikan SPOP dalam 7 hari sejak diterima teguran, jika tidak maka KPP membuat analisis risiko untuk usulan Pemeriksaan.</p>", "page": "hlm 221", "id": "pengawasan_r_124"}, {"heading": "Penelitian Formal dan Material SPOP", "p": 0, "html": "<p><strong>Penelitian Formal</strong> (kelengkapan pengisian, tanda tangan, dokumen pendukung, batas waktu) — jika tidak terpenuhi, SPOP dianggap tidak disampaikan. Jika terpenuhi, terbit Bukti Penerimaan Elektronik, lalu KPP lakukan <strong>Penelitian Material</strong>; jika ada indikasi ketidaksesuaian, terbit Surat Permintaan Klarifikasi kepada WP (WP merespons dengan surat tanggapan atau pembetulan SPOP) — hasilnya jadi bahan analisis risiko usulan Pemeriksaan.</p>", "page": "hlm 223", "id": "pengawasan_r_125"}, {"heading": "Pembetulan SPOP", "p": 0, "html": "<p>Pembetulan atas SPOP yang sudah disampaikan: disampaikan paling lama 15 hari setelah berakhirnya 30 hari penyampaian SPOP awal. Jika melewati batas waktu, dianggap tidak disampaikan. Jika ada Surat Permintaan Klarifikasi, pembetulan disampaikan paling lama 7 hari sejak tanggal diterimanya surat permintaan tersebut.</p>", "page": "hlm 224", "id": "pengawasan_r_126"}, {"heading": "Pendataan Objek Pajak Terdaftar — Kantor &amp; Lapangan", "p": 0, "html": "<p>DJP berwenang melakukan Pendataan terhadap Objek Pajak terdaftar melalui petugas Pendataan. <strong>Pendataan Kantor</strong>: mengolah data SPOP/sistem DJP, meliputi pengumpulan data dan pemetaan (transformasi sistem proyeksi/digitasi peta). <strong>Pendataan Lapangan</strong>: peninjauan lokasi fisik, meliputi pengumpulan data via pengukuran (satelit/inderaja/alat ukur manual). Jika WP menolak, Petugas tetap melakukan Pendataan berdasarkan data yang dimiliki DJP; hasil dilaporkan dalam Laporan Hasil Pendataan sebagai bahan penelitian material/analisis risiko usulan Pemeriksaan.</p>", "page": "hlm 225-226", "id": "pengawasan_r_127"}, {"heading": "PMK-81/2024 — Dasar Hukum &amp; Tujuan SIAP", "p": 0, "html": "<p>Dasar hukum: <strong>Perpres 40/2018 Pasal 9</strong> (ketentuan lebih lanjut Pembaruan Sistem Administrasi Perpajakan diatur Menteri). PMK-81/2024 mengatur Ketentuan Perpajakan dalam rangka Pelaksanaan Sistem Inti Administrasi Perpajakan (Coretax).</p>", "page": "hlm 228-229", "id": "pengawasan_r_128"}, {"heading": "Penyesuaian PMK 63/2021 — Tujuan &amp; Pokok Pengaturan", "p": 0, "html": "<p>Dasar hukum amanah: Pasal 6 angka 18, Pasal 63A ayat (6), dan Pasal 63B ayat (5) PP 9/2021 (turunan UU Cipta Kerja). Tujuan: memberi kemudahan/tingkatkan pelayanan WP, sederhanakan administrasi, simplifikasi regulasi, tingkatkan kepastian hukum. Pokok pengaturan: (1) pelaksanaan hak/kewajiban elektronik &amp; nonelektronik; (2) kerja sama Menteri dengan instansi/lembaga/pihak lain untuk fasilitas elektronik; (3) penerbitan keputusan/ketetapan elektronik; (4) pelimpahan kewenangan via delegasi/mandat.</p>", "page": "hlm 233-234", "id": "pengawasan_r_129"}, {"heading": "Pelaksanaan Hak &amp; Kewajiban Elektronik — Penyampaian Dokumen", "p": 0, "html": "<p>Dokumen elektronik yang ditandatangani WP disampaikan via Portal WP, laman/aplikasi terintegrasi DJP, atau Contact Center → ditindaklanjuti oleh sistem administrasi DJP/pejabat DJP/K&amp;L lain, terekam sebagai Bukti Penerimaan. Jika 1 dokumen dikirim via beberapa kanal, bukti penerimaan yang diakui adalah <strong>yang pertama terekam sistem DJP</strong>. Dalam kondisi tertentu (infrastruktur belum tersedia, gangguan komunikasi, bencana) dapat dilakukan secara tertulis (langsung ke KPP/KP2KP atau via pos/ekspedisi).</p>", "page": "hlm 235", "id": "pengawasan_r_130"}, {"heading": "Aktivasi Akun WP — Portal WP", "p": 0, "html": "<p>Dirjen Pajak menyediakan Akun WP untuk setiap WP; digunakan setelah WP melakukan aktivasi melalui Portal WP atau KPP/KP2KP. Pengajuan aktivasi disetujui apabila alamat pos elektronik dan nomor telepon seluler WP telah tervalidasi.</p>", "page": "hlm 236", "id": "pengawasan_r_131"}, {"heading": "Penandatanganan Dokumen Elektronik", "p": 0, "html": "<p>Dua jenis: <strong>TTE Tersertifikasi</strong> (sertifikat elektronik dari PSrE — PSrE instansi untuk WP Instansi Pemerintah via ASN/TNI/Polri, PSrE noninstansi untuk WP lainnya) dan <strong>TTE Tidak Tersertifikasi</strong> (Kode Otorisasi DJP, diterbitkan saat aktivasi Akun WP) — keduanya opsional. Via Contact Center, dianggap ditandatangani setelah WP menjawab validasi identitas dan menyampaikan afirmasi.</p>", "page": "hlm 237", "id": "pengawasan_r_132"}, {"heading": "WP Penandatangan Dokumen Elektronik", "p": 0, "html": "<p><strong>Orang Pribadi</strong>: WP OP bersangkutan; wali/pengampu (anak belum dewasa/dalam pengampuan); orang pribadi yang ditunjuk WP sesuai ketentuan. <strong>Badan/Instansi Pemerintah/WBT</strong>: orang pribadi yang merupakan wakil WP, atau orang pribadi selain wakil WP yang ditunjuk wakil WP sesuai ketentuan.</p>", "page": "hlm 238", "id": "pengawasan_r_133"}, {"heading": "Kerja Sama Menteri Keuangan — Fasilitas Elektronik", "p": 0, "html": "<p>Menkeu dapat kerja sama (perjanjian/penunjukan) dengan Instansi Pemerintah/lembaga/asosiasi/pihak lain melalui sistem administrasi terintegrasi DJP untuk: pemberian NPWP, pemberian KSWP (Konfirmasi Status WP), penyelenggaraan bukti potput &amp; Faktur Pajak elektronik, penyelenggaraan pembayaran pajak dan/atau pelaporan SPT elektronik.</p>", "page": "hlm 239", "id": "pengawasan_r_134"}, {"heading": "Pelimpahan Kewenangan — Delegasi/Mandat", "p": 0, "html": "<p>Menkeu dapat delegasi kewenangan kepada Dirjen Pajak untuk menunjuk PSrE dan membuat/melaksanakan perjanjian kerja sama/penunjukan. Dirjen Pajak dapat delegasi/mandat kepada pejabat/pegawai DJP untuk menerbitkan Keputusan. Menkeu juga dapat delegasi/mandat langsung kepada pejabat/pegawai DJP atau menteri/K&amp;L lain.</p>", "page": "hlm 240", "id": "pengawasan_r_135"}, {"heading": "Ketentuan Peralihan PMK 63/2021 (via PMK 81/2024)", "p": 0, "html": "<table><tr><th>Materi</th><th>Ketentuan</th></tr><tr><td>Sertifikat elektronik, EFIN, kode verifikasi (DJP)</td><td>Dapat digunakan s.d. Masa Pajak Desember 2024/Tahun Pajak 2024</td></tr><tr><td>TTE tidak tersertifikasi (DJP)</td><td>Dapat digunakan s.d. Masa Pajak Desember 2024/Tahun Pajak 2024</td></tr><tr><td>Segel Elektronik pada Keputusan DJP</td><td>Paling lambat mulai 1 Januari 2025</td></tr><tr><td>Aktivasi Akun WP, Sertel &amp; Kode Otorisasi</td><td>Paling lambat mulai 1 Januari 2025</td></tr></table>", "page": "hlm 241", "id": "pengawasan_r_136"}, {"heading": "Tempat Pendaftaran WP (PMK 147/2017, Pasal 2)", "p": 0, "html": "<p>WP (OP, Warisan Belum Terbagi, Badan, Instansi Pemerintah) memenuhi syarat subjektif+objektif wajib mendaftar pada KPP sesuai tempat tinggal/kedudukan WP, diberikan NPWP. Dirjen Pajak berwenang menetapkan: tempat tinggal/kedudukan jika WP punya lebih dari satu, tempat terdaftar untuk WP kriteria tertentu, dan tempat pendaftaran tertentu. WP yang tidak mendaftarkan diri dikenai sanksi sesuai UU KUP.</p>", "page": "hlm 244-245", "id": "pengawasan_r_137"}, {"heading": "Pendaftaran WP Orang Pribadi — NIK Jadi NPWP", "p": 0, "html": "<p>WP OP <strong>Penduduk</strong> menggunakan <strong>NIK yang telah divalidasi/diaktivasi</strong> sebagai NPWP. WP OP <strong>Bukan Penduduk</strong> menggunakan nomor identitas perpajakan format <strong>16 digit</strong> yang dihasilkan sistem administrasi DJP. WP OP wajib melaporkan tempat kegiatan usaha untuk memperoleh Nomor Identitas Tempat Kegiatan Usaha (NITKU) bagi setiap tempat kegiatan usaha.</p>", "page": "hlm 246", "id": "pengawasan_r_138"}, {"heading": "Jangka Waktu Pendaftaran WP OP (Pasal 3)", "p": 0, "html": "<p>WP OP yang melakukan kegiatan usaha/pekerjaan bebas (termasuk Pengusaha Tertentu): paling lama <strong>1 bulan</strong> setelah kegiatan mulai dilakukan. WP OP yang tidak melakukan usaha namun memperoleh penghasilan ≥ PTKP: paling lambat <strong>akhir bulan berikutnya</strong> setelah penghasilan akumulasi mencapai/melebihi PTKP pada tahun berjalan.</p>", "page": "hlm 247", "id": "pengawasan_r_139"}, {"heading": "Permohonan Pendaftaran WP OP — Penduduk vs Bukan Penduduk", "p": 0, "html": "<p><strong>Penduduk</strong>: mengisi formulir permohonan pendaftaran saja. <strong>Bukan Penduduk</strong>: mengisi formulir + lampiran salinan paspor, pasfoto berwarna, dan pasfoto memegang paspor — via Portal WP/laman terintegrasi/Contact Center, atau langsung/pos jika tidak dapat elektronik. NPWP diterbitkan Kepala KPP paling lama <strong>1 hari kerja</strong> setelah permohonan diterima lengkap.</p>", "page": "hlm 248", "id": "pengawasan_r_140"}, {"heading": "Penerbitan NPWP Secara Jabatan (WP OP)", "p": 0, "html": "<p>Jika WP OP tidak melaksanakan kewajiban pendaftaran dalam jangka waktu yang ditentukan, Kepala KPP menerbitkan NPWP Secara Jabatan berdasarkan hasil penelitian administrasi sesuai data/informasi yang dimiliki/diperoleh DJP, termasuk data dari kegiatan ekstensifikasi.</p>", "page": "hlm 249", "id": "pengawasan_r_141"}, {"heading": "Perubahan Data WP OP", "p": 0, "html": "<p>Kepala KPP dapat ubah data (permohonan/jabatan) jika ada perbedaan data administrasi dengan keadaan sebenarnya; keputusan diterbitkan 1 hari kerja. Perubahan yang menyebabkan pemindahan wilayah kerja KPP terdaftar diterbitkan dalam <strong>5 hari kerja</strong>.</p>", "page": "hlm 250", "id": "pengawasan_r_142"}, {"heading": "Kriteria WP OP Nonaktif", "p": 0, "html": "<p>WP OP ditetapkan Nonaktif jika: (a) melakukan usaha namun hentikan usahanya (tak lagi penuhi syarat objektif); (b) tidak usaha dan belum/tidak peroleh penghasilan di atas PTKP; (c) WNI Penduduk berniat jadi SPLN tapi belum penuhi syarat; (d) WNI Penduduk tak lagi penuhi syarat subjektif &amp; objektif; (e) wanita kawin memilih gabung kewajiban dengan suami; (f) kriteria tertentu Dirjen Pajak. Penetapan/pengaktifan kembali: 5 hari kerja sejak permohonan lengkap.</p>", "page": "hlm 251-252", "id": "pengawasan_r_143"}, {"heading": "Penetapan Subjek Pajak Luar Negeri", "p": 0, "html": "<p>WP OP WNI Penduduk mengajukan permohonan status SPLN → Kepala KPP meneliti → terbit Penetapan WP Nonaktif (sebagai pengganti Surat Keterangan WNI memenuhi syarat SPLN) jika memenuhi syarat, atau Penolakan jika tidak. Jika WP OP yang sudah ditetapkan Nonaktif (karena berniat SPLN) kemudian tidak memenuhi syarat/tidak mengajukan permohonan surat keterangan, penetapan Nonaktif <strong>batal</strong>, tetap SPDN, dan dikenai pajak sesuai ketentuan SPDN.</p>", "page": "hlm 253-254", "id": "pengawasan_r_144"}, {"heading": "Penghapusan NPWP WP OP — Kriteria &amp; Syarat", "p": 0, "html": "<p>Kriteria: WP OP meninggal tanpa warisan; meninggalkan Indonesia selama-lamanya (Penduduk/bukan Penduduk); atau memiliki >1 NPWP. Syarat agar dapat dihapus: <strong>tidak punya utang pajak</strong>; tidak sedang diperiksa/bukper/penyidikan/penuntutan; tidak sedang proses MAP/APA; tidak sedang proses upaya administratif &amp; hukum (pembetulan, keberatan, pengurangan sanksi/SKP/STP/PBB, gugatan, banding, PK). Keputusan diterbitkan maks. 6 bulan; jika terlampaui dianggap dikabulkan, surat keputusan terbit maks. 1 bulan setelahnya.</p>", "page": "hlm 255-259", "id": "pengawasan_r_145"}, {"heading": "WP Warisan Belum Terbagi", "p": 0, "html": "<p>Menggunakan NPWP WP OP pewaris. Jika pewaris belum ber-NPWP dan warisan menghasilkan penghasilan, <strong>wakil</strong> (ahli waris/pelaksana wasiat/pengurus harta peninggalan) wajib mendaftarkan paling lambat akhir bulan berikutnya setelah WP OP meninggal, untuk memperoleh NPWP (dan NITKU jika ada tempat usaha). Wakil melaksanakan hak &amp; kewajiban perpajakan atas nama Warisan Belum Terbagi. Dapat diubah datanya atau dihapus (jika warisan sudah selesai dibagi) dengan mekanisme serupa WP OP.</p>", "page": "hlm 260-261", "id": "pengawasan_r_146"}, {"heading": "WP Badan — Pendaftaran &amp; NPWP Jabatan", "p": 0, "html": "<p>WP Badan wajib mendaftar pada KPP sesuai tempat kedudukan, paling lama 1 bulan setelah didirikan/bertempat kedudukan di Indonesia; mencakup Badan dengan kewajiban sebagai pembayar/pemotong/pemungut pajak, atau hanya pemotong/pemungut. NPWP terbit maks. 1 hari kerja setelah permohonan lengkap. Jika tidak mendaftar, Kepala KPP terbitkan NPWP secara jabatan berdasar penelitian administrasi (termasuk data ekstensifikasi). Badan yang tidak penuhi syarat subjektif/bukan subjek pajak (Pasal 3 UU PPh) tetap dapat diberi NPWP untuk kepentingan administrasi.</p>", "page": "hlm 262-263", "id": "pengawasan_r_147"}, {"heading": "WP Instansi Pemerintah — Pendaftaran &amp; NITKU Subunit", "p": 0, "html": "<p>Didaftarkan oleh kepala IP Pusat/KPA/kepala BLU (Instansi Pemerintah Pusat); kepala IP Daerah/PA/kepala BLUD (Instansi Pemerintah Daerah); atau Kades/perangkat desa (Instansi Pemerintah Desa) — paling lama sebelum melakukan pemotongan/pemungutan pajak. Wajib melaporkan subunit organisasinya ke KPP tempat WP IP terdaftar untuk memperoleh NITKU bagi tiap subunit. Dokumen pendaftaran menunjukkan status pengguna APBN/APBD/BLU/BLUD/APBDes.</p>", "page": "hlm 268", "id": "pengawasan_r_148"}, {"heading": "Kriteria &amp; Penghapusan WP Instansi Pemerintah Nonaktif", "p": 0, "html": "<p>Kriteria Nonaktif: tidak memenuhi syarat sebagai pemotong/pemungut namun belum dihapus NPWP-nya, atau kriteria tertentu Dirjen Pajak. Penghapusan NPWP (permohonan/jabatan, 6 bulan) mensyaratkan: tidak memenuhi syarat pemotong/pemungut, tidak punya utang pajak, tidak sedang diperiksa/bukper/penyidikan/penuntutan, tidak proses MAP/APA, dan tidak proses upaya administratif/hukum (daftar sama dengan WP OP).</p>", "page": "hlm 264-267", "id": "pengawasan_r_149"}, {"heading": "Wewenang Dirjen Pajak Secara Jabatan — Ringkasan", "p": 0, "html": "<p>Dirjen Pajak secara jabatan dapat: menerbitkan NPWP untuk WP OP/Warisan Belum Terbagi/Badan/Instansi Pemerintah yang tidak mendaftar; memberikan nomor identitas perpajakan (NPWP) kepada OP/Badan yang belum penuhi syarat subjektif/objektif atau bukan subjek pajak (untuk kemudahan administrasi); serta menghapus NPWP WP yang tak lagi memenuhi syarat.</p>", "page": "hlm 269", "id": "pengawasan_r_150"}, {"heading": "Tata Cara Pengukuhan PKP — Kewajiban &amp; Pengecualian", "p": 0, "html": "<p>Pengusaha yang melakukan penyerahan dan/atau ekspor BKP/JKP sesuai UU PPN <strong>wajib</strong> melaporkan usahanya untuk dikukuhkan sebagai PKP, <strong>kecuali Pengusaha Kecil</strong> (batasan ditetapkan Menkeu). Jika tidak melaksanakan kewajiban sesuai batas waktu PMK 164/2023, dikenai sanksi sesuai UU KUP. Pengusaha Kecil dapat memilih untuk dikukuhkan (jika sejak semula bermaksud melakukan penyerahan/ekspor, atau sukarela).</p>", "page": "hlm 270-271", "id": "pengawasan_r_151"}, {"heading": "Virtual Office sebagai Tempat Pelaporan Usaha", "p": 0, "html": "<p>Pengusaha di dalam kawasan FTZ wajib menentukan satu tempat pelaporan usaha di luar kawasan FTZ. Penyedia Jasa Kantor Virtual harus: telah dikukuhkan PKP, menyediakan ruang fisik untuk kegiatan usaha Pengusaha yang akan dikukuhkan, dan secara nyata melakukan layanan pendukung kantor — dibuktikan dengan dokumen kontrak/perjanjian yang masih berlaku dan dokumen izin/NIB dari instansi berwenang. Ketentuan ini berlaku juga bagi Pengusaha Badan di FTZ yang memilih Kantor Virtual di luar kawasan sebagai tempat kegiatan usaha.</p>", "page": "hlm 272-273", "id": "pengawasan_r_152"}, {"heading": "Tata Cara Pengukuhan PKP — Penelitian 10 Hari Kerja", "p": 0, "html": "<p>Pengusaha menyampaikan permohonan pengukuhan PKP + pernyataan kegiatan/tempat usaha sebenarnya (jika pakai Kantor Virtual) via Portal WP/laman terintegrasi/Contact Center sesuai Pasal 4, atau langsung/pos. Kepala KPP menerbitkan Surat Keterangan Permohonan Pengukuhan PKP (1 hari kerja), lalu Penelitian (10 hari kerja) meliputi: (a) kelengkapan data/dokumen identitas/pendirian/kegiatan usaha; (b) kesesuaian kegiatan usaha di tempat tinggal/kedudukan/kegiatan usaha dengan dokumen; (c) khusus Kantor Virtual: penelitian penggunaan &amp; pernyataan kegiatan usaha sebenarnya.</p>", "page": "hlm 274", "id": "pengawasan_r_153"}, {"heading": "Mekanisme Penelitian Data Pengukuhan PKP", "p": 0, "html": "<p>Meneliti data/dokumen dalam sistem administrasi DJP: untuk Pengusaha OP — identitas diri (WNI/WNA); untuk Pengusaha Badan — dokumen pendirian/pembentukan &amp; perubahannya, dan identitas seluruh pengurus/penanggung jawab. Hasilnya: <strong>menerima</strong> permohonan (diberi akses pembuatan Faktur Pajak sejak tanggal dimulainya kewajiban PKP dalam SPPKP), atau <strong>menolak</strong> permohonan.</p>", "page": "hlm 275", "id": "pengawasan_r_154"}, {"heading": "Penonaktifan Akses Pembuatan Faktur Pajak", "p": 0, "html": "<p>Dinonaktifkan jika: (1) PKP terindikasi menyalahgunakan/menggunakan tanpa hak pengukuhan PKP; dan/atau (2) PKP tidak melaksanakan kewajiban sesuai kriteria Dirjen Pajak. PKP dapat menyampaikan klarifikasi kepada Dirjen Pajak; jika klarifikasi tidak disampaikan dalam <strong>30 hari</strong> sejak penonaktifan (atau klarifikasi ditolak), PKP <strong>DICABUT</strong>. Jika klarifikasi diterima, akses pembuatan Faktur Pajak diaktifkan kembali.</p>", "page": "hlm 276", "id": "pengawasan_r_155"}, {"heading": "Pengukuhan PKP Secara Jabatan &amp; Pencabutan PKP", "p": 0, "html": "<p><strong>Pengukuhan Jabatan</strong>: dilakukan jika Pengusaha tidak melaksanakan kewajiban lapor usaha, berdasar hasil pemeriksaan atau penelitian administrasi → terbit SPPKP + akses Faktur Pajak. <strong>Pencabutan PKP</strong> (permohonan atau jabatan, berdasar hasil pemeriksaan atau penelitian administrasi): pemeriksaan maks. <strong>6 bulan</strong>; jika terlampaui dianggap dikabulkan, Surat Pencabutan terbit maks. 1 bulan setelahnya.</p>", "page": "hlm 277", "id": "pengawasan_r_156"}, {"heading": "Kriteria Pencabutan PKP Secara Jabatan (Penelitian Administrasi)", "p": 0, "html": "<p>(a) PKP berstatus WP Nonaktif; (b) PKP telah dinonaktifkan akses Faktur Pajak &amp; tidak klarifikasi dalam 30 hari atau klarifikasi ditolak; (c) PKP menyalahgunakan/tanpa hak pengukuhan dengan putusan pengadilan berkekuatan hukum tetap; (d) PKP OP meninggal tanpa warisan; (e) PKP BUT hentikan kegiatan usaha di Indonesia; dan/atau (f) kriteria lain Dirjen Pajak.</p>", "page": "hlm 278", "id": "pengawasan_r_157"}, {"heading": "Ketentuan Lain-lain &amp; Peralihan PMK 147/2017", "p": 0, "html": "<p>SKP/STP dapat diterbitkan untuk Masa/Tahun Pajak sebelum WP diberi NPWP/dikukuhkan PKP, maks. 5 tahun ke belakang. Penerbitan SKP/STP terkait kewajiban PPN tidak mengharuskan Pengusaha dikukuhkan PKP, <strong>kecuali</strong> jika penghitungan PPN dalam SKPKB/SKPKBT menerapkan pedoman pengkreditan PM (Pasal 9 ayat 9a UU PPN) — maka wajib dikukuhkan PKP dulu. Penghapusan NPWP/Pencabutan PKP tidak menghilangkan hak &amp; kewajiban perpajakan WP yang bersangkutan.</p>", "page": "hlm 279-282", "id": "pengawasan_r_158"}, {"heading": "PMK 242/2014: Pembayaran dengan Mata Uang Dolar AS", "p": 0, "html": "<p>WP Badan yang mendapat izin menyelenggarakan pembukuan dalam bahasa Inggris dan mata uang dolar AS wajib membayar/menyetor PPh Pasal 25/29, STP, SKPKB, SKPKBT, SPTPBB, SPT terutang, SK Pembetulan, SK Keberatan, SK Persetujuan Bersama, Putusan Banding, dan Putusan PK, serta Deposit Pajak dalam mata uang dolar AS. Pihak Lain yang berkedudukan di luar Daerah Pabean dan memilih melaksanakan kewajiban PPN PMSE dengan dolar AS juga wajib mengisi SPT Masa PPN dengan mata uang dolar AS.</p>", "page": "hlm 301", "id": "pengawasan_r_159"}, {"heading": "PMK 242/2014: Pemindahbukuan (Pbk)", "p": 0, "html": "<p>Pemindahbukuan dapat dilakukan atas permohonan WP atau secara jabatan. Objek Pbk antara lain: Deposit Pajak; PPh atas pengalihan tanah/bangunan yang belum diteliti; penyetoran di muka Bea Meterai yang belum digunakan untuk menambah saldo deposit MTMD; dan jumlah pembayaran yang lebih besar daripada pajak terutang. Pbk secara jabatan dapat dilakukan a.l. karena kesalahan penerbitan bukti Pbk, penghapusan NPWP, atau tindak lanjut penyitaan oleh juru sita (sebelumnya: tidak ada Pbk secara jabatan).</p><p><strong>Kriteria Pbk yang TIDAK DAPAT dilakukan</strong>: pembayaran melalui SSP yang dipersamakan Faktur Pajak yang PM-nya tidak dapat dikreditkan (Pasal 9 ayat 8 UU PPN); penyetoran Bea Meterai untuk distribusi/penjualan meterai; pembayaran dengan kode billing bukan dari sistem DJP; pembayaran yang dianggap sebagai penyampaian SPT Masa; dan pembayaran yang sudah diperhitungkan dengan pajak terutang dalam STP/SKP/SK/Putusan. Pemindahbukuan hanya dapat dilakukan antar pembayaran pajak dalam mata uang yang sama.</p>", "page": "hlm 302-303", "id": "pengawasan_r_160"}, {"heading": "PMK 242/2014: Permohonan Penambahan Saldo Deposit MTMD", "p": 0, "html": "<p>WP pemilik izin MTMD (Mesin Teraan Meterai Digital) dapat menambah saldo deposit dengan dua cara: (1) penyetoran di muka Bea Meterai, atau (2) permohonan penambahan saldo deposit dengan mencantumkan nomor seri mesin dan nilai nominal sebesar Rp15.000.000,00 atau kelipatannya. Permohonan yang tidak sesuai ketentuan mengakibatkan sistem gagal menghasilkan tambahan saldo deposit/kode.</p>", "page": "hlm 304", "id": "pengawasan_r_161"}, {"heading": "PMK 242/2014: Pengangsuran/Penundaan Pembayaran karena Kesulitan Likuiditas/Force Majeur", "p": 0, "html": "<p>Dasar: kekurangan pembayaran pajak terutang menurut SPT Tahunan PPh. Syarat permohonan: WP telah menyampaikan SPT Tahunan PPh 2 tahun terakhir dan SPT Masa PPN 3 masa pajak terakhir; mencantumkan alasan (kesulitan likuiditas atau force majeur) dan rincian jumlah/masa angsuran/penundaan; dilampiri laporan keuangan interim/catatan peredaran bruto, serta bukti force majeur dari pihak berwenang (jika force majeur); dan memberikan jaminan berupa dokumen aset berwujud milik WP yang tidak sedang dijadikan jaminan utang lain.</p>", "page": "hlm 305-306", "id": "pengawasan_r_162"}, {"heading": "PMK 242/2014: Pengangsuran PPh Pasal 29 (Kekurangan SPT Tahunan)", "p": 0, "html": "<p>Disampaikan paling lama sebelum batas waktu penyampaian SPT Tahunan PPh dan sebelum SPT Tahunan disampaikan. Tata cara penyampaian mengikuti ketentuan pelaksanaan hak dan pemenuhan kewajiban perpajakan (Pasal 4). <em>Aturan sebelumnya: permohonan diajukan paling lama 9 hari kerja sebelum jatuh tempo pembayaran.</em></p>", "page": "hlm 307", "id": "pengawasan_r_163"}, {"heading": "PMK 242/2014: Pengangsuran Utang Pajak (STP/SKP/SK/Putusan) & PBB", "p": 0, "html": "<p>Untuk pajak yang masih harus dibayar (Pasal 97 ayat 3) dan kewajiban pelunasan (Pasal 98 ayat 1), syaratnya mirip (kesulitan likuiditas/force majeur) namun jaminan aset berwujud minimal sebesar jumlah yang dimohonkan dan dibuktikan kepemilikannya oleh Penanggung Pajak. Khusus PBB, permohonan juga harus dilampiri salinan STP PBB; jika dokumen sudah tervalidasi dalam sistem DJP, tidak perlu dilampirkan lagi.</p>", "page": "hlm 308-309", "id": "pengawasan_r_164"}, {"heading": "PMK 242/2014: Pengangsuran atas Keputusan Pembahasan Akhir Hasil Pemeriksaan", "p": 0, "html": "<p>(Ketentuan baru, belum diatur sebelumnya) Dapat diajukan dalam hal: (a) WP menyetujui seluruh nilai pajak yang masih harus dibayar dalam PAHP; (b) terdapat nilai yang tidak disetujui dan WP tidak mengajukan keberatan sampai jatuh tempo; atau (c) WP mengajukan keberatan tetapi tidak banding. Jaminan aset berwujud diserahkan kepada Dirjen Pajak paling lama 3 hari kerja setelah permohonan disampaikan. Permohonan dapat diajukan paling lama sebelum permohonan lelang atas barang sitaan diajukan oleh pejabat penagihan; jika sudah ada permohonan lelang dan masih ada sisa utang pajak, WP dapat mengajukan pengangsuran/penundaan atas sisa tersebut.</p>", "page": "hlm 310-312", "id": "pengawasan_r_165"}, {"heading": "PMK 242/2014: Jangka Waktu Keputusan & Lama Pengangsuran/Penundaan", "p": 0, "html": "<p>Dirjen Pajak memberi keputusan paling lama 3 hari kerja (untuk permohonan Pasal 114) atau 7 hari kerja (untuk Pasal 115) sejak bukti penerimaan diterbitkan — <em>sebelumnya 7 hari kerja sejak tanggal diterima permohonan</em>. Jika lewat waktu dan belum ada keputusan, permohonan dianggap disetujui, keputusan diterbitkan paling lama 3 hari kerja setelah jangka waktu berakhir. Jangka waktu pengangsuran/penundaan paling lama sampai batas waktu SPT Tahunan PPh tahun berikutnya, atau 24 bulan sejak diterbitkannya surat persetujuan. Pembayaran angsuran ditetapkan sama besar tiap bulan.</p>", "page": "hlm 313-314", "id": "pengawasan_r_166"}, {"heading": "PMK 242/2014: Denda Administratif Pengangsuran/Penundaan PBB", "p": 0, "html": "<p>Denda administratif dihitung sejak jatuh tempo STP PBB sampai tanggal pelunasan pengangsuran/penundaan, dan tidak melampaui 24 bulan sejak jatuh tempo Surat Pemberitahuan Pajak Terutang/SKP PBB. Sanksi administratif berupa bunga ditagih dengan STP, denda administratif PBB ditagih dengan STP PBB; keduanya tidak dikenakan atas angsuran/penundaan STP yang hanya memuat denda administratif.</p>", "page": "hlm 315-316", "id": "pengawasan_r_167"}, {"heading": "PMK 242/2014: Surat Keputusan Tidak Berlaku/Dibatalkan", "p": 0, "html": "<p>(Ketentuan baru) Surat keputusan persetujuan pengangsuran/penundaan menjadi tidak berlaku dan dilakukan penagihan pajak jika WP tidak memenuhi pembayaran berdasarkan: surat keputusan pengangsuran paling banyak 2 kali, atau surat keputusan penundaan sesuai lamanya penundaan.</p>", "page": "hlm 317", "id": "pengawasan_r_168"}, {"heading": "PMK 187/2015: Tata Cara Pengembalian Kelebihan Pembayaran Pajak yang Seharusnya Tidak Terutang", "p": 0, "html": "<p>Dasar hukum: Pasal 17 ayat (2) UU KUP. Objek yang dapat diajukan pengembalian: PPh, PPN, PPnBM, PBB, Bea Meterai, Pajak Penjualan, dan Pajak Karbon — kecuali Deposit Pajak yang tidak digunakan untuk pelunasan pajak terutang. Ruang lingkup pengembalian: (1) pembayaran bukan objek pajak terutang/seharusnya tidak terutang; (2) kelebihan pembayaran terkait pajak dalam rangka impor; (3) kesalahan pemotongan/pemungutan yang mengakibatkan pajak lebih besar dari seharusnya; (4) kesalahan pemotongan/pemungutan atas bukan objek pajak atau objek/subjek yang dapat fasilitas; (5) kelebihan pemotongan/pemungutan PPh terkait penerapan P3B bagi SPLN.</p>", "page": "hlm 320-321", "id": "pengawasan_r_169"}, {"heading": "PMK 187/2015: Tata Cara Penelitian & Penerbitan SKPLB", "p": 0, "html": "<p>WP mengajukan permohonan ke KPP tempat WP terdaftar, KPP melakukan penelitian atas pemenuhan kriteria dan menerbitkan SKPLB atau pemberitahuan penolakan paling lama 3 bulan sejak permohonan diterima. Apabila lewat 3 bulan tanpa keputusan, permohonan dianggap dikabulkan dan Dirjen Pajak menerbitkan SKPLB dalam 5 hari kerja sejak berakhirnya batas waktu 3 bulan. Kriteria penelitian: pajak yang seharusnya tidak terutang telah dibayar ke Kas Negara, dan telah dibayar tersebut tidak dikreditkan dalam SPT.</p>", "page": "hlm 322, 325", "id": "pengawasan_r_170"}, {"heading": "PMK 187/2015: Permohonan Pengembalian atas Kesalahan Pemotongan/Pemungutan", "p": 0, "html": "<p>Dapat diajukan oleh pihak terpungut, Pihak Lain, pihak yang menerima perolehan, atau dianggap diminta kembali oleh pihak terpungut (untuk PPN, tergantung status apakah PM sudah dikreditkan). Permohonan PPh melampirkan: penghitungan pajak seharusnya tidak terutang, alasan, bukti pemotongan/pemungutan, surat kuasa (jika diajukan pemotong/pemungut), dan surat pernyataan SPLN. Kriteria penelitian: pajak telah dibayar ke Kas Negara DAN telah dilaporkan dalam SPT Masa pemotong/pemungut DAN tidak diajukan keberatan oleh WP yang dipotong/dipungut.</p>", "page": "hlm 328-331, 334-335", "id": "pengawasan_r_171"}, {"heading": "PMK 18/2021: Ruang Lingkup Pemberian Imbalan Bunga", "p": 0, "html": "<p>(Pelaksanaan UU Cipta Kerja terkait KUP) Imbalan bunga diberikan atas 5 kondisi: (1) keterlambatan pengembalian kelebihan pembayaran pajak (Pasal 11 ayat 3 UU KUP); (2) keterlambatan penerbitan SKPLB (Pasal 17B ayat 3); (3) keterlambatan penerbitan SKPLB terkait proses pidana (Pasal 17B ayat 4); (4) kelebihan pembayaran karena keberatan/banding/PK dikabulkan sebagian/seluruhnya (Pasal 27B ayat 1); dan (5) kelebihan pembayaran karena SK Pembetulan atau SK Pengurangan/Pembatalan SKP/STP yang mengabulkan sebagian/seluruhnya permohonan WP (Pasal 27B ayat 3).</p>", "page": "hlm 339-340", "id": "pengawasan_r_172"}, {"heading": "PMK 18/2021: Mekanisme Pemberian Imbalan Bunga", "p": 0, "html": "<p>Atas permohonan Imbalan Bunga WP, dilakukan penelitian — jika memenuhi ketentuan diterbitkan SKPIB (Surat Keputusan Pemberian Imbalan Bunga) → SKPKPP → SPMIB → SP2D, dalam jangka waktu 1 bulan. Jika tidak memenuhi ketentuan, diterbitkan pemberitahuan SKPIB tidak diterbitkan. <em>Pengaturan sebelumnya: tindak lanjut dari SKPIB adalah SKPPIB.</em></p>", "page": "hlm 341", "id": "pengawasan_r_173"}, {"heading": "PMK 244/2014: Ruang Lingkup Kelebihan Pembayaran Pajak & Imbalan Bunga", "p": 0, "html": "<p>Kelebihan pembayaran pajak dapat timbul dari Hasil Penelitian/Pemeriksaan (SKPLB Pasal 17 ayat 1 & 2 KUP, SKPPKP Pasal 17B/17C/17D KUP & Pasal 9 ayat 4c PPN, PPN VAT Refund) atau Keputusan Atas Upaya Hukum (SK Keberatan, SK Pasal 36(1) KUP, SK Pasal 19&20 PBB, SK Pembetulan, Putusan Banding/PK, SK Persetujuan Bersama). Imbalan Bunga timbul dari SKPIB atau SK Pembetulan SKPIB.</p>", "page": "hlm 342-343", "id": "pengawasan_r_174"}, {"heading": "PMK 244/2014: Perbandingan SKPLB Pasal 17B, Pasal 17(1), Pasal 17(2) KUP", "p": 0, "html": "<p><strong>Pasal 17B KUP</strong>: WP lapor SPT restitusi → wajib dilakukan Pemeriksaan → SKPLB (dasar pengembalian). <strong>Pasal 17(1) KUP</strong>: WP lapor SPT status KB/Nihil/LB tanpa permohonan restitusi → dilakukan Pemeriksaan → SKPLB → WP mengajukan permohonan restitusi atas SKPLB tersebut. <strong>Pasal 17(2) KUP</strong>: Permohonan pengembalian pajak yang seharusnya tidak terutang → dilakukan Penelitian (bukan Pemeriksaan) → SKPLB (dasar pengembalian langsung).</p>", "page": "hlm 344", "id": "pengawasan_r_175"}, {"heading": "PMK 244/2014: Alur, Mekanisme, dan Jangka Waktu Pengembalian", "p": 0, "html": "<p>Dasar pengembalian (SKPLB/SKPPKP/SK/Putusan) → SKPKPP (Surat Keputusan Pengembalian Kelebihan Pembayaran Pajak) → SPMKP/SPMIB → SP2D (dianggap sah jika mendapat nomor SP2D). SKPKPP diterbitkan paling lama 1 bulan sejak diterima permohonan (nomor rekening), diterbitkan (untuk SKPLB 17/2, 17B, SKPPKP, SK Pasal 36(1), SK Persetujuan Bersama, SK Pasal 19&20 PBB, SKPIB), atau diterima (Putusan Banding/PK oleh KPP yang melaksanakan).</p>", "page": "hlm 345", "id": "pengawasan_r_176"}, {"heading": "PMK 244/2014: Mekanisme Kompensasi dengan Utang Pajak", "p": 0, "html": "<p>Kelebihan pembayaran pajak dan Imbalan Bunga diperhitungkan terlebih dahulu dengan Utang Pajak (Pasal 54 ayat 1 PMK PSIAP). DJP mengirimkan permintaan konfirmasi kompensasi, WP harus memberi persetujuan paling lama 7 hari sejak permintaan disampaikan, atau 1 hari sebelum jatuh tempo penerbitan SKPKPP (mana yang lebih dahulu). Jika WP tidak menyampaikan persetujuan, sisa kelebihan pembayaran dikembalikan kepada WP. Apabila masih ada sisa setelah kompensasi, berdasarkan persetujuan WP dapat digunakan untuk membayar utang pajak atas nama WP lain dan/atau mengisi Deposit Pajak.</p>", "page": "hlm 346", "id": "pengawasan_r_177"}, {"heading": "PMK 244/2014: Daftar Jenis Utang Pajak untuk Kompensasi", "p": 0, "html": "<p>10 jenis utang pajak yang dapat dikompensasikan: (1) STP, kecuali terkait jumlah pajak yang tidak disetujui dalam PAHP yang masih diajukan keberatan/banding; (2) SKPKB/SKPKBT atas jumlah yang disetujui; (3) SKPKB/SKPKBT atas jumlah yang tidak disetujui dalam kondisi tertentu; (4) SPPT; (5) STP PBB; (6) SKP PBB; (7) SK Keberatan yang menambah pajak terutang tapi tidak dibanding; (8) SK Pembetulan yang menambah pajak terutang; (9) SK Persetujuan Bersama yang menambah pajak terutang; (10) Putusan Banding/PK yang menambah pajak terutang.</p>", "page": "hlm 347", "id": "pengawasan_r_178"}, {"heading": "PMK 244/2014: Nomor Rekening & Pengecualian Pengembalian", "p": 0, "html": "<p>Pengembalian menggunakan nomor rekening dalam negeri atas nama WP pada profil WP dalam basis data perpajakan. Pengecualian: PPN VAT Refund menggunakan rekening LN a.n. Turis Asing; pengembalian ke PNABI/pejabatnya menggunakan rekening LN a.n. PNABI; pengembalian ke SPLN yang pemotong/pemungutnya tidak ditemukan menggunakan rekening LN a.n. SPLN bersangkutan; pengembalian ke WP penggabungan/peleburan ke rekening entitas hasil penggabungan; ke WP pailit/pembubaran/likuidasi/WBT masing-masing ke rekening kurator/pihak yang ditugasi/likuidator/ahli waris.</p>", "page": "hlm 348", "id": "pengawasan_r_179"}, {"heading": "PMK 243/2014: Kewajiban Mengisi, Menandatangani, Menyampaikan SPT", "p": 0, "html": "<p>WP wajib mengisi SPT dengan benar/lengkap/jelas, dalam bahasa Indonesia, huruf Latin, angka Arab, satuan mata uang rupiah (kecuali WP berizin pembukuan bahasa Inggris/dolar AS). SPT ditandatangani oleh WP/Wakil WP/Kuasa WP, dengan tanda tangan biasa atau tanda tangan elektronik (jika disampaikan elektronik; penyampaian elektronik dengan cara lain tidak diberi bukti penerimaan dan dianggap tidak menyampaikan SPT). SPT disampaikan ke tempat WP terdaftar/dikukuhkan/tempat lain yang ditetapkan Dirjen Pajak.</p>", "page": "hlm 349-350", "id": "pengawasan_r_180"}, {"heading": "PMK 243/2014: Kelengkapan SPT Tahunan PPh (Laporan Keuangan)", "p": 0, "html": "<p>SPT Tahunan PPh bagi WP yang menyelenggarakan Pembukuan wajib dilampiri laporan keuangan (neraca & laba rugi serta keterangan lain). Jika diaudit akuntan publik, wajib melampirkan yang telah diaudit. Jika SPT disampaikan elektronik, laporan keuangan juga disampaikan dalam bentuk elektronik. WP yang merupakan perusahaan induk wajib melampirkan juga laporan keuangan konsolidasi, selain laporan keuangan WP sendiri.</p>", "page": "hlm 351", "id": "pengawasan_r_181"}, {"heading": "PMK 243/2014: Cara Penyampaian SPT", "p": 0, "html": "<p>3 cara: Elektronik (melalui Portal WP atau aplikasi lain terintegrasi sistem DJP — WP yang wajib SPT Elektronik sesuai Pasal 163 wajib menyampaikan secara elektronik); Langsung (ke KPP, KP2KP, atau tempat lain yang ditetapkan Dirjen Pajak); dan Kirim (melalui pos atau perusahaan jasa ekspedisi/kurir dengan bukti pengiriman surat, ke KPP tempat WP terdaftar atau tempat lain yang ditetapkan Dirjen Pajak).</p>", "page": "hlm 352", "id": "pengawasan_r_182"}, {"heading": "PMK 243/2014: Batas Waktu Penyampaian SPT Tahunan & SPOP", "p": 0, "html": "<p>SPT Tahunan PPh OP: 3 bulan setelah akhir Tahun Pajak/Bagian Tahun Pajak. SPT Tahunan PPh Badan: 4 bulan setelah akhir Tahun Pajak/Bagian Tahun Pajak. SPT Tahunan Pajak Karbon: 4 bulan setelah akhir tahun kalender. SPOP: 30 hari setelah tanggal diterimanya SPOP — tanggal diterima ditetapkan 1 Februari (Perkebunan/Migas/Panas Bumi), 31 Maret (Perhutanan/Minerba/sektor lain), atau tanggal objek PBB terdaftar sesuai SKT PBB.</p>", "page": "hlm 353", "id": "pengawasan_r_183"}, {"heading": "PMK 243/2014: Batas Waktu SPT Masa", "p": 0, "html": "<p>PPh Pasal 21/26, PPh Pasal 25, PPh Unifikasi (Pasal 15, 22, 23/26, 4(2)), Laporan Penerimaan Negara migas, dan Pajak Karbon: 20 hari setelah Masa Pajak berakhir. Bea Meterai: 15 hari setelah Masa Pajak berakhir. PPN (semua jenis SPT Masa PPN): akhir bulan berikutnya setelah Masa Pajak berakhir. Jika batas waktu bertepatan hari libur (khusus SPT Masa), pelaporan dapat dilakukan paling lambat hari kerja berikutnya — ketentuan ini TIDAK berlaku untuk SPT Tahunan.</p>", "page": "hlm 355-356, 361", "id": "pengawasan_r_184"}, {"heading": "PMK 243/2014: Ketentuan Khusus PPh Pasal 21/26, 25, dan 4(2)", "p": 0, "html": "<p>PPh Pasal 21/26 wajib dilaporkan sepanjang terdapat pembayaran penghasilan sehubungan pekerjaan/jasa/kegiatan OP untuk Masa Pajak selain Masa Pajak Terakhir, dan untuk Masa Pajak Terakhir (Desember, atau masa pegawai berhenti/pensiunan berhenti terima uang pensiun). PPh Pasal 25 yang telah dibayar dan mendapat validasi dianggap telah lapor sesuai tanggal pembayaran (kewajiban lapor tidak berlaku bagi WP dengan angsuran nihil). PPh Pasal 4(2) atas PHTB/pengalihan Real Estat KIK yang telah divalidasi dianggap telah memenuhi kewajiban pelaporan sesuai tanggal pembayaran (declaration by validation).</p>", "page": "hlm 357", "id": "pengawasan_r_185"}, {"heading": "PMK 243/2014: Perpanjangan Penyampaian SPT Tahunan", "p": 0, "html": "<p>WP dapat memperpanjang jangka waktu penyampaian SPT Tahunan PPh/Pajak Karbon paling lama 2 bulan sejak batas waktu, dengan menyampaikan Pemberitahuan Perpanjangan (elektronik atau formulir kertas untuk PPh) sebelum batas waktu berakhir, dilampiri: penghitungan sementara pajak terutang, Laporan Keuangan sementara, SSP/BPN (jika ada kekurangan bayar), dan surat pernyataan akuntan publik (jika audit belum selesai).</p>", "page": "hlm 358-359", "id": "pengawasan_r_186"}, {"heading": "PMK 243/2014: Sanksi Administrasi Telat/Tidak Lapor SPT & Pengecualian", "p": 0, "html": "<p>Sanksi denda Pasal 7 ayat (1) UU KUP: SPT Masa PPN Rp500.000, SPT Masa lainnya Rp100.000, SPT Tahunan OP Rp100.000, SPT Tahunan Badan Rp1.000.000 — dikecualikan untuk SPT Masa PPh Final pengungkapan harta bersih, SPT Masa PPh Final PPS, dan SPOP. Sanksi tidak dikenakan terhadap: WP OP meninggal tanpa warisan yang belum terbagi; WP OP tidak lagi usaha/pekerjaan bebas; WNA yang tidak tinggal/berada di Indonesia >183 hari; BUT yang tidak lagi beroperasi; Badan yang tidak usaha lagi tapi belum dibubarkan; Instansi Pemerintah yang tidak bayar lagi; WP terkena bencana; atau &ldquo;WP lain&rdquo; (kerusuhan massal, kebakaran, bom/terorisme, perang antarsuku, kegagalan sistem administrasi, atau keadaan lain menurut Dirjen Pajak).</p>", "page": "hlm 362-364", "id": "pengawasan_r_187"}, {"heading": "PMK 243/2014: Pembetulan SPT", "p": 0, "html": "<p>WP dapat membetulkan SPT dengan pernyataan tertulis, dengan tanda di SPT, dengan syarat belum dilakukan Pemeriksaan atau Pemeriksaan Bukti Permulaan secara terbuka. Jika pembetulan menyatakan rugi/lebih bayar, dapat dilakukan paling lama 2 tahun sebelum daluwarsa; jika tidak, dapat dilakukan sampai daluwarsa. Pembetulan yang mengakibatkan utang pajak lebih besar dikenai sanksi bunga Pasal 8 UU KUP = Pajak Kurang Bayar × tarif bunga per bulan (suku bunga acuan + 5%, dibagi 12) × jumlah bulan.</p>", "page": "hlm 365-366", "id": "pengawasan_r_188"}, {"heading": "PMK 243/2014: Pembetulan SPT karena Menerima Ketetapan/Keputusan/Putusan", "p": 0, "html": "<p>Jika WP menerima SKP/SK Keberatan/SK Pembetulan/Putusan Banding/Putusan PK atas Tahun Pajak sebelumnya yang menyatakan rugi fiskal berbeda dari yang telah dikompensasikan dalam SPT Tahunan, WP dapat membetulkan SPT dalam jangka waktu 3 bulan sejak diterima (dihitung sejak stempel pos/diterima langsung), dengan syarat belum dilakukan Pemeriksaan. Jika WP tidak membetulkan, Dirjen Pajak menghitung kembali kompensasi kerugian secara jabatan.</p>", "page": "hlm 367", "id": "pengawasan_r_189"}, {"heading": "PMK 243/2014: Penelitian SPT & Dianggap Tidak Disampaikan", "p": 0, "html": "<p>Penelitian SPT memastikan: ditandatangani sesuai Pasal 3(1) KUP, disampaikan dalam bahasa Indonesia/mata uang yang sesuai izin, dilampiri keterangan/dokumen lengkap, SPT LB disampaikan dalam 3 tahun dan telah ditegur, serta disampaikan sebelum Pemeriksaan/Pemeriksaan Bukper/penerbitan SKP. Untuk SPT via pos/ekspedisi/kurir, dianggap TIDAK disampaikan jika: NPWP tidak valid; SPT sudah pernah disampaikan; isi amplop bukan SPT; 1 amplop berisi >1 SPT; tidak ada bukti bayar untuk status kurang bayar; terdapat kesalahan hitung/jumlah bayar tidak sesuai; atau WP seharusnya wajib elektronik.</p>", "page": "hlm 368-369, 373", "id": "pengawasan_r_190"}, {"heading": "PMK 261/2016: Subjek, Objek, Tarif PPh Final PHTB & PPJB", "p": 0, "html": "<p>Subjek: OP atau Badan. Objek: penghasilan dari pengalihan hak tanah/bangunan (jual beli, tukar-menukar, pelepasan hak, hibah, waris, dll) dan dari Perjanjian Pengikatan Jual Beli (PPJB) — baik dari pihak penjual (saat PPJB pertama ditandatangani) maupun pihak pembeli (atas perubahan pihak pembeli dalam adendum PPJB). Tarif: 0% (pengalihan kepada pemerintah/BUMN/BUMD penugasan khusus pengadaan tanah kepentingan umum), 1% (Rumah Sederhana & Rusun Sederhana oleh WP usaha pokok PHTB), 2,5% (tanah/bangunan selain itu) — bersifat final dari jumlah bruto nilai pengalihan.</p>", "page": "hlm 374-375", "id": "pengawasan_r_191"}, {"heading": "PMK 261/2016: Mekanisme Pembayaran & Tempat Terutang PHTB", "p": 0, "html": "<p>Pengalihan ke selain pemerintah: WP menyetor sendiri sebelum akta/keputusan/kesepakatan/risalah lelang ditandatangani, dihitung berdasarkan jumlah setiap pembayaran (untuk pembayaran angsuran). Pengalihan ke pemerintah (ketentuan baru): PPh dipungut oleh Instansi Pemerintah, disetor atas nama Instansi Pemerintah sebelum pembayaran kepada OP/Badan, dan wajib dibuatkan bukti pemungutan (termasuk untuk tarif 0%) — <em>sebelumnya dipungut bendahara pemerintah, disetor a.n. OP/Badan penjual, tanpa bukti pemungutan, dan tanpa SSP untuk tarif 0%</em>. Tempat terutang (ketentuan baru): di tempat SPT Tahunan WP diadministrasikan — sebelumnya di lokasi tanah/bangunan untuk WP developer.</p>", "page": "hlm 376-377", "id": "pengawasan_r_192"}, {"heading": "PMK 261/2016: Pengecualian PPh Final PHTB & PPJB", "p": 0, "html": "<p>7 pengecualian: (1) OP di bawah PTKP dengan nilai pengalihan <Rp60.000.000 dan bukan hasil pemecahan; (2) hibah OP kepada keluarga sedarah lurus 1 derajat/badan keagamaan/pendidikan/sosial/koperasi/UMK; (3) hibah Badan dengan penerima sejenis; (4) warisan; (5) penggabungan/peleburan/pemekaran usaha dengan nilai buku yang ditetapkan Menteri; (6) bangun guna serah/serah guna/pemanfaatan BMN; (7) PHTB oleh OP/Badan yang bukan subjek pajak. Pembebasan dibuktikan dengan Surat Keterangan Bebas PPh.</p>", "page": "hlm 378", "id": "pengawasan_r_193"}, {"heading": "PMK 37/2017: Definisi & Subjek-Objek PPh DIRE (KIK)", "p": 0, "html": "<p>Definisi: KIK (Kontrak Investasi Kolektif), Real Estat (tanah fisik+bangunan), DIRE (wadah menghimpun dana masyarakat untuk investasi real estat), SPC (Special Purpose Company — PT yang sahamnya ≥99,9% dimiliki DIRE berbentuk KIK). Subjek: OP atau Badan. Objek: penghasilan dari pengalihan Real Estat kepada SPC atau KIK dalam skema KIK tertentu. Tarif: 0,5% final dari jumlah bruto nilai pengalihan (jumlah sesungguhnya diterima jika tidak ada hubungan istimewa; jumlah seharusnya diterima jika ada hubungan istimewa dengan SPC/KIK).</p>", "page": "hlm 379-382", "id": "pengawasan_r_194"}, {"heading": "PMK 37/2017: Mekanisme Pembayaran, Syarat Tarif 0,5%, dan Pelaporan DIRE", "p": 0, "html": "<p>WP wajib menyetor sendiri sebelum akta/keputusan/perjanjian/kesepakatan atas pengalihan ditandatangani. Saat terutang: saat diterimanya sebagian/seluruh pembayaran. Syarat tarif 0,5%: menyampaikan surat pemberitahuan ke KPP dilengkapi (salinan surat efektif pendaftaran DIRE KIK dari OJK, keterangan OJK atas transaksi dengan SPC/KIK DIRE, surat pernyataan bermeterai, dan salinan SSP) serta memenuhi syarat Surat Keterangan Fiskal. Tempat terutang (baru): tempat terdaftar WP (bukan lagi lokasi Real Estat untuk developer). Pelaporan melalui SPT Masa PPh Unifikasi; penyetoran dengan Suket Validasi dianggap telah lapor sesuai tanggal SSP (declaration by validation).</p>", "page": "hlm 383-386", "id": "pengawasan_r_195"}, {"heading": "PMK 257/2011: PPh atas Uplift/Imbalan Lain Sejenis Kontraktor Migas", "p": 0, "html": "<p>Penghasilan lain Kontraktor di luar Kontrak Kerja Sama berupa Uplift (imbalan atas dana talangan pembiayaan operasi kontrak bagi hasil yang seharusnya kewajiban partisipasi kontraktor lain) atau penghasilan dari Pengalihan Participating Interest (PI) dikenakan PPh bersifat final. Tarif Uplift: 20% dari jumlah bruto, terutang saat dibayar/diakui sebagai biaya, dipotong oleh Kontraktor pembayar, disetor dan dilaporkan ke KPP tempat Kontraktor pembayar terdaftar. PKP setelah dikurangi PPh final dari Uplift TIDAK dikenai PPh lagi (diubah Pasal 27 ayat 1a PP 27/2017).</p>", "page": "hlm 401-402", "id": "pengawasan_r_196"}, {"heading": "PMK 257/2011: PPh atas Pengalihan Participating Interest (PI)", "p": 0, "html": "<p>PI = hak, kepentingan, dan kewajiban kontraktor berdasarkan kontrak kerja sama migas (PP 93/2021). Bentuk kepemilikan: Langsung (kepemilikan PI oleh Kontraktor dengan persetujuan Menteri ESDM) atau Tidak Langsung (melalui kepemilikan saham/penyertaan modal pada Kontraktor atau pemiliknya, berlapis). Tarif pengalihan PI: 5% dari jumlah bruto (masa Eksplorasi), 7% dari jumlah bruto (masa Eksploitasi) — bersifat final. Dikecualikan dari PPh final jika memenuhi syarat ketat (tidak mengalihkan seluruh PI, PI dimiliki >3 tahun, ada investasi eksplorasi, tidak untuk cari untung — untuk Langsung; atau restrukturisasi dengan nilai buku/tidak cari untung — untuk Tidak Langsung, dengan kewajiban lapor ke DJP 4 bulan setelah akhir tahun pajak).</p>", "page": "hlm 403-405", "id": "pengawasan_r_197"}, {"heading": "PMK 34/2017: Pemungut, Objek, dan Tarif PPh Pasal 22", "p": 0, "html": "<p>8 kelompok pemungut PPh Pasal 22: (1) Bank Devisa & DJBC (impor/ekspor komoditas tambang); (2) Instansi Pemerintah (pembelian barang, baru — sebelumnya bendahara pemerintah), tarif 1,5% harga pembelian tidak termasuk PPN; (3) Badan usaha tertentu (BUMN & turunannya); (4) industri semen/kertas/baja/otomotif/farmasi (penjualan hasil produksi ke distributor DN), tarif bervariasi 0,1%-0,45%; (5) ATPM/APM/importir kendaraan (0,45% DPP PPN); (6) produsen/importir BBM/BBG/pelumas (0,25%-0,3%); (7) industri/eksportir sektor kehutanan-perkebunan-pertanian-peternakan-perikanan (0,25%); (8) badan usaha pembeli komoditas tambang batubara/mineral (1,5%). Pemberlakuan tarif 100% lebih tinggi bagi WP tanpa NPWP (NPWP=NIK) dihapus.</p>", "page": "hlm 406-408", "id": "pengawasan_r_198"}, {"heading": "PMK 34/2017: Penyetoran dan Pelaporan PPh Pasal 22", "p": 0, "html": "<p>Untuk impor/ekspor: disetor Importir/DJBC saat pembayaran Bea Masuk/penyelesaian dokumen ekspor, bukti SSPCP/BPN, tanpa kewajiban lapor. Untuk Instansi Pemerintah dan pemungut lain: SSP a.n. Instansi Pemerintah/Pemungut, jatuh tempo tanggal 15 bulan berikutnya (baru), bukti pemungutan wajib dibuat Instansi Pemerintah dan Pemungut PPh 22 (baru), dilaporkan dalam SPT Masa PPh Unifikasi termasuk oleh Instansi Pemerintah (baru). <em>Sebelumnya: SSP a.n. Rekanan, jatuh tempo UP tanggal 7/LS hari yang sama, SSP berlaku sebagai bukti pemungutan, ada kewajiban SPT Masa PPh bagi DJBC, IP lapor dalam SPT Masa PPh Unifikasi IP.</em></p>", "page": "hlm 409", "id": "pengawasan_r_199"}, {"heading": "PMK 215/2018: Penghitungan Umum Angsuran PPh Pasal 25", "p": 0, "html": "<p>Rumus umum: Angsuran PPh 25 = (PPh Terutang di SPT Sebelumnya − Kredit Pajak PPh 21/22/23/24) ÷ 12 bulan (atau banyaknya bulan dalam Bagian Tahun Pajak). Rumus umum TIDAK berlaku bagi: WP Baru; bank, BUMN, BUMD, WP masuk bursa, dan WP Lainnya (sektor asuransi/dana pensiun/pembiayaan/jasa keuangan lain); dan WP OP Pengusaha Tertentu (OPPT) — masing-masing punya rumus khusus.</p>", "page": "hlm 410", "id": "pengawasan_r_200"}, {"heading": "PMK 215/2018: Angsuran PPh 25 untuk Bank, WP Masuk Bursa, BUMN/BUMD, dan WP Lainnya", "p": 0, "html": "<p>Formula: (Penghasilan Neto berdasarkan Laporan Keuangan × Tarif PPh Badan − Kredit Pajak tahun berjalan) dibagi 12 bulan (Bank — Lapkeu disampaikan ke OJK sejak awal Tahun Pajak) atau 3 bulan (WP Masuk Bursa & WP Lainnya — Lapkeu triwulanan ke OJK/bursa; BUMN/BUMD — berdasarkan RKAP yang disahkan, dibagi 12 bulan, kredit pajak tahun lalu). Penghasilan neto tidak termasuk penghasilan luar negeri serta penghasilan/biaya terkait objek final & non-objek; memperhitungkan kompensasi kerugian dan fasilitas pengurangan Pasal 17(2b)/31E UU PPh (baru). Jika WP berhak fasilitas pembebasan/pengurangan PPh Badan, Angsuran PPh 25 memperhitungkan fasilitas tersebut (baru).</p>", "page": "hlm 411-414, 416", "id": "pengawasan_r_201"}, {"heading": "PMK 215/2018: Pengecualian dari Rekalkulasi & Rekalkulasi Angsuran PPh 25", "p": 0, "html": "<p>Jika Laporan Keuangan belum dilaporkan ke OJK/bursa sampai batas setor Masa Pajak terakhir, angsuran sama dengan Masa Pajak sebelumnya (Bank/WP Masuk Bursa/WP Lainnya) atau bulan terakhir Tahun Pajak sebelumnya (BUMN/BUMD, jika RKAP belum disahkan). Setelah Lapkeu/RKAP disahkan, angsuran sampai bulan sebelumnya direkalkulasi. Jika hasil rekalkulasi lebih besar (kurang setor), wajib disetor DAN dikenai sanksi administratif UU KUP; jika lebih kecil (lebih setor), dapat dimintakan pengembalian pajak seharusnya tidak terutang (baru) atau dikreditkan dalam SPT PPh. Khusus Bank yang belum menyampaikan Lapkeu tahunan karena masih audit, atau WP masuk bursa tanpa kewajiban Lapkeu triwulan 4, dikecualikan dari rekalkulasi.</p>", "page": "hlm 417-418", "id": "pengawasan_r_202"}, {"heading": "PMK 215/2018: Angsuran PPh 25 WP OPPT & WP Baru", "p": 0, "html": "<p>Angsuran PPh 25 WP OPPT (Orang Pribadi Pengusaha Tertentu) = 0,75% × jumlah peredaran bruto tiap bulan dari masing-masing tempat usaha (termasuk tempat usaha di tempat tinggal WP, ketentuan baru), merupakan kredit pajak atas PPh terutang Tahun Pajak bersangkutan. Untuk WP Baru dalam rangka restrukturisasi: penggabungan/peleburan/pengambilalihan → angsuran = jumlah angsuran seluruh WP sebelum restrukturisasi; pemekaran usaha → total angsuran = angsuran sebelum pemekaran, dibagi per WP berdasarkan persentase nilai harta dialihkan; perubahan bentuk badan usaha → angsuran = angsuran bulan terakhir sebelum perubahan. WP Baru selain kategori tersebut (termasuk bukan hasil restrukturisasi bank/WP masuk bursa/BUMN-BUMD/WP Lainnya): Angsuran PPh 25 = NIHIL.</p>", "page": "hlm 419-422", "id": "pengawasan_r_203"}, {"heading": "KMK 434/1999: PPh Pasal 26 atas Penjualan Saham oleh WPLN Selain BUT", "p": 0, "html": "<p>Pemotong: Pembeli (saat ini tanpa syarat ditunjuk — sebelumnya harus pembeli yang ditunjuk) atau Perseroan (dalam hal pembeli adalah WPLN). Objek: penghasilan berupa keuntungan dari penjualan saham oleh WPLN. Tarif: 20% dari perkiraan penghasilan neto (= 25% dari harga jual) dan bersifat final — mengacu P3B apabila terdapat P3B dengan Indonesia. Tanggal setor: 15 bulan berikutnya (baru, sebelumnya tgl 10); tanggal lapor: 20 bulan berikutnya (baru). Perseroan mencatat pemindahan hak atas saham setelah WPLN menyerahkan salinan bukti potong/pungut sebagai bukti pelunasan PPh (baru — sebelumnya dengan fotokopi bukti potong/pungut menunjukkan aslinya).</p>", "page": "hlm 423-424", "id": "pengawasan_r_204"}, {"heading": "KMK 624/1994: PPh Pasal 26 atas Premi Asuransi & Reasuransi ke Luar Negeri", "p": 0, "html": "<p>Pemotong: Tertanggung, perusahaan asuransi di Indonesia, atau perusahaan reasuransi di Indonesia. Objek: pembayaran premi asuransi/reasuransi kepada perusahaan asuransi di luar negeri. Tarif: 20% dari perkiraan penghasilan neto (= persentase tertentu [50%/10%/5% tergantung pihak pembayar & penerima premi] × jumlah premi dibayar). Saat terutang: akhir bulan dibayarkannya premi atau akhir bulan terutangnya premi. Batas setor: tanggal 15 bulan berikutnya (baru, sebelumnya tanggal 10); batas lapor: tanggal 20 bulan berikutnya (baru, sebelumnya tidak diatur). Sanksi bagi pemotong (baru) sesuai ketentuan perpajakan.</p>", "page": "hlm 425", "id": "pengawasan_r_205"}, {"heading": "KMK 282/1997: Pemungutan PPh atas Transaksi Penjualan Saham di Bursa Efek", "p": 0, "html": "<p>Subjek: OP/Badan. Objek: penghasilan dari transaksi penjualan saham di bursa efek. Tarif: Final 0,1% dari jumlah bruto nilai transaksi, dipotong oleh penyelenggara bursa efek (BEI) melalui perantara pedagang efek (Anggota Bursa) saat pelunasan transaksi. Kewajiban BEI (sebagai pemotong wajib, baru): (1) membuat bukti pemotongan PPh per nasabah berdasarkan data trade confirmation dari Anggota Bursa (sebelumnya: pemotongan secara gunggungan); (2) menyampaikan bukti pemotongan ke pihak yang dipotong; (3) menyetor ke kas negara maksimal tanggal 15 bulan berikutnya (baru, sebelumnya tanggal 20); (4) melaporkan via SPT Masa PPh Unifikasi maksimal 20 hari setelah Masa Pajak berakhir (baru, sebelumnya tanggal 25).</p>", "page": "hlm 426-429", "id": "pengawasan_r_206"}, {"heading": "KMK 282/1997: PPh Final Tambahan atas Saham Pendiri (IPO)", "p": 0, "html": "<p>Saham Pendiri = saham dimiliki pendiri saat IPO, termasuk dari kapitalisasi agio setelah IPO dan pemecahan saham pendiri — tidak termasuk saham dari dividen saham, pelaksanaan HMETD/waran/obligasi konversi, atau pendiri reksa dana. Pemilik saham pendiri (termasuk penerima warisan/hibah) yang diperdagangkan setelah 1997 dikenai tambahan PPh final 0,5% dari nilai saham saat IPO, dipungut oleh Emiten. Kewajiban Emiten (sebagai pemungut wajib): memungut maks 1 bulan sejak terutang, menerbitkan bukti pemungutan ke pemilik saham pendiri (baru), menyetor dengan SSP a.n. NPWP Emiten (baru, sebelumnya a.n. NPWP pemilik) maks 1 bulan sejak terutang, dan melaporkan via SPT Masa PPh Unifikasi maks 20 hari setelah Masa Pajak berakhir (baru). Jika tidak disetor dalam 1 bulan sejak IPO, penjualan saham pendiri dikenai PPh sesuai tarif umum Pasal 17 UU PPh.</p>", "page": "hlm 430-432", "id": "pengawasan_r_207"}, {"heading": "PMK 79/2012: Penerimaan Negara & Perhitungan Lifting Migas", "p": 0, "html": "<p>Penerimaan Negara dari kegiatan usaha hulu migas terdiri dari Bagian Negara dan Pajak Penghasilan Migas. Bagian Negara dihitung dari Total Lifting (jumlah keseluruhan migas dari suatu Wilayah Kerja) yang dibagi menjadi Hak/Bagian Kontraktor dan Hak Negara (disetarakan dengan SKK Migas atau BP Migas Aceh, ketentuan baru). Lifting migas suatu WK dijual/dikirim sebagai Lifting Sementara, kemudian dihitung Final Lifting (hak Kontraktor & hak Negara) oleh Kontraktor dan SKK Migas/BP Migas Aceh, menghasilkan Overlifting atau Underlifting Kontraktor.</p>", "page": "hlm 433-434", "id": "pengawasan_r_208"}, {"heading": "PMK 79/2012: Pembayaran PPh Migas (Tunai & Volume Migas)", "p": 0, "html": "<p>PPh wajib dibayar/dilapor kontraktor terdiri atas: angsuran pajak tahun berjalan, PPh Badan terutang akhir tahun, dan PPh atas PKP setelah dikurangi PPh Badan (dibayar bulanan dan/atau tahunan). Pembayaran dapat berupa Tunai (melalui Bank Persepsi Valas) atau Volume Migas (minyak bumi/gas bumi) dari bagian Kontraktor, diserahkan kepada Pemerintah menggunakan harga ICP (minyak) atau harga rata-rata tertimbang penjualan Kontraktor (gas) pada bulan saat PPh terutang, dituangkan dalam Berita Acara Serah Terima (BAST) yang ditandatangani Kontraktor dan Pemerintah (diwakili SKK Migas/BP Migas Aceh), disampaikan ke Kemenkeu cq. DJP & DJA maks 5 hari kerja setelah BAST — tanggal BAST menjadi tanggal pembayaran PPh. Pembayaran PPh migas wajib dilakukan paling lama tanggal 15 bulan berikutnya setelah masa pajak berakhir; kontraktor yang tidak memenuhi kewajiban wajib lapor PPh dikenai sanksi sesuai UU KUP.</p>", "page": "hlm 435-438", "id": "pengawasan_r_209"}, {"heading": "PMK 79/2012: Kewajiban Pelaporan SKK Migas/BP Migas Aceh", "p": 0, "html": "<p>SKK Migas/BP Migas Aceh wajib melaporkan hasil penjualan Migas kepada Kemenkeu cq. DJP (jika Migas hasil pembayaran PPh dalam bentuk volume migas dijual) dan menyetorkan hasil penjualan minyak/gas bumi ke Kas Negara melalui Bank Persepsi Valas (baru). Laporan Penerimaan Negara (Bagian Negara + PPh Migas) disusun oleh Kontraktor sebagai Operator maupun Partner, disampaikan sebagai Laporan Bulanan (baru) kepada DJA cq. Dit. PNBP, DJP tempat Operator/Partner terdaftar, dan SKK Migas/BP Migas Aceh; jika Kontraktor bertindak sebagai Partner, laporan disusun berdasarkan data dari Operator.</p>", "page": "hlm 439-447", "id": "pengawasan_r_210"}, {"heading": "PMK 79/PMK.02/2012 — Pelaporan Penerimaan Negara Hulu Migas", "p": 0, "html": "<p>Kontraktor (sebagai Operator maupun Partner) wajib menyampaikan <strong>Laporan Penerimaan Negara (LPN)</strong> yang terdiri atas Laporan Bulanan yang disamakan dengan SPT Masa PPh. LPN disampaikan <strong>paling lambat tanggal 20 bulan berikutnya</strong>; jika bertepatan hari libur, disampaikan hari kerja berikutnya. Keterlambatan dikenai sanksi sesuai ketentuan perundang-undangan perpajakan.</p>", "page": "hlm 451", "id": "pengawasan_r_211"}, {"heading": "PMK 120/PMK.03/2019 — VAT Refund bagi Turis Asing: Subjek & Objek", "p": 0, "html": "<p><strong>VAT Refund</strong> adalah insentif berupa pengembalian PPN yang sudah dibayar atas pembelian BKP oleh Turis Asing (pemegang paspor luar negeri) yang kemudian dibawa ke luar Daerah Pabean.</p><ul><li><strong>Subjek (Turis Asing)</strong>: bukan WNI/bukan permanent resident Indonesia, dan berada di Indonesia tidak lebih dari <strong>60 hari</strong> sejak kedatangan.</li><li><strong>Objek (Barang Bawaan)</strong>: BKP yang dibeli dari PKP Toko Retail dan dibawa keluar Daerah Pabean dengan moda transportasi pesawat udara.</li></ul>", "page": "hlm 454", "id": "pengawasan_r_212"}, {"heading": "VAT Refund — Kewajiban PKP Toko Retail", "p": 0, "html": "<p>PKP Toko Retail yang ingin berpartisipasi dalam skema VAT Refund harus mendaftarkan diri. PKP Toko Retail yang berpartisipasi wajib: (1) membuat Faktur Pajak atas penyerahan Barang Bawaan, dan (2) menyampaikan SPT Masa PPN atas seluruh penyerahan BKP/JKP, termasuk penyerahan Barang Bawaan kepada Turis Asing.</p>", "page": "hlm 455", "id": "pengawasan_r_213"}, {"heading": "VAT Refund — Syarat Pengajuan", "p": 0, "html": "<p>Ketentuan pengajuan VAT Refund:</p><ul><li><strong>Nilai PPN</strong> paling sedikit Rp500.000, tercantum dalam 1 Faktur Pajak atau gabungan, dengan nilai PPN masing-masing FP paling sedikit Rp50.000.</li><li><strong>Barang Bawaan</strong> dibeli dalam jangka waktu 1 bulan (30 hari kalender) sebelum keberangkatan.</li><li>Diajukan oleh Turis Asing bersangkutan, maksimal <strong>1 kali pengajuan</strong> per periode kunjungan, melalui Unit Pelaksana Restitusi PPN Bandara (bandara yang ditetapkan: Soekarno-Hatta, Ngurah Rai, Juanda, Yogyakarta, Kualanamu).</li></ul>", "page": "hlm 457", "id": "pengawasan_r_214"}, {"heading": "VAT Refund — Alur dan Skema Pengembalian", "p": 0, "html": "<p>Alur: Turis Asing mengajukan ke UPRPPN Bandara dengan membawa Barang Bawaan, paspor, boarding pass, Faktur Pajak → Petugas Konter Pemeriksaan meneliti pemenuhan syarat → Petugas Konter Pembayaran mengembalikan PPN secara <strong>tunai</strong> (jika nilai ≤ Rp5 juta) atau <strong>transfer</strong> (jika > Rp5 juta). Administrasi skema transfer melalui KPP yang ditunjuk (3 hari kerja) → SPMKP/SKPKPP → KPPN → SP2D (maks. 1 bulan).</p>", "page": "hlm 458-459", "id": "pengawasan_r_215"}, {"heading": "PMK 32/PMK.010/2019 — Ekspor Jasa Kena Pajak: Formula & Cakupan", "p": 0, "html": "<p>PPN atas Ekspor JKP = DPP (Penggantian) × Tarif <strong>0%</strong>. Cakupan kegiatan Ekspor JKP: (a) melekat pada barang bergerak yang dikeluarkan untuk dimanfaatkan di luar Daerah Pabean; (b) melekat pada barang tidak bergerak yang berada di luar Daerah Pabean; (c) kegiatan pelayanan lain (selain a dan b) yang hasilnya diserahkan untuk dimanfaatkan di luar Daerah Pabean berdasarkan permintaan Penerima Ekspor JKP.</p>", "page": "hlm 463", "id": "pengawasan_r_216"}, {"heading": "Ekspor JKP — Jenis Jasa Kategori (a), (b), (c)", "p": 0, "html": "<ul><li><strong>Kategori (a)</strong>: Jasa Maklon (spesifikasi/bahan baku disediakan Penerima Ekspor JKP, BKP hasil dikirim ke luar Daerah Pabean via mekanisme ekspor barang), Jasa Perawatan dan Perbaikan, Jasa Pengurusan Transportasi (freight forwarding) terkait barang untuk tujuan ekspor.</li><li><strong>Kategori (b)</strong>: Jasa Konsultansi Konstruksi (pengkajian, perencanaan, perancangan) atas bangunan di luar Daerah Pabean.</li><li><strong>Kategori (c)</strong>: jasa teknologi informasi, litbang (R&D), persewaan alat angkut (pesawat/kapal untuk penerbangan/pelayaran internasional), jasa konsultansi bisnis/hukum/desain/SDM/engineering/marketing/akuntansi/audit/perpajakan, jasa perdagangan (mencarikan penjual untuk tujuan ekspor), jasa interkoneksi/satelit/konektivitas data.</li></ul>", "page": "hlm 466-468", "id": "pengawasan_r_217"}, {"heading": "Ekspor JKP — Syarat Pengenaan Tarif 0%", "p": 0, "html": "<p>Syarat Ekspor JKP dikenai PPN tarif 0%: (1) didasarkan perikatan/perjanjian tertulis antara PKP dengan Penerima Ekspor JKP yang mencantumkan jenis, rincian kegiatan, dan nilai penyerahan JKP; DAN (2) terdapat pembayaran disertai bukti pembayaran yang sah dari Penerima Ekspor JKP kepada PKP. Jika tidak memenuhi, dianggap sebagai penyerahan JKP di dalam Daerah Pabean yang dikenai PPN tarif umum; sebaliknya JKP yang dihasilkan dan dimanfaatkan di luar Daerah Pabean tidak dikenai PPN.</p>", "page": "hlm 469", "id": "pengawasan_r_218"}, {"heading": "Ekspor JKP — Saat Terutang, Faktur Pajak, dan Pelaporan", "p": 0, "html": "<p>Saat terutang PPN atas Ekspor JKP adalah saat Ekspor JKP, yaitu saat penggantian atas jasa yang diekspor dicatat/diakui sebagai piutang atau penghasilan. PKP wajib membuat Faktur Pajak berupa Pemberitahuan Ekspor JKP (dilampiri invoice). Pajak Masukan yang berhubungan langsung dengan Ekspor JKP dapat dikreditkan. Khusus jasa maklon, dilaporkan sebagai Ekspor JKP (atas jasanya) dan Ekspor BKP (atas barang hasil maklon) dalam SPT Masa PPN.</p>", "page": "hlm 470-472", "id": "pengawasan_r_219"}, {"heading": "PMK 65/PMK.03/2010 — Pengembalian (Retur) BKP", "p": 0, "html": "<p>Pengembalian BKP (retur) adalah pengembalian sebagian/seluruhnya BKP oleh pembeli. Terjadi pada saat BKP dikembalikan. Pembeli wajib membuat <strong>Nota Retur</strong> dan menyampaikannya ke PKP penjual. Nota Retur mengurangi Pajak Keluaran/PPnBM bagi penjual (pada Masa Pajak terjadinya retur) dan mengurangi Pajak Masukan/biaya/harta bagi pembeli. Pengembalian BKP <strong>dianggap tidak terjadi</strong> jika BKP diganti dengan BKP yang sama (jumlah fisik, jenis, maupun harga).</p>", "page": "hlm 475", "id": "pengawasan_r_220"}, {"heading": "PMK 65/PMK.03/2010 — Pembatalan JKP", "p": 0, "html": "<p>Pembatalan JKP (sebagian/seluruh) oleh penerima JKP memerlukan <strong>Nota Pembatalan</strong> yang disampaikan ke PKP pemberi JKP, dibuat pada saat pembatalan terjadi. Mengurangi Pajak Keluaran bagi pemberi JKP dan Pajak Masukan/biaya/harta bagi penerima JKP, pada Masa Pajak terjadinya pembatalan.</p>", "page": "hlm 476", "id": "pengawasan_r_221"}, {"heading": "Nota Retur/Nota Pembatalan — Bentuk dan Isi Minimal", "p": 0, "html": "<p>Nota Retur/Pembatalan wajib: berbentuk elektronik, dibuat & diunggah melalui modul Portal Wajib Pajak, ditandatangani TTE, dan memperoleh persetujuan DJP. Isi minimal: nomor nota, kode/nomor seri/tanggal Faktur Pajak (atau dokumen tertentu) terkait, nama/alamat/NPWP pembeli dan penjual, jenis barang/jasa dan nilai, PPN/PPnBM terkait, tanggal pembuatan, dan tanda tangan pihak berwenang. Jika tidak memenuhi ketentuan pembuatan/isi/waktu/penyampaian, pengembalian BKP/pembatalan JKP dianggap tidak terjadi.</p>", "page": "hlm 477-478", "id": "pengawasan_r_222"}, {"heading": "PMK 8/PMK.03/2021 — BUMN sebagai Pemungut PPN", "p": 0, "html": "<p>PPN/PPnBM atas penyerahan BKP/JKP oleh <strong>Rekanan</strong> (PKP) kepada <strong>Pemungut PPN</strong> dipungut, disetor, dan dilaporkan oleh Pemungut PPN. Pemungut PPN meliputi: BUMN hasil restrukturisasi setelah 1 April 2015 melalui pengalihan saham negara ke BUMN lain, dan perusahaan tertentu dengan kepemilikan saham BUMN >25%, ditetapkan dengan KMK (saat ini KMK-240/KMK.03/2022). Jika perusahaan tidak lagi dimiliki langsung oleh BUMN, status Pemungut PPN gugur.</p>", "page": "hlm 480-481", "id": "pengawasan_r_223"}, {"heading": "BUMN Pemungut PPN — Tarif, Pengecualian, dan Faktur Pajak", "p": 0, "html": "<p>Tarif pemungutan: Tarif PPN × DPP (atau formula khusus × Tarif PPN × DPP untuk besaran tertentu). Dikecualikan dari pemungutan (dipungut sendiri oleh Rekanan): pembayaran ≤Rp10 juta (bukan pemecahan transaksi), penyerahan yang mendapat fasilitas tidak dipungut/dibebaskan, penyerahan BBM/non-BBM oleh Pertamina & anak usahanya (Pertamina Patra Niaga, Kilang Pertamina Internasional, Elnusa Petrofin, dll), jasa telekomunikasi, dan jasa angkutan udara. Rekanan wajib membuat Faktur Pajak dan melaporkannya dalam SPT Masa PPN; Kode Transaksi FP bergantung status Pemungut (01, 02, atau 03).</p>", "page": "hlm 482-485", "id": "pengawasan_r_224"}, {"heading": "PMK 73/2010 & PMK 166/2018 — Kontraktor Migas/Panas Bumi & IUPK sebagai Pemungut PPN", "p": 0, "html": "<p>Kontraktor Kontrak Kerja Sama Migas, Pemegang Kuasa/Izin Panas Bumi (PMK 73/PMK.03/2010), dan Pemegang Izin Usaha Pertambangan Khusus Operasi Produksi hasil perubahan Kontrak Karya (PMK 166/PMK.03/2018) ditunjuk sebagai Pemungut PPN. Mekanisme pemungutan, penyetoran (SSP atas nama Kontraktor/Pemegang Izin, paling lambat akhir bulan berikutnya), dan pelaporan (SPT Masa PPN) sama dengan skema BUMN Pemungut — termasuk pengecualian pemungutan untuk pembayaran ≤Rp10 juta, fasilitas PPN tidak dipungut, BBM Pertamina, telekomunikasi, dan jasa angkutan udara.</p>", "page": "hlm 489-494", "id": "pengawasan_r_225"}, {"heading": "PMK 67/PMK.03/2022 — PPN atas Jasa Agen/Pialang Asuransi", "p": 0, "html": "<p>Perusahaan asuransi/asuransi syariah/reasuransi/reasuransi syariah wajib memungut, menyetor, dan melaporkan PPN atas komisi/imbalan yang dibayarkan kepada <strong>Agen Asuransi</strong> dan <strong>Perusahaan Pialang Asuransi/Reasuransi</strong>. Besaran tertentu PPN (sebelum tarif 12% berlaku): <strong>Agen Asuransi 1,1%</strong> dari komisi; <strong>Pialang Asuransi/Reasuransi 2,2%</strong> dari komisi (nilai sebelum dipotong PPh/pungutan lain). Saat tarif PPN naik ke 12%, besaran menjadi 1,2% dan 2,4%.</p>", "page": "hlm 497-500", "id": "pengawasan_r_226"}, {"heading": "Agen/Pialang Asuransi — Status PKP, Faktur Pajak, dan Pelaporan", "p": 0, "html": "<p>Agen bernomor NPWP dianggap telah dikukuhkan sebagai PKP (seluruh agen & pialang tetap PKP meski omzet di bawah batas pengusaha kecil Rp4,8 miliar). Faktur Pajak dapat berupa <strong>bukti pembayaran komisi (statement of account)</strong> dari perusahaan asuransi (untuk Agen) atau <strong>bukti tagihan</strong> yang dibuat pialang — keduanya adalah dokumen tertentu yang dipersamakan dengan Faktur Pajak, dibuat paling lama akhir bulan berikutnya setelah bulan diterimanya komisi. SPT Masa PPN Agen/Pialang <strong>dianggap telah dilaporkan</strong> jika kegiatan usahanya hanya jasa agen/pialang; jika ada BKP/JKP lain melebihi batasan pengusaha kecil, wajib dilaporkan sendiri dalam SPT Masa PPN. Pajak Masukan terkait jasa ini tidak dapat dikreditkan oleh Agen/Pialang.</p>", "page": "hlm 501-510", "id": "pengawasan_r_227"}, {"heading": "PMK 61/PMK.03/2022 — Ruang Lingkup PPN Kegiatan Membangun Sendiri (KMS)", "p": 0, "html": "<p>KMS adalah kegiatan membangun bangunan (baru maupun perluasan bangunan lama), tidak dalam kegiatan usaha/pekerjaan, oleh OP/Badan, hasilnya digunakan sendiri atau pihak lain — termasuk bangunan yang dibangun pihak lain bagi OP/Badan namun PPN-nya tidak dipungut pihak lain. Kriteria bangunan terutang PPN: konstruksi utama dapat berupa kayu/beton/batu bata/baja, diperuntukkan tempat tinggal/usaha, dan luas keseluruhan paling sedikit 200m².</p>", "page": "hlm 514-515", "id": "pengawasan_r_228"}, {"heading": "KMS — Pembangunan Sekaligus dan Bertahap", "p": 0, "html": "<p>KMS dapat dilakukan sekaligus maupun bertahap. Pembangunan bertahap yang berjeda ≤2 tahun dianggap satu kesatuan KMS; jika jeda >2 tahun antartahap dianggap KMS terpisah. Saat terutang: sejak mulai dibangun sampai bangunan selesai. Tempat terutang: tempat bangunan didirikan.</p>", "page": "hlm 516", "id": "pengawasan_r_229"}, {"heading": "KMS — Penghitungan, Penyetoran, dan Pengkreditan", "p": 0, "html": "<p>PPN Terutang KMS = <strong>20% × Tarif PPN × DPP</strong> (besaran tertentu), dengan DPP berupa jumlah biaya yang dikeluarkan/dibayarkan untuk membangun per Masa Pajak sampai selesai, <strong>tidak termasuk biaya perolehan tanah</strong>. Disetor dengan SSP (kolom NPWP = NPWP OP/Badan pelaku KMS, bukan lokasi bangunan; kolom NOP = nomor objek pajak) — SSP ini adalah dokumen tertentu yang dipersamakan dengan Faktur Pajak. Pajak Masukan atas perolehan BKP/JKP terkait KMS <strong>tidak dapat dikreditkan</strong>, sedangkan PPN dalam SSP KMS dapat dikreditkan (jika pembangunan untuk kegiatan usaha kena pajak).</p>", "page": "hlm 518-520", "id": "pengawasan_r_230"}, {"heading": "KMS — Pelaporan dan Pengawasan", "p": 0, "html": "<p>Bagi Non-PKP: penyetoran = pelaporan PPN. Bagi PKP: wajib melaporkan penyetoran dalam SPT Masa PPN ke KPP terdaftar. Jika PPN terutang dalam suatu Masa Pajak Nihil, tidak ada kewajiban penyetoran maupun pelaporan. Pengawasan kepatuhan KMS: KPP menerbitkan <strong>imbauan tertulis</strong> kepada OP/Badan yang tidak melakukan penyetoran/pelaporan atau yang datanya menunjukkan PPN kurang dibayar/dilaporkan; jika tidak ditindaklanjuti, ditindaklanjuti sesuai ketentuan berlaku (termasuk pemeriksaan).</p>", "page": "hlm 521-522", "id": "pengawasan_r_231"}, {"heading": "PMK 60/PMK.03/2022 — PPN PMSE: Objek dan Alur Transaksi", "p": 0, "html": "<p>Objek: pemanfaatan BKP Tidak Berwujud (barang digital) dan/atau JKP (jasa digital) dari luar Daerah Pabean di dalam Daerah Pabean melalui Perdagangan Melalui Sistem Elektronik (PMSE). Pelaku Usaha PMSE meliputi: Pedagang Luar Negeri (LN), Penyedia Jasa LN, Penyelenggara PMSE LN, dan Penyelenggara PMSE Dalam Negeri (DN) — salah satunya dapat ditunjuk sebagai <strong>Pihak Lain</strong> pemungut PPN PMSE.</p>", "page": "hlm 525-526", "id": "pengawasan_r_232"}, {"heading": "PMSE — Kriteria Penunjukan Pihak Lain & Pemanfaat Barang/Jasa", "p": 0, "html": "<p>Kriteria penunjukan sebagai Pihak Lain: nilai transaksi dengan Pemanfaat di Indonesia melebihi jumlah tertentu dalam 12 bulan, dan/atau jumlah traffic/akses melebihi jumlah tertentu dalam 12 bulan; ditetapkan oleh Dirjen Pajak melalui Kepdirjen, berlaku awal bulan berikutnya. Pemungut PPN PMSE diberikan identitas berupa <strong>NPWP</strong>. Pemanfaat Barang/Jasa adalah OP/Badan yang: bertempat tinggal/berkedudukan di Indonesia (alamat korespondensi/pemilihan negara registrasi Indonesia), DAN/ATAU melakukan pembayaran via fasilitas institusi Indonesia, DAN/ATAU bertransaksi menggunakan alamat IP/kode telepon Indonesia.</p>", "page": "hlm 528-529", "id": "pengawasan_r_233"}, {"heading": "PMSE — Tarif, DPP, Bukti Pungut, dan Pelaporan", "p": 0, "html": "<p>Tarif PPN yang dipungut Pihak Lain sesuai Pasal 7(1) UU PPN × DPP (nilai uang yang dibayar Pemanfaat, tidak termasuk PPN yang dipungut). Saat pemungutan: saat pembayaran oleh Pemanfaat. Pihak Lain membuat bukti pungut berupa commercial invoice/billing/order receipt/dokumen sejenis sebagai dokumen tertentu yang dipersamakan dengan Faktur Pajak. Penyetoran: Pihak Lain DN pakai rupiah; Pihak Lain LN pakai rupiah (kurs KMK) atau USD, untuk setiap Masa Pajak paling lambat akhir bulan berikutnya. Pelaporan triwulanan/masa menggunakan SPT Masa PPN (PKP), SPT Masa PPN dan Pihak Lain (bukan PKP DN), atau SPT Masa PPN PMSE (Pihak Lain LN).</p>", "page": "hlm 531-533", "id": "pengawasan_r_234"}, {"heading": "PMK 68/PMK.03/2022 — PPN & PPh atas Transaksi Aset Kripto", "p": 0, "html": "<p>Mencakup 3 kegiatan: (1) <strong>Transaksi Aset Kripto</strong> — jual beli dengan mata uang fiat, tukar-menukar antar aset kripto (swap), tukar aset kripto dengan barang/jasa lain, dilakukan
