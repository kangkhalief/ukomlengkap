 melalui PPMSE (Penyelenggara Perdagangan Melalui Sistem Elektronik); (2) <strong>PPMSE</strong> — memfasilitasi jual beli, swap, dan dompet elektronik (e-wallet); exchanger ditunjuk sebagai pemungut PPh Pasal 22; (3) <strong>Mining</strong> — block reward, jasa verifikasi transaksi, dan penghasilan lain dari sistem aset kripto.</p>", "page": "hlm 535-536", "id": "pengawasan_r_235"}, {"heading": "Aset Kripto — Tarif PPh Pasal 22", "p": 0, "html": "<p>Tarif PPh Pasal 22 atas transaksi aset kripto: <strong>0,1%</strong> dari nilai transaksi jika exchanger terdaftar di Bappebti; <strong>0,2%</strong> jika exchanger tidak terdaftar di Bappebti. Untuk PPMSE: penghasilan berupa imbalan jasa yang disediakan exchanger merupakan objek PPh dikenai tarif umum. Untuk Mining: <strong>0,1% × penghasilan</strong> yang diterima/diperoleh, tidak termasuk imbalan jasa manajemen kelompok penambang (Mining Pool).</p>", "page": "hlm 537-538", "id": "pengawasan_r_236"}, {"heading": "Aset Kripto — Skema Pemotongan/Pemungutan dan PPMSE LN", "p": 0, "html": "<p>Subjek dan skema: Transaksi Aset Kripto — OP/Badan, dipungut oleh PPMSE; PPMSE — dikenai PPh tarif umum sesuai UU PPh; Mining — setor sendiri. Jika PPMSE LN ditunjuk sebagai pemungut PPN, sekaligus ditunjuk sebagai pemungut PPh Pasal 22 — wajib menyetorkan dan melaporkan dalam SPT Masa PPh Unifikasi. PPMSE wajib membuat Bukti Pemotongan/Pemungutan Unifikasi (atau dokumen yang dipersamakan). Penyetoran paling lambat tanggal 15 bulan berikutnya; pelaporan dalam SPT Masa PPh Unifikasi paling lambat 20 hari setelah Masa Pajak berakhir.</p>", "page": "hlm 539-540", "id": "pengawasan_r_237"}, {"heading": "PMK 18/PMK.03/2021 — Pengecualian PPh atas Dividen/Penghasilan Lain (UU HPP/Cipta Kerja)", "p": 0, "html": "<p>Dividen dari dalam negeri diterima WP OP DN, dividen dari luar negeri diterima WP OP/Badan DN, dan penghasilan lain dari luar negeri diterima WP OP/Badan DN dapat dikecualikan dari objek PPh apabila: (1) memenuhi kriteria bentuk investasi, tata cara investasi, dan jangka waktu investasi; dan (2) memenuhi kewajiban penyampaian laporan realisasi investasi.</p>", "page": "hlm 543", "id": "pengawasan_r_238"}, {"heading": "Pengecualian PPh Dividen — Bentuk Investasi, Jangka Waktu, dan Sanksi", "p": 0, "html": "<p>12 bentuk investasi yang diakui: antara lain SBN/SBSN RI, obligasi/sukuk BUMN/lembaga pembiayaan/perusahaan swasta yang diawasi OJK, investasi bank persepsi, investasi infrastruktur KPBU, investasi sektor riil prioritas, penyertaan modal pada perusahaan baru/sudah berdiri, kerja sama LPI, pendukung UMK, dan bentuk lain yang sah. Jangka waktu holding minimal <strong>3 Tahun Pajak</strong> sejak diterima/diperoleh, investasi dimaksud tidak dapat dialihkan (kecuali ke bentuk investasi lain sesuai ketentuan). Laporan realisasi disampaikan elektronik via Portal WP, berkala paling lambat akhir bulan ke-3 (OP)/ke-4 (Badan) setelah Tahun Pajak berakhir, sampai tahun ketiga sejak diterima. Sanksi jika tidak memenuhi: WP OP wajib setor sendiri PPh final 10% paling lambat tanggal 15 bulan berikutnya & lapor SPT Masa PPh Unifikasi; PPh atas dividen/penghasilan LN lainnya dihitung tarif umum Pasal 17 UU PPh dan dilaporkan dalam SPT Tahunan tahun diterima/diperoleh.</p>", "page": "hlm 544-545", "id": "pengawasan_r_239"}, {"heading": "PMK 18/PMK.03/2021 — Pengkreditan Pajak Masukan oleh PKP", "p": 0, "html": "<p>PPN dalam Faktur Pajak (Pasal 13(5)/(9) UU PPN) dan dalam dokumen tertentu yang dipersamakan Faktur Pajak (Pasal 13(6)/(9)) merupakan Pajak Masukan yang dapat dikreditkan sejak Pengusaha dikukuhkan PKP. Bagi PKP yang telah melakukan penyerahan/ekspor namun dalam suatu Masa Pajak tidak ada penyerahan/ekspor dimaksud, Pajak Masukan tetap dapat dikreditkan dalam Masa Pajak tersebut.</p>", "page": "hlm 549", "id": "pengawasan_r_240"}, {"heading": "Pengkreditan PM — Masa Pajak Tidak Sama dan NIK sebagai Identitas", "p": 0, "html": "<p>Pajak Masukan yang tercantum dalam dokumen tertentu yang dipersamakan Faktur Pajak, belum dikreditkan pada Masa Pajak yang sama, dapat dikreditkan pada Masa Pajak berikutnya <strong>paling lama 3 Masa Pajak</strong> sejak berakhirnya Masa Pajak saat dokumen dibuat — sepanjang belum dibebankan sebagai biaya/dikapitalisasi, melalui penyampaian atau pembetulan SPT Masa PPN. Faktur Pajak yang mencantumkan nama/alamat/<strong>NIK</strong> (bagi subjek pajak DN OP) dianggap memenuhi Pasal 13(5) huruf b angka 1 UU PPN, dan PPN-nya dapat dikreditkan PKP pembeli/penerima.</p>", "page": "hlm 550-551", "id": "pengawasan_r_241"}, {"heading": "Pengkreditan PM Sebelum Dikukuhkan PKP", "p": 0, "html": "<p>PKP dapat mengkreditkan Pajak Masukan dengan <strong>pedoman pengkreditan sebesar 80% dari Pajak Keluaran</strong> yang seharusnya dipungut atas penyerahan BKP/JKP pada Masa Pajak sebelum dikukuhkan PKP (sejak seharusnya dikukuhkan s.d. sebelum dikukuhkan), menggunakan nilai lain (Pasal 8A) dan besaran tertentu (Pasal 9A UU PPN) — melalui self-assessment (SPT Masa PPN) atau official assessment (SKPKB/SKPKBT). PPN dalam Faktur Pajak/dokumen tertentu atas perolehan BKP/JKP sebelum dikukuhkan PKP <strong>tidak dapat dikreditkan</strong>. Pengusaha yang tidak membuat Faktur Pajak atas penyerahan sebelum dikukuhkan PKP tidak dikenai sanksi Pasal 14(4) UU KUP, namun tetap dikenai sanksi bunga/kenaikan terkait kurang bayar.</p>", "page": "hlm 552-554", "id": "pengawasan_r_242"}, {"heading": "Pengkreditan PM Ditemukan/Dilaporkan, dan Ditagih dengan Ketetapan Pajak", "p": 0, "html": "<p>Pajak Masukan yang belum dilaporkan dalam SPT Masa PPN dapat dikreditkan melalui pemeriksaan jika diberitahukan PKP (dengan dokumen pendukung) dan/atau ditemukan Pemeriksa — sepanjang SPHP belum disampaikan. Pajak Masukan atas perolehan BKP/JKP/impor/pemanfaatan yang <strong>ditagih dengan ketetapan pajak</strong> dapat dikreditkan sebesar jumlah pokok pajak dalam ketetapan, dengan syarat: ketetapan hanya untuk menagih PM, PKP menyetujui seluruh hasil pemeriksaan, PPN telah dilunasi, dan tidak dilakukan upaya hukum apapun (keberatan/Pasal 36/banding/PK/gugatan).</p>", "page": "hlm 555-556", "id": "pengawasan_r_243"}, {"heading": "PMK 18/PMK.03/2021 — Tata Cara Faktur Pajak (Gabungan, Keterlambatan, Elektronik)", "p": 0, "html": "<p>PKP wajib membuat Faktur Pajak untuk tiap penyerahan BKP/JKP/ekspor; dapat membuat 1 Faktur Pajak <strong>gabungan</strong> untuk seluruh penyerahan ke pembeli yang sama dalam 1 bulan kalender, dibuat paling lambat akhir bulan penyerahan. Faktur Pajak yang dibuat melewati <strong>3 bulan</strong> sejak seharusnya dibuat tidak diperlakukan sebagai Faktur Pajak — PKP dianggap tidak membuat Faktur Pajak (dikenai sanksi UU KUP), dan PPN-nya menjadi PM yang tidak dapat dikreditkan. Faktur Pajak/dokumen tertentu atas ekspor BKP tidak berwujud/JKP wajib berbentuk elektronik, dibuat via Portal WP, bertanda tangan elektronik, dan diunggah untuk mendapat <strong>persetujuan DJP</strong> — tanpa persetujuan, bukan merupakan Faktur Pajak.</p>", "page": "hlm 559-562", "id": "pengawasan_r_244"}, {"heading": "Faktur Pajak — Pembetulan, Pembatalan, dan Keadaan Kahar", "p": 0, "html": "<p><strong>Pembetulan/Penggantian</strong> Faktur Pajak dilakukan jika terdapat kesalahan pengisian/penulisan sehingga tidak benar/lengkap/jelas. <strong>Pembatalan</strong> Faktur Pajak dilakukan untuk penyerahan yang transaksinya dibatalkan, atau barang/jasa yang seharusnya tidak dibuatkan Faktur Pajak. Dalam <strong>keadaan kahar</strong> yang menyebabkan PKP tidak dapat membuat Faktur Pajak elektronik atas ekspor BKP tidak berwujud/JKP, PKP diperkenankan membuat Faktur Pajak/dokumen tertentu tidak dalam bentuk elektronik.</p>", "page": "hlm 563-564", "id": "pengawasan_r_245"}, {"heading": "PMK 52/PMK.010/2017 — Nilai Buku atas Penggabungan/Peleburan/Pemekaran/Pengambilalihan Usaha", "p": 0, "html": "<p>Dasar hukum: Pasal 4(1)d angka 3 & Pasal 10(3) UU PPh. Keuntungan karena pengalihan harta akibat likuidasi, penggabungan, peleburan, pemekaran, pemecahan, pengambilalihan usaha, atau reorganisasi merupakan <strong>objek PPh</strong>. Nilai perolehan/pengalihan harta tersebut adalah jumlah yang seharusnya dikeluarkan/diterima berdasarkan <strong>harga pasar</strong>, kecuali ditetapkan lain oleh Menteri Keuangan. Selisih harga pasar dengan nilai sisa buku merupakan penghasilan kena pajak. WP badan dalam negeri bermodal saham dapat menggunakan nilai buku (bukan harga pasar) atas persetujuan Dirjen Pajak, dengan syarat tujuan bisnis (business purpose test) dan Surat Keterangan Fiskal berlaku.</p>", "page": "hlm 566-568", "id": "pengawasan_r_246"}, {"heading": "Nilai Buku — Jenis Restrukturisasi yang Dapat Menggunakan Nilai Buku", "p": 0, "html": "<p>Transaksi yang dapat menggunakan nilai buku: (1) <strong>Penggabungan</strong>: 2+ WP badan DN bergabung, mengalihkan seluruh harta/kewajiban ke salah satu WP (tanpa sisa rugi fiskal lebih besar), membubarkan WP yang mengalihkan — termasuk penggabungan badan hukum LN dengan WP badan DN; (2) <strong>Peleburan</strong>: 2+ WP badan DN melebur mendirikan badan usaha baru; (3) <strong>Pemekaran</strong>: pemisahan usaha 1 WP menjadi 2+ WP (dengan/tanpa badan baru, dengan/tanpa likuidasi); (4) <strong>Pengambilalihan</strong>: pengambilalihan usaha BUT perbankan atau pengalihan saham dalam rangka restrukturisasi BUMN.</p>", "page": "hlm 569-571", "id": "pengawasan_r_247"}, {"heading": "Nilai Buku — Persyaratan Umum, Khusus, dan Prosedur", "p": 0, "html": "<p><strong>Persyaratan umum</strong>: melampirkan dokumen alasan & tujuan restrukturisasi, memenuhi business purpose test, dan memiliki Surat Keterangan Fiskal (SKF) berlaku untuk setiap WP badan/BUT terkait. <strong>Persyaratan khusus tambahan</strong> berlaku untuk pemekaran dalam rangka IPO (pernyataan pendaftaran OJK efektif dalam 2 tahun), pemekaran investasi asing (tambahan modal ≥Rp500 miliar), dan pemekaran/pengambilalihan BUMN. Permohonan diajukan melalui portal WP. Aktiva tetap hasil restrukturisasi tidak boleh dipindahtangankan minimal 2 tahun sejak tanggal efektif, kecuali untuk tujuan peningkatan efisiensi perusahaan (dengan dokumen pendukung).</p>", "page": "hlm 572-576", "id": "pengawasan_r_248"}, {"heading": "PMK 11/PMK.010/2020 — Tax Allowance: Pokok Perubahan", "p": 0, "html": "<p>PMK 11/PMK.010/2020 (s.t.d.d. PMK 96/2020) melaksanakan PP 78/2019 tentang Fasilitas PPh untuk Penanaman Modal di Bidang Usaha/Daerah Tertentu. Pokok perubahan: menghapus unggah dokumen Surat Keterangan Fiskal (digantikan SKF otomasi), menghapus pengajuan luring, penyampaian laporan realisasi investasi/produksi via Sistem OSS, dengan ketentuan peralihan bagi permohonan yang belum selesai.</p>", "page": "hlm 577", "id": "pengawasan_r_249"}, {"heading": "Tax Allowance — Jangka Waktu & Syarat Aktiva, Alur Persetujuan", "p": 0, "html": "<p>Syarat aktiva tetap berwujud (termasuk tanah) sebagai pengurang penghasilan neto: diperoleh dalam keadaan baru (kecuali relokasi 1 paket penanaman modal dari negara lain), tercantum dalam Izin Prinsip/Investasi/Pendaftaran Penanaman Modal/Perizinan Berusaha, dan digunakan untuk kegiatan usaha utama. Tidak termasuk aktiva yang diperoleh lewat sewa guna usaha tanpa hak opsi (operating lease) atau dengan hak opsi sebelum opsi dilakukan. Alur: WP mengajukan via Sistem OSS → notifikasi eligible/no eligible → jika lengkap, diteruskan ke Kementerian Investasi/BKPM → KMK Persetujuan Pemberian Fasilitas terbit maks. <strong>5 hari kerja</strong> sejak permohonan lengkap dan benar; KMK Pemanfaatan Fasilitas via pemeriksaan DJP maks. <strong>45 hari kerja</strong>.</p>", "page": "hlm 579, 585-587", "id": "pengawasan_r_250"}, {"heading": "Tax Allowance — Pengurangan Penghasilan Neto 30% & Penyusutan/Amortisasi Dipercepat", "p": 0, "html": "<p>Pengurangan penghasilan neto 30% dari jumlah nilai Penanaman Modal, dibebankan <strong>5% per tahun selama 6 tahun</strong> sejak Saat Mulai Berproduksi Komersial (SMB). Penyusutan/amortisasi dipercepat atas aktiva tetap berwujud/tak berwujud, dengan masa manfaat dipersingkat: Kelompok I (2 tahun, GL 50%/SM 100%), II (4 tahun, 25%/50%), III (8 tahun, 12,5%/25%), IV (10 tahun, 10%/20%), Bangunan Permanen (10 tahun, 10%), Bangunan Tidak Permanen (5 tahun, 20%).</p>", "page": "hlm 588-589", "id": "pengawasan_r_251"}, {"heading": "Tax Allowance — Tarif PPh Dividen WPLN & Perpanjangan Kompensasi Kerugian", "p": 0, "html": "<p>Dividen yang dibayarkan ke WP Luar Negeri (selain BUT) dikenai tarif PPh <strong>10%</strong> atau tarif lebih rendah sesuai P3B, dimanfaatkan sejak bulan ditetapkannya KMK persetujuan sampai WP tidak lagi memenuhi ketentuan bidang usaha/KBLI/kriteria. Perpanjangan kompensasi kerugian (5 s.d. 10 tahun): tambahan 1 tahun untuk kriteria A-F (penanaman modal baru/perluasan di daerah tertentu, kawasan industri/berikat, energi baru terbarukan, infrastruktur ekonomi/sosial ≥Rp10 miliar, TKDN ≥70%, serap ≥300 TKI), tambahan 2 tahun untuk kriteria G-I (litbang dalam negeri ≥5% dari nilai PM dalam 5 tahun, ekspor ≥30%, serap ≥600 TKI selama 4 tahun berturut-turut).</p>", "page": "hlm 590-591", "id": "pengawasan_r_252"}, {"heading": "Tax Allowance — Kewajiban Pelaporan dan Pencabutan Fasilitas", "p": 0, "html": "<p>WP wajib menyampaikan Laporan Realisasi Penanaman Modal (sejak KMK Persetujuan s.d. KMK Pemanfaatan) dan Laporan Realisasi Produksi (sejak KMK Pemanfaatan s.d. berakhirnya masa manfaat aktiva), via Sistem OSS, paling lama 30 hari setelah tahun pajak berakhir; kelalaian dapat ditindaklanjuti dengan pemeriksaan DJP. Fasilitas dicabut jika: WP tidak lagi memenuhi bidang usaha/kriteria/persyaratan, permohonan diajukan setelah SMB, atau melanggar ketentuan larangan — dikenai sanksi pencabutan fasilitas dan pajak/sanksi sesuai ketentuan berlaku, tanpa dapat lagi memperoleh fasilitas Tax Allowance.</p>", "page": "hlm 592-593", "id": "pengawasan_r_253"}, {"heading": "Tax Allowance — Penggantian Aktiva Tetap Berwujud (Contoh Perhitungan)", "p": 0, "html": "<p>Jika penggantian aktiva terjadi <strong>sebelum SMB</strong>, nilai realisasi dihitung dari nilai aktiva pengganti pada tahun SMB (contoh: PT X fasilitas Rp100M, ganti aktiva Rp30M→Rp50M sebelum SMB, nilai realisasi tetap Rp120M, fasilitas tahunan tetap 6M). Jika terjadi <strong>setelah SMB</strong> dengan nilai aktiva pengganti <strong>lebih rendah</strong>, maka pengurangan penghasilan neto 30% dihitung ulang berdasarkan nilai yang lebih rendah antara aktiva lama dan pengganti sejak tahun penggantian, berlaku sampai berakhirnya sisa jangka waktu pemanfaatan.</p>", "page": "hlm 597-598", "id": "pengawasan_r_254"}, {"heading": "PMK 16/PMK.010/2020 — Fasilitas Pengurangan Penghasilan Neto 60% (Industri Padat Karya)", "p": 0, "html": "<p>Fasilitas berupa pengurangan penghasilan neto <strong>60% dari total nilai Penanaman Modal</strong>, dibebankan <strong>10% per tahun selama 6 tahun</strong> sejak SMB. Diberikan kepada WP Badan dalam negeri yang: melakukan penanaman modal pada KBLI tercantum dalam Lampiran PMK, mempekerjakan Tenaga Kerja Indonesia minimal <strong>300 orang</strong>, dan atas penanaman modal yang tidak mendapat fasilitas Tax Allowance, Tax Holiday, atau fasilitas PPh di KEK. Mencakup 17 kelompok industri dan 45 bidang usaha (KBLI) padat karya (perikanan, makanan, tekstil & pakaian jadi, barang kulit, alas kaki, kertas & tissue, karet & plastik, logam, furnitur, mainan anak, dll).</p>", "page": "hlm 600", "id": "pengawasan_r_255"}, {"heading": "PMK 16/PMK.010/2020 — Kewajiban Pelaporan Investment Allowance", "p": 0, "html": "<p>Pasal 428. WP penerima fasilitas pengurang penghasilan neto 60% wajib menyampaikan 2 laporan ke sistem OSS: (a) <strong>Laporan Realisasi Penanaman Modal</strong> (sejak Notifikasi Persetujuan Pemberian Fasilitas s.d. penetapan pemanfaatan); (b) <strong>Laporan Penggunaan Tenaga Kerja Indonesia</strong> (selama periode pemanfaatan). Disampaikan setiap tahun melalui OSS, paling lambat 30 hari setelah berakhirnya tahun pajak. WP yang tidak menyampaikan/laporan tidak memenuhi ketentuan dapat dilakukan Pemeriksaan oleh DJP.</p>", "page": "hlm 601", "id": "pengawasan_r_256"}, {"heading": "PMK 16/PMK.010/2020 — Penggantian Aktiva Tetap Berwujud (Pasal 429)", "p": 0, "html": "<p>Mengatur Saat Mulai Berproduksi Komersial (SMB). Sebelum SMB: dasar penyusutan adalah nilai perolehan aktiva baru. Setelah SMB: (a) dasar fasilitas pengurang 60% adalah nilai yang lebih rendah antara aktiva lama vs pengganti; (b) jika aktiva pengganti lebih rendah, fasilitas berdasarkan nilai aktiva pengganti; (c) WP wajib menyampaikan pemberitahuan tertulis ke Dirjen Pajak sebelum penggantian.</p>", "page": "hlm 603", "id": "pengawasan_r_257"}, {"heading": "PMK 16/PMK.010/2020 — Syarat dan Ketentuan Pelanggaran Fasilitas (Pasal 430)", "p": 0, "html": "<p>Jika kegiatan usaha utama WP tak lagi memenuhi bidang usaha, atau melanggar ketentuan larangan terkait fasilitas → WP dikenai sanksi, tidak dapat memanfaatkan investment allowance tahun berikutnya, dan tidak dapat lagi diberi fasilitas. Jika WP tidak memenuhi persyaratan jumlah tenaga kerja selama masa pemanfaatan → PPh yang seharusnya terutang wajib dibayar kembali + sanksi; fasilitas dapat dimanfaatkan lagi tahun berikutnya jika jumlah minimal tenaga kerja terpenuhi kembali, namun TIDAK diberikan tambahan jangka waktu pemanfaatan.</p>", "page": "hlm 604", "id": "pengawasan_r_258"}, {"heading": "PMK 16/PMK.010/2020 — Penghitungan Tenaga Kerja Indonesia & Pengurang Penghasilan Neto 60%", "p": 0, "html": "<p>Syarat mempekerjakan TKI minimal 300 orang dihitung dari <strong>rata-rata jumlah TKI dalam 1 tahun pajak</strong> (total per bulan dibagi 12), bukan dihitung sejak SMB saja (contoh: hanya 8 bulan sejak SMB = rata-rata 297,5 → gagal syarat; dihitung 12 bulan penuh = rata-rata 300 → syarat terpenuhi). Fasilitas pengurang penghasilan neto 60% dari nilai penanaman modal dibebankan selama <strong>6 tahun</strong> sejak SMB, masing-masing 10% per tahun.</p>", "page": "hlm 605-606", "id": "pengawasan_r_259"}, {"heading": "PMK 16/PMK.010/2020 — Ketentuan Peralihan (Pasal 478 angka 3)", "p": 0, "html": "<p>Permohonan pemberian/pemanfaatan fasilitas yang telah disampaikan WP namun belum diselesaikan sampai PMK berlaku, serta permohonan pemanfaatan yang disampaikan setelah PMK berlaku oleh WP yang telah memperoleh pemberitahuan persetujuan pemberian fasilitas sebelum PMK berlaku, tetap dilaksanakan sesuai ketentuan PMK 16/PMK.010/2020.</p>", "page": "hlm 607", "id": "pengawasan_r_260"}, {"heading": "PMK 153/PMK.010/2020 — Pokok Perubahan Litbang (Superdeduction)", "p": 0, "html": "<p>Mengatur Pengurangan Penghasilan Bruto atas Kegiatan Penelitian dan Pengembangan (Litbang) Tertentu di Indonesia. Pokok perubahan: (1) menghapus persyaratan mengunggah dokumen Surat Keterangan Fiskal (SKF), diganti penerapan SKF secara otomasi; (2) menghapus pengajuan permohonan fasilitas secara luring (hanya daring via OSS).</p>", "page": "hlm 611", "id": "pengawasan_r_261"}, {"heading": "PMK 153/PMK.010/2020 — Ketentuan Komersialisasi & HAKI (Pasal 433 & 436)", "p": 0, "html": "<p><strong>Komersialisasi</strong>: kegiatan produksi dan penjualan di Indonesia atas barang/jasa hasil Litbang, dapat dilakukan oleh WP pelaku Litbang atau WP lainnya (dengan syarat: pelaku Litbang telah mendapat HAKI Paten/Hak PVT dan mendapat penghasilan dari WP lain yang melakukan komersialisasi). <strong>HAKI (Paten/Hak PVT)</strong> wajib didaftarkan atas nama WP atau bersama WP yang bekerja sama; tidak dapat dialihkan kecuali setelah jangka waktu perlindungan berakhir — jika HAKI dialihkan, tambahan pengurang penghasilan bruto yang telah dimanfaatkan menjadi penghasilan dan terutang PPh saat pengalihan.</p>", "page": "hlm 613", "id": "pengawasan_r_262"}, {"heading": "PMK 153/PMK.010/2020 — Kriteria Litbang & Yang Tidak Termasuk (Pasal 434)", "p": 0, "html": "<p>Kriteria Litbang: (1) bertujuan memperoleh penemuan baru; (2) berdasarkan konsep/hipotesis orisinal; (3) memiliki ketidakpastian hasil akhir; (4) terencana & punya anggaran; (5) bertujuan menciptakan sesuatu yang dapat ditransfer bebas/diperdagangkan. <strong>Tidak termasuk Litbang</strong>: rekayasa produksi tahap awal, kendali mutu rutin, perbaikan kerusakan produksi, perbaikan rutin produk, penyesuaian permintaan pelanggan, perubahan rancangan musiman, rancangan rutin peralatan, rekayasa konstruksi (start-up of facilities), dan riset pemasaran.</p>", "page": "hlm 614", "id": "pengawasan_r_263"}, {"heading": "PMK 153/PMK.010/2020 — Bentuk Fasilitas & Persentase Tambahan Pengurang (Pasal 432)", "p": 0, "html": "<p>Pengurangan penghasilan bruto paling tinggi 300% dari biaya litbang (100% pengurang biasa + maks 200% tambahan). Persentase tambahan: <strong>50%</strong> jika Litbang menghasilkan Paten/Hak PVT di dalam negeri; <strong>25%</strong> jika juga menghasilkan Paten/Hak PVT di luar negeri; <strong>100%</strong> jika mencapai tahap Komersialisasi; <strong>25%</strong> jika dilakukan melalui kerja sama dengan lembaga litbang Pemerintah/pendidikan tinggi di Indonesia.</p>", "page": "hlm 616", "id": "pengawasan_r_264"}, {"heading": "PMK 153/PMK.010/2020 — Biaya Litbang yang Dapat Dibebankan (Pasal 434)", "p": 0, "html": "<p>Meliputi: biaya penyusutan/amortisasi aktiva selain tanah/bangunan beserta biaya penunjang (listrik, air, bahan bakar, pemeliharaan); barang/bahan; gaji/honor pegawai/peneliti/perekayasa; biaya pengurusan HAKI Paten/Hak PVT; imbalan ke lembaga litbang/pendidikan tinggi tanpa hak atas hasil litbang. Dibebankan berdasarkan masing-masing proposal; jika tak terpisahkan, dibebankan proporsional. Tambahan pengurang TIDAK diberikan jika aktiva yang digunakan sudah mendapat fasilitas Tax Allowance (Ps 31A UU PPh) atau Investment Allowance (Ps 29A PP 45).</p>", "page": "hlm 618", "id": "pengawasan_r_265"}, {"heading": "PMK 153/PMK.010/2020 — Cara Pembebanan & Prosedur Permohonan/Pemanfaatan", "p": 0, "html": "<p>Tambahan pengurang = persentase tambahan × akumulasi biaya litbang 5 tahun terakhir (sejak pendaftaran HAKI atau tahap Komersialisasi, mana yang lebih dulu). Dibebankan paling tinggi 40% dari PKP sebelum tambahan pengurang; kelebihan dapat dikompensasi ke tahun pajak berikutnya. Prosedur: WP upload proposal litbang ke OSS → BRIN meneliti kesesuaian → notifikasi kesesuaian via OSS (sesuai/tidak sesuai) → WP wajib lapor Biaya Litbang via OSS. Prosedur pemanfaatan serupa: pemberitahuan bukti (Paten/Hak PVT atau Komersialisasi) → penelitian BRIN → notifikasi dapat/tidak dapat memanfaatkan → pelaporan penghitungan pemanfaatan.</p>", "page": "hlm 619-620", "id": "pengawasan_r_266"}, {"heading": "PMK 153/PMK.010/2020 — Kewajiban Pelaporan & Ketentuan Koreksi", "p": 0, "html": "<p>Laporan disampaikan setiap Tahun Pajak, paling lambat bersamaan SPT Tahunan PPh Badan, melalui OSS: (1) Laporan Biaya Penelitian & Pengembangan; (2) Laporan Penghitungan Pemanfaatan Pengurangan Penghasilan Bruto. WP yang tidak lapor/tidak memenuhi ketentuan → Kepala KPP terbitkan Surat Teguran, WP wajib lapor paling lama 14 hari sejak surat teguran disampaikan. DJP dapat melakukan koreksi tambahan pengurang jika: WP tidak memperoleh notifikasi kesesuaian, tidak menyampaikan laporan, atau tidak melaporkan dengan benar besaran/jenis biaya Litbang.</p>", "page": "hlm 621-622", "id": "pengawasan_r_267"}, {"heading": "PMK 18/PMK.03/2021 — Kriteria Keahlian Tertentu & Pengenaan PPh bagi WNA", "p": 0, "html": "<p>Bagian dari pelaksanaan UU Cipta Kerja di bidang PPh/PPN/KUP. WNA dengan keahlian tertentu (TKA pos jabatan tertentu atau peneliti asing) yang menjadi SPDN dikenai PPh <strong>hanya atas penghasilan yang diterima/diperoleh dari Indonesia</strong> selama <strong>4 Tahun Pajak</strong> sejak menjadi SPDN — tidak berlaku bagi WNA yang memanfaatkan P3B. Kriteria keahlian: bidang STEM (ilmu pengetahuan/teknologi/matematika) dan berkewajiban alih pengetahuan, dibuktikan sertifikat keahlian/ijazah/pengalaman kerja min. 5 tahun. WNA dapat memilih dikenai PPh sesuai ketentuan ini ATAU memanfaatkan P3B; permohonan ke Dirjen Pajak dijawab via Surat Persetujuan/Penolakan paling lama 10 hari kerja sejak bukti diterima.</p>", "page": "hlm 624-626", "id": "pengawasan_r_268"}, {"heading": "PMK 54/PMK.03/2021 — WP OP yang Boleh Melakukan Pencatatan & Pembukuan Stelsel Kas", "p": 0, "html": "<p>WP OP ber-NPPN (peredaran bruto <4,8M) wajib beritahu NPPN ke Dirjen Pajak dalam 3 bulan pertama tahun pajak (WP baru: 3 bulan sejak terdaftar atau akhir tahun pajak, mana lebih dulu) — jika tidak, dianggap memilih Pembukuan. <strong>Pembukuan Stelsel Kas</strong> (pembukuan sederhana): penghasilan diakui saat diterima tunai, biaya diakui saat dibayar tunai; tetap memperhitungkan penjualan tunai/non-tunai, HPP meliputi seluruh pembelian/persediaan, dan harta >1 tahun dibebankan via penyusutan/amortisasi. Kriteria: WP berhak pembukuan SAK EMKM (OP yang pilih Pembukuan, atau Badan dengan peredaran bruto ≤4,8M). Pemberitahuan wajib setiap tahun pajak, paling lambat bersamaan SPT Tahunan tahun sebelumnya (atau akhir tahun pajak jika tidak lapor SPT); jika tidak diproses, WP tetap menggunakan stelsel sebelumnya.</p>", "page": "hlm 627-630", "id": "pengawasan_r_269"}, {"heading": "PMK-111/2025 — Kewenangan & Bentuk Kegiatan Pengawasan WP Terdaftar (Pasal 2 & 4)", "p": 0, "html": "<p>Dirjen Pajak berwenang melakukan Pengawasan yang bertujuan mewujudkan kepatuhan WP, kewenangan didelegasikan ke Kepala KPP. Bentuk kegiatan Pengawasan (Pasal 4): (a) meminta penjelasan atas data/keterangan; (b) melakukan pembahasan; (c) mengundang WP hadir luring/daring; (d) melakukan kunjungan; (e) menyampaikan imbauan; (f) memberikan teguran; (g) meminta dokumen penentuan harga transfer; (h) mengumpulkan data ekonomi wilayah kerja; (i) menerbitkan surat dalam rangka Pengawasan; (j) kegiatan pendukung (pengusulan penilaian, pembahasan internal DJP, permintaan data pihak ketiga, dll).</p>", "page": "hlm 629", "id": "pengawasan_r_270"}, {"heading": "PMK-111/2025 — Alur Permintaan Penjelasan atas Data (SP2DK)", "p": 0, "html": "<p>AR/pegawai DJP (berdasarkan surat perintah Pengawasan) menerbitkan SP2DK, disampaikan via akun WP/pos elektronik/pos-jasa ekspedisi/faksimile/langsung (dengan Berita Acara jika langsung — jika WP/wakil/kuasa/pegawai/anggota keluarga dewasa tidak ditemukan atau tidak bersedia menerima, WP dianggap menerima dan tidak memberi tanggapan). WP menanggapi dalam <strong>14 hari</strong> (dapat diperpanjang 7 hari via pemberitahuan tertulis sebelum 14 hari berakhir) dengan memenuhi kewajiban dan/atau menyampaikan penjelasan. Jika WP tidak memenuhi/belum sesuai → Undangan pembahasan/kunjungan → Berita Acara Pelaksanaan (BAP2DK) → case closed (SP3-P2DK) atau usulan tindak lanjut lain (huruf b-q).</p>", "page": "hlm 633-638", "id": "pengawasan_r_271"}, {"heading": "PMK-111/2025 — Pembahasan & BA Pelaksanaan P2DK", "p": 0, "html": "<p>Pembahasan (Pasal 6 ayat 11 & Pasal 7): DJP dapat melakukan pembahasan/kunjungan jika tanggapan WP tidak sesuai, ada data tambahan, atau WP tidak menanggapi — dilakukan daring/luring berdasar surat undangan, dapat >1 kali. BA Pelaksanaan dibuat: jika tanggapan WP sudah sesuai (Ps 6(10)) atau atas hasil pembahasan (Ps 7(6)); ditandatangani WP dan AR/pegawai DJP — jika WP tidak hadir/tidak bersedia tanda tangan, BA hanya ditandatangani AR/pegawai DJP. Penandatanganan daring: AR kirim konsep BAP2DK via TTE, WP kirim kembali yang sudah ditandatangani maks 5 hari kerja — jika tidak dikirim kembali, WP dianggap menghadiri pembahasan namun tidak bersedia menandatangani.</p>", "page": "hlm 641-645", "id": "pengawasan_r_272"}, {"heading": "PMK-111/2025 — Hasil Kegiatan P2DK (Usulan Lain)", "p": 0, "html": "<p>Setelah BA Pelaksanaan P2DK, hasil berupa: (a) case closed → SP3-P2DK; atau usulan lain (b-q) antara lain: perubahan data secara jabatan, penghapusan NPWP jabatan, pengukuhan/pencabutan PKP jabatan, pendaftaran/perubahan/pencabutan objek PBB jabatan, perubahan status (mis. NE→aktif), perubahan administrasi layanan/fasilitas perpajakan, pencabutan pemungut Bea Meterai, pembetulan/pembatalan produk hukum jabatan, pembatasan/pemblokiran layanan publik, penilaian untuk tujuan perpajakan, pengamatan/intelijen, Pemeriksaan, atau pemeriksaan bukti permulaan.</p>", "page": "hlm 646", "id": "pengawasan_r_273"}, {"heading": "PMK-111/2025 — Penyampaian Imbauan & Tanggapan WP", "p": 0, "html": "<p>Imbauan dilakukan terhadap pemenuhan kewajiban: pengukuhan PKP, pembayaran/penyetoran pajak, pelaporan pajak, angsuran pajak tahun berjalan, layanan/fasilitas perpajakan, kewajiban formal lainnya. Disampaikan via Surat Imbauan (saluran sama dengan SP2DK) dengan BA penyampaian. WP menanggapi dalam <strong>14 hari</strong> sejak diterima (dihitung dari peristiwa yang lebih dahulu: tanggal penerbitan/pengiriman/bukti kirim/penyampaian langsung), dengan: memenuhi kewajiban dan/atau menyampaikan penjelasan — dapat disampaikan >1 kali. Jika WP tidak menanggapi → dapat dilakukan Pembahasan atau Kunjungan.</p>", "page": "hlm 650-654", "id": "pengawasan_r_274"}, {"heading": "PMK-111/2025 — Hasil Penyampaian Imbauan & Pemberian Teguran", "p": 0, "html": "<p>Hasil kegiatan Imbauan berupa usulan: penutupan kegiatan imbauan, penetapan nilai angsuran pajak tahun berjalan, perubahan data jabatan, penghapusan NPWP jabatan, pengukuhan PKP jabatan, pendaftaran/perubahan/pencabutan SKT objek PBB jabatan, perubahan status jabatan, perubahan administrasi layanan/fasilitas, pencabutan pemungut Bea Meterai, dan/atau pembatasan/pemblokiran layanan publik tertentu. <strong>Pemberian Teguran</strong> diterbitkan dalam hal: SPT tidak disampaikan sesuai batas waktu; atau pelaksanaan ketentuan perundang-undangan perpajakan lainnya — via Surat Teguran, dapat ditindaklanjuti dengan Kunjungan/Pembahasan.</p>", "page": "hlm 655-660", "id": "pengawasan_r_275"}, {"heading": "Petunjuk Pelaksanaan Pengawasan Masa Transisi Coretax (ND-1718/ND-236/ND-927/PJ.06)", "p": 0, "html": "<p>Mengatur transisi kegiatan Pengawasan dari sistem lama (APPROWEB) ke sistem baru (<strong>Coretax</strong>). Prinsip umum: kegiatan Pengawasan yang dimulai pada sistem Coretax diproses di Coretax; kegiatan Pengawasan sebelum penerapan Coretax diproses di APPROWEB. Penyusunan DPP (Daftar Pengawasan Potensi): DPP Kolaboratif s.d. Tahun Pajak 2024 → APPROWEB (PKM); DPP Tahun Pajak 2025 dst (PPM & PKM) → Coretax; DPP dari KPD/Intelijen/Penegakan Hukum (RBP) s.d. 2024 → APPROWEB (PKM); RBP Tahun Pajak 2025 dst → Coretax.</p>", "page": "hlm 661-662", "id": "pengawasan_r_276"}, {"heading": "Masa Transisi Coretax — Perubahan Tindak Lanjut Data RBP (ND-927/PJ.06/2025)", "p": 0, "html": "<p>Untuk percepatan tindak lanjut data RBP: Tahun Pajak s.d. 2024 pilihan tindak lanjut Penelitian Kepatuhan Material untuk WP Tunggal → setujui di Coretax jadi DPP; untuk WP Nontunggal → tolak di Coretax lalu usul DPP di Legacy (alasan \"Ditindaklanjuti di Legacy\"). Wider Revenue Activity (WRA) baik tunggal/nontunggal → tolak di Coretax, lanjutkan WRA di Legacy. Data tidak men-generate potensi → tolak di Coretax (alasan \"Potensi Perpajakan\"). Sejak 2025: Penelitian Kepatuhan Material (tunggal maupun nontunggal) → setujui langsung di Coretax jadi DPP.</p>", "page": "hlm 662", "id": "pengawasan_r_277"}, {"heading": "Masa Transisi Coretax — Penelitian Kepatuhan Formal & Penerbitan STP", "p": 0, "html": "<p>Penelitian Kepatuhan Formal: seluruh WP untuk kewajiban s.d. Tahun Pajak 2024/Masa s.d. Des 2024 → APPROWEB & SIDJP (kecuali STP Bea Meterai/PBB, imbalan bunga yang seharusnya tidak diberikan, dan denda penagihan Ps 25(9)/27(5d)/27(5f) yang permohonan keberatannya pakai Coretax — untuk seluruh Tahun Pajak, tetap via Coretax); kewajiban Tahun Pajak 2025 dst/Masa Januari 2025 dst → Coretax. Penerbitan STP Denda Penagihan diatur matriks 3 skenario berdasarkan sistem permohonan keberatan vs putusan upaya hukum terakhir vs aplikasi penerbitan STP (Legacy-Legacy-Legacy; Legacy-Coretax-Coretax; Coretax-Coretax-Coretax).</p>", "page": "hlm 664-665", "id": "pengawasan_r_278"}, {"heading": "Masa Transisi Coretax — Pengaturan Pola Kerja & Skema Penugasan", "p": 0, "html": "<p>Pengawasan WP Cabang s.d. Tahun Pajak 2024/Masa s.d. Des 2024 dilakukan petugas dengan tusi sama dengan WP Pusat (via APPROWEB); tindak lanjut Pengawasan WP Cabang di KPP Lokasi dilakukan petugas tusi Pengawasan KPP Pusat sesuai administrasi WP Pusat. Skema Penugasan: Penelitian Kepatuhan Formal & Material dilakukan di APPROWEB sesuai assignment WP ke pegawai tusi Pengawasan; format penugasan Penelitian Kepatuhan Formal (Kepala Seksi, 1 Ketua AR, Anggota AR) dilakukan via Coretax, sedangkan Tim Penelitian Kepatuhan Material (Kepala Seksi sbg Supervisor, 1 Ketua AR, Anggota AR) juga dibentuk via Coretax.</p>", "page": "hlm 666-667", "id": "pengawasan_r_279"}, {"heading": "PMK 79/2023 — Latar Belakang & Asas Tata Cara Penilaian untuk Tujuan Perpajakan", "p": 0, "html": "<p>Latar belakang: diperlukan standar penilaian untuk menentukan NJOP PBB serta nilai harta berwujud/tak berwujud/bisnis, demi keadilan & kepastian hukum pelaksanaan Penilaian di bidang PPh, PPN, PBB, dan Penagihan dengan Surat Paksa. Memenuhi 3 asas pembentukan hukum: <strong>Kepastian Hukum</strong> (dasar hukum formal Penilaian), <strong>Keadilan</strong> (hubungan adil Penilai-WP, perlindungan memadai), <strong>Kemanfaatan</strong> (acuan standar/prosedur/jangka waktu Penilaian).</p>", "page": "hlm 668", "id": "pengawasan_r_280"}, {"heading": "PMK 79/2023 — Lingkup Penilaian untuk Perpajakan (Pasal 2-3)", "p": 0, "html": "<p>2 lingkup utama Penilaian: (1) menentukan Nilai Objek Pajak PBB dalam rangka penetapan NJOP (berdasar PMK-186/PMK.03/2019 jo. PMK-234/PMK.03/2022); (2) menentukan nilai harta berwujud, harta tidak berwujud, dan bisnis — untuk keperluan Pengawasan, Pemeriksaan, Buper, Penyidikan, MAP, APA, Keberatan, Pengurangan PBB, Pengurangan/Pembatalan ketetapan, Penagihan. Dilakukan melalui <strong>Penilaian Kantor</strong> (tanpa peninjauan lapangan) atau <strong>Penilaian Lapangan</strong> (dengan peninjauan lapangan). Dasar hukum tersebar di UU PBB, PPh (Ps 4(1)a, 4(2)d, 10, 11, 11A, 18(3), 18(3a), 19), PPN (Ps 1A(1)e, 2(1), 16C, 16D), dan PPSP (Ps 2(3), 14(2), 25(2)).</p>", "page": "hlm 670-673", "id": "pengawasan_r_281"}, {"heading": "PMK 79/2023 — Tindak Lanjut Penilaian NJOP PBB & Harta/Bisnis", "p": 0, "html": "<p>Penetapan NJOP (Ps 6(2) UU PBB) menjadi dasar penghitungan PBB terutang dalam: penerbitan SPPT berdasar SPOP (Pengawasan), SKP PBB (Pemeriksaan), SK Keberatan PBB, SK Pengurangan ketetapan PBB tidak benar, penghitungan kerugian negara (Buper), penghitungan/pemulihan kerugian negara (Penyidikan). Hasil Penilaian harta berwujud/tak berwujud/bisnis digunakan sebagai dasar penghitungan pajak terutang (Pengawasan, Pemeriksaan, Keberatan, Pengurangan/Pembatalan ketetapan), dasar penentuan harga transfer wajar (MAP, APA), atau dasar nilai jaminan/sitaan/harga limit/jual (Penagihan), dasar penghitungan kerugian negara (Buper, Penyidikan).</p>", "page": "hlm 677-678", "id": "pengawasan_r_282"}, {"heading": "PMK 79/2023 — Surat Perintah Penilaian, Tim Penilai & Tata Cara (Pasal 6-7)", "p": 0, "html": "<p>Dirjen Pajak membentuk Tim Penilai; Penilaian dilakukan berdasar Surat Perintah Penilaian (dan Surat Perintah Penilaian perubahan) yang didelegasikan ke kepala unit penilaian; jangka waktu paling lama <strong>3 bulan</strong> sejak Surat Perintah ditetapkan s.d. Laporan Penilaian ditandatangani. 5 tahap Tata Cara Penilaian (Pasal 7-31): Penyiapan bahan Penilaian (Ps 8) → Pengumpulan data objek & data pendukung (Ps 9-11) → Analisis data (Ps 12) → Penerapan Pendekatan Penilaian sesuai objek (Ps 13-28) → Penyusunan Laporan Penilaian (Ps 29-31). Kepala unit Penilaian dapat meminta bantuan Penilaian/Penilai ke unit Penilaian lain (Ps 32), dilengkapi latar belakang, tujuan, dan data/informasi objek Penilaian.</p>", "page": "hlm 679-680", "id": "pengawasan_r_283"}, {"heading": "Kompetensi Analisis Potensi Pajak — Alur Pembangunan & Pemanfaatan Data", "p": 0, "html": "<p>2 tahap utama: (1) <strong>Pembangunan Data</strong> — mencakup Pencarian Data Eksternal (Data ILAP ber-PMK Ps 35A(1) & non-PMK Ps 35A(2) dari instansi/lembaga/asosiasi dalam negeri; Data Eksternal Luar Negeri dari Competent Authority) dan Produksi Data (Data Produksi Unit Kerja DJP) serta Pengolahan Data SPT (SPT WP, SPT lawan transaksi, data elektronik pendukung SPT); (2) <strong>Pemanfaatan Data</strong> — oleh DJP sendiri maupun dibagikan ke pihak luar DJP. Data tersimpan dalam berbagai kategori Sistem Informasi DJP: Registrasi, Pelaporan, Pembayaran, Layanan Perpajakan, Knowledge Management, Pihak Ketiga (ILAP/Alket/EOI), Ekstensifikasi (DSE, Himbauan, dll), Pengawasan (Indikasi Potensi, LHA/LHPt, P2DK, Usulan Pemeriksaan), Penagihan, Sengketa Pajak, Non Keberatan, Pemeriksaan, Bukper/Penyidikan, dan Ketetapan.</p>", "page": "hlm 681-685", "id": "pengawasan_r_284"}, {"heading": "Data Pemicu — 28 Jenis yang Dipertahankan", "p": 0, "html": "<p>Data pemicu analisis kepatuhan meliputi berbagai jenis mismatch/selisih, antara lain: Faktur Pajak sudah approve tapi belum lapor SPT; selisih pembayaran SPT PPh 21/26/4(2)/23/15/26 vs MPN; penyandingan data EOI rekening keuangan (Inbound) dengan penghasilan LN; kredit pajak PPh 25 OP vs MPN; data kelebihan kompensasi PPN; PKP mengkreditkan PPN impor lebih besar dari SSP; mismatch setoran PPh PP 23/46 (UMKM lama) dengan MPN; pengkreditan PM atas Faktur Pajak yang telah diganti/dibatalkan lawan transaksinya; mismatch KB PPN vs MPN; selisih laba komersial SPT vs audit KAP; pengkreditan PM >1 kali atas FP sama; NTPN dikreditkan >1 kali; dan daftar Faktur Pajak ganda (lawan transaksi tidak berhak mengkreditkan PM).</p>", "page": "hlm 688-689", "id": "pengawasan_r_285"}, {"heading": "Analisis Mandiri (SE-05/PJ/2022)", "p": 0, "html": "<p>Potensi analisis mandiri dilakukan antara lain melalui: <strong>Ekualisasi</strong> (logika dasar analisis kepatuhan material, menyandingkan pos-pos SPT berbeda jenis pajak untuk periode sama); <strong>Jembreng PPN</strong> (penyandingan SPT PPN dalam satu halaman — sering ditemukan kompensasi tidak nyambung dan PPN disetorkan di masa yang sama tanpa setoran); <strong>Analisis Penyusutan</strong> (sering ditemukan penyusutan tidak sesuai golongan harta); <strong>Analisis Laporan Keuangan</strong> (manfaatkan data penguji, Apportal, dan data lain); <strong>Analisis Transfer Pricing</strong>; dan <strong>Analisis Proses Bisnis</strong>.</p>", "page": "hlm 690", "id": "pengawasan_r_286"}, {"heading": "Analisis Potensi WP OP — Kompleksitas Galian Potensi OP", "p": 0, "html": "<p>WP OP dibagi 2 jalur: Karyawan (data pihak pemberi kerja) dan Non-Karyawan (Profesi → Norma Penghitungan Penghasilan Neto, atau Pengusaha → Pembukuan/Pencatatan). Analisis OP memiliki tantangan khas (<em>Cons</em>): perilaku WP sangat beragam, data internal & eksternal sangat terbatas, karakteristik WP cenderung defensif/tertutup, banyak transaksi cash, perlu communication skill mumpuni. Namun juga punya kelebihan (<em>Pros</em>): cukup dengan analisis sederhana, cakupan kreativitas luas, data lapangan relatif mudah didapat, komunikasi langsung ke penanggung pajak, cakupan sampai ke tanggungan, dan resilience modal (karena basisnya individu) menjadi keunggulan.</p>", "page": "hlm 697-698", "id": "pengawasan_r_287"}, {"heading": "Teknik/Metode Penggalian Potensi WP OP (8 Teknik)", "p": 0, "html": "<p>8 teknik: (1) menelusuri harta kekayaan WP (uang tunai, persediaan, tabungan, piutang, deposito, aktiva lancar lain); (2) visit ke lokasi usaha pusat & cabang; (3) menghitung jumlah pegawai yang dipekerjakan (untuk estimasi biaya & perputaran omset); (4) mengidentifikasi mekanisme penjualan (kredit/tunai, penjualan kembali, member/keanggotaan); (5) mengidentifikasi jenis usaha di lokasi (mis. dagang emas, simpan pinjam, gesek tunai); (6) menelusuri durasi waktu operasional usaha (hari & jam operasi); (7) menggali informasi dari end customer (pelayanan, kepercayaan, mekanisme jual-beli); (8) mengenali produk & usaha melalui media sosial.</p>", "page": "hlm 699-700", "id": "pengawasan_r_288"}, {"heading": "Menghitung Omzet WP — Teknik Pencarian Data & 8 Pendekatan", "p": 0, "html": "<p>Teknik pencarian data: wawancara, elisitasi, pengamatan, berita & medsos, data internal. 8 pendekatan penghitungan omzet: (1) transaksi tunai & nontunai; (2) sumber & penggunaan dana; (3) satuan dan/atau volume; (4) penghitungan biaya hidup; (5) pertambahan kekayaan bersih; (6) berdasar SPT/hasil pemeriksaan tahun pajak sebelumnya; (7) proyeksi nilai ekonomi; (8) penghitungan rasio.</p>", "page": "hlm 701", "id": "pengawasan_r_289"}, {"heading": "Metode Satuan/Volume, Rasio, Biaya Hidup, dan Kekayaan Bersih", "p": 0, "html": "<p><strong>Satuan/Volume</strong>: Peredaran Usaha = Volume Usaha × Harga Jual; bila hanya periode tertentu: Proyeksi Volume = Volume periode teridentifikasi × (Setahun ÷ Periode teridentifikasi). <strong>Rasio</strong>: menguji/menghitung ulang peredaran usaha, HPP, laba bruto/bersih dengan mengalikan basis data dengan rasio pembanding (DJP/WP/pihak lain) — syarat: kegiatan usaha WP harus dapat dibandingkan dengan rasio yang diperoleh. <strong>Biaya Hidup</strong>: penghasilan minimal = biaya hidup WP+tanggungan (jika tak ada utang); biaya hidup = konsumsi RT, transportasi, pendidikan, kesehatan, rekreasi, gaya hidup, sumbangan, olahraga, pemeliharaan harta, biaya perolehan penghasilan, pajak/retribusi, dan lain-lain — digali via wawancara (tanggungan, tagihan listrik/kartu kredit/telepon, kendaraan). <strong>Kekayaan Bersih</strong>: penghasilan = pertambahan kekayaan bersih (selisih harta-kewajiban awal vs akhir tahun) + biaya hidup.</p>", "page": "hlm 702-706", "id": "pengawasan_r_290"}, {"heading": "Analisis Potensi Perdagangan & Industri Emas Perhiasan — Tarif PPN & PPh Pasal 22 (PMK-48/2023)", "p": 0, "html": "<p>PPN emas perhiasan: PKP Pabrikan Emas Perhiasan — tarif <strong>1,1%</strong> dari harga jual untuk penyerahan ke pabrikan lain/pedagang emas; <strong>1,65%</strong> untuk penyerahan ke konsumen akhir. PKP Pedagang Emas Perhiasan — tarif <strong>1,1%</strong> jika punya faktur pajak/dokumen tertentu lengkap atas perolehan/impor emas; <strong>1,65%</strong> jika tidak punya dokumen lengkap. PPh Pasal 22 atas emas: tarif <strong>0,25%</strong> dari harga jual emas perhiasan dan/atau emas batangan — kecuali penjualan emas perhiasan ke konsumen akhir, WP dikenai PPh final PP 20/2026, atau WP memiliki SKB.</p>", "page": "hlm 709-712", "id": "pengawasan_r_291"}, {"heading": "Modus Penghindaran Pajak Sektor Emas Perhiasan", "p": 0, "html": "<p>Modus yang umum ditemukan: nilai bahan baku (terutama impor) sulit diketahui kebenarannya; kemungkinan nilai penjualan produk disembunyikan; sulit mengetahui nilai penjualan dari kegiatan Trade In (tukar-tambah); sulit mengetahui nilai penghasilan jasa service/cuci/perawatan perhiasan yang sebenarnya; kemungkinan menyembunyikan kerja sama dengan pihak ketiga dalam produksi dan pemasaran produk.</p>", "page": "hlm 713", "id": "pengawasan_r_292"}, {"heading": "PP 20/2026 — Perubahan PP 55/2022 (PPh Final UMKM 0,5%) — Pasal 20A: Anti Suap/Gratifikasi", "p": 0, "html": "<p>Pasal baru: pengeluaran berupa suap, gratifikasi, dan/atau pemberian lain (termasuk ke pejabat publik asing) sebagaimana dimaksud UU Tipikor/suap, <strong>bukan merupakan biaya</strong> pengurang penghasilan bruto (non-deductible) — berlaku umum, tidak khusus UMKM. Penjelasan mencakup pemberian ke pejabat/pegawai negeri/penyelenggara negara, dan ke pejabat publik asing (sesuai definisi internasional anti-korupsi, termasuk pejabat legislatif/eksekutif/administratif/yudisial negara asing atau badan/organisasi publik internasional).</p>", "page": "hlm 715-716", "id": "pengawasan_r_293"}, {"heading": "PP 20/2026 — Perluasan Jenis Jasa Pekerjaan Bebas yang Dikecualikan PPh Final (Pasal 56 ayat 4)", "p": 0, "html": "<p>PP 20/2026 memperluas & menegaskan daftar jenis jasa sehubungan dengan pekerjaan bebas yang dikecualikan dari PPh Final 0,5% WP PBT, menyesuaikan PMK 168/2023 — tambahan signifikan: tenaga ahli sejenis lainnya; <strong>pemahat, pelukis, pembuat/pencipta konten pada media yang dibagikan secara daring (influencer/pemengaruh, selebgram, bloger, vloger, dan sejenisnya), serta seniman lainnya</strong>; profesi sejenis penasihat/pengajar/pelatih; profesi sejenis pengarang/peneliti/penerjemah; dan perantara <strong>atau orang yang menemukan pelanggan</strong>.</p>", "page": "hlm 718-719", "id": "pengawasan_r_294"}, {"heading": "PP 20/2026 — Pengetatan Subjek PPh Final & Anti Penghindaran (Pasal 57)", "p": 0, "html": "<p>Batasan peredaran bruto tetap Rp4.800.000.000/tahun. Perubahan signifikan: (1) Subjek badan untuk PPh Final 0,5% dipersempit dari (koperasi, CV/firma, PT termasuk PT OP, BUMDes) menjadi hanya <strong>PT perseroan perorangan yang didirikan 1 orang, dan koperasi</strong> — CV/firma/PT biasa/BUMDes TIDAK LAGI bisa pakai PPh Final 0,5%; (2) ditambahkan ayat anti-penghindaran: pengecualian bagi WP yang berpotensi digunakan sebagai sarana melakukan penghindaran pajak dengan tujuan utama memanfaatkan tarif final 0,5% — contoh kasus: konsultan pajak OP yang penghasilannya tak bisa pakai PPh Final (jasa pekerjaan bebas) lalu mendirikan PT OP dengan jasa sejenis untuk menikmati tarif 0,5% → PT OP tersebut diusulkan TIDAK dapat menjadi subjek PPh Final.</p>", "page": "hlm 717", "id": "pengawasan_r_295"}, {"heading": "PP 20/2026 — Penentuan Peredaran Bruto Kriteria Subjek (Pasal 58) & Penghapusan Jangka Waktu (Pasal 59)", "p": 0, "html": "<p><strong>Pasal 58</strong>: besarnya peredaran bruto untuk kriteria subjek kini dihitung dari <strong>jumlah keseluruhan</strong> peredaran bruto atas penghasilan dari usaha & jasa pekerjaan bebas (baik dikenai PPh final maupun non-final, termasuk penghasilan luar negeri) — bukan hanya peredaran bruto yang dikenai PPh Final 0,5% saja seperti aturan lama (contoh: WP dengan omzet gabungan Rp4,5M dagang + jasa konstruksi PPh Final + jasa penceramah PPh umum → tetap dianggap WP PBT karena total <Rp4,8M; namun jika omzet gabungan Rp6M → bukan lagi WP PBT, seluruh penghasilan dagang dikenai PPh Pasal 17 tarif umum). <strong>Pasal 59 dihapus</strong>: jangka waktu pemanfaatan PPh Final 0,5% (dulu 7 tahun WP OP, 4 tahun PT OP) dihapus — berlaku sampai WP tidak lagi memenuhi kriteria subjek atau memilih tarif umum.</p>", "page": "hlm 714, 720", "id": "pengawasan_r_296"}, {"heading": "Analisis Potensi Bank Umum Swasta Nasional Devisa — Proses Bisnis", "p": 0, "html": "<p>Proses bisnis bank: menghimpun <strong>Dana Pihak Ketiga</strong> (tabungan, deposito, giro) dari masyarakat dengan imbalan bunga; menyalurkan sebagai <strong>Kredit</strong> (ritel, korporasi, konsumer) ke masyarakat dengan imbalan bunga pinjaman & provisi. Aspek perpajakan tersebar di sepanjang 12 tahap siklus bisnis bank: persiapan (jasa teknik/konstruksi/konsultan/manajemen kena PPh 4(2)/23/26 & PPN Masukan), penentuan rencana bisnis & pasar, promosi & penyaluran kredit, penghimpunan kredit & produk lain, pengikatan kredit, realisasi kredit, pengawasan & mitigasi risiko, evaluasi, penyampaian SP1-SP3 & penyitaan, penilaian aset, hingga lelang — masing-masing tahap memicu kewajiban PPh 21/23/26/4(2) dan/atau PPN Masukan yang berbeda.</p>", "page": "hlm 721-722", "id": "pengawasan_r_297"}, {"heading": "Modus Penghindaran Pajak Sektor Perbankan", "p": 0, "html": "<p>4 modus umum berdasar regulasi terkait: (1) UU Perbankan 10/1998 — kredit tanpa agunan ke debitur berhubungan istimewa/afiliasi/pejabat/perusahaan besar, lalu berlindung di balik kerahasiaan perbankan saat diminta rincian; (2) PAPI (Pedoman Akuntansi Perbankan Indonesia) — jumlah kredit tidak sama dengan arus keluar uang, tidak ada mutasi CKPN/hapus tagih/hapus buku di Laporan Keuangan; (3) PMK 219/2012 — WP membagi kredit berdasar kolektibilitas BI (Lancar/DPK/KL/Diragukan/Macet) untuk hindari domain pajak, istilah \"paling tinggi\" pada agunan tidak seragam; (4) PMK 207/2012 — WP tidak menyertakan/tidak sesuai format/syarat Daftar Nominatif Piutang Nyata-Nyata Tak Tertagih dalam SPT Tahunan, serta sengketa perlakuan PPN atas pengalihan agunan piutang tak tertagih.</p>", "page": "hlm 724", "id": "pengawasan_r_298"}, {"heading": "Teknik Penggalian Potensi Sektor Perbankan", "p": 0, "html": "<p>4 teknik: (1) meneliti lampiran piutang tak tertagih (write off) sebagai Alket ke KPP domisili debitur, mengukur profil ekonomi debitur & penggunaan dana pinjaman; (2) meneliti lampiran biaya promosi & entertainment — WP wajib buat daftar nominatif (nama, NPWP, alamat, tanggal, bentuk/jenis biaya, nomor bukti potput — PMK-02/PMK.03/2010) namun faktanya sering tidak lengkap; (3) meneliti pendapatan bunga kredit non-performing dalam penyelesaian — diakui cash basis (KEP-184/PJ/2002 & SE-08/PJ/2002), bank-debitur wajib buat perjanjian tambahan/addendum & lampirkan di SPT, namun faktanya sering tidak dilampirkan; (4) menganalisis laporan keuangan bulanan di situs OJK/WP sendiri — uji kesesuaian angsuran PPh 25 dengan PMK-215/PMK.03/2018.</p>", "page": "hlm 725", "id": "pengawasan_r_299"}, {"heading": "CRM Specific Risk Sektor Rokok — Ruang Lingkup & Data", "p": 0, "html": "<p>Mencakup rantai pasok: Perkebunan Tembakau/Cengkeh & Pabrik Bahan Pendukung → Pabrik/Industri Rokok (KLU 12011 Kretek Tangan, 12012 Rokok Putih, 12013 Kretek Mesin, 12019 Rokok Lainnya) → Perdagangan Besar/Distributor → Pengecer → Konsumen Akhir; termasuk Produsen Rokok Luar Negeri (importir). Ruang lingkup: Industri & Importir Rokok, KLU utama 12011-12012-12013-12019, plus WP KLU lain yang punya data pesanan pita cukai CK1 Hasil Tembakau. Data internal: ekstraksi harga komoditas dari Faktur Pajak via NER/NLP, SPT Masa & Tahunan. Data eksternal: data Pita Cukai (CK1/CK2/CK3) dan PEB dari Ditjen Bea Cukai; Harga Acuan Tembakau & Cengkeh dari Ditjen Perkebunan.</p>", "page": "hlm 726-727", "id": "pengawasan_r_300"}, {"heading": "CRM Specific Risk Sektor Rokok — Klaster Prediktor Peredaran Usaha & Biaya/Utang", "p": 0, "html": "<p>Klaster Peredaran Usaha (termasuk SR10_X_013, SR10_X_002, SR10_X_003 — kotak merah): penjualan produk hasil tembakau per SPT Tahunan lebih kecil dari data Total HJE CK1 & DPP Ekspor PEB; DPP PPN Keluaran lebih kecil dari Total HJE CK1; PPN dibayar dimuka tanpa data pengembalian/perusakan pita cukai CK2/CK3; perbandingan rasio GPM & CTTOR WP vs industri sejenis golongan pabrik yang sama. Klaster Biaya & Utang (termasuk SR10_X_017, SR10_X_018, SR10_X_005 — kotak merah): harga beli tembakau/cengkeh per Faktur Pajak lebih tinggi dari harga acuan Ditjen Perkebunan; perbandingan PM vs PK tidak wajar; bukti pemungutan PPh 22 oleh pabrikan rokok lebih besar dari kredit pajak yang dilaporkan lawan transaksi; rasio biaya promosi terhadap peredaran usaha; perbandingan transaksi afiliasi jasa terhadap biaya jasa; perbandingan Lampiran 1771-VI (utang piutang afiliasi) antar lawan transaksi.</p>", "page": "hlm 728-729", "id": "pengawasan_r_301"}, {"heading": "CRM Specific Risk Sektor Otomotif — Supply Chain & Ruang Lingkup", "p": 0, "html": "<p>Rantai pasok: Supplier (Industri Komponen Hulu/Tier 3 & Tier 1-2) → Industri Perakitan/Pabrikan (dengan Jasa Perakitan) → Distributor → Dealer → Konsumen; terhubung dengan Asuransi, Leasing, Sparepart Shop, dan Bengkel (authorized/non-authorized); cross-border via CBU/CKD/IKD Parts dari Principal luar negeri, atau via Importir Umum. Ruang lingkup: Manufaktur Kendaraan Bermotor & Komponen — 5 KLU utama (Industri Kendaraan Bermotor, Komponen Kendaraan, Ban) plus 50 KLU lain yang bertransaksi dengan anggota Gaikindo. Data internal: ekstraksi harga kendaraan/komponen dari Faktur Pajak (NER/NLP), SPT. Data eksternal: data produksi & wholesales dari Gaikindo, database Orbis & TP Catalyst, dan data PIB.</p>", "page": "hlm 731-732", "id": "pengawasan_r_302"}, {"heading": "CRM Specific Risk Sektor Otomotif — Klaster Prediktor (17 Prediktor)", "p": 0, "html": "<p><strong>Peredaran Usaha (6)</strong>: peredaran usaha SPT Tahunan < DPP PPh 22 industri otomotif; DPP PPN penyerahan kendaraan < DPP PPh 22; jumlah unit penjualan per Faktur Pajak < jumlah unit wholesales Gaikindo; DPP PPN penyerahan < nilai penjualan wholesales Gaikindo; jumlah unit produksi Gaikindo < unit pembelian komponen (HS Code/Faktur); WP tidak kenakan PPN Pasal 16D atas penjualan aset yang semula tidak untuk diperjualbelikan. <strong>HPP & Biaya (5)</strong>: signifikansi tenaga kerja tak ber-NPWP; % kenaikan peredaran usaha < % kenaikan biaya jasa/royalti pada SPT Tahunan; tarif royalti WP > rata-rata industri; pelaporan utang-piutang afiliasi tak sesuai. <strong>Profil WP (6)</strong>: WP masuk grup usaha per data CbCR (Country by Country Reporting); laba sebelum pajak WP < rata-rata laba grup (CbCR); indikasi penentuan harga di level induk grup (Umbrella Agreement); CTTOR WP < CTTOR industri; signifikansi nilai transaksi afiliasi berisiko beda tarif; leverage ratio (debt to asset) WP > industri.</p>", "page": "hlm 733-736", "id": "pengawasan_r_303"}, {"heading": "Pengertian Hubungan Istimewa", "p": 0, "page": "hlm 738", "html": "<p>Hubungan Istimewa (Pasal 2 PMK 172/2023) adalah keadaan <strong>ketergantungan atau keterikatan</strong> satu pihak dengan pihak lain, di mana satu/lebih pihak mengendalikan pihak lain atau tidak berdiri bebas. Disebabkan oleh:</p><ul><li><strong>Kepemilikan/penyertaan modal</strong>: penyertaan langsung/tidak langsung paling rendah 25%, atau hubungan dua WP dengan penyertaan 25% pada pihak ketiga yang sama</li><li><strong>Penguasaan</strong>: menguasai/dikuasai pihak lain (langsung/tidak langsung), berada di bawah penguasaan yang sama, melalui manajemen/teknologi, orang yang sama terlibat pengambilan keputusan, satu Grup Usaha, atau menyatakan diri memiliki hubungan istimewa</li><li><strong>Keluarga sedarah atau semenda</strong>: garis keturunan lurus dan/atau ke samping satu derajat</li></ul>", "id": "pengawasan_r_304"}, {"heading": "Prinsip Kewajaran dan Kelaziman Usaha (PKKU)", "p": 0, "page": "hlm 739", "html": "<p>PKKU (Pasal 3) <strong>wajib diterapkan</strong> WP dalam pelaksanaan hak dan kewajiban perpajakan terkait Transaksi yang Dipengaruhi Hubungan Istimewa. Tujuannya menentukan <strong>Harga Transfer wajar</strong>, dengan cara membandingkan kondisi dan indikator harga Transaksi Afiliasi dengan Transaksi Independen yang sebanding. Harga transfer memenuhi PKKU jika nilai indikator harganya <strong>sama dengan</strong> nilai indikator harga Transaksi Independen pembanding. Indikator harga dapat berupa harga transaksi, laba kotor, atau laba bersih operasi.</p>", "id": "pengawasan_r_305"}, {"heading": "Kewajiban Penerapan PKKU: Terpisah vs Digabungkan", "p": 0, "page": "hlm 741", "html": "<p>Pasal 4: Penerapan PKKU wajib dilakukan berdasarkan keadaan sebenarnya, pada saat Penentuan Harga Transfer dan/atau saat terjadinya transaksi, sesuai tahapan.</p><ul><li><strong>Terpisah</strong>: dilakukan untuk setiap jenis Transaksi Afiliasi secara sendiri-sendiri</li><li><strong>Digabungkan</strong>: jika dua/lebih jenis transaksi saling berkaitan dan mempengaruhi satu sama lain dalam penentuan Harga Transfer sehingga penerapan terpisah tidak andal/akurat</li></ul>", "id": "pengawasan_r_306"}, {"heading": "Enam Tahapan Penerapan PKKU", "p": 0, "page": "hlm 742", "html": "<p>Pasal 4 menetapkan 6 tahapan berurutan penerapan PKKU:</p><ol><li>Mengidentifikasi Transaksi Afiliasi dan Pihak Afiliasi</li><li>Melakukan analisis industri</li><li>Mengidentifikasi hubungan komersial/keuangan (analisis kondisi transaksi)</li><li>Melakukan analisis kesebandingan</li><li>Menentukan metode Penentuan Harga Transfer</li><li>Menerapkan metode dan menentukan Harga Transfer wajar</li></ol><p>Untuk Transaksi Afiliasi tertentu, wajib didahului dengan <strong>tahapan pendahuluan</strong>.</p>", "id": "pengawasan_r_307"}, {"heading": "Tahap 1: Identifikasi Transaksi dan Pihak Afiliasi", "p": 0, "page": "hlm 743", "html": "<p>Pasal 5: kegiatan mengidentifikasi (a) Transaksi Afiliasi yang dilakukan WP; (b) pihak-pihak yang terlibat; dan (c) bentuk hubungan istimewa.</p>", "id": "pengawasan_r_308"}, {"heading": "Tahap 2: Analisis Industri", "p": 0, "page": "hlm 743", "html": "<p>Pasal 6: mengidentifikasi faktor jenis produk, karakteristik industri &amp; pasar (pertumbuhan, segmentasi, siklus, teknologi, ukuran, prospek, rantai pasokan/nilai), pesaing, efisiensi &amp; lokasi WP, keadaan ekonomi (inflasi, pertumbuhan, suku bunga, kurs), regulasi, dan faktor lain. Hasilnya dipakai mengidentifikasi perbedaan kondisi saat analisis kesebandingan.</p>", "id": "pengawasan_r_309"}, {"heading": "Tahap 3: Analisis Kondisi Transaksi — 5 Faktor Kesebandingan", "p": 0, "page": "hlm 744", "html": "<p>Pasal 7: kondisi transaksi adalah karakteristik ekonomi yang relevan, terdiri dari 5 faktor:</p><ol><li><strong>Ketentuan Kontraktual</strong>: tertulis/tidak tertulis sesuai keadaan sebenarnya</li><li><strong>Fungsi, Aset, dan Risiko</strong>: aktivitas/tanggung jawab, aset berwujud/tidak berwujud/keuangan, dan dampak ketidakpastian yang ditanggung</li><li><strong>Karakteristik Produk</strong>: spesifik barang/jasa yang mempengaruhi harga</li><li><strong>Strategi Bisnis</strong>: strategi di pasar terbuka</li><li><strong>Keadaan Ekonomi</strong>: kondisi para pihak dan pasar bertransaksi</li></ol>", "id": "pengawasan_r_310"}, {"heading": "Tahap 4: Analisis Kesebandingan", "p": 0, "page": "hlm 745-747", "html": "<p>Pasal 8: menentukan kesebandingan Transaksi Independen dengan Transaksi Afiliasi. Suatu transaksi <strong>sebanding</strong> jika kondisinya sama/serupa, atau berbeda tetapi tidak mempengaruhi harga, atau berbeda tapi dapat disesuaikan secara memadai. Tahapannya: memahami karakteristik transaksi, mengidentifikasi calon pembanding, menentukan pihak yang diuji (fungsi/aset/risiko paling sederhana), identifikasi perbedaan kondisi, penyesuaian, dan menentukan pembanding terpilih.</p><p><strong>Hierarki pembanding</strong>: Pembanding Internal (transaksi WP dengan pihak independen) diutamakan di atas Pembanding Eksternal jika tingkat kesebandingan dan keandalan sama; jika tersedia beberapa pembanding eksternal setara, pembanding dari <strong>jurisdiksi yang sama</strong> dipilih.</p>", "id": "pengawasan_r_311"}, {"heading": "Tahap 5-6: Delapan Metode Penentuan Harga Transfer", "p": 0, "page": "hlm 748-752", "html": "<p>Pasal 9-10, 8 metode yang dapat digunakan:</p><ol><li><strong>CUP</strong> (Comparable Uncontrolled Price) — perbandingan harga pihak independen, sesuai untuk komoditas</li><li><strong>RPM</strong> (Resale Price Method) — harga penjualan kembali, untuk distributor/reseller</li><li><strong>CPM</strong> (Cost Plus Method) — biaya-plus, untuk pabrikan/penyedia jasa</li><li><strong>PSM</strong> (Profit Split Method) — pembagian laba, untuk transaksi dengan kontribusi unik & terintegrasi tinggi</li><li><strong>TNMM</strong> (Transactional Net Margin Method) — laba bersih transaksional</li><li><strong>CUT</strong> (Comparable Uncontrolled Transaction) — perbandingan transaksi independen</li><li><strong>Penilaian harta berwujud/tidak berwujud</strong></li><li><strong>Penilaian bisnis</strong></li></ol><p><strong>Hierarki pemilihan</strong>: jika CUP dan metode lain memiliki keandalan setara, <strong>CUP diutamakan</strong>; jika CPM, RPM, PSM, TNMM memiliki keandalan setara, <strong>CPM dan RPM diutamakan</strong> di atas PSM/TNMM.</p>", "id": "pengawasan_r_312"}, {"heading": "Metode Pembagian Laba (Profit Split Method)", "p": 0, "page": "hlm 753", "html": "<p>Pasal 11: pembagian laba gabungan dapat di tingkat laba kotor atau laba operasi bersih, ditentukan oleh tingkat integrasi fungsi, aset, dan risiko. Dua pendekatan:</p><ul><li><strong>Pendekatan berbasis kontribusi (contribution analysis)</strong>: laba gabungan dibagi berdasarkan faktor pembagi</li><li><strong>Pendekatan berbasis laba residu (residual analysis)</strong>: laba gabungan dipisah jadi (a) laba dari kontribusi masing-masing pihak yang dapat dibandingkan andal, dan (b) sisa laba gabungan (dapat positif/negatif) dibagi berdasarkan faktor pembagi</li></ul><p>Faktor pembagi harus bebas dari Transaksi Afiliasi, dapat diverifikasi, dan didukung data relevan.</p>", "id": "pengawasan_r_313"}, {"heading": "Penentuan Harga Transfer yang Wajar", "p": 0, "page": "hlm 754", "html": "<p>Pasal 12: nilai indikator harga Transaksi Independen dapat berupa <strong>titik kewajaran</strong> (arm's length point) atau <strong>rentang kewajaran</strong> (arm's length range).</p><ul><li>Titik kewajaran: dari pembanding dengan nilai indikator harga yang sama</li><li>Rentang kewajaran: dari pembanding dengan nilai berbeda — <strong>full range</strong> (minimum-maksimum) jika dari 2 pembanding; <strong>interquartile range</strong> (kuartil 1-3) jika dari 3+ pembanding</li></ul><p>Jika Harga Transfer tidak memenuhi PKKU, penentuan menggunakan titik kewajaran, titik paling tepat di rentang, atau median jika titik paling tepat tidak dapat ditentukan.</p>", "id": "pengawasan_r_314"}, {"heading": "Tahapan Pendahuluan untuk Transaksi Afiliasi Tertentu", "p": 0, "page": "hlm 757-764", "html": "<p>Pasal 13: untuk 7 jenis transaksi tertentu, PKKU wajib didahului tahapan pendahuluan berupa pembuktian, sebelum tahapan penerapan PKKU biasa:</p><ul><li><strong>Transaksi jasa</strong>: nyata diberikan & dibutuhkan, memberi manfaat ekonomis (benefit test), bukan shareholder activity, bukan passive association, bukan duplikasi, bukan manfaat insidental</li><li><strong>Harta tidak berwujud</strong>: eksistensi, jenis, nilai, pemilik legal & ekonomis, hak penggunaan, kontribusi DEMPE (development, enhancement, maintenance, protection, exploitation)</li><li><strong>Keuangan terkait pinjaman</strong>: sesuai substansi, dibutuhkan peminjam, memenuhi karakteristik pinjaman (jatuh tempo, kewajiban bayar kembali, kemampuan bayar, dll)</li><li><strong>Keuangan lainnya, pengalihan harta, restrukturisasi usaha, kesepakatan kontribusi biaya</strong>: masing-masing dengan pembuktian motif ekonomis, substansi, dan manfaat yang diharapkan (expected benefit)</li></ul><p>Jika WP <strong>tidak dapat membuktikan</strong> tahapan pendahuluan, transaksi tersebut dianggap <strong>tidak memenuhi PKKU</strong>.</p>", "id": "pengawasan_r_315"}, {"heading": "Penerapan PKKU atas WPDN yang Memenuhi Ketentuan BUT", "p": 0, "page": "hlm 765", "html": "<p>Pasal 14: jika transaksi WP yang ditentukan oleh pihak afiliasinya memenuhi ketentuan sebagai BUT, WP tersebut juga ditetapkan sebagai BUT. BUT wajib menyampaikan seluruh data/informasi terkait transaksi Pihak Afiliasi di luar negeri; jika tidak disampaikan, nilai transaksi ditentukan dengan menerapkan PKKU. Pemenuhan kewajiban WPDN sebelumnya diperhitungkan dalam pemenuhan kewajiban BUT.</p>", "id": "pengawasan_r_316"}, {"heading": "Proses Bisnis Pengawasan per PMK-111/2025", "p": 0, "page": "hlm 767", "html": "<p>PMK-111/2025 membagi proses bisnis Pengawasan menjadi 3 jalur:</p><ul><li><strong>WP Terdaftar</strong>: SP2DK, Surat Imbauan (pengukuhan PKP, pembayaran, pelaporan, angsuran, fasilitas, kewajiban formal), atau Surat Teguran (SPT terlambat, pelanggaran ketentuan)</li><li><strong>WP Belum Terdaftar</strong>: SP2DK → SPHPP (jalur Ekstensifikasi)</li><li><strong>Pengawasan Wilayah</strong>: Kegiatan Pengumpulan Data (pengamatan, wawancara, geotagging, pengambilan gambar)</li></ul>", "id": "pengawasan_r_317"}, {"heading": "Persandingan Alur PMK Pengawasan dan PMK Pemeriksaan", "p": 0, "page": "hlm 768", "html": "<p>Terdapat 2 jalur paralel (DPE = Digital/Elektronik, DPP = manual/konvensional):</p><ul><li><strong>Step 1</strong>: Surat Perintah Pengawasan → LHPtE/LHPt (mirip SP2 → S.Pemb Pemeriksaan)</li><li><strong>Step 2</strong>: SP2DKE/SP2DK dan SPHPP → Tanggapan WP → Undangan Pembahasan Akhir → BAP2DKE/BAP2DK → LHP2DKE/LHP2DK (bersanding dengan SPHP → Tanggapan → Undangan PAHP → Risalah/Ikhtisar PAHP → KKP → LHP pada jalur Pemeriksaan PMK-15/2025)</li></ul>", "id": "pengawasan_r_318"}, {"heading": "Ruang Lingkup Kegiatan Ekstensifikasi 2026", "p": 0, "page": "hlm 770", "html": "<p>Kegiatan Ekstensifikasi 2026 terfokus pada <strong>Aktivasi WP</strong>, mencakup 2 kategori:</p><ul><li><strong>WP Baru</strong>: melalui DPE (Daftar Prioritas Ekstensifikasi) dan KPD</li><li><strong>WP NA (Non-Aktif)</strong>: melalui NA TD (Non-Aktif Terdapat Data) dan KPD</li></ul>", "id": "pengawasan_r_319"}, {"heading": "Gambaran Umum Proses Bisnis Pengawasan WP Belum Ber-NPWP", "p": 0, "page": "hlm 768", "html": "<p>Terdiri 4 tahap: <strong>I. Perencanaan Ekstensifikasi</strong> (analisis data KM/CRM/BI via Komite Kepatuhan → DPE, risiko High/Medium → Analisis/Penelitian Potensi, risiko Low → Edukasi); <strong>II. Pelaksanaan</strong> (SP2DK → penyampaian → monitor tanggapan → SPHP → jika masih ada potensi → undangan pembahasan akhir → BAP2DK → LHP2DK); <strong>III. Tindak Lanjut</strong> (Probis Registrasi/Pemeriksaan/Intelijen Perpajakan); <strong>IV. Monitoring dan Evaluasi</strong> membentang di seluruh tahap.</p>", "id": "pengawasan_r_320"}, {"heading": "Penugasan Tim Ekstensifikasi", "p": 0, "page": "hlm 771", "html": "<p>Kepala Seksi Pengawasan meng-<em>assign case</em> ke Petugas Ekstensifikasi (2 orang) berdasarkan rekomendasi HRIS sesuai kompleksitas kasus. Kepala KPP menerbitkan Surat Perintah Pengawasan (SPP). Tim ekstensifikasi terdiri dari: Kepala Seksi Pengawasan (Supervisor), 1 AR pengampu/Kepala KP2KP (Ketua Tim), dan 1 AR lain dalam seksi yang sama (Anggota Tim).</p>", "id": "pengawasan_r_321"}, {"heading": "Penyusunan dan Penyampaian SP2DK", "p": 0, "page": "hlm 772", "html": "<p>SP2DK berisi: (1) penjelasan pelaksanaan kewajiban perpajakan, (2) permintaan penjelasan data/informasi DJP terkait Income, Cost, Asset, Liability, Equity, (3) jangka waktu <strong>14 hari kalender</strong> untuk tanggapan. SP2DK risiko tinggi disampaikan oleh Fungsional Penyuluh; risiko sedang/rendah oleh Tim Ekstensifikasi. Disampaikan melalui: Portal WP, Pos/Kurir, atau Visit (kunjungan) ke lokasi WP.</p>", "id": "pengawasan_r_322"}, {"heading": "Jangka Waktu Tanggapan WP atas SP2DK", "p": 0, "page": "hlm 775-777", "html": "<p>WP diberi waktu <strong>14 hari</strong> sejak peristiwa yang lebih dahulu terjadi (tanggal penerbitan/aktivasi akun WP, bukti kirim pos, atau penyampaian langsung) untuk menanggapi dengan memenuhi kewajiban dan/atau menyampaikan penjelasan. WP dapat mengajukan <strong>perpanjangan maksimal 7 hari</strong> secara tertulis, yang harus diterima KPP sebelum jangka waktu 14 hari berakhir. WP dapat menyampaikan tanggapan <strong>lebih dari 1 kali</strong>. Jika WP tidak setuju sebagian/seluruh data dalam SP2DK, penjelasan harus disertai bukti/dokumen pendukung.</p>", "id": "pengawasan_r_323"}, {"heading": "Penyusunan SPHPP (Surat Pemberitahuan Hasil Pengujian/Pengawasan)", "p": 0, "page": "hlm 781-783", "html": "<p>Tim Ekstensifikasi memonitor tanggapan WP lalu melakukan penelitian potensi pajak menggunakan <em>Examination Working Sheet</em> (EWS) untuk masa pajak maksimal <strong>5 tahun sebelum tahun berjalan</strong> pelaksanaan ekstensifikasi, mencakup akun pajak sesuai SPT, penghitungan versi WP vs petugas, dan selisih (nilai potensi). Hasilnya: (a) jika ada indikasi kewajiban dengan jumlah pajak → SPHPP + Surat Undangan Pembahasan; (b) jika tidak ada indikasi → SPHPP langsung menuju BAP2DK.</p>", "id": "pengawasan_r_324"}, {"heading": "Pembahasan dengan WP (Ekstensifikasi)", "p": 0, "page": "hlm 785", "html": "<p>Pembahasan dilakukan secara luring atau daring (video conference), dapat melibatkan pegawai DJP lain yang ditugaskan. WP dapat memberikan tanggapan atas penghitungan dan informasi lain disertai bukti/dokumen pendukung. Jika <strong>WP tidak hadir</strong>, pembahasan dianggap telah dilaksanakan dan kewajiban perpajakan yang masih harus dipenuhi WP dihitung sendiri oleh DJP. Hasil pembahasan dituangkan dalam BAP2DK.</p>", "id": "pengawasan_r_325"}, {"heading": "Penyusunan dan Penandatanganan BAP2DK", "p": 0, "page": "hlm 787-790", "html": "<p>BAP2DK berisi informasi penyampaian SP2DK, data profil WP, tanggapan WP, simpulan akhir, dan hasil penghitungan potensi. Ditandatangani WP dan AR/pegawai DJP. BAP2DK disampaikan via Akun WP, pos/kurir, atau langsung saat WP hadir pembahasan. Jika WP tidak bisa tanda tangan elektronik (TTE), WP mengirim kembali konsep BAP2DK yang sudah ditandatangani maksimal <strong>5 hari kerja</strong> sejak konsep dikirim; jika tidak dikembalikan, WP dianggap menghadiri pembahasan namun tidak bersedia menandatangani BAP2DK.</p>", "id": "pengawasan_r_326"}, {"heading": "Hasil Kegiatan P2DK dan Penyusunan LHP2DK", "p": 0, "page": "hlm 786, 791", "html": "<p>Hasil kegiatan P2DK dapat berupa: pemberian NPWP/NITKU secara jabatan, usulan pengukuhan PKP jabatan, pendaftaran objek PBB jabatan, pembatasan/pemblokiran layanan publik, usulan pemeriksaan, atau pengembangan &amp; analisis data (jika ada indikasi pidana perpajakan). LHP2DK memuat informasi profil WP, penyampaian SP2DK, hasil klarifikasi, indikasi kewajiban yang masih harus dibayar, tanggapan WP, dan rekomendasi tindak lanjut (case closed / usul IDLP / usul Pemeriksaan / pengukuhan PKP jabatan / pendaftaran PBB jabatan / input form KPD).</p>", "id": "pengawasan_r_327"}, {"heading": "Dasar Hukum dan Kriteria WP Non-Aktif", "p": 0, "page": "hlm 793-794", "html": "<p>Dasar hukum: UU 6/1983 s.t.d.d UU 7/2021 (HPP) dan <strong>PER-07/PJ/2025</strong>. Kriteria WP Non-Aktif (8 kriteria, a-h): WP OP usaha/pekerjaan bebas berhenti tidak penuhi syarat objektif; WP OP tanpa usaha tidak penuhi syarat objektif/penghasilan di bawah PTKP; WP OP WNI berniat jadi SPLN tapi belum penuhi syarat; WP OP WNI sudah jadi SPLN; WP OP wanita kawin pilih gabung suami tapi masih punya NIK; WP Badan tidak penuhi syarat subjektif/objektif tapi belum dihapus NPWP-nya; Instansi Pemerintah tidak penuhi syarat pemotong/pemungut tapi belum dihapus NPWP.</p>", "id": "pengawasan_r_328"}, {"heading": "Penetapan WP Non-Aktif Secara Jabatan", "p": 0, "page": "hlm 795", "html": "<p>Berdasarkan PER-7/PJ/2025, WP ditetapkan Non-Aktif secara jabatan jika memenuhi 6 kriteria sekaligus: (a) tidak melaporkan SPT Masa/Tahunan berturut-turut 5 tahun terakhir; (b) tidak dipotong/dipungut pihak ketiga berturut-turut 5 tahun terakhir; (c) tidak melakukan pembayaran pajak berturut-turut 5 tahun terakhir; (d) tidak memiliki tunggakan pajak dan/atau tidak sedang melakukan upaya hukum; (e) tidak sedang dilakukan pemeriksaan pajak/bukper/penyidikan; (f) tidak mendapatkan fasilitas/insentif perpajakan.</p>", "id": "pengawasan_r_329"}, {"heading": "Imbauan Massal dan Pengaktifan Kembali WP Non-Aktif Otomatis", "p": 0, "page": "hlm 797-798", "html": "<p>PMK 111/2025 memungkinkan pengawasan otomatis via sistem informasi (Surat Teguran/Imbauan Massal), termasuk program prioritas <strong>NATD</strong> (WP Non-Aktif Terdapat Data). Proses: Penyusunan Daftar Nominatif & penerbitan Imbauan oleh Kantor Pusat DJP → disampaikan via Akun WP/Email/pos/kunjungan → Tanggapan WP → case closed atau lanjut Teguran/SP2DK. Pengaktifan kembali WP Non-Efektif (NE) otomatis <em>by system</em> (SE-27/PJ/2020) terjadi saat pelaporan SPT dengan kriteria: formulir 1770S/1770SS, tidak lewat batas waktu, bukan SPT pembetulan, menyatakan nihil/kurang bayar, dan tidak disampaikan dalam bentuk e-SPT.</p>", "id": "pengawasan_r_330"}, {"heading": "Kewenangan, Tujuan, dan Tipe Pemeriksaan (PMK 15/2025)", "p": 0, "page": "hlm 800-802", "html": "<p>Dirjen Pajak berwenang melakukan Pemeriksaan untuk (1) menguji kepatuhan dan (2) tujuan lain, dengan kewenangan dilimpahkan secara delegasi ke pejabat DJP. Tiga tipe pemeriksaan:</p><ul><li><strong>Pemeriksaan Lengkap</strong>: mencakup seluruh pos dalam SPT/SPOP secara mendalam</li><li><strong>Pemeriksaan Terfokus</strong>: satu/beberapa pos secara mendalam</li><li><strong>Pemeriksaan Spesifik</strong>: satu/beberapa pos secara sederhana (termasuk pemeriksaan atas data konkret)</li></ul>", "id": "pengawasan_r_331"}, {"heading": "Kriteria Pemeriksaan untuk Menguji Kepatuhan", "p": 0, "page": "hlm 803, 816", "html": "<p>Pasal 4 PMK 15/2025, pemeriksaan uji kepatuhan dilakukan dalam 14 kriteria (a-n), antara lain: pengembalian LB Pasal 17B KUP, SPT LB selain Pasal 17B, SPT menyatakan rugi, telah diberikan pengembalian pendahuluan, perubahan tahun buku/metode pembukuan, penilaian kembali aktiva tetap, WP merger/likuidasi/bubar/tinggalkan Indonesia selamanya, PKP tidak serahkan BKP/JKP tapi sudah restitusi (Pasal 9 ayat 6e UU PPN), WP terpilih berdasarkan risiko kepatuhan, pihak lain tidak laksanakan kewajiban potput (Pasal 32A UU KUP — kriteria baru), terdapat data konkret, WP tidak sampaikan SPOP, dan indikasi PBB lebih besar dari SPOP.</p>", "id": "pengawasan_r_332"}, {"heading": "Kriteria Pemeriksaan untuk Tujuan Lain", "p": 0, "page": "hlm 804", "html": "<p>Pasal 4 PMK 15/2025 menetapkan 25 kriteria (a-y) pemeriksaan tujuan lain, di antaranya: pemberian/penghapusan NPWP secara jabatan, pengukuhan/pencabutan PKP, pendaftaran objek PBB jabatan, penyelesaian keberatan, pencocokan data, penentuan tempat terutang PPN, penyelesaian penagihan, pemberian fasilitas perpajakan, pertukaran informasi internasional, penyelesaian MAP, permohonan APA, pengujian UU Akses Informasi Keuangan, penetapan biaya eksplorasi, pemeriksaan fisik endorsement, perluasan basis data, dan pengujian pihak lain atas kewajiban Pasal 32A UU KUP. Banyak kriteria ditandai label &ldquo;NEW&rdquo; sebagai ketentuan yang baru ditambahkan.</p>", "id": "pengawasan_r_333"}, {"heading": "Jangka Waktu Pemeriksaan", "p": 0, "page": "hlm 806-807", "html": "<p>Untuk uji kepatuhan, dihitung sejak Surat Pemberitahuan Pemeriksaan disampaikan — <strong>jangka waktu pengujian</strong>: Lengkap 5 bulan, Terfokus 3 bulan, Spesifik 1 bulan, Dakon (data konkret) 10 hari kerja. <strong>Jangka waktu PAHP &amp; pelaporan</strong> (sejak SPHP disampaikan): Lengkap/Terfokus/Spesifik 30 hari kerja, Dakon 10 hari kerja. Untuk pemeriksaan <strong>Tujuan Lain</strong>, jangka waktu paling lama <strong>4 bulan</strong> sejak Surat Pemberitahuan Pemeriksaan disampaikan. WP K3S Migas mengikuti pedoman pemeriksaan bersama atas kontrak kerja sama (PSC Cost Recovery).</p>", "id": "pengawasan_r_334"}, {"heading": "Pemeriksaan PBB", "p": 0, "page": "hlm 808-809", "html": "<p>Kriteria pemeriksaan uji kepatuhan PBB sama dengan kriteria umum ditambah: WP tidak menyampaikan SPOP setelah ditegur, dan terdapat indikasi PBB lebih besar dari yang dihitung dari SPOP. Terbagi dua: <strong>Pemeriksaan Rutin</strong> berdasarkan Daftar Nominatif, dan <strong>Pemeriksaan Khusus</strong> berdasarkan Jalur Proses (Jopro) CRM PBB (misal sektor batubara).</p>", "id": "pengawasan_r_335"}, {"heading": "Siklus Penatausahaan PBB P5L", "p": 0, "page": "hlm 809", "html": "<p>Alur: WP lapor SPOP via CoreTax → Penelitian Material (sesuai → lanjut Penilaian; belum sesuai → Surat Teguran 7 hari → Klarifikasi → Pembetulan SPOP 7 hari) → Penilaian (Kantor 5 hari / Lapangan 15 hari) → Penetapan NJOP → SPPT. Jika teguran tidak ditanggapi → Anris Pemeriksaan → <strong>Pemeriksaan PBB</strong> → SKP PBB. Auto creation SPOP: Periode I (Kebun, Migas, Pabum) 1 Februari; Periode II (Hutan, Minerba, Lainnya) 31 Maret.</p>", "id": "pengawasan_r_336"}, {"heading": "Bantuan Ahli dalam Pemeriksaan", "p": 0, "page": "hlm 811", "html": "<p>Tim Pemeriksa Pajak dapat dibantu satu/lebih ahli tertentu dari dalam/luar DJP berdasarkan Surat Tugas Membantu Pelaksanaan Pemeriksaan. Khusus Pemeriksaan PBB, Kepala UP2 melibatkan <strong>Penilai Pajak</strong> sebagai pihak berkeahlian khusus untuk menetapkan NJOP — baik sebagai Bantuan Penilaian (jika ada Penilai Pajak/Petugas Penilai pada Unit Pelaksana Pemeriksaan) maupun Bantuan Penilai (jika tidak ada).</p>", "id": "pengawasan_r_337"}, {"heading": "Data Konkret (PER-18/PJ/2025)", "p": 0, "page": "hlm 812-814", "html": "<p>Data Konkret adalah data yang dimiliki/diperoleh DJP, terdiri 3 jenis:</p><ul><li><strong>Faktur Pajak</strong> yang disetujui sistem tapi belum/tidak dilaporkan dalam SPT Masa PPN</li><li><strong>Bukti Potput PPh</strong> yang belum/tidak dilaporkan penerbitnya pada SPT Masa PPh</li><li><strong>Bukti Transaksi/Data Perpajakan</strong> (8 sub-jenis): kelebihan kompensasi PPN tanpa LB sebelumnya, penghitungan kembali PM oleh pihak tidak berhak, PPN disetor dimuka kurang bayar, pemanfaatan insentif tidak sesuai, pengkreditan PM tidak sesuai ketentuan, penghasilan tidak/kurang dilaporkan dari bukti potong DJP, data dari ketetapan/putusan inkrah, serta data P2DK yang tidak ditindaklanjuti tepat waktu (LHP2DK berpeluang jadi data konkret kategori ini)</li></ul><p>Data Konkret memerlukan pengujian sederhana sehingga diarahkan ke Pemeriksaan Spesifik.</p>", "id": "pengawasan_r_338"}, {"heading": "Kebijakan Umum Tanggung Jawab Tim Pemeriksa", "p": 0, "page": "hlm 821", "html": "<p>Tim Pemeriksa Pajak yang terdiri dari <strong>Pejabat Fungsional Pemeriksa Pajak</strong> bertanggung jawab atas pemeriksaan restitusi PPN tahun berjalan, pemeriksaan ruang lingkup seluruh jenis pajak, dan pemeriksaan ulang. Tim yang terdiri dari <strong>Petugas Pemeriksa Pajak</strong> bertanggung jawab atas pemeriksaan ruang lingkup satu/beberapa jenis pajak, termasuk pemeriksaan khusus berdasarkan data konkret, pemeriksaan PBB, dan pemeriksaan SPT Masa Pengungkapan Aset Sukarela dengan Tarif Final.</p>", "id": "pengawasan_r_339"}, {"heading": "Kriteria Pemeriksaan Efektif (SE-15/PJ/2018)", "p": 0, "page": "hlm 822", "html": "<p>Empat kriteria pemeriksaan dinilai efektif:</p><ol><li><strong>Pemeriksaan selesai dan pencairan optimal</strong>: upaya minimalisasi jangka waktu agar Pemeriksa dapat optimal mengerjakan pemeriksaan di tahun berjalan</li><li><strong>Upaya hukum minimal</strong>: kualitas pemeriksaan ditingkatkan agar hasil lebih baik</li><li><strong>Restitusi terkendali</strong>: melalui optimalisasi pengembalian pendahuluan bagi WP sesuai kriteria Pasal 17C/17D UU KUP dan Pasal 9 ayat (4c) UU PPN</li><li><strong>Menciptakan kepatuhan berkelanjutan</strong>: tidak hanya kepatuhan sesaat, terlihat dari dinamisasi SPT tahun-tahun setelah pemeriksaan</li></ol>", "id": "pengawasan_r_340"}, {"heading": "Pengusulan Pemeriksaan (SE 05/2022)", "p": 0, "page": "hlm 823-824", "html": "<p>Pengusulan pemeriksaan terbagi: pemeriksaan tujuan lain; pemeriksaan khusus berdasarkan data konkret; pemeriksaan khusus berdasarkan analisis risiko (satu/beberapa jenis pajak); dan pemeriksaan khusus berdasarkan analisis risiko seluruh jenis pajak (<em>all taxes</em>).</p>", "id": "pengawasan_r_341"}, {"heading": "Ketentuan Pemeriksaan atas WP Strategis", "p": 0, "page": "hlm 823-825", "html": "<p><strong>Berdasarkan data konkret</strong>: tahun pajak berjalan <em>dapat</em> diusulkan setelah penelitian satu/beberapa jenis pajak dan/atau satu/beberapa masa pajak serta kegiatan P2DK selesai; tahun pajak sebelum tahun berjalan <em>dapat</em> diusulkan setelah penelitian komprehensif dan P2DK selesai.</p><p><strong>Berdasarkan analisis risiko</strong>: tahun pajak berjalan <em>tidak dapat</em> diusulkan (baik satu/beberapa jenis pajak maupun all taxes); tahun pajak sebelum tahun berjalan <em>dapat</em> diusulkan setelah penelitian komprehensif dan P2DK selesai.</p><p>Penggalian potensi tahun berjalan di setiap KPP hanya dapat dilakukan terhadap WP yang telah terdapat dalam <strong>DSP3</strong>, kecuali KPP memperoleh keterangan lain berupa data konkret yang dapat ditindaklanjuti tersendiri.</p>", "id": "pengawasan_r_342"}, {"heading": "Persetujuan/Penugasan Pemeriksaan oleh Kepala KPP", "p": 0, "page": "hlm 826", "html": "<p>Kepala KPP bertanggung jawab atas penerbitan persetujuan/penugasan pemeriksaan untuk: (1) penugasan rutin berdasarkan Daftar Nominatif (kriteria SPT LB, merger/likuidasi/pembubaran, WP
