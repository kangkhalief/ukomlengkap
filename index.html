 hak", "Penitipan BKP sementara"], "c": 1, "e": "Pemakaian sendiri dan/atau pemberian cuma-cuma termasuk definisi penyerahan BKP (huruf d). Penyerahan secara konsinyasi sudah tidak lagi masuk definisi penyerahan sejak UU Cipta Kerja.", "p": 1, "topic": "Penyerahan BKP", "id": "pemeriksaan_q_43"}, {"q": "Tarif PPN atas Ekspor BKP, Ekspor JKP, dan Ekspor BKP Tidak Berwujud, baik sebelum maupun sesudah 1 April 2022, adalah...", "o": ["10%", "11%", "12%", "0%"], "c": 3, "e": "Tarif PPN atas seluruh jenis kegiatan ekspor (BKP, JKP, BKPTB) tetap 0%, baik sebelum maupun sesudah perubahan tarif normal dari 10% ke 11%.", "p": 1, "topic": "Tarif PPN", "id": "pemeriksaan_q_44"}, {"q": "Pemungutan PPN dan PPnBM menganut prinsip akrual, artinya terutangnya pajak terjadi pada saat...", "o": ["Pembayaran diterima penuh", "Penyerahan BKP/JKP, meskipun pembayaran belum diterima", "Faktur Pajak diterbitkan", "SPT Masa dilaporkan"], "c": 1, "e": "Prinsip akrual PPN: terutangnya pajak terjadi pada saat penyerahan BKP/JKP, meskipun pembayaran atas penyerahan tersebut belum diterima atau belum sepenuhnya diterima.", "p": 1, "topic": "Saat Terutang PPN", "id": "pemeriksaan_q_45"}, {"q": "Faktur Pajak WAJIB dibuat PKP pada saat-saat berikut, KECUALI...", "o": ["Saat penyerahan BKP/JKP", "Saat penerimaan pembayaran sebelum penyerahan", "Saat laporan keuangan tahunan diaudit", "Saat ekspor BKP/JKP"], "c": 2, "e": "Faktur Pajak dibuat pada saat penyerahan, penerimaan pembayaran (jika sebelum penyerahan), penerimaan pembayaran termin, ekspor, atau saat lain menurut PMK — bukan saat audit laporan keuangan.", "p": 1, "topic": "Faktur Pajak", "id": "pemeriksaan_q_46"}, {"q": "Dokumen tertentu yang dipersamakan dengan Faktur Pajak, jika dibuat melewati jangka waktu berapa bulan sejak seharusnya dibuat, dianggap tidak membuat dokumen tertentu sehingga PPN tidak dapat dikreditkan?", "o": ["1 bulan", "2 bulan", "3 bulan", "6 bulan"], "c": 2, "e": "Dokumen tertentu yang dibuat melewati jangka waktu 3 bulan sejak seharusnya dibuat dianggap tidak membuat dokumen tertentu, sehingga PPN yang tercantum tidak dapat dikreditkan.", "p": 1, "topic": "Faktur Pajak", "id": "pemeriksaan_q_47"}, {"q": "Persyaratan material Faktur Pajak mensyaratkan bahwa Faktur Pajak harus...", "o": ["Diisi secara benar, lengkap, dan jelas", "Berisi keterangan yang sebenarnya/sesungguhnya mengenai penyerahan BKP/JKP", "Dicetak dengan tinta berwarna", "Ditandatangani oleh direktur utama"], "c": 1, "e": "Persyaratan material berkaitan dengan substansi (keterangan sebenarnya mengenai transaksi), sedangkan \"diisi benar, lengkap, jelas\" adalah persyaratan formal.", "p": 1, "topic": "Faktur Pajak", "id": "pemeriksaan_q_48"}, {"q": "Pajak Masukan yang dapat namun belum dikreditkan pada Masa Pajak yang sama dapat dikreditkan pada Masa Pajak berikutnya paling lama...", "o": ["1 Masa Pajak", "2 Masa Pajak", "3 Masa Pajak sejak berakhirnya Masa Pajak saat Faktur Pajak dibuat", "6 Masa Pajak"], "c": 2, "e": "Sesuai Pasal 9 ayat (9) UU PPN, PM yang belum dikreditkan dapat dikreditkan paling lama 3 Masa Pajak setelah berakhirnya Masa Pajak saat Faktur Pajak dibuat, sepanjang belum dibebankan sebagai biaya/dikapitalisasi.", "p": 1, "topic": "Pengkreditan PM", "id": "pemeriksaan_q_49"}, {"q": "Pengkreditan Pajak Masukan TIDAK berlaku bagi pengeluaran untuk perolehan BKP/JKP yang...", "o": ["Dibeli secara tunai", "Tidak mempunyai hubungan langsung dengan kegiatan usaha", "Dibeli dari PKP lain", "Memiliki nilai di atas Rp1 juta"], "c": 1, "e": "Pasal 9 ayat (8) huruf b UU PPN mengecualikan pengkreditan PM atas perolehan BKP/JKP yang tidak mempunyai hubungan langsung dengan kegiatan usaha.", "p": 1, "topic": "PM Tidak Dapat Dikreditkan", "id": "pemeriksaan_q_50"}, {"q": "Pajak Masukan yang ditagih dengan penerbitan ketetapan pajak dapat dikreditkan oleh PKP sebesar...", "o": ["Jumlah pokok PPN dalam ketetapan, dengan syarat telah dilunasi dan tidak dilakukan upaya hukum", "Seluruh jumlah ketetapan termasuk sanksi", "50% dari jumlah ketetapan", "Tidak dapat dikreditkan sama sekali"], "c": 0, "e": "PM yang ditagih dengan ketetapan pajak dapat dikreditkan sebesar jumlah pokok PPN dalam ketetapan, dengan syarat ketetapan telah dilunasi dan tidak dilakukan upaya hukum.", "p": 1, "topic": "Pengkreditan PM", "id": "pemeriksaan_q_51"}, {"q": "Pemeriksa Pajak adalah pegawai negeri sipil di lingkungan DJP atau tenaga ahli yang ditunjuk oleh Direktur Jenderal Pajak, diatur dalam...", "o": ["PMK 15/2025 dan PERMENPAN 66/2021", "UU KUP Pasal 29", "PER-18/PJ/2025", "SE-15/PJ/2018"], "c": 0, "e": "Definisi Pemeriksa Pajak diatur dalam PMK 15/2025, sedangkan unsur kegiatan tugas Jabatan Fungsional Pemeriksa Pajak (pengujian kepatuhan & penegakan hukum) diatur dalam PERMENPAN 66/2021.", "p": 0, "topic": "Pemeriksa Pajak", "id": "pemeriksaan_q_52"}, {"q": "Berdasarkan Pasal 2 PMK 15/2025, tujuan Pemeriksaan terbagi menjadi 2 kategori, yaitu...", "o": ["Pemeriksaan Lengkap dan Pemeriksaan Terfokus", "Menguji Kepatuhan dan Tujuan Lain", "Pemeriksaan Rutin dan Pemeriksaan Khusus", "Pemeriksaan Kantor dan Pemeriksaan Lapangan"], "c": 1, "e": "Pasal 2 PMK 15/2025 membagi tujuan Pemeriksaan menjadi 2: Menguji Kepatuhan dan Tujuan Lain, yang kemudian berkaitan dengan tipe pemeriksaan (Lengkap/Terfokus/Spesifik).", "p": 0, "topic": "Tujuan Pemeriksaan", "id": "pemeriksaan_q_53"}, {"q": "Tipe Pemeriksaan Lengkap mencakup...", "o": ["Satu atau beberapa pos dalam SPT secara sederhana", "Satu atau beberapa pos dalam SPT secara mendalam", "Seluruh pos dalam SPT dan/atau SPOP secara mendalam", "Hanya pos PPN"], "c": 2, "e": "Pemeriksaan Lengkap mencakup seluruh pos dalam SPT dan/atau SPOP secara mendalam, berbeda dengan Pemeriksaan Terfokus (satu/beberapa pos mendalam) dan Spesifik (satu/beberapa pos sederhana).", "p": 0, "topic": "Tipe Pemeriksaan", "id": "pemeriksaan_q_54"}, {"q": "Manakah yang termasuk kriteria Pemeriksaan untuk menguji kepatuhan menurut Pasal 4 PMK 15/2025?", "o": ["Pemberian NPWP secara jabatan", "Pengembalian Lebih Bayar Pasal 17B KUP", "Penyelesaian keberatan", "Pengumpulan bahan penyusunan norma"], "c": 1, "e": "Pengembalian LB Pasal 17B KUP adalah kriteria pemeriksaan untuk menguji kepatuhan (huruf a); sementara pemberian NPWP jabatan, penyelesaian keberatan, dan pengumpulan bahan norma adalah kriteria pemeriksaan untuk tujuan lain.", "p": 0, "topic": "Kriteria Pemeriksaan", "id": "pemeriksaan_q_55"}, {"q": "Kriteria pemeriksaan untuk tujuan lain yang bersifat khusus PBB antara lain...", "o": ["Penentuan tempat terutang PPN", "Pendaftaran Objek PBB secara jabatan dan Pencabutan SKT Objek PBB", "Pengujian fasilitas perpajakan", "Penyelesaian prosedur persetujuan bersama"], "c": 1, "e": "Pendaftaran Objek PBB secara jabatan (huruf e) dan Pencabutan SKT Objek PBB (huruf f) adalah kriteria tujuan lain yang khusus berkaitan dengan PBB.", "p": 0, "topic": "Kriteria Pemeriksaan", "id": "pemeriksaan_q_56"}, {"q": "Jangka waktu pengujian Pemeriksaan Lengkap paling lama adalah...", "o": ["1 bulan", "3 bulan", "5 bulan", "10 hari kerja"], "c": 2, "e": "Jangka waktu pengujian: Pemeriksaan Lengkap paling lama 5 bulan, Terfokus 3 bulan, Spesifik 1 bulan, dan Data Konkret 10 hari kerja.", "p": 0, "topic": "Jangka Waktu Pemeriksaan", "id": "pemeriksaan_q_57"}, {"q": "Jangka waktu pengujian pemeriksaan dapat diperpanjang 4 bulan khusus untuk...", "o": ["WP yang mengajukan restitusi", "WP Grup/WP Transfer Pricing", "WP yang tidak kooperatif", "WP UMKM"], "c": 1, "e": "Jangka waktu pengujian dapat diperpanjang 4 bulan khusus untuk WP Grup atau WP yang bertransaksi dengan pihak yang mempunyai hubungan istimewa (Transfer Pricing).", "p": 0, "topic": "Jangka Waktu Pemeriksaan", "id": "pemeriksaan_q_58"}, {"q": "Data Konkret yang menjadi dasar pemeriksaan berdasarkan PER-18/PJ/2025 terdiri dari 3 jenis, yaitu...", "o": ["Faktur Pajak, Bukti Potput PPh, dan Bukti Transaksi/Data Perpajakan", "SPT, SPOP, dan Laporan Keuangan", "Data CRM, Data Analisis Risiko, dan Data Eksternal", "SP2DK, SPHPP, dan LHP2DK"], "c": 0, "e": "PER-18/PJ/2025 mendefinisikan Data Konkret sebagai: (a) Faktur Pajak yang disetujui namun belum/tidak dilaporkan dalam SPT PPN, (b) Bukti Potput PPh yang belum/tidak dilaporkan, (c) Bukti Transaksi/Data Perpajakan untuk menghitung kewajiban WP.", "p": 0, "topic": "Data Konkret", "id": "pemeriksaan_q_59"}, {"q": "Pemeriksaan Khusus berdasarkan analisis risiko disebut juga...", "o": ["Audit based on data", "Risk-based audit", "Pemeriksaan rutin", "Pemeriksaan data konkret"], "c": 1, "e": "Pemeriksaan khusus berdasarkan analisis risiko disebut risk-based audit, berbeda dengan pemeriksaan khusus berdasarkan data konkret yang disebut audit based on data.", "p": 0, "topic": "Jenis Pemeriksaan", "id": "pemeriksaan_q_60"}, {"q": "Pemeriksaan Rutin merupakan pemeriksaan yang dilakukan sehubungan dengan...", "o": ["Indikasi ketidakpatuhan berdasarkan data konkret", "Pemenuhan hak dan/atau pelaksanaan kewajiban perpajakan WP", "Analisis risiko kepatuhan", "Permintaan aparat penegak hukum"], "c": 1, "e": "Pemeriksaan Rutin dilakukan sehubungan dengan pemenuhan hak dan/atau pelaksanaan kewajiban perpajakan Wajib Pajak, berbeda dengan Pemeriksaan Khusus yang berbasis data konkret atau analisis risiko.", "p": 0, "topic": "Jenis Pemeriksaan", "id": "pemeriksaan_q_61"}, {"q": "Standar Umum Pemeriksaan mensyaratkan Pemeriksa Pajak memiliki, KECUALI...", "o": ["Pendidikan dan/atau pelatihan teknis yang cukup", "Integritas dan independensi dalam melaksanakan tugas", "Keterampilan sebagai Pemeriksa Pajak", "Jabatan struktural minimal eselon III"], "c": 3, "e": "Standar Umum Pemeriksaan mensyaratkan pendidikan/pelatihan teknis, keterampilan, serta integritas dan independensi — tidak mensyaratkan jabatan struktural tertentu.", "p": 0, "topic": "Standar Pemeriksaan", "id": "pemeriksaan_q_62"}, {"q": "Standar Pelaporan Hasil Pemeriksaan mensyaratkan bahwa Laporan Hasil Pemeriksaan disusun berdasarkan...", "o": ["Instruksi atasan", "Kertas kerja Pemeriksaan", "Permintaan Wajib Pajak", "Hasil rapat internal"], "c": 1, "e": "Standar Pelaporan Hasil Pemeriksaan mensyaratkan LHP disusun berdasarkan kertas kerja Pemeriksaan, memuat pelaksanaan, simpulan, dan usulan Pemeriksa Pajak.", "p": 0, "topic": "Standar Pemeriksaan", "id": "pemeriksaan_q_63"}, {"q": "Metode, Teknik, dan Prosedur Pemeriksaan memiliki pengertian berbeda. Manakah pasangan definisi yang TEPAT?", "o": ["Metode = cara pengumpulan bukti; Teknik = langkah rinci berupa perintah", "Teknik = cara-cara pengumpulan bukti, pengujian, dan/atau pembuktian; Prosedur = langkah rinci tertulis berupa perintah", "Prosedur = gabungan Metode Langsung dan Tidak Langsung", "Metode = serangkaian langkah dalam suatu Teknik"], "c": 1, "e": "Teknik adalah cara-cara pengumpulan bukti, pengujian, dan/atau pembuktian yang dikembangkan Pemeriksa Pajak; Prosedur adalah serangkaian langkah dalam suatu Teknik, berupa petunjuk rinci tertulis dalam bentuk perintah.", "p": 0, "topic": "Metode Teknik Prosedur", "id": "pemeriksaan_q_64"}, {"q": "Enam pendekatan dalam Metode Tidak Langsung meliputi semua berikut, KECUALI...", "o": ["Transaksi Tunai dan Bank", "Pertambahan Kekayaan Bersih", "Penghitungan Biaya Hidup", "Wawancara langsung dengan manajemen"], "c": 3, "e": "6 pendekatan Metode Tidak Langsung: transaksi tunai & bank, sumber & penggunaan dana, pertambahan kekayaan bersih, penghitungan rasio, penghitungan biaya hidup, dan satuan/volume — wawancara bukan termasuk pendekatan Metode Tidak Langsung (itu Teknik Metode Langsung).", "p": 0, "topic": "Metode Tidak Langsung", "id": "pemeriksaan_q_65"}, {"q": "Dalam Alur Proses Pemeriksaan, setelah SPHP disampaikan kepada WP, WP diberi hak menyampaikan tanggapan tertulis dalam jangka waktu...", "o": ["5 hari kerja", "30 hari kerja (PAHP & Pelaporan) / 10 hari kerja untuk Dakon", "4 bulan", "12 bulan"], "c": 1, "e": "Jangka waktu PAHP & Pelaporan paling lama 30 hari kerja sejak SPHP disampaikan (10 hari kerja untuk Pemeriksaan Data Konkret) sampai tanggal LHP.", "p": 0, "topic": "Alur Proses Pemeriksaan", "id": "pemeriksaan_q_66"}, {"q": "Pembukuan menurut Pasal 1 angka 29 UU KUP adalah proses pencatatan yang ditutup dengan menyusun...", "o": ["SPT Tahunan", "Laporan keuangan berupa neraca dan laporan laba rugi", "Nota perhitungan pajak", "Laporan audit independen"], "c": 1, "e": "Pembukuan adalah proses pencatatan teratur yang ditutup dengan menyusun laporan keuangan berupa neraca dan laporan laba rugi untuk periode Tahun Pajak tersebut.", "p": 0, "topic": "Pembukuan", "id": "pemeriksaan_q_67"}, {"q": "Buku, catatan, dan dokumen dasar pembukuan wajib disimpan di Indonesia selama...", "o": ["5 tahun", "10 tahun", "7 tahun", "Selamanya"], "c": 1, "e": "Buku, catatan, dokumen termasuk hasil pengolahan data elektronik wajib disimpan selama 10 tahun di Indonesia.", "p": 0, "topic": "Pembukuan", "id": "pemeriksaan_q_68"}, {"q": "Ketentuan Pembukuan mensyaratkan diselenggarakan dengan prinsip taat asas dan menggunakan...", "o": ["Stelsel akrual atau stelsel kas", "Hanya stelsel kas", "Hanya stelsel akrual", "Metode campuran tanpa batasan"], "c": 0, "e": "Ketentuan Pembukuan mensyaratkan taat asas dengan Stelsel Akrual atau Stelsel Kas, dicatat dalam huruf Latin, angka Arab, mata uang Rupiah, bahasa Indonesia atau bahasa asing yang diizinkan.", "p": 0, "topic": "Pembukuan", "id": "pemeriksaan_q_69"}, {"q": "Salah satu kewajiban Wajib Pajak yang diperiksa menurut Pasal 13 ayat (3) PP Nomor 50 Tahun 2022 adalah...", "o": ["Membayar biaya pemeriksaan", "Memperlihatkan dan/atau meminjamkan buku, catatan, atau dokumen yang berhubungan dengan penghasilan", "Menunjuk pengacara", "Hadir di pengadilan pajak"], "c": 1, "e": "WP yang diperiksa wajib memperlihatkan/meminjamkan buku/catatan/dokumen, memberi kesempatan memasuki tempat/ruang, dan memberikan data/informasi/keterangan yang diperlukan.", "p": 0, "topic": "Kewajiban WP Diperiksa", "id": "pemeriksaan_q_70"}, {"q": "Contoh keterangan tertulis yang dapat diminta Pemeriksa dari WP meliputi, KECUALI...", "o": ["Surat pernyataan tidak diaudit oleh kantor akuntan publik", "Surat pernyataan tentang kepemilikan harta", "Surat pernyataan tentang perkiraan biaya hidup", "Transkrip rekaman CCTV kantor WP"], "c": 3, "e": "Keterangan tertulis mencakup surat pernyataan tidak diaudit, kesesuaian fotokopi dokumen, kepemilikan harta, dan perkiraan biaya hidup — bukan rekaman CCTV.", "p": 0, "topic": "Keterangan Tertulis dan Lisan", "id": "pemeriksaan_q_71"}, {"q": "Kewajiban merahasiakan data pembukuan/pencatatan WP ditiadakan untuk keperluan...", "o": ["Pemasaran produk", "Pemeriksaan pajak sesuai Pasal 29 ayat (4) UU KUP", "Audit internal perusahaan", "Kepentingan pihak ketiga umum"], "c": 1, "e": "Pasal 29 ayat (4) UU KUP meniadakan kewajiban merahasiakan data/dokumen WP untuk keperluan pemeriksaan, guna mencegah dalih kerahasiaan menghalangi pemeriksaan.", "p": 0, "topic": "Peniadaan Kewajiban Merahasiakan", "id": "pemeriksaan_q_72"}, {"q": "Pengungkapan Ketidakbenaran Pengisian SPT oleh WP sesuai Pasal 8 ayat (4) UU KUP dapat dilakukan WP dengan syarat...", "o": ["DJP belum menyampaikan SPHP", "Pemeriksaan belum dimulai sama sekali", "WP sudah menerima SKP", "Keberatan sudah diajukan"], "c": 0, "e": "Walaupun DJP telah melakukan pemeriksaan, dengan syarat DJP belum menyampaikan SPHP, WP dapat mengungkapkan ketidakbenaran pengisian SPT dalam laporan tersendiri dan pemeriksaan tetap dilanjutkan.", "p": 0, "topic": "Pengungkapan Ketidakbenaran SPT", "id": "pemeriksaan_q_73"}, {"q": "Surat Ketetapan Pajak Nihil (SKPN) diterbitkan dalam hal...", "o": ["Jumlah kredit pajak sama dengan jumlah pajak terutang, atau pajak tidak terutang dan tidak ada kredit/pembayaran pajak", "Terdapat kelebihan pembayaran pajak", "Terdapat kekurangan pembayaran pajak", "WP mengajukan permohonan restitusi"], "c": 0, "e": "SKPN (Pasal 17A UU KUP) diterbitkan jika jumlah kredit pajak/pembayaran sama dengan jumlah pajak terutang, atau pajak tidak terutang dan tidak ada kredit pajak/pembayaran.", "p": 0, "topic": "SKPN", "id": "pemeriksaan_q_74"}, {"q": "Upaya hukum administratif dalam penyelesaian sengketa perpajakan yang dapat diajukan berkali-kali adalah...", "o": ["Keberatan", "Pembetulan", "Pengurangan dan Pembatalan", "Prosedur Persetujuan Bersama"], "c": 1, "e": "Pembetulan (Pasal 16 UU KUP) dapat diajukan berkali-kali, berbeda dengan Pengurangan/Pembatalan (maksimal 2 kali, selain Pasal 36(1) huruf d) dan Prosedur Persetujuan Bersama (maksimal 1 kali).", "p": 0, "topic": "Upaya Hukum", "id": "pemeriksaan_q_75"}, {"q": "Prosedur Persetujuan Bersama (MAP) dapat diajukan oleh pihak-pihak berikut, KECUALI...", "o": ["WP dalam negeri", "Direktur Jenderal Pajak", "Pejabat berwenang negara/yurisdiksi mitra P3B", "Pengadilan Pajak"], "c": 3, "e": "MAP diajukan oleh WP dalam negeri, Dirjen Pajak, pejabat berwenang negara mitra P3B, atau WNI melalui Dirjen Pajak terkait perlakuan diskriminatif — bukan oleh Pengadilan Pajak.", "p": 0, "topic": "Prosedur Persetujuan Bersama", "id": "pemeriksaan_q_76"}, {"q": "Objek Gugatan ke Pengadilan Pajak antara lain pelaksanaan Surat Paksa, dengan jangka waktu pengajuan...", "o": ["14 hari sejak tanggal pelaksanaan penagihan", "30 hari sejak tanggal pelaksanaan penagihan", "3 bulan sejak tanggal pelaksanaan penagihan", "12 bulan sejak tanggal pelaksanaan penagihan"], "c": 0, "e": "Jangka waktu Gugatan terhadap pelaksanaan penagihan pajak adalah 14 hari sejak tanggal pelaksanaan penagihan, sedangkan untuk objek gugatan lainnya 30 hari sejak diterimanya keputusan yang digugat.", "p": 0, "topic": "Gugatan", "id": "pemeriksaan_q_77"}, {"q": "Peninjauan Kembali (PK) ke Mahkamah Agung dapat diajukan paling banyak...", "o": ["1 kali", "2 kali", "3 kali", "Tanpa batas"], "c": 0, "e": "Permohonan PK sebagai upaya hukum luar biasa diajukan maksimal 1 kali sesuai Pasal 89 UU Pengadilan Pajak.", "p": 0, "topic": "Peninjauan Kembali", "id": "pemeriksaan_q_78"}, {"q": "Salah satu alasan pengajuan Peninjauan Kembali adalah...", "o": ["WP tidak puas dengan nominal pajak", "Putusan Pengadilan Pajak didasarkan pada kebohongan/tipu muslihat pihak lawan yang diketahui setelah putusan", "WP ingin mengulang proses persidangan", "Terdapat perubahan peraturan setelah putusan"], "c": 1, "e": "Salah satu dari 5 alasan PK adalah putusan Pengadilan Pajak didasarkan pada kebohongan atau tipu muslihat pihak lawan yang diketahui setelah perkara diputus, atau didasarkan bukti yang kemudian dinyatakan palsu oleh hakim pidana.", "p": 0, "topic": "Peninjauan Kembali", "id": "pemeriksaan_q_79"}, {"q": "WP yang ditunjuk sebagai Pihak Lain yang bertempat kedudukan di luar Daerah Pabean dan memilih melaksanakan kewajiban PPN PMSE menggunakan mata uang tertentu, wajib mengisi SPT Masa PPN menggunakan...", "o": ["Mata uang Rupiah saja", "Satuan mata uang dolar Amerika Serikat", "Mata uang negara asal", "Mata uang Euro"], "c": 1, "e": "WP yang ditunjuk sebagai Pihak Lain di luar Daerah Pabean dan memilih melaksanakan kewajiban PPN PMSE menggunakan dolar AS wajib mengisi SPT Masa PPN menggunakan satuan mata uang dolar Amerika Serikat.", "p": 0, "topic": "Mata Uang Dolar AS", "id": "pemeriksaan_q_80"}, {"q": "SPT yang digunakan WP untuk melaporkan perhitungan dan/atau pembayaran pajak, objek pajak, serta harta dan kewajiban terdiri dari 3 jenis, yaitu...", "o": ["SPT Masa, SPT Tahunan, dan SPOP", "SPT Masa dan SPT Tahunan saja", "SPOP dan SPT Masa saja", "SPT Elektronik dan SPT Manual"], "c": 0, "e": "Berdasarkan PMK 81/2024, jenis SPT terdiri dari SPT Masa (PPh, PPN, Bea Meterai, Pajak Karbon), SPT Tahunan (PPh 1 Tahun Pajak/Bagian Tahun Pajak, Pajak Karbon Tahunan), dan SPOP.", "p": 0, "topic": "Jenis dan Bentuk SPT", "id": "pemeriksaan_q_81"}, {"q": "Jangka waktu perpanjangan penyampaian SPT Tahunan PPh paling lama adalah...", "o": ["1 bulan sejak batas waktu penyampaian SPT Tahunan", "2 bulan sejak batas waktu penyampaian SPT Tahunan", "3 bulan sejak batas waktu penyampaian SPT Tahunan", "6 bulan sejak batas waktu penyampaian SPT Tahunan"], "c": 1, "e": "WP dapat memperpanjang jangka waktu penyampaian SPT Tahunan PPh paling lama 2 bulan sejak batas waktu penyampaian SPT Tahunan, dengan menyampaikan Pemberitahuan Perpanjangan.", "p": 0, "topic": "Perpanjangan SPT", "id": "pemeriksaan_q_82"}, {"q": "WP dapat membetulkan SPT dengan menyampaikan pernyataan tertulis, dengan syarat DJP belum melakukan...", "o": ["Penelitian SPT", "Pemeriksaan atau Pemeriksaan Bukti Permulaan secara terbuka", "Konfirmasi data", "Pengawasan"], "c": 1, "e": "Syarat pembetulan SPT: DJP belum melakukan Pemeriksaan atau Pemeriksaan Bukti Permulaan secara terbuka terhadap WP yang bersangkutan.", "p": 0, "topic": "Pembetulan SPT", "id": "pemeriksaan_q_83"}, {"q": "Pembetulan SPT yang menyebabkan rugi atau lebih bayar dapat dilakukan paling lama...", "o": ["1 tahun sebelum daluwarsa", "2 tahun sebelum daluwarsa", "3 tahun sebelum daluwarsa", "5 tahun sebelum daluwarsa"], "c": 1, "e": "Pembetulan SPT yang mengakibatkan rugi atau lebih bayar dapat dilakukan paling lama 2 tahun sebelum daluwarsa penetapan; selain itu dapat dilakukan sampai daluwarsa.", "p": 0, "topic": "Pembetulan SPT", "id": "pemeriksaan_q_84"}, {"q": "WP yang membetulkan SPT sehingga utang pajak menjadi lebih besar dikenai sanksi administrasi berupa bunga sesuai Pasal 8 UU KUP, dengan tarif...", "o": ["Suku bunga acuan + 5% dibagi 12", "Suku bunga acuan + 10% dibagi 12", "Suku bunga acuan + 15% dibagi 12", "Suku bunga acuan + 20% dibagi 12"], "c": 0, "e": "Sanksi bunga pembetulan SPT yang mengakibatkan utang pajak lebih besar dihitung dengan tarif suku bunga acuan ditambah 5%, dibagi 12.", "p": 0, "topic": "Sanksi Pembetulan SPT", "id": "pemeriksaan_q_85"}, {"q": "Objek Pajak Penghasilan menurut Pasal 4 ayat (1) UU PPh adalah...", "o": ["Hanya penghasilan dari pekerjaan", "Setiap tambahan kemampuan ekonomis yang diterima/diperoleh WP, dari Indonesia maupun luar Indonesia", "Hanya penghasilan dari usaha", "Hanya penghasilan berupa uang tunai"], "c": 1, "e": "Objek PPh adalah setiap tambahan kemampuan ekonomis yang diterima/diperoleh WP, baik berasal dari Indonesia maupun luar Indonesia, yang dapat dipakai untuk konsumsi atau menambah kekayaan.", "p": 0, "topic": "Objek PPh", "id": "pemeriksaan_q_86"}, {"q": "Manakah berikut yang TERMASUK dalam penghasilan yang DIKECUALIKAN dari objek pajak menurut Pasal 4 ayat (3) UU PPh?", "o": ["Penghasilan dari pekerjaan", "Hibah tertentu dan bantuan/sumbangan tertentu", "Penghasilan dari modal", "Penghasilan dari pengalihan harta"], "c": 1, "e": "Pasal 4 ayat (3) UU PPh mengecualikan antara lain bantuan/sumbangan tertentu, hibah tertentu, penerimaan asuransi tertentu, dividen tertentu (dengan syarat), dan imbalan bunga obligasi negara.", "p": 0, "topic": "Bukan Objek Pajak", "id": "pemeriksaan_q_87"}, {"q": "Timeline pelaporan pengukuhan PKP: jika WP wajib lapor PKP maksimal akhir tahun buku namun terlambat, maka mulai kewajiban PKP ditetapkan...", "o": ["Secara jabatan atau dianggap terlambat, mulai Masa Pajak pertama Tahun Buku berikutnya", "Sejak omzet melebihi Rp4,8 miliar", "Sejak awal tahun buku berjalan", "Sejak tanggal pendirian usaha"], "c": 0, "e": "Default mulai kewajiban PKP adalah Masa Pajak pertama Tahun Buku berikutnya; jika WP wajib lapor namun terlambat atau tidak lapor, pengukuhan dilakukan secara jabatan atau dianggap terlambat dengan mulai kewajiban yang sama.", "p": 0, "topic": "Timeline Pengukuhan PKP", "id": "pemeriksaan_q_88"}, {"q": "Kegiatan Membangun Sendiri (KMS) yang dikenai PPN menurut Pasal 16C UU PPN mensyaratkan luas bangunan minimal...", "o": ["100 m2", "150 m2", "200 m2", "500 m2"], "c": 2, "e": "KMS dikenai PPN jika luas bangunan minimal 200 m2, dilakukan tidak dalam kegiatan usaha/pekerjaan, hasilnya digunakan sendiri/pihak lain, diatur dalam PMK-61/PMK.03/2022.", "p": 0, "topic": "Kegiatan Membangun Sendiri", "id": "pemeriksaan_q_89"}, {"q": "PPN terutang atas Kegiatan Membangun Sendiri (KMS) dihitung dengan formula...", "o": ["11% x DPP penuh", "20% x 11% x Biaya Pembangunan (tidak termasuk tanah)", "0,5% x Peredaran Bruto", "10% x Nilai Bangunan"], "c": 1, "e": "PPN terutang atas KMS dihitung 20% x 11% x Biaya Pembangunan tidak termasuk harga tanah, dengan saat terutang mulai dibangun sampai selesai.", "p": 0, "topic": "Kegiatan Membangun Sendiri", "id": "pemeriksaan_q_90"}, {"q": "Jasa Maklon yang diekspor dapat dikenai PPN tarif 0% dengan salah satu syarat...", "o": ["Spesifikasi dan bahan baku disediakan oleh Penerima Ekspor JKP", "Jasa dilakukan di luar Daerah Pabean", "Bahan baku dibeli dari luar negeri", "Hasil produksi dijual di dalam negeri"], "c": 0, "e": "Salah satu syarat Jasa Maklon yang diekspor: spesifikasi dan bahan baku/bahan setengah jadi disediakan oleh Penerima Ekspor JKP, kepemilikan BKP hasil berada pada Penerima Ekspor JKP, dan BKP dikirim ke luar Daerah Pabean dengan mekanisme ekspor barang.", "p": 0, "topic": "Ekspor Jasa Kena Pajak", "id": "pemeriksaan_q_91"}, {"q": "Jenis Jasa Kena Pajak yang melekat pada barang tidak bergerak yang berada di luar Daerah Pabean, sebagaimana diatur PMK 32/PMK.010/2019, adalah...", "o": ["Jasa Maklon", "Jasa Konsultansi Konstruksi (pengkajian, perencanaan, perancangan bangunan di luar Daerah Pabean)", "Jasa teknologi informasi", "Jasa perawatan dan perbaikan"], "c": 1, "e": "Jasa Konsultansi Konstruksi meliputi pengkajian, perencanaan, dan perancangan bangunan/rencana bangunan yang berada di luar Daerah Pabean, termasuk kategori jasa yang melekat pada barang tidak bergerak.", "p": 0, "topic": "Ekspor Jasa Kena Pajak", "id": "pemeriksaan_q_92"}, {"q": "Jasa teknologi dan informasi yang dapat diekspor dengan tarif PPN 0% antara lain mencakup, KECUALI...", "o": ["Layanan analisis sistem komputer", "Layanan keamanan teknologi informasi (IT security)", "Layanan komputasi awan (cloud computing) dengan server berada di dalam Daerah Pabean", "Penjualan properti fisik di dalam negeri"], "c": 3, "e": "Penjualan properti fisik di dalam negeri bukan termasuk kategori jasa teknologi dan informasi yang dapat diekspor; jasa teknologi informasi mencakup layanan terkait sistem komputer, keamanan IT, hingga cloud computing.", "p": 0, "topic": "Jasa Teknologi dan Interkoneksi", "id": "pemeriksaan_q_93"}, {"q": "Agar kegiatan pelayanan JKP dikenai PPN tarif 0% sebagai ekspor jasa, harus didasarkan atas...", "o": ["Persetujuan lisan antara PKP dan Penerima Ekspor JKP", "Perikatan/perjanjian tertulis yang mencantumkan jenis, rincian kegiatan, dan nilai penyerahan JKP, disertai bukti pembayaran", "Faktur penjualan saja", "Surat keterangan domisili dari negara penerima"], "c": 1, "e": "Syarat ekspor JKP dikenai PPN 0%: didasarkan perikatan/perjanjian tertulis yang mencantumkan jenis, rincian kegiatan, dan nilai penyerahan JKP, serta terdapat pembayaran disertai bukti pembayaran yang sah.", "p": 0, "topic": "Syarat Ekspor JKP", "id": "pemeriksaan_q_94"}, {"q": "Rumus umum untuk menghitung Pajak Pertambahan Nilai menurut Pasal 8A ayat (1) UU PPN adalah...", "o": ["PPN = Tarif x DPP", "PPN = DPP / Tarif", "PPN = Peredaran Bruto x 0,5%", "PPN = Laba Kena Pajak x Tarif"], "c": 0, "e": "Formula umum penghitungan PPN sesuai Pasal 8A ayat (1) UU PPN adalah PPN = Tarif x Dasar Pengenaan Pajak (DPP).", "p": 0, "topic": "Formula PPN", "id": "pemeriksaan_q_95"}, {"q": "Pajak Masukan menurut Pasal 1 angka 24 UU PPN adalah PPN yang seharusnya sudah dibayar oleh PKP karena, KECUALI...", "o": ["Perolehan BKP dan/atau JKP", "Pemanfaatan BKP Tidak Berwujud/JKP dari luar Daerah Pabean", "Impor BKP", "Penjualan BKP kepada konsumen akhir"], "c": 3, "e": "Pajak Masukan timbul dari perolehan BKP/JKP, pemanfaatan BKP Tidak Berwujud/JKP dari luar Daerah Pabean, dan impor BKP — bukan dari penjualan (yang menimbulkan Pajak Keluaran).", "p": 0, "topic": "Pajak Masukan", "id": "pemeriksaan_q_96"}]}, "pengawasan": {"file": "pengawasan", "label": "Pengawasan", "ringkasan": [{"heading": "Penghapusan Wajib Pajak Badan — Batas Waktu Keputusan", "p": 1, "page": "hlm 259", "html": "<p>Permohonan penghapusan NPWP Wajib Pajak Badan harus diputuskan oleh Kepala KPP paling lama <strong>1 (satu) bulan</strong> setelah jangka waktu penyelesaian berakhir.</p><p><strong>Apabila jangka waktu tersebut terlampaui dan Kepala KPP tidak memberikan keputusan, permohonan penghapusan WP dianggap dikabulkan</strong> (deemed approval) dan Kepala KPP wajib menerbitkan Surat Keputusan Penghapusan NPWP paling lama 1 bulan setelah jangka waktu berakhir.</p>", "id": "pengawasan_r_0"}, {"heading": "PPN atas Kegiatan Membangun Sendiri (KMS) — Pengenaan Tanpa Pengurangan Biaya", "p": 1, "page": "hlm 443", "html": "<p>PMK 61/PMK.03/2022 menegaskan bahwa PPN KMS dikenakan <strong>tanpa pengurangan biaya-biaya administrasi</strong> dari total biaya membangun yang menjadi dasar pengenaan pajak.</p>", "id": "pengawasan_r_1"}, {"heading": "PPN KMS — Batas Waktu Penyetoran", "p": 1, "page": "hlm 443", "html": "<p>PPN atas Kegiatan Membangun Sendiri wajib disetor <strong>paling lambat pada akhir bulan berikutnya</strong> setelah berakhirnya masa pajak dibangunnya bangunan tersebut.</p>", "id": "pengawasan_r_2"}, {"heading": "PPN KMS — Pengecualian bagi Pihak yang Membangunkan untuk Pihak Lain", "p": 1, "page": "hlm 517", "html": "<p>PMK 61/PMK.03/2022 memberikan pengecualian dari kewajiban PPN KMS <strong>sepanjang pihak yang membangunkan memberikan data/informasi paling sedikit berupa identitas dan alamat pihak lain yang sesungguhnya membangun bangunan tersebut</strong> kepada DJP — tanggung jawab PPN KMS beralih ke pihak yang sebenarnya membangun.</p>", "id": "pengawasan_r_3"}, {"heading": "Fasilitas Tax Allowance — Bentuk Fasilitas dan Wajib Pajak yang Berhak", "p": 1, "page": "hlm 578 (Pasal 408, PMK 11/PMK.010/2020)", "html": "<p>Fasilitas Tax Allowance (PPh Pasal 31A UU PPh) berupa pengurangan penghasilan neto, penyusutan/amortisasi dipercepat, perpanjangan kompensasi kerugian, dan penurunan tarif PPh atas dividen bagi WPLN. Diberikan kepada WP Badan yang melakukan penanaman modal di bidang usaha tertentu dan/atau daerah tertentu yang mendapat prioritas tinggi secara nasional.</p>", "id": "pengawasan_r_4"}, {"heading": "Larangan Pemanfaatan Fasilitas Tax Allowance atas Aktiva", "p": 1, "page": "hlm 599 (Pasal 421, PMK 11/PMK.010/2020)", "html": "<p><strong>Aktiva tetap berwujud dan aktiva tak berwujud yang telah mendapatkan fasilitas Tax Allowance dilarang</strong> dialihkan/digunakan untuk tujuan selain yang diberikan fasilitas dalam jangka waktu tertentu — pelanggaran mengakibatkan fasilitas dicabut dan dikenakan sanksi.</p>", "id": "pengawasan_r_5"}, {"heading": "Larangan Serupa pada PMK 16/PMK.010/2020 (Tax Holiday)", "p": 1, "page": "hlm 609 (Pasal 429)", "html": "<p>Ketentuan larangan pengalihan aktiva tetap berwujud yang mendapat fasilitas berlaku serupa pada rezim <strong>Tax Holiday</strong> (PMK 16/PMK.010/2020) — konsisten dengan prinsip bahwa fasilitas fiskal terikat pada penggunaan aktiva sesuai tujuan pemberian fasilitas.</p>", "id": "pengawasan_r_6"}, {"heading": "Fasilitas Litbang — Pengecualian Kontrak Bagi Hasil/Kontrak Karya", "p": 1, "page": "hlm 614 (Pasal 434 & 437, PMK 153/PMK.010/2020)", "html": "<p>Fasilitas pengurangan penghasilan bruto untuk kegiatan penelitian dan pengembangan (litbang) <strong>tidak berlaku bagi Wajib Pajak badan dalam negeri yang menjalankan usaha berdasarkan kontrak bagi hasil, kontrak karya, atau perjanjian kerja sama pengusahaan pertambangan</strong> — karena rezim fiskal sektor tersebut sudah diatur tersendiri dalam kontrak/perjanjiannya.</p>", "id": "pengawasan_r_7"}, {"heading": "PMK-111/2025 — Ruang Lingkup Pengawasan (WP Terdaftar)", "p": 1, "page": "hlm 628 (Pasal 3)", "html": "<p>Pasal 3 PMK-111/2025 menegaskan ruang lingkup pengawasan kepatuhan mencakup kolom <strong>\"WP Terdaftar\"</strong> sebagai salah satu sasaran utama pengawasan kepatuhan — dibedakan dari pengawasan ekstensifikasi atas WP yang belum terdaftar. (Detail alur SP2DK/PMK-111 dibahas lebih lanjut pada materi Pengawasan bagian Ekstensifikasi.)</p>", "id": "pengawasan_r_8"}, {"heading": "NPWP dan Fungsinya", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 1 angka 6 & Pasal 2 ayat (1) UU KUP.</strong> NPWP adalah nomor identitas yang digunakan WP dalam administrasi pelaksanaan hak dan/atau pemenuhan kewajiban perpajakan. Setiap WP yang telah memenuhi syarat subjektif dan objektif wajib mendaftarkan diri pada KPP yang wilayah kerjanya meliputi tempat tinggal/kedudukan WP.</p>", "page": "hlm 6", "id": "pengawasan_r_9"}, {"heading": "NPWP bagi Wanita Kawin & Anak Belum Dewasa", "p": 0, "html": "<p>Wanita kawin & anak belum dewasa <strong>tidak dapat mendaftarkan NPWP atas nama sendiri</strong>. Wanita kawin menggunakan NPWP suami jika menghendaki penggabungan (NPWP sendiri dihapuskan) atau suami meninggal meninggalkan warisan belum terbagi. Menggunakan NPWP sendiri jika: hidup terpisah berdasarkan putusan hakim, pisah harta/penghasilan tertulis, menghendaki pemisahan kewajiban perpajakan, bercerai, menikah setelah suami meninggal (warisan belum terbagi), atau warisan telah selesai dibagi. Anak <18 tahun menggunakan NPWP orang tua.</p>", "page": "hlm 7-8", "id": "pengawasan_r_10"}, {"heading": "Kewajiban NPWP bagi Warisan Belum Terbagi (WBT)", "p": 0, "html": "<p>WBT menggunakan NPWP dari WP OP yang meninggalkan warisan tersebut. Jika WP OP tersebut belum memiliki NPWP, wakil WBT wajib mendaftarkan diri pada KPP.</p>", "page": "hlm 9", "id": "pengawasan_r_11"}, {"heading": "Pendaftaran NPWP dan Pengukuhan PKP", "p": 0, "html": "<p>Pendaftaran NPWP dapat dilakukan <strong>secara elektronik</strong> (mengisi formulir + unggah dokumen) atau <strong>secara tertulis</strong> (mengisi formulir + lampiran dokumen, disampaikan langsung/pos/kurir). Pengukuhan PKP: pengusaha (kecuali pengusaha kecil) wajib lapor secara elektronik atau secara jabatan; penelitian kelengkapan permohonan tertulis memakan waktu 1 hari kerja.</p>", "page": "hlm 10-11", "id": "pengawasan_r_12"}, {"heading": "Jangka Waktu Pendaftaran NPWP dan Pengukuhan PKP", "p": 0, "html": "<p>Orang pribadi: paling lama akhir bulan berikutnya setelah penghasilan WP melebihi PTKP, atau 1 bulan setelah kegiatan usaha/pekerjaan bebas dimulai. <strong>Badan:</strong> paling lama 1 bulan setelah saat pendirian. <strong>Instansi Pemerintah:</strong> sebelum melakukan pemotongan/pemungutan pajak. <strong>Warisan Belum Terbagi:</strong> akhir bulan berikutnya setelah pewaris meninggal. <strong>PKP:</strong> akhir bulan berikutnya setelah peredaran bruto melebihi batasan pengusaha kecil.</p>", "page": "hlm 12", "id": "pengawasan_r_13"}, {"heading": "Pencabutan Pengukuhan PKP", "p": 0, "html": "<p>Dilakukan jika PKP pindah alamat ke wilayah kerja KPP lain atau sudah tidak memenuhi syarat PKP, baik atas permohonan WP maupun secara jabatan (melalui pemeriksaan/penelitian). Dirjen Pajak harus memberikan keputusan atas permohonan pencabutan dalam jangka waktu <strong>6 bulan</strong> sejak permohonan diterima lengkap.</p>", "page": "hlm 13", "id": "pengawasan_r_14"}, {"heading": "Penerapan NIK sebagai NPWP", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 2 ayat (1a) UU KUP, PMK-112/PMK.03/2022 stdd PMK-136/PMK.03/2023.</strong> NPWP OP penduduk = NIK; NPWP Badan/Instansi Pemerintah/OP bukan penduduk = 16 digit angka; NPWP Cabang = NITKU (Nomor Identitas Tempat Kegiatan Usaha). Berlaku sejak 14 Juli 2022, penerapan penuh 1 Juli 2024.</p>", "page": "hlm 14-15", "id": "pengawasan_r_15"}, {"heading": "Definisi Pembukuan dan Pencatatan", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 1 angka 29, Pasal 28 ayat (7) & (9) UU KUP.</strong> Pembukuan = proses pencatatan teratur untuk mengumpulkan data harta, kewajiban, modal, penghasilan dan biaya, ditutup dengan laporan keuangan (neraca & laba rugi). Pencatatan = data yang dikumpulkan teratur tentang peredaran/penerimaan bruto dan/atau penghasilan bruto sebagai dasar menghitung pajak terutang.</p>", "page": "hlm 17", "id": "pengawasan_r_16"}, {"heading": "Kewajiban Pembukuan/Pencatatan & Penyimpanan Dokumen", "p": 0, "html": "<p>WP OP kegiatan usaha/pekerjaan bebas & Badan wajib menyelenggarakan pembukuan, termasuk hasil pengolahan data elektronik, disimpan 10 tahun di Indonesia. Pengecualian: WP OP memilih NPPN, WP OP tanpa kegiatan usaha/pekerjaan bebas, atau WP OP kriteria tertentu berdasarkan peredaran bruto (PMK 54/PMK.03/2021).</p>", "page": "hlm 18", "id": "pengawasan_r_17"}, {"heading": "Ketentuan Pembukuan dan Pencatatan", "p": 0, "html": "<p><strong>Pembukuan:</strong> iktikad baik & mencerminkan keadaan sebenarnya; diselenggarakan di Indonesia, huruf Latin, angka Arab, Rupiah, bahasa Indonesia/asing yang diizinkan; taat asas dengan Stelsel Akrual/Kas; berdasarkan SAK kecuali ketentuan perpajakan lain. <strong>Pencatatan:</strong> prinsip serupa namun lebih sederhana, disusun kronologis & sistematis.</p>", "page": "hlm 19", "id": "pengawasan_r_18"}, {"heading": "Ketentuan Penyimpanan Dokumen Dasar Pembukuan/Pencatatan", "p": 0, "html": "<p>Buku, catatan, dokumen termasuk dokumen terkait transaksi hubungan istimewa (dokumen TP) wajib disimpan <strong>10 tahun</strong> di tempat kegiatan/tempat tinggal WP OP atau tempat kedudukan WP Badan yang berada di Indonesia.</p>", "page": "hlm 20", "id": "pengawasan_r_19"}, {"heading": "Sarana dan Batas Waktu Pembayaran Pajak", "p": 0, "html": "<p>Dasar hukum: <strong>PMK-242/PMK.03/2014 s.t.d.d. PMK-18/PMK.03/2021.</strong> Pembayaran via SSP ke kas negara melalui Bank/Pos Persepsi (loket/elektronik). Batas waktu: tgl 10 bulan berikutnya untuk PPh 4(2)/15/21/23/26 yang dipotong, PPh 22 WP badan tertentu; tgl 15 bulan berikutnya untuk PPh 4(2)/15 dibayar sendiri, PPh 25, PPN atas pemanfaatan BKPTB/JKP luar negeri, PPN KMS.</p>", "page": "hlm 22-23", "id": "pengawasan_r_20"}, {"heading": "Batas Waktu Pembayaran Pajak atas Transaksi Khusus", "p": 0, "html": "<p>PPh 4(2) atas pengalihan tanah/bangunan: sebelum akta/perjanjian ditandatangani. PPh 22/PPN impor: bersamaan bea masuk atau 1 hari setelah pemungutan (jika dipungut DJBC). Pemungutan oleh Pejabat Penandatangan SPM (mekanisme LS): pada hari yang sama. Bendahara Pengeluaran (mekanisme UP): 7 hari setelah pembayaran. PPh 25 kriteria tertentu Pasal 3(3b): akhir masa pajak terakhir. SPT Masa PPN/Tahunan: sebelum SPT disampaikan.</p>", "page": "hlm 24", "id": "pengawasan_r_21"}, {"heading": "Sanksi Administrasi Keterlambatan Pembayaran Pajak", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 9 ayat (2a) & (2b) UU KUP.</strong> Sanksi bunga per bulan = suku bunga acuan + uplift factor <strong>5%</strong>, dibagi 12, paling lama <strong>24 bulan</strong>. Masa: dihitung sejak JT pembayaran s.d. tanggal pembayaran. SPT Tahunan: dihitung sejak berakhirnya batas waktu penyampaian SPT Tahunan s.d. tanggal pembayaran. Formula: Pajak Kurang Bayar × Tarif Bunga per Bulan × Jumlah Bulan.</p>", "page": "hlm 25", "id": "pengawasan_r_22"}, {"heading": "Batas Waktu Pembayaran STP, Ketetapan dan Keputusan", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 9 ayat (3) UU KUP.</strong> STP, SKPKB, SKPKBT, SK Keberatan, SK Pembetulan, Putusan Banding, Putusan PK harus dibayar paling lama <strong>1 bulan</strong> sejak tanggal diterbitkan. Kecuali WP usaha kecil & WP di daerah tertentu, dapat diperpanjang maksimal <strong>2 bulan</strong> berdasarkan PMK.</p>", "page": "hlm 26", "id": "pengawasan_r_23"}, {"heading": "Pengangsuran atau Penundaan Pembayaran Pajak", "p": 0, "html": "<p>WP dapat mengajukan permohonan mengangsur/menunda pembayaran untuk PPh Pasal 29 (pengajuan paling lama saat SPT Tahunan disampaikan, pemberian angsuran paling lama sampai batas waktu SPT PPh tahun berikutnya) atau STP/SKPKB/SKPKBT/SK Keberatan/SK Pembetulan/Putusan Banding/PK yang menambah pajak terutang (pengajuan sebelum Surat Paksa disampaikan, pemberian paling lama 24 bulan sejak keputusan diterbitkan).</p>", "page": "hlm 27", "id": "pengawasan_r_24"}, {"heading": "Sanksi Administrasi atas Angsuran/Penundaan & Keterlambatan Ketetapan", "p": 0, "html": "<p>Sanksi bunga per bulan (suku bunga acuan + uplift sesuai jenis), dihitung dari JT s.d. tanggal pembayaran/penerbitan STP, paling lama 24 bulan. Untuk angsuran/penundaan: sanksi bunga per bulan ditetapkan terpisah (kecuali SPPT/SKP PBB/STP PBB).</p>", "page": "hlm 28", "id": "pengawasan_r_25"}, {"heading": "Batas Waktu Bertepatan dengan Hari Libur (Pembayaran)", "p": 0, "html": "<p>Hari libur termasuk Sabtu, hari libur nasional, hari libur Pemilu, dan cuti bersama nasional. Jika batas waktu pembayaran/penyetoran jatuh pada hari libur, pembayaran dapat dilakukan pada hari kerja berikutnya.</p>", "page": "hlm 29", "id": "pengawasan_r_26"}, {"heading": "SPT dan Fungsinya", "p": 0, "html": "<p>Dasar hukum: <strong>PMK-243/PMK.03/2014 s.t.d.t.d. PMK-18/PMK.03/2021.</strong> SPT = surat untuk melaporkan penghitungan/pembayaran pajak, objek/bukan objek pajak, dan/atau harta-kewajiban. Jenis: SPT Masa (PPh 21/26, Unifikasi PPh 4(2)/15/22/23/26, PPN, PPN Pemungut, Bea Meterai) dan SPT Tahunan (PPh 1 Tahun Pajak/Bagian Tahun Pajak). Bentuk: hardcopy atau dokumen elektronik.</p>", "page": "hlm 31", "id": "pengawasan_r_27"}, {"heading": "Kewajiban Mengisi, Menandatangani, Menyampaikan SPT", "p": 0, "html": "<p>WP (atau Wakil/Kuasa) wajib mengisi SPT dengan <strong>benar, lengkap, jelas</strong> dalam bahasa Indonesia, huruf Latin, angka Arab, Rupiah; menandatangani; dan menyampaikan ke tempat terdaftar/dikukuhkan. Benar = benar hitung & penerapan ketentuan; lengkap = memuat semua unsur objek pajak; jelas = melaporkan asal-usul objek pajak.</p>", "page": "hlm 32", "id": "pengawasan_r_28"}, {"heading": "Penandatanganan dan Penyampaian SPT", "p": 0, "html": "<p>SPT ditandatangani WP atau Kuasa WP (tanda tangan biasa/stempel/elektronik). Penyampaian: langsung (KPP/KP2KP), pos (dengan bukti pengiriman), atau cara lain (jasa ekspedisi dengan bukti, e-filing DJP, penyalur SPT elektronik/PJAP).</p>", "page": "hlm 33-34", "id": "pengawasan_r_29"}, {"heading": "Batas Waktu Penyampaian SPT", "p": 0, "html": "<p>SPT Tahunan PPh OP: <strong>3 bulan</strong> setelah akhir Tahun Pajak. SPT Tahunan PPh Badan: <strong>4 bulan</strong> setelah akhir Tahun Pajak. SPT Masa PPh 4(2)/15/21-26/22 & PPh 25: <strong>20 hari</strong> setelah akhir Masa Pajak. SPT Masa PPN: <strong>akhir bulan berikutnya.</strong> Pengecualian pelaporan SPT Masa berlaku jika PPh 21/26 nihil (selain Desember) dan angsuran PPh 25 nihil.</p>", "page": "hlm 35", "id": "pengawasan_r_30"}, {"heading": "Batas Waktu Pelaporan Khusus (PMK 243/2014 Pasal 11)", "p": 0, "html": "<p>PPh Pasal 22 & PPN/PPnBM atas impor: paling lama hari kerja terakhir minggu berikutnya. PPN KMS oleh OP/Badan Non-PKP & PPN atas pemanfaatan BKPTB/JKP luar negeri oleh OP/Badan Non-PKP: dianggap telah melapor dengan melakukan pembayaran tervalidasi NTPN, akhir bulan berikutnya.</p>", "page": "hlm 36", "id": "pengawasan_r_31"}, {"heading": "SPT Dianggap Tidak Disampaikan", "p": 0, "html": "<p>SPT dianggap tidak disampaikan jika: (1) tidak ditandatangani; (2) tidak sepenuhnya dilampiri keterangan/dokumen yang disyaratkan; (3) SPT Lebih Bayar disampaikan setelah 3 tahun sesudah berakhirnya Masa/Bagian Tahun/Tahun Pajak dan WP telah ditegur tertulis; (4) disampaikan setelah dilakukan pemeriksaan atau diterbitkan SKP.</p>", "page": "hlm 41", "id": "pengawasan_r_32"}, {"heading": "Perpanjangan Penyampaian SPT Tahunan", "p": 0, "html": "<p>WP dapat memperpanjang penyampaian SPT Tahunan PPh paling lama <strong>2 bulan</strong> sejak batas waktu, dengan menyampaikan Pemberitahuan Perpanjangan (formulir kertas/elektronik) sebelum batas waktu berakhir, dilampiri penghitungan sementara pajak terutang, laporan keuangan sementara, dan SSP/Bukti Penerimaan Negara (jika kurang bayar).</p>", "page": "hlm 42", "id": "pengawasan_r_33"}, {"heading": "Sanksi Administrasi Telat/Tidak Lapor SPT", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 7 ayat (1) UU KUP.</strong> SPT Masa PPN: Rp500.000. SPT Masa lainnya: Rp100.000. SPT Tahunan PPh OP: Rp100.000. SPT Tahunan PPh Badan: Rp1.000.000.</p>", "page": "hlm 43", "id": "pengawasan_r_34"}, {"heading": "Pembetulan SPT", "p": 0, "html": "<p>WP dapat membetulkan SPT dengan pernyataan tertulis sepanjang <strong>belum dilakukan pemeriksaan</strong> atau pemeriksaan bukti permulaan secara terbuka. Jika pembetulan menyatakan rugi/lebih bayar: paling lama <strong>2 tahun sebelum daluwarsa</strong>; jika tidak, dapat dilakukan sampai daluwarsa.</p>", "page": "hlm 44", "id": "pengawasan_r_35"}, {"heading": "Sanksi Karena Pembetulan SPT", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 8 UU KUP.</strong> Pembetulan SPT yang mengakibatkan utang pajak lebih besar dikenai sanksi bunga = Pajak Kurang Bayar × tarif bunga per bulan (suku bunga acuan + 5%, dibagi 12) × jumlah bulan.</p>", "page": "hlm 45", "id": "pengawasan_r_36"}, {"heading": "Pembetulan SPT karena Menerima Ketetapan/Keputusan/Putusan", "p": 0, "html": "<p>Jika WP menerima SKP/SK Keberatan/SK Pembetulan/Putusan Banding/PK yang menyatakan rugi fiskal berbeda dari yang telah dikompensasikan di SPT Tahunan atas Tahun Pajak sebelumnya: WP dapat membetulkan SPT dalam 3 bulan (syarat: belum diperiksa); jika tidak dibetulkan, Dirjen Pajak menghitung ulang kompensasi kerugian secara jabatan.</p>", "page": "hlm 46", "id": "pengawasan_r_37"}, {"heading": "Dasar Hukum dan Konsep PPh", "p": 0, "html": "<p>UU PPh: UU 7/1983 s.t.d.t.d. terakhir UU 6/2023. Karakteristik PPh: pajak subjektif (memperhatikan subjek pajak), pajak langsung, pajak pusat (administrasi di Pemerintah Pusat), self-assessment & withholding, bersifat progresif.</p>", "page": "hlm 2-3", "id": "pengawasan_r_38"}, {"heading": "Subjek Pajak PPh", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 2 UU PPh.</strong> Subjek PPh: Orang Pribadi (SPDN wajib NPWP/NIK kecuali di bawah PTKP; SPLN tidak memiliki NPWP/NIK), Warisan Belum Terbagi, Badan (PT, CV, firma, BUMN/BUMD, koperasi, yayasan, dll termasuk KIK & BUT), dan BUT (badan yang tidak didirikan/berkedudukan di Indonesia namun menjalankan usaha/kegiatan di Indonesia).</p>", "page": "hlm 4", "id": "pengawasan_r_39"}, {"heading": "SPDN vs SPLN dan Saat Mulai/Berakhir Kewajiban Subjektif", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 2 & 2A UU PPh.</strong> OP SPDN: tinggal di Indonesia, >183 hari dalam 12 bulan, atau berniat tinggal. Mulai: dilahirkan/berada/berniat tinggal di Indonesia; berakhir: meninggal dunia/meninggalkan Indonesia selamanya. Badan: mulai sejak didirikan/berkedudukan di Indonesia, berakhir saat dibubarkan.</p>", "page": "hlm 5", "id": "pengawasan_r_40"}, {"heading": "Non-Subjek Pajak PPh", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 2 & 3 UU PPh.</strong> Tidak termasuk Subjek PPh: kantor perwakilan negara asing, pejabat diplomatik/konsulat (syarat: bukan WNI, tidak menerima penghasilan lain di Indonesia, asas timbal balik), organisasi internasional, dan unit tertentu dari badan pemerintah (dibentuk berdasarkan UU, dibiayai APBN/APBD, penerimaan masuk anggaran pusat/daerah, dibukukan oleh aparat pengawasan fungsional negara).</p>", "page": "hlm 6", "id": "pengawasan_r_41"}, {"heading": "Objek Pajak Penghasilan", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 4 ayat (1) UU PPh.</strong> Penghasilan = setiap tambahan kemampuan ekonomis yang diterima/diperoleh WP, baik dari Indonesia maupun luar Indonesia, dengan nama dan dalam bentuk apapun, yang dapat dipakai untuk konsumsi atau menambah kekayaan WP.</p>", "page": "hlm 7", "id": "pengawasan_r_42"}, {"heading": "Karakteristik PPh Final", "p": 0, "html": "<p>Penghasilan tidak digabung dengan penghasilan tarif umum; tarif bersifat khusus; terutang setiap transaksi; dipotong/dipungut pihak lain atau disetor sendiri; tidak dapat dikreditkan; biayanya tidak dapat dikurangkan; tetap dikenakan walau rugi usaha. Pertimbangan pengenaan: dorongan investasi, kesederhanaan pemungutan, pemerataan.</p>", "page": "hlm 8", "id": "pengawasan_r_43"}, {"heading": "Pengenaan PPh bagi WNA yang Telah Menjadi SPDN", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 4 ayat (1a)-(1c) UU PPh.</strong> WNA yang telah menjadi SPDN dikenai PPh hanya atas penghasilan dari Indonesia, dengan syarat: memiliki keahlian tertentu dan berlaku <strong>4 Tahun Pajak</strong> sejak menjadi SPDN. Tidak berlaku bagi WNA yang memanfaatkan P3B.</p>", "page": "hlm 9", "id": "pengawasan_r_44"}, {"heading": "Objek Pajak Penghasilan dengan Tarif Umum (Pasal 4 ayat 1)", "p": 0, "html": "<p>Mencakup a-t antara lain: penggantian/imbalan pekerjaan/jasa, hadiah undian, laba usaha, keuntungan penjualan/pengalihan harta, bunga, dividen, royalti, sewa, penerimaan pembayaran berkala, keuntungan pembebasan utang, selisih kurs, selisih penilaian kembali aktiva, premi asuransi, tambahan kekayaan neto dari penghasilan belum dikenai pajak, surplus Bank Indonesia.</p>", "page": "hlm 10", "id": "pengawasan_r_45"}, {"heading": "Penghasilan Final dan Bukan Objek Pajak (Pasal 4 ayat 2 & 3)", "p": 0, "html": "<p>Penghasilan bersifat final a.l.: bunga deposito/tabungan/obligasi/SUN, hadiah undian, transaksi saham, pengalihan tanah/bangunan, usaha peredaran bruto tertentu (PP). Bukan objek pajak a.l.: bantuan/sumbangan/zakat/hibah, warisan, setoran modal, natura/kenikmatan tertentu, dividen yang memenuhi syarat, iuran dana pensiun, beasiswa, sisa lebih lembaga nirlaba pendidikan/litbang.</p>", "page": "hlm 11", "id": "pengawasan_r_46"}, {"heading": "Objek Pajak BUT", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 5 UU PPh.</strong> 3 jenis atribusi penghasilan BUT: Atribusi Faktual (penghasilan dari usaha/harta yang dimiliki BUT), Atribusi Hubungan Efektif (penghasilan Pasal 26 sepanjang ada hubungan efektif dengan harta/kegiatan BUT), dan Atribusi Penarikan Paksa (penghasilan kantor pusat dari pemberian jasa/penjualan barang sejenis yang dilakukan di Indonesia - force of attraction).</p>", "page": "hlm 12", "id": "pengawasan_r_47"}, {"heading": "Biaya Fiskal (3M) dan Biaya Non-Fiskal", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 6 & 9 UU PPh.</strong> Biaya dapat dikurangkan (3M - mendapatkan, menagih, memelihara penghasilan): biaya langsung usaha, penyusutan/amortisasi, iuran dana pensiun, kerugian penjualan harta, kerugian selisih kurs, biaya litbang, sumbangan bencana/litbang/infrastruktur sosial/pendidikan/olahraga. Tidak dapat dikurangkan: pembagian laba/dividen, biaya pribadi pengurus, cadangan, PPh, sanksi administrasi/pidana, gaji ke firma/CV modal tak terbagi saham.</p>", "page": "hlm 13", "id": "pengawasan_r_48"}, {"heading": "Kompensasi Kerugian", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 6 ayat (2) UU PPh.</strong> Kompensasi horizontal: rugi dalam 1 tahun pajak dikompensasikan dengan penghasilan lain dalam tahun yang sama (kecuali rugi atas penghasilan final/non-objek atau rugi luar negeri). Kompensasi vertikal: kerugian fiskal dapat dikompensasikan selama <strong>5 tahun berturut-turut</strong> mulai tahun berikutnya setelah tahun kerugian.</p>", "page": "hlm 14", "id": "pengawasan_r_49"}, {"heading": "Penilaian Harta", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 10 UU PPh.</strong> Jual beli: harga perolehan/penjualan (jika ada hubungan istimewa: jumlah yang seharusnya; tanpa hubungan istimewa: jumlah sesungguhnya). Tukar menukar: harga pasar. Likuidasi/penggabungan/pemekaran: harga pasar kecuali ditetapkan lain Menkeu. Hibah/bantuan/warisan: nilai sisa buku pihak pengalih atau nilai pasar (jika bukan Pasal 4(3) huruf a/b).</p>", "page": "hlm 15", "id": "pengawasan_r_50"}, {"heading": "Penyusutan dan Amortisasi", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 11 & 11A UU PPh.</strong> Atas pengeluaran untuk 3M dengan masa manfaat >1 tahun. Metode: garis lurus atau saldo menurun (aktiva berwujud bukan bangunan; bangunan hanya garis lurus). 4 kelompok harta berwujud (4-20 tahun) & tak berwujud dengan tarif berbeda. Harta masa manfaat >20 tahun: WP dapat memilih masa manfaat 20 tahun atau sesuai pembukuan sebenarnya (berlaku sejak TP 2022).</p>", "page": "hlm 16-17", "id": "pengawasan_r_51"}, {"heading": "Cara Menghitung Penghasilan Kena Pajak", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 16 UU PPh.</strong> WPDN & BUT: Cara Biasa (Penghasilan Neto - Kompensasi Rugi - PTKP [WP OP] = PKP) atau Norma Penghitungan. WP Tertentu: Norma Penghitungan Khusus (Pasal 15). WPLN melalui BUT atau WPLN lainnya diatur terpisah.</p>", "page": "hlm 18-21", "id": "pengawasan_r_52"}, {"heading": "Tarif PPh (Pasal 17)", "p": 0, "html": "<p>Tarif Umum WP OP progresif: 5%/15%/25%/30%/35% (Pasal 17); WP Badan 22%. Tarif Khusus/Final: Pasal 4(2) dan Pasal 15. Fasilitas: PP-55/2022 Bab XI memberi penurunan tarif 3% bagi WP Badan DN Perseroan Terbuka (saham diperdagangkan di bursa efek); Pasal 31E memberi pengurangan 50% tarif bagi WP Badan peredaran bruto s.d. Rp50 miliar.</p>", "page": "hlm 22", "id": "pengawasan_r_53"}, {"heading": "Angsuran PPh Pasal 25", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 25 UU PPh.</strong> Angsuran bulanan = (PPh terutang menurut SPT Tahunan tahun lalu - PPh dipotong/dipungut Pasal 22/23 - PPh luar negeri Pasal 24) dibagi 12 atau banyaknya bulan dalam Bagian Tahun Pajak. Untuk bulan sebelum SPT Tahunan disampaikan = angsuran bulan terakhir tahun pajak lalu (Desember).</p>", "page": "hlm 23-24", "id": "pengawasan_r_54"}, {"heading": "Penetapan Angsuran Khusus oleh Dirjen Pajak/Menkeu (Pasal 25 ayat 6-7)", "p": 0, "html": "<p>Dirjen Pajak berwenang menetapkan angsuran bagi WP yang: berhak kompensasi rugi, penghasilan tidak teratur, SPT Tahunan terlambat, diberi perpanjangan SPT, membetulkan SPT (angsuran lebih besar), atau perubahan keadaan usaha (KEP-537/PJ/2000). Menkeu menetapkan bagi WP baru, Bank/BUMN/BUMD/WP masuk bursa, dan WP OPPT (PMK 215/PMK.03/2018).</p>", "page": "hlm 25", "id": "pengawasan_r_55"}, {"heading": "Perhitungan PPh Kurang/Lebih Bayar (Pasal 28-29)", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 28 & 29 UU PPh.</strong> PPh Terutang dikurangi kredit pajak (PPh 21/22/23/24/25/26(5)) menghasilkan Pasal 28A (PPh Lebih Bayar) atau Pasal 29 (PPh Kurang Bayar), dilaporkan dalam SPT Tahunan PPh.</p>", "page": "hlm 26", "id": "pengawasan_r_56"}, {"heading": "Fasilitas Pasal 31E", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 31E ayat (1) UU PPh, SE-02/PJ/2015.</strong> WP Badan DN peredaran bruto s.d. <strong>Rp50 miliar</strong> mendapat pengurangan tarif 50% dari tarif Pasal 17(1)b/(2a), atas PKP dari bagian peredaran bruto s.d. Rp4,8 miliar. Fasilitas otomatis (bukan pilihan), tidak berlaku bagi BUT/CV-firma modal tak terbagi saham/WP yang sudah dapat fasilitas lain.</p>", "page": "hlm 27-28", "id": "pengawasan_r_57"}, {"heading": "Pemajakan atas Penghasilan Keluarga", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 8 UU PPh.</strong> Keluarga = satu kesatuan ekonomis; penghasilan suami-istri-anak belum dewasa digabung, kepala keluarga bertanggung jawab, 1 NPWP a.n. kepala keluarga. Dikenai terpisah jika: hidup berpisah putusan hakim, perjanjian pisah harta tertulis, atau istri memilih menjalankan hak/kewajiban sendiri (wajib daftar NPWP).</p>", "page": "hlm 29", "id": "pengawasan_r_58"}, {"heading": "Besaran dan Notasi PTKP", "p": 0, "html": "<p>Rp54.000.000 (diri WP OP); +Rp4.500.000 (kawin); +Rp54.000.000 (istri penghasilan digabung); +Rp4.500.000/tanggungan (maks 3, keluarga sedarah/semenda garis lurus + anak angkat). Ditentukan kondisi awal tahun pajak. Notasi: TK/, K/, K/I/, HB/ (khusus PPh 21) diikuti jumlah tanggungan.</p>", "page": "hlm 31-33", "id": "pengawasan_r_59"}, {"heading": "PPh atas Penghasilan WP Peredaran Bruto Tertentu (PP 55/2022)", "p": 0, "html": "<p>Objek: peredaran bruto usaha tidak melebihi <strong>Rp4,8 miliar</strong>/tahun. Bukan objek: penghasilan jasa pekerjaan bebas, penghasilan luar negeri, penghasilan dikenai PPh Final lain, penghasilan dikecualikan. Subjek & jangka waktu: OP 7 tahun; Badan (PT) 3 tahun; CV/Firma/Koperasi/BUMDes/PT OP 4 tahun, dihitung sejak terdaftar (atau sejak TP 2018 bagi WP terdaftar sebelum PP berlaku).</p>", "page": "hlm 35-36", "id": "pengawasan_r_60"}, {"heading": "Tarif, Batasan, dan Pelunasan PPh Final UMKM", "p": 0, "html": "<p>PPh Final = <strong>0,5% × Peredaran Bruto</strong>. Khusus WP OP: atas peredaran bruto s.d. Rp500 juta setahun (dihitung kumulatif sejak masa pajak pertama) <strong>tidak dikenai PPh</strong>. Pelunasan: disetor sendiri via ATM/bank atau dipotong pihak lain dengan bukti potong (Bupot).</p>", "page": "hlm 37", "id": "pengawasan_r_61"}, {"heading": "Perlakuan Perpajakan Natura dan/atau Kenikmatan", "p": 0, "html": "<p>Dasar hukum: UU HPP. Natura (barang) dan kenikmatan (fasilitas/pelayanan) terkait hubungan pekerjaan/jasa merupakan <strong>objek pajak (taxable)</strong> bagi penerima, namun <strong>deductible</strong> bagi pemberi (dapat dikurangkan sepanjang untuk 3M). Dikecualikan dari objek: makan/minum bagi seluruh pegawai, natura di daerah tertentu, natura keharusan pekerjaan (K3/seragam), natura dari APBN/D/Desa, serta natura/kenikmatan jenis dan batasan tertentu (diatur PMK).</p>", "page": "hlm 39-40", "id": "pengawasan_r_62"}, {"heading": "Norma Penghitungan Penghasilan Neto (NPPN)", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 14 UU PPh.</strong> Digunakan jika tidak ada pembukuan yang lebih baik atau pembukuan/pencatatan diselenggarakan tidak benar. Syarat: hanya WP OP, peredaran bruto <Rp4,8 miliar setahun, memberitahukan Dirjen Pajak dalam 3 bulan pertama Tahun Pajak (jika tidak, dianggap memilih Pembukuan), wajib menyelenggarakan Pencatatan.</p>", "page": "hlm 42-43", "id": "pengawasan_r_63"}, {"heading": "Penerapan Norma saat Pemeriksaan", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 14(5) jo. Pasal 16(2) UU PPh, PMK 15/2018.</strong> Jika WP pembukuan/pencatatan diperiksa dan <strong>tidak meminjamkan</strong> buku/catatan atau <strong>tidak menyelenggarakan</strong> pembukuan/pencatatan, Penghasilan Neto dihitung dengan cara lain (Penetapan Peredaran Bruto dengan Cara Lain) menggunakan NPPN.</p>", "page": "hlm 44", "id": "pengawasan_r_64"}, {"heading": "Pengusaha, PKP, dan Pengusaha Kecil", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 1 angka 14 & 15 UU PPN.</strong> Pengusaha = OP/Badan yang menghasilkan/mengimpor/mengekspor barang, berdagang, memanfaatkan BKPTB, atau melakukan usaha jasa. PKP = Pengusaha yang melakukan penyerahan BKP/JKP dikenai pajak berdasarkan UU PPN. Pengusaha Kecil = peredaran bruto/penerimaan bruto tidak lebih dari <strong>Rp4,8 miliar</strong> setahun (PMK 197/PMK.03/2013), wajib lapor untuk dikukuhkan PKP kecuali Pengusaha Kecil.</p>", "page": "hlm 45-46", "id": "pengawasan_r_65"}, {"heading": "Timeline dan Saat Mulai Kewajiban PKP (PMK 164/2023)", "p": 0, "html": "<p>PMK lama: saat terbit SPPKP = saat mulai kewajiban/hak PKP. PMK baru (164/2023): saat terbit SPPKP ≠ saat mulai kewajiban/hak PKP — WP dapat memilih saat mulai kewajiban pungut/setor/lapor PPN sebelum awal tahun buku berikutnya (grace period) dengan menyampaikan pemberitahuan bersamaan permohonan pengukuhan PKP; jika tidak memberitahukan, mulai wajib sejak Masa Pajak pertama tahun buku berikutnya (atau sejak SPPKP terbit jika PKP tidak menyampaikan pemberitahuan meski wajib lapor terlambat/jabatan).</p>", "page": "hlm 47-49", "id": "pengawasan_r_66"}, {"heading": "Objek PPN (Pasal 4 ayat 1)", "p": 0, "html": "<p>PPN dikenakan atas: (a) penyerahan BKP di Daerah Pabean oleh Pengusaha; (b) impor BKP; (c) penyerahan JKP di Daerah Pabean oleh Pengusaha; (d) pemanfaatan BKPTB dari luar Daerah Pabean; (e) pemanfaatan JKP dari luar Daerah Pabean; (f) ekspor BKP Berwujud oleh PKP; (g) ekspor BKP Tidak Berwujud oleh PKP; (h) ekspor JKP oleh PKP.</p>", "page": "hlm 52", "id": "pengawasan_r_67"}, {"heading": "Objek PPN Khusus: Pasal 16C (KMS) dan 16D (Aktiva Semula Tidak Diperjualbelikan)", "p": 0, "html": "<p><strong>Pasal 16C (KMS):</strong> PPN atas kegiatan membangun sendiri (bukan dalam kegiatan usaha, hasil digunakan sendiri/pihak lain), PMK-61/PMK.03/2022, tarif 20%×11%×total biaya (tidak termasuk perolehan tanah), luas minimal 200m², disetor max tgl 15 bulan berikutnya. <strong>Pasal 16D:</strong> PPN atas penyerahan aktiva yang semula tidak untuk diperjualbelikan, kecuali atas aktiva yang PM-nya tidak dapat dikreditkan menurut Pasal 9 ayat (8) huruf b/c.</p>", "page": "hlm 52,115-116", "id": "pengawasan_r_68"}, {"heading": "Yang Termasuk Penyerahan BKP (Pasal 1A ayat 1)", "p": 0, "html": "<p>8 kategori (a-h): penyerahan hak karena perjanjian; pengalihan karena leasing dengan hak opsi; penyerahan ke pedagang perantara/juru lelang; pemakaian sendiri/pemberian cuma-cuma; BKP persediaan/aktiva tersisa saat pembubaran (kecuali PM tidak dapat dikreditkan Pasal 9(8)b); penyerahan antar pusat-cabang; penyerahan dalam skema pembiayaan syariah. Catatan: huruf g lama &ldquo;penyerahan BKP secara konsinyasi&rdquo; telah dihapus sejak UU Cipta Kerja.</p>", "page": "hlm 55-58", "id": "pengawasan_r_69"}, {"heading": "Yang TIDAK Termasuk Penyerahan BKP (Pasal 1A ayat 2)", "p": 0, "html": "<p>5 kategori (a-e): penyerahan ke makelar; penyerahan untuk jaminan utang-piutang; penyerahan dalam pemusatan tempat pajak terutang; pengalihan BKP dalam rangka penggabungan/peleburan/pemekaran/pengambilalihan usaha & setoran modal pengganti saham (syarat kedua pihak PKP); BKP aktiva tersisa saat pembubaran yang PM-nya tidak dapat dikreditkan (Pasal 9(8)b).</p>", "page": "hlm 60", "id": "pengawasan_r_70"}, {"heading": "Bukan Barang Kena Pajak dan Bukan Jasa Kena Pajak (Pasal 4A)", "p": 0, "html": "<p>Sejak UU HPP, daftar Non-BKP/Non-JKP dipersempit drastis (banyak dihapus, kini kena PPN). Non-BKP tersisa: uang, emas batangan untuk cadangan devisa, surat berharga. Non-JKP tersisa: jasa keagamaan, jasa kesenian & hiburan (objek pajak daerah), jasa tenaga kerja (dihapus dari list lama namun masih berlaku lewat ketentuan lain), jasa yang disediakan pemerintah dalam rangka pemerintahan umum, jasa penyediaan tempat parkir, jasa boga/katering.</p>", "page": "hlm 61-62", "id": "pengawasan_r_71"}, {"heading": "Tarif PPN", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 7 UU PPN.</strong> Tarif normal: 10% (sebelum 1 April 2022) → <strong>11%</strong> (sejak 1 April 2022) → <strong>12%</strong> paling lambat 1 Januari 2025. Tarif ekspor BKP/JKP/BKPTB tetap <strong>0%</strong>.</p>", "page": "hlm 64", "id": "pengawasan_r_72"}, {"heading": "Formula dan Komponen DPP (Pasal 8A)", "p": 0, "html": "<p>PPN = Tarif × DPP. DPP terdiri dari: <strong>Harga Jual</strong> (penyerahan BKP, Pasal 1 angka 18), <strong>Penggantian</strong> (penyerahan JKP/ekspor JKP/BKPTB, Pasal 1 angka 19), <strong>Nilai Impor</strong> (Pasal 1 angka 20), <strong>Nilai Ekspor</strong> (Pasal 1 angka 26), dan <strong>Nilai Lain</strong> (ditetapkan Menkeu untuk kondisi khusus).</p>", "page": "hlm 65-66", "id": "pengawasan_r_73"}, {"heading": "Cara Hitung PPN Umum vs Besaran Tertentu", "p": 0, "html": "<p>Cara Umum (Pasal 8A): PPN = Tarif × DPP (Harga Jual/Penggantian/Nilai Lain); PM dapat dikreditkan. Besaran Tertentu (Pasal 9A): PPN = Tarif × Formula Tertentu × DPP; PM <strong>tidak dapat</strong> dikreditkan (dianggap sudah diperhitungkan dalam penghitungan Pajak Keluaran besaran tertentu).</p>", "page": "hlm 67", "id": "pengawasan_r_74"}, {"heading": "Contoh DPP Nilai Lain dan Besaran Tertentu (PMK)", "p": 0, "html": "<p>Nilai Lain (PMK-75/PMK.03/2010 stdtd PMK 121/2015): pemakaian/pemberian cuma-cuma BKP/JKP = Harga Jual/Penggantian dikurangi laba kotor; penyerahan pusat-cabang = harga pokok/perolehan; produk tembakau = 9,9% × HJE. Besaran Tertentu (PMK 61-71/2022): PPN KMS 2,2%×DPP; LPG tertentu, barang hasil pertanian 1,1%×Harga Jual; kendaraan bermotor bekas 1,1%×Harga Jual; agen asuransi 1,1%; aset kripto 0,11%/0,22%×nilai transaksi.</p>", "page": "hlm 69-70", "id": "pengawasan_r_75"}, {"heading": "Saat Terutang PPN: Umum (Prinsip Akrual)", "p": 0, "html": "<p>Pemungutan PPN/PPnBM menganut <strong>prinsip akrual</strong>: terutang pada saat penyerahan BKP/JKP atau saat impor, meski pembayaran belum/belum sepenuhnya diterima. Terjadi pada saat: penyerahan BKP, impor BKP, penyerahan JKP, pemanfaatan BKPTB/JKP luar negeri, ekspor BKP Berwujud/Tidak Berwujud/JKP.</p>", "page": "hlm 72", "id": "pengawasan_r_76"}, {"heading": "Saat Terutang Khusus: Pembayaran Sebelum Penyerahan & Pemanfaatan BKPTB/JKP Luar Negeri", "p": 0, "html": "<p>Jika pembayaran diterima sebelum penyerahan BKP/JKP atau sebelum pemanfaatan dimulai, saat terutang = <strong>saat pembayaran</strong>. Untuk pemanfaatan BKPTB/JKP luar negeri, saat terutang = saat <strong>mulai memanfaatkan</strong> (bukan saat penyerahan), ditentukan oleh mana yang lebih dulu: nyata digunakan, harga dinyatakan sebagai utang, harga ditagih, atau dibayar; jika tidak diketahui = saat kontrak ditandatangani.</p>", "page": "hlm 73-74", "id": "pengawasan_r_77"}, {"heading": "Tempat Terutang PPN", "p": 0, "html": "<p>PKP OP: tempat tinggal dan/atau tempat kegiatan usaha. PKP Badan: tempat kedudukan dan tempat kegiatan usaha. Impor: tempat BKP dimasukkan & dipungut melalui DJBC. Pemanfaatan BKPTB/JKP luar negeri: tempat tinggal/kedudukan dan/atau tempat kegiatan usaha pemanfaat (tetap terutang di situ meski PKP/bukan PKP).</p>", "page": "hlm 76", "id": "pengawasan_r_78"}, {"heading": "Pemusatan Tempat Pajak Terutang", "p": 0, "html": "<p>PKP dengan >1 tempat kegiatan usaha: setiap tempat pada dasarnya adalah tempat terutang terpisah, namun PKP dapat memilih <strong>1 tempat atau lebih</strong> sebagai tempat pemusatan pajak terutang dengan pemberitahuan tertulis ke Dirjen Pajak.</p>", "page": "hlm 77-78", "id": "pengawasan_r_79"}, {"heading": "Definisi, Fungsi, dan Kewajiban Pembuatan Faktur Pajak", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 1 angka 23 UU PPN.</strong> Faktur Pajak = bukti pungutan pajak oleh PKP atas penyerahan BKP/JKP, berfungsi sebagai bukti pungutan PPN & sarana pengkreditan PM. PKP wajib membuat untuk setiap: penyerahan BKP/JKP, ekspor BKP berwujud/tidak berwujud, ekspor JKP.</p>", "page": "hlm 81", "id": "pengawasan_r_80"}, {"heading": "Saat Pembuatan Faktur Pajak", "p": 0, "html": "<p>Dibuat pada: saat penyerahan BKP/JKP; saat penerimaan pembayaran (jika sebelum penyerahan); saat penerimaan pembayaran termin (penyerahan sebagian tahap pekerjaan); saat ekspor; atau saat lain berdasarkan PMK tersendiri.</p>", "page": "hlm 82", "id": "pengawasan_r_81"}, {"heading": "Faktur Pajak Gabungan", "p": 0, "html": "<p>PKP dapat membuat 1 Faktur Pajak meliputi seluruh penyerahan ke pembeli/penerima yang sama selama 1 bulan kalender, dibuat paling lama akhir bulan penyerahan (termasuk jika ada pembayaran sebelum penyerahan dalam bulan itu). Untuk >1 kode transaksi, dibuat per kode transaksi. Pengecualian: BKP/JKP dengan fasilitas PPN tidak dipungut untuk kawasan/tempat tertentu.</p>", "page": "hlm 83-85", "id": "pengawasan_r_82"}, {"heading": "Keterangan yang Harus Dicantumkan dalam Faktur Pajak", "p": 0, "html": "<p>Nama/alamat/NPWP penjual; identitas pembeli (NPWP utk WP Badan DN/instansi pemerintah; NPWP/NIK utk OP DN; nomor paspor utk OP LN; nama & alamat saja utk Badan LN/bukan subjek Pasal 3 UU PPh); jenis barang/jasa, Harga Jual/Penggantian, potongan harga; PPN & PPnBM dipungut; kode/nomor seri/tanggal; nama & tanda tangan penandatangan. NIK berkedudukan sama dengan NPWP (Pasal 27(3) PP-44/2022).</p>", "page": "hlm 86", "id": "pengawasan_r_83"}, {"heading": "Faktur Pajak PKP Pedagang Eceran", "p": 0, "html": "<p>PKP yang menyerahkan BKP/JKP ke konsumen akhir (termasuk via PMSE) = PKP Pedagang Eceran, tidak ditentukan berdasarkan KLU. Dapat membuat Faktur Pajak eceran (bon kontan, faktur penjualan, struk cash register, karcis, kuitansi, dapat elektronik) <strong>tanpa identitas pembeli serta nama/tanda tangan penjual</strong>. Berlaku juga untuk pemakaian sendiri & pemberian cuma-cuma ke konsumen akhir.</p>", "page": "hlm 87", "id": "pengawasan_r_84"}, {"heading": "Dokumen Tertentu yang Dipersamakan dengan Faktur Pajak", "p": 0, "html": "<p>Dirjen Pajak dapat menetapkan dokumen tertentu dipersamakan dengan Faktur Pajak: faktur penjualan yang sudah dikenal luas (tagihan telekomunikasi), pihak pembuat berada di luar Daerah Pabean (SSP atas pemanfaatan JKP luar negeri), dokumen impor/ekspor (PIB), SSP untuk PPN penyerahan melalui juru lelang. Dibuat melewati 3 bulan sejak seharusnya dibuat → dianggap tidak membuat dokumen tertentu, PPN tidak dapat dikreditkan.</p>", "page": "hlm 88", "id": "pengawasan_r_85"}, {"heading": "Persyaratan Formal dan Material Faktur Pajak", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 13 ayat (5)/(6) UU PPN.</strong> Persyaratan Formal: diisi benar, lengkap, jelas sesuai ketentuan. Persyaratan Material: berisi keterangan yang sebenarnya/sesungguhnya mengenai penyerahan BKP/JKP, ekspor, impor, atau pemanfaatan BKPTB/JKP luar negeri.</p>", "page": "hlm 89", "id": "pengawasan_r_86"}, {"heading": "Pajak Masukan dan Prinsip Pengkreditan", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 1 angka 24, Pasal 9 ayat (2) UU PPN.</strong> PM = PPN yang seharusnya sudah dibayar PKP karena perolehan/pemanfaatan BKP/JKP atau impor BKP, dibuktikan dengan Faktur Pajak/dokumen tertentu yang dipersamakan. PM dikreditkan dengan PK dalam <strong>Masa Pajak yang sama</strong>; jika dalam suatu Masa Pajak tidak ada penyerahan/ekspor, PM tetap dapat dikreditkan.</p>", "page": "hlm 91-92", "id": "pengawasan_r_87"}, {"heading": "Syarat dan Saat Pengkreditan Pajak Masukan", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 9 ayat (2b) & (9) UU PPN, PMK-18/2021.</strong> PM harus menggunakan Faktur Pajak memenuhi Pasal 13(5)/(9). PM yang dapat namun belum dikreditkan pada Masa yang sama dapat dikreditkan paling lama <strong>3 Masa Pajak</strong> setelah berakhirnya Masa Pajak saat Faktur Pajak dibuat, sepanjang belum dibebankan sebagai biaya/dikapitalisasi.</p>", "page": "hlm 93", "id": "pengawasan_r_88"}, {"heading": "Kriteria Pajak Masukan Tidak Dapat Dikreditkan", "p": 0, "html": "<p>Dasar hukum: <strong>Pasal 9 ayat (8) UU PPN.</strong> Tidak dapat dikreditkan untuk: perolehan BKP/JKP tidak berhubungan langsung dengan kegiatan usaha (huruf b); perolehan dengan Faktur Pajak tidak memenuhi Pasal 13(5)/(9) atau tidak mencantumkan identitas pembeli (huruf f); pemanfaatan BKPTB/JKP luar negeri yang Faktur Pajaknya tidak memenuhi Pasal 13(6) (huruf g).</p>", "page": "hlm 94", "id": "pengawasan_r_89"}, {"heading": "Pengkreditan PM Sebelum Penyerahan & Sebelum Dikukuhkan PKP", "p": 0, "html": "<p>PKP yang belum melakukan penyerahan BKP/JKP: PM atas semua perolehan yang berhubungan langsung dengan penyerahan tetap dapat dikreditkan (LB dikompensasi/direstitusi akhir tahun buku); jika 3 tahun pertama belum ada penyerahan, PPN menjadi tidak dapat dikreditkan (dibatalkan) - Pasal 9(2a)&(6a). Pengusaha sebelum dikukuhkan PKP: PM dapat dikreditkan dengan pedoman <strong>Deemed PM 80%</strong> dari Pajak Keluaran yang seharusnya dipungut.</p>", "page": "hlm 95-96", "id": "pengawasan_r_90"}, {"heading": "Pengkreditan PM yang Ditemukan Saat Pemeriksaan", "p": 0, "html": "<p>PM yang tidak dilaporkan dalam SPT Masa PPN namun ditemukan saat pemeriksaan tetap <strong>dapat dikreditkan</strong> sepanjang sesuai bukti Faktur Pajak yang dimiliki dan memenuhi ketentuan pengkreditan UU PPN.</p>", "page": "hlm 97", "id": "pengawasan_r_91"}, {"heading": "Objek Pajak PBB P5L — Klasifikasi Umum", "p": 0, "html": "<p>PBB Sektor Perkebunan, Perhutanan, dan Pertambangan (P5L/P3L lama) dasar hukum <strong>Pasal 2 &amp; Pasal 2 ayat (2) UU PBB</strong>. Dulu diklasifikasikan berdasar sektor (Perkebunan/Perhutanan/Pertambangan/Lainnya), kini (Pasal 2, aturan baru) diklasifikasikan lebih rinci menjadi: <strong>Sektor Perkebunan, Perhutanan, Pertambangan Migas, Pertambangan Panas Bumi, Pertambangan Mineral/Batubara, dan Lainnya.</strong></p>", "page": "hlm 161-164", "id": "pengawasan_r_92"}, {"heading": "Objek Pajak Bumi Sektor Perkebunan (Pasal 3)", "p": 0, "html": "<p>Bumi yang berada di <strong>kawasan perkebunan</strong>, meliputi: (a) areal sebagaimana tercantum dalam IUP-B, IUP, ITUBP, dan/atau HGU perkebunan; (b) areal di luar areal huruf a yang merupakan satu kesatuan yang digunakan untuk kegiatan usaha perkebunan dan secara fisik tidak terpisahkan. \"Areal di luar areal\" mencakup areal yang memiliki ≥1 titik koordinat yang sama dengan areal huruf a, atau areal yang terhubung melalui sungai/parit/jalan/jembatan.</p>", "page": "hlm 165", "id": "pengawasan_r_93"}, {"heading": "Objek Pajak Bumi Sektor Perhutanan (Pasal 4)", "p": 0, "html": "<p>Bumi yang berada di kawasan perhutanan: (a) areal tercantum dalam IUPHHK-HA dan/atau IUPHHBK-HA, IUPHHK-RE, IUPHHK-HTI dan/atau IUPHHBK-HT, atau Penugasan Pemerintah (Perhutani); (b) areal di luar areal huruf a yang satu kesatuan & tidak terpisahkan secara fisik.</p>", "page": "hlm 166", "id": "pengawasan_r_94"}, {"heading": "Objek Pajak Bumi Sektor Pertambangan Migas (Pasal 5)", "p": 0, "html": "<p>Bumi di kawasan pertambangan migas: (a) Wilayah Kerja sesuai Kontrak Kerja Sama; (b) areal di luar Wilayah Kerja yang satu kesatuan secara fisik. Khusus sektor ini, \"terhubung\" juga mencakup koneksi melalui <strong>jaringan pipa</strong> (bukan hanya sungai/jalan/jembatan).</p>", "page": "hlm 167", "id": "pengawasan_r_95"}, {"heading": "Objek Pajak Bumi Sektor Panas Bumi & Minerba (Pasal 6-7)", "p": 0, "html": "<p><strong>Panas Bumi</strong>: Wilayah Kerja/penugasan pengusahaan panas bumi + areal di luarnya yang satu kesatuan (terhubung via sungai/pipa/jalan/jembatan). <strong>Mineral/Batubara</strong>: areal dalam IUP/IUPK/IPR/KK/PKP2B + areal di luar yang satu kesatuan (terhubung via sungai/pipa/konveyor/jalan/jembatan).</p>", "page": "hlm 168-169", "id": "pengawasan_r_96"}, {"heading": "Objek Pajak Bumi Sektor Lainnya (Pasal 8)", "p": 0, "html": "<p>Bumi selain Objek Pajak P5L yang berada di wilayah perairan NKRI dan selain objek PBB P2, meliputi perairan untuk: (a) perikanan tangkap; (b) pembudidayaan ikan — keduanya dengan Surat Izin Usaha Perikanan dari kementerian kelautan & perikanan; (c) jaringan pipa; (d) jaringan kabel; (e) ruas jalan tol; (f) fasilitas penyimpanan &amp; pengolahan meliputi FSO, FPS, FPU, FSU, FPSO, dan FSRU.</p>", "page": "hlm 170", "id": "pengawasan_r_97"}, {"heading": "Objek Pajak di Luar Kawasan yang TIDAK Dikenakan PBB P5L", "p": 0, "html": "<p>Dasar hukum Pasal 3 ayat (1) UU PBB. Bumi tidak dikenakan PBB P5L jika: untuk sektor Perkebunan/Perhutanan — dipunyai haknya dan/atau dimanfaatkan sepenuhnya secara nyata dan sah oleh selain subjek pajak/WP; untuk sektor Pertambangan — <strong>tidak dipunyai haknya dan tidak diperoleh manfaatnya</strong> oleh subjek pajak/WP.</p>", "page": "hlm 171", "id": "pengawasan_r_98"}, {"heading": "Objek Pajak Bangunan P5L", "p": 0, "html": "<p>Konstruksi teknik yang ditanam atau dilekatkan secara tetap pada bumi yang berada di kawasan: Perkebunan, Perhutanan, Pertambangan Migas, Pertambangan Panas Bumi, Pertambangan Mineral/Batubara. Untuk sektor Lainnya (wilayah perairan NKRI) mencakup: jaringan pipa, jaringan kabel, ruas jalan tol, fasilitas penyimpanan &amp; pengolahan.</p>", "page": "hlm 172", "id": "pengawasan_r_99"}, {"heading": "Formula Umum NJOP PBB P5L", "p": 0, "html": "<p>NJOP PBB = <strong>NJOP Bumi + NJOP Bangunan</strong>, keduanya ditetapkan dari hasil penilaian objek pajak oleh Penilai Pajak, menjadi dasar pengenaan pajak PBB. Dasar hukum: Pasal 10, 11, 12, 14, 15, 17, 19, 21 UU PBB.</p>", "page": "hlm 174", "id": "pengawasan_r_100"}, {"heading": "Penetapan NJOP Bumi Sektor Perkebunan (Pasal 12,14)", "p": 0, "html": "<table><tr><th>Areal</th><th>Metode Penghitungan</th></tr><tr><td>Areal Produktif — Tanah</td><td>Perbandingan Harga dengan Objek Sejenis</td></tr><tr><td>Areal Produktif — Pengembangan</td><td>Biaya Investasi Tanaman (KEP Dirjen Pajak)</td></tr><tr><td>Areal Belum/Tidak Produktif</td><td>Perbandingan Harga Objek Sejenis</td></tr><tr><td>Areal Pengaman</td><td>Penyesuaian terhadap NJOP Areal Belum Produktif</td></tr><tr><td>Areal Emplasemen</td><td>Perbandingan Harga Objek Sejenis</td></tr></table>", "page": "hlm 180", "id": "pengawasan_r_101"}, {"heading": "Penetapan NJOP Bumi Sektor Perhutanan — Hutan Alam (Pasal 15,16)", "p": 0, "html": "<p>Areal Produktif Hutan Alam dinilai dengan <strong>Nilai Jual Pengganti (NJP) = Pendapatan Bersih Hasil Hutan × Angka Kapitalisasi</strong>. Pendapatan bersih = pendapatan kotor − biaya produksi perhutanan; pendapatan kotor = jumlah produksi × harga jual rata-rata hasil hutan (kayu di <em>log pond</em>/<em>log yard</em> atau bukan kayu), dihitung tahun terakhir sebelum Tahun Pajak PBB terutang. Biaya Produksi Perhutanan = rasio biaya produksi × pendapatan kotor, rasio ditetapkan Kep. Dirjen Pajak. Area Tidak Produktif &amp; Perlindungan/Konservasi ditetapkan dengan Keputusan Dirjen Pajak (bukan perbandingan harga).</p>", "page": "hlm 181-182", "id": "pengawasan_r_102"}, {"heading": "Penetapan NJOP Bumi Sektor Migas — Onshore/Offshore/Tubuh Bumi (Pasal 12,17)", "p": 0, "html": "<p>Areal Offshore ditetapkan dengan Keputusan Dirjen Pajak. Areal Produktif/Belum Produktif/Tidak Produktif/Pengaman/Emplasemen (onshore) dinilai dengan perbandingan harga atau penyesuaian NJOP areal belum produktif. <strong>Tahap Eksplorasi</strong> (tubuh bumi belum/tidak menghasilkan) ditetapkan dengan Keputusan Dirjen Pajak. <strong>Tahap Eksploitasi</strong> (tubuh bumi menghasilkan): NJP = Nilai Jual Pengganti.</p>", "page": "hlm 183", "id": "pengawasan_r_103"}, {"heading": "NJOP Tubuh Bumi Eksploitasi Migas (FQR)", "p": 0, "html": "<p>Nilai Jual Pengganti = Pendapatan Minyak/Gas Bumi × Angka Kapitalisasi. Pendapatan = <em>gross sales</em> minyak/gas sebagaimana tertuang dalam <strong>Financial Quarterly Report (FQR)</strong> triwulan IV WP sebelum Tahun Pajak PBB terutang. Jika penjualan kotor dalam mata uang selain Rupiah, dikonversi berdasarkan kurs KMK tanggal 1 Januari Tahun Pajak PBB terutang.</p>", "page": "hlm 184 (Pasal 17-18)", "id": "pengawasan_r_104"}, {"heading": "Penetapan NJOP Bumi Sektor Panas Bumi", "p": 0, "html": "<p>Struktur sama dengan Migas (Areal Offshore ditetapkan Keputusan Dirjen Pajak; Tahap Eksplorasi = Keputusan Dirjen Pajak; Tahap Eksploitasi = Nilai Jual Pengganti). NJP Tubuh Bumi Eksploitasi Panas Bumi = Pendapatan Uap dan/atau Listrik × Angka Kapitalisasi; pendapatan dihitung dari hasil produksi uap/listrik terjual tahun terakhir sebelum Tahun Pajak terutang × harga uap/listrik (ditetapkan Keputusan Dirjen Pajak).</p>", "page": "hlm 185-186 (Pasal 19-20)", "id": "pengawasan_r_105"}, {"heading": "Penetapan NJOP Bumi Sektor Minerba — Operasi Produksi (Pasal 21-22)", "p": 0, "html": "<p>Areal Cadangan Produksi &amp; Belum Dimanfaatkan: perbandingan harga/penyesuaian NJOP. Tahap Eksplorasi: Keputusan Dirjen Pajak. <strong>Operasi Produksi</strong>: NJP = Pendapatan Bersih × Angka Kapitalisasi; Pendapatan Bersih = Pendapatan Kotor − Biaya Produksi; Pendapatan Kotor = Hasil Produksi × Harga Jual rata-rata minerba (penjualan dibagi volume satu tahun terakhir). Penilaian kewajaran Biaya Produksi dan Harga Jual dilakukan oleh Penilai Pajak.</p>", "page": "hlm 189-190", "id": "pengawasan_r_106"}, {"heading": "Biaya Produksi Minerba — Kriteria (Pasal 32)", "p": 0, "html": "<p>Biaya Produksi harus: (1) sesuai ketentuan PPh; (2) sesuai prinsip kewajaran dan kelaziman usaha; (3) berkaitan langsung dengan kegiatan: a) pengupasan lapisan tanah (<em>top soil</em>/<em>stripping over burden</em>); b) pengambilan hasil produksi (galian tambang); c) pengolahan dan/atau pemurnian (pembersihan/pemisahan/penghancuran/peningkatan kualitas); d) pengangkutan hasil produksi ke titik serah penjualan.</p>", "page": "hlm 192", "id": "pengawasan_r_107"}, {"heading": "Ketentuan Harga Jual &amp; Harga Patokan Minerba (Pasal 23-31)", "p": 0, "html": "<p>Harga Jual rata-rata (min
