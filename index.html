aran/PPnBM bagi penjual pada Masa Pajak TERJADINYA retur (bukan dengan membetulkan SPT masa penyerahan awal). PPN atas barang yang diretur = 11% x Rp30.000.000 = Rp3.300.000, dikurangkan dari Pajak Keluaran PT Sentosa Elektronik pada SPT Masa PPN April 2024 (saat retur terjadi).", "topic": "Koreksi Fiskal PPN — Retur BKP", "id": "pengawasan_sk_37"}, {"q": "PT Konstruksi Nusantara (PKP, berstatus Rekanan) melakukan 2 transaksi penyerahan jasa kepada PT Semen Indonesia (BUMN yang ditetapkan sebagai Pemungut PPN): Transaksi 1 senilai Rp8.000.000 (belum PPN) dan Transaksi 2 senilai Rp25.000.000 (belum PPN), keduanya bukan hasil pemecahan dari transaksi yang lebih besar.\nSiapa yang wajib memungut, menyetor, dan melaporkan PPN untuk masing-masing transaksi?", "o": ["Kedua transaksi dipungut oleh PT Semen Indonesia selaku Pemungut PPN", "Transaksi 1 dipungut sendiri oleh PT Konstruksi Nusantara (≤Rp10 juta, dikecualikan dari pemungutan); Transaksi 2 dipungut oleh PT Semen Indonesia", "Kedua transaksi dipungut sendiri oleh PT Konstruksi Nusantara karena berstatus Rekanan", "Transaksi 1 dipungut oleh PT Semen Indonesia; Transaksi 2 dipungut sendiri oleh PT Konstruksi Nusantara"], "c": 1, "e": "Pembayaran dengan nilai paling banyak Rp10.000.000 (dan bukan hasil pemecahan transaksi) dikecualikan dari pemungutan oleh Pemungut PPN BUMN — PPN dipungut sendiri oleh Rekanan. Transaksi 1 (Rp8.000.000) memenuhi pengecualian ini, sehingga dipungut sendiri oleh PT Konstruksi Nusantara. Transaksi 2 (Rp25.000.000) melebihi Rp10 juta, sehingga PPN-nya dipungut, disetor, dan dilaporkan oleh PT Semen Indonesia selaku Pemungut PPN.", "topic": "Koreksi Fiskal PPN — Pemungut PPN BUMN", "id": "pengawasan_sk_38"}, {"q": "PT Software Nasional menggunakan jasa konsultasi IT dari perusahaan di Singapura (bukan PKP di Indonesia, tidak memiliki BUT) senilai Rp300.000.000 pada Juni 2024. Jasa tersebut dimanfaatkan di dalam Daerah Pabean Indonesia.\nSiapa yang wajib memungut, menyetor, dan melaporkan PPN atas pemanfaatan JKP dari luar Daerah Pabean tersebut, dan berapa jumlah PPN yang harus disetor?", "o": ["Perusahaan Singapura tersebut yang menyerahkan jasa — namun karena tidak terdaftar sebagai PKP di Indonesia, PPN tidak terutang", "PT Software Nasional wajib memungut dan menyetor sendiri PPN sebesar Rp33.000.000 (self-assessment atas pemanfaatan JKP luar Daerah Pabean)", "PPN tidak terutang karena transaksi lintas negara termasuk objek yang dikecualikan", "PT Software Nasional wajib memungut PPN sebesar Rp30.000.000 menggunakan tarif 10% (tarif lama)"], "c": 1, "e": "Atas pemanfaatan JKP dari luar Daerah Pabean di dalam Daerah Pabean, karena pemberi jasa luar negeri tidak berkedudukan sebagai PKP di Indonesia, kewajiban memungut, menyetor, dan melaporkan PPN beralih (self-assessment) kepada pihak yang memanfaatkan jasa tersebut di Indonesia. PPN = 11% x Rp300.000.000 = Rp33.000.000, disetor sendiri oleh PT Software Nasional menggunakan SSP.", "topic": "Koreksi Fiskal PPN — Pemanfaatan JKP Luar Negeri", "id": "pengawasan_sk_39"}, {"q": "PT Digital Kreatif Indonesia (konsumen, non-PKP) membeli lisensi software (barang digital/BKP Tidak Berwujud) dari penyedia luar negeri \"CloudSoft Inc.\" melalui platform Penyelenggara PMSE Luar Negeri \"GlobalApp Store\" senilai Rp5.000.000. GlobalApp Store telah ditunjuk oleh DJP sebagai Pihak Lain pemungut PPN PMSE.\nSiapa yang wajib memungut PPN atas transaksi tersebut?", "o": ["PT Digital Kreatif Indonesia wajib menyetor sendiri karena bukan PKP", "GlobalApp Store, selaku Penyelenggara PMSE Luar Negeri yang ditunjuk sebagai Pihak Lain pemungut PPN PMSE", "CloudSoft Inc., selaku Pedagang Luar Negeri pemilik produk", "Tidak ada PPN terutang karena transaksi dilakukan oleh pihak non-PKP"], "c": 1, "e": "Atas pemanfaatan BKP Tidak Berwujud/JKP dari luar Daerah Pabean melalui PMSE, PPN dipungut oleh Pelaku Usaha PMSE (Pedagang LN, Penyedia Jasa LN, atau Penyelenggara PMSE) yang ditunjuk DJP sebagai Pihak Lain pemungut PPN PMSE — dalam kasus ini GlobalApp Store, bukan konsumen maupun pemilik produk.", "topic": "Koreksi Fiskal PPN — PMSE", "id": "pengawasan_sk_40"}, {"q": "Seorang WP Orang Pribadi menjual aset kripto senilai Rp50.000.000 melalui exchanger yang terdaftar di Bappebti.\nBerapa PPh Pasal 22 yang dipungut oleh exchanger atas transaksi penjualan aset kripto tersebut?", "o": ["Rp50.000 (0,1% karena exchanger terdaftar di Bappebti)", "Rp100.000 (0,2% karena dianggap tidak terdaftar)", "Rp500.000 (tarif umum 1%)", "Rp0 (transaksi aset kripto tidak dikenai PPh)"], "c": 0, "e": "Tarif PPh Pasal 22 atas transaksi aset kripto adalah 0,1% dari nilai transaksi jika exchanger terdaftar di Bappebti, atau 0,2% jika tidak terdaftar. Karena exchanger pada kasus ini terdaftar di Bappebti: PPh 22 = 0,1% x Rp50.000.000 = Rp50.000.", "topic": "Koreksi Fiskal PPh 22 — Aset Kripto", "id": "pengawasan_sk_41"}, {"q": "PT Retail Prima menjual barang dengan harga jual (sebelum PPN) sebesar Rp100.000.000. Karena kekeliruan administrasi, PT Retail Prima keliru menganggap harga tersebut SUDAH termasuk PPN, sehingga menghitung DPP dengan rumus 100/111 x Rp100.000.000 = Rp90.090.090 dan melaporkan PPN sebesar 11% x Rp90.090.090 = Rp9.909.910 dalam SPT Masa PPN.\nDalam pemeriksaan, berapa PPN kurang bayar yang harus dikoreksi akibat kesalahan penghitungan DPP tersebut?", "o": ["Rp0 (DPP yang dilaporkan PT Retail Prima sudah benar)", "Rp1.090.090 (selisih akibat kesalahan penghitungan gross-up DPP)", "Rp9.909.910 (seluruh PPN yang telah dilaporkan dianggap salah total)", "Rp11.000.000 (seluruh PPN dianggap belum dibayar sama sekali)"], "c": 1, "e": "Karena harga jual Rp100.000.000 adalah harga SEBELUM PPN (bukan harga termasuk PPN), DPP yang benar adalah Rp100.000.000 itu sendiri, sehingga PPN seharusnya = 11% x Rp100.000.000 = Rp11.000.000. PT Retail Prima keliru melakukan gross-down (menganggap harga sudah termasuk PPN) sehingga hanya melaporkan Rp9.909.910. Kurang bayar = Rp11.000.000 − Rp9.909.910 = Rp1.090.090.", "topic": "Koreksi Fiskal PPN — DPP Nilai Lain", "id": "pengawasan_sk_42"}, {"q": "PT Mega Distribusi menerima pembayaran uang muka dari pelanggan pada 5 Maret 2024 sebesar Rp50.000.000 untuk pembelian barang yang baru diserahkan pada 20 April 2024. PT Mega Distribusi baru membuat Faktur Pajak pada 20 April 2024 (saat penyerahan), padahal seharusnya dibuat pada 5 Maret 2024 karena pembayaran diterima sebelum penyerahan.\nBerapa sanksi denda administrasi (Pasal 14 ayat 4 UU KUP) atas kesalahan saat pembuatan Faktur Pajak tersebut, dihitung dari DPP uang muka?", "o": ["Rp5.500.000 (sama dengan jumlah PPN terutang)", "Rp500.000 (denda 1% dari DPP uang muka Rp50.000.000)", "Rp50.000 (0,1% dari DPP)", "Tidak ada sanksi karena PPN akhirnya tetap dilaporkan"], "c": 1, "e": "Faktur Pajak wajib dibuat pada saat penerimaan pembayaran jika pembayaran diterima SEBELUM penyerahan — bukan pada saat penyerahan. Karena PT Mega Distribusi membuat Faktur Pajak terlambat (seharusnya 5 Maret, dibuat 20 April), dikenai sanksi administrasi berupa denda 1% dari DPP sesuai Pasal 14 ayat (4) UU KUP = 1% x Rp50.000.000 = Rp500.000, terlepas dari jumlah PPN Rp5.500.000 (11% x Rp50.000.000) yang tetap harus disetor.", "topic": "Koreksi Fiskal PPN — Sanksi Faktur Pajak Terlambat", "id": "pengawasan_sk_43"}, {"q": "PT Komponen Otomotif menjual komponen mobil kepada PT Afiliasi Motor (pihak berelasi, kepemilikan modal 40%) dengan harga Rp8.000.000/unit. Pada periode yang sama, PT Komponen Otomotif juga menjual komponen identik (spesifikasi, kualitas, volume, dan syarat pembayaran sama) kepada PT Independen Jaya (pihak tidak berelasi) dengan harga Rp10.000.000/unit.\nMetode PKKU manakah yang paling tepat digunakan untuk menguji kewajaran harga transaksi dengan PT Afiliasi Motor, dan berapa koreksi harga wajar per unit?", "o": ["Metode CUP (Comparable Uncontrolled Price); harga wajar Rp10.000.000/unit, koreksi positif Rp2.000.000/unit", "Metode TNMM; tidak ada koreksi karena margin sudah wajar", "Metode CPM (Cost Plus Method); koreksi Rp1.000.000/unit", "Metode PSM (Profit Split Method); tidak dapat ditentukan tanpa data laba gabungan"], "c": 0, "e": "Tersedia data pembanding internal berupa penjualan barang IDENTIK dengan kondisi transaksi yang sebanding (spesifikasi, kualitas, volume, syarat pembayaran sama) kepada pihak independen — ini adalah kondisi ideal penerapan metode CUP. Harga wajar = Rp10.000.000/unit (harga ke pihak independen), sehingga koreksi positif atas transaksi dengan PT Afiliasi Motor = Rp10.000.000 − Rp8.000.000 = Rp2.000.000/unit.", "topic": "Transfer Pricing/PKKU — Metode CUP", "id": "pengawasan_sk_44"}, {"q": "PT Anak Usaha Indonesia membayar management fee kepada induk perusahaannya di luar negeri dengan markup 15% dari biaya (cost-plus), sementara berdasarkan analisis kesebandingan, rentang markup wajar untuk jasa manajemen sejenis dari penyedia independen adalah 8%-12% dengan median 10%. Biaya jasa aktual yang dikeluarkan induk perusahaan adalah Rp2.000.000.000.\nMetode PKKU apa yang digunakan, dan berapa koreksi fiskal (biaya yang tidak dapat dibebankan) jika menggunakan median sebagai acuan harga wajar?", "o": ["Metode Cost Plus Method (CPM); koreksi positif Rp100.000.000 (biaya yang tidak dapat dibebankan)", "Metode TNMM; tidak ada koreksi karena markup masih dalam batas wajar", "Metode CUP; koreksi Rp300.000.000", "Metode PSM; koreksi Rp200.000.000"], "c": 0, "e": "Untuk transaksi jasa intra-grup berbasis cost-plus, metode yang tepat adalah Cost Plus Method (CPM): membandingkan markup aktual dengan rentang markup wajar dari pembanding independen. Harga wajar (median 10%) = Rp2.000.000.000 x 1,10 = Rp2.200.000.000. Harga yang dibayar PT Anak Usaha Indonesia (markup 15%) = Rp2.000.000.000 x 1,15 = Rp2.300.000.000. Koreksi positif (biaya yang dikoreksi, menambah PKP di Indonesia) = Rp2.300.000.000 − Rp2.200.000.000 = Rp100.000.000.", "topic": "Transfer Pricing/PKKU — Metode CPM", "id": "pengawasan_sk_45"}, {"q": "PT Teknologi Maju Indonesia membayar royalti kepada perusahaan induknya di luar negeri atas penggunaan merek dagang, sebesar 6% dari penjualan bersih. Pemeriksa Pajak menemukan data pembanding independen berupa perjanjian lisensi merek sejenis antara pihak tidak berelasi dengan tarif royalti 3%-4% dari penjualan bersih.\nMetode PKKU apa yang paling tepat digunakan untuk menguji kewajaran tarif royalti tersebut, dan termasuk kategori transaksi tertentu apa?", "o": ["CUT (Comparable Uncontrolled Transaction) — kategori transaksi pemanfaatan harta tidak berwujud", "CUP (Comparable Uncontrolled Price) — kategori transaksi penjualan barang", "TNMM — kategori transaksi jasa", "PSM — kategori transaksi restrukturisasi usaha"], "c": 0, "e": "Metode CUT (Comparable Uncontrolled Transaction) digunakan untuk menguji kewajaran transaksi pemanfaatan harta tidak berwujud (intangibles) seperti royalti/lisensi merek, dengan membandingkan tarif/syarat transaksi terkendali terhadap transaksi sejenis antara pihak independen. Tarif royalti 6% berada di atas rentang wajar pembanding independen (3%-4%), sehingga berpotensi dikoreksi ke tarif wajar.", "topic": "Transfer Pricing/PKKU — Metode CUT", "id": "pengawasan_sk_46"}, {"q": "PT Distribusi Berelasi (distributor pihak berelasi, fungsi dan risiko rendah) melaporkan margin laba kotor (gross margin) sebesar 8% dari penjualan Rp50.000.000.000. Berdasarkan analisis kesebandingan menggunakan metode Resale Price Method (RPM), margin laba kotor wajar untuk distributor independen dengan fungsi serupa berkisar 12%-15%, dengan median 13,5%.\nBerapa koreksi positif atas laba kotor PT Distribusi Berelasi jika menggunakan median sebagai acuan harga wajar?", "o": ["Rp2.750.000.000 (selisih antara margin wajar median 13,5% dengan margin aktual 8%)", "Rp1.500.000.000", "Rp750.000.000", "Tidak ada koreksi karena margin masih dalam toleransi"], "c": 0, "e": "Resale Price Method (RPM) cocok digunakan untuk menguji kewajaran margin distributor fungsi rendah seperti PT Distribusi Berelasi. Margin laba kotor aktual = 8% x Rp50.000.000.000 = Rp4.000.000.000. Margin wajar (median 13,5%) = 13,5% x Rp50.000.000.000 = Rp6.750.000.000. Koreksi positif = Rp6.750.000.000 − Rp4.000.000.000 = Rp2.750.000.000.", "topic": "Transfer Pricing/PKKU — Metode RPM", "id": "pengawasan_sk_47"}, {"q": "KPP menerbitkan SP2DK kepada Sdr. Budi (WP OP, usaha dagang elektronik) pada 2 Januari 2026 terkait indikasi penghasilan yang belum dilaporkan. Hingga batas waktu 14 hari (16 Januari 2026) berakhir, WP sama sekali tidak memberikan tanggapan.\nApa tindak lanjut yang tepat dilakukan KPP?", "o": ["Langsung menerbitkan SKPKB tanpa proses lebih lanjut", "Mengundang WP untuk pembahasan/kunjungan; jika WP tetap tidak merespons, dilanjutkan dengan penyusunan BAP2DK berdasarkan data yang dimiliki", "Menghapus NPWP WP secara jabatan", "Melimpahkan langsung ke Pemeriksaan Bukti Permulaan"], "c": 1, "e": "Jika WP tidak menyampaikan tanggapan SP2DK dalam 14 hari, KPP tidak boleh langsung menerbitkan ketetapan pajak. Langkah berikutnya adalah mengundang WP untuk pembahasan/kunjungan; bila WP tetap tidak merespons/hadir, proses dilanjutkan dengan penyusunan Berita Acara Pelaksanaan Pengawasan Kepatuhan WP (BAP2DK) berdasarkan data dan informasi yang dimiliki DJP, sebagai dasar tindak lanjut selanjutnya (LHP2DK).", "topic": "Ekstensifikasi — SP2DK", "id": "pengawasan_sk_48"}, {"q": "PT Sumber Rejeki menerima SP2DK dan menyampaikan tanggapan tertulis dalam 10 hari. Namun penjelasan yang diberikan tidak didukung bukti memadai dan tidak sesuai dengan data konkret yang dimiliki DJP.\nLangkah selanjutnya yang tepat?", "o": ["SP2DK dianggap selesai karena WP sudah menyampaikan tanggapan tepat waktu", "KPP menerbitkan Surat Pemberitahuan Hasil Penelitian Pengawasan (SPHPP) dan mengundang WP untuk pembahasan", "Kasus otomatis dilimpahkan ke pemeriksaan bukti permulaan", "WP otomatis dinyatakan sebagai WP Non-Aktif"], "c": 1, "e": "Menyampaikan tanggapan tepat waktu tidak serta-merta menyelesaikan proses pengawasan jika substansi tanggapan tidak sesuai/tidak didukung bukti. KPP menindaklanjuti dengan menerbitkan SPHPP (Surat Pemberitahuan Hasil Penelitian Pengawasan) dan mengundang WP untuk pembahasan guna mengklarifikasi ketidaksesuaian tersebut sebelum proses berlanjut ke BAP2DK.", "topic": "Ekstensifikasi — SP2DK", "id": "pengawasan_sk_49"}, {"q": "Hasil BAP2DK menyimpulkan bahwa seseorang telah memenuhi syarat subjektif (bertempat tinggal di Indonesia) dan syarat objektif (memperoleh penghasilan di atas PTKP dari usaha yang telah berjalan 2 tahun), namun yang bersangkutan belum memiliki NPWP dan tidak kunjung mendaftarkan diri meski telah diberi kesempatan.\nTindak lanjut administratif yang tepat?", "o": ["NPWP diterbitkan secara jabatan", "Menunggu WP mendaftarkan diri tanpa batas waktu", "Kasus dihentikan karena pendaftaran NPWP bersifat sukarela mutlak", "Langsung dilimpahkan ke penyidikan pidana perpajakan"], "c": 0, "e": "Jika seseorang telah memenuhi syarat subjektif dan objektif sebagai Wajib Pajak namun tidak mendaftarkan diri meski telah diberi kesempatan melalui proses pengawasan (SP2DK/BAP2DK), DJP berwenang menerbitkan NPWP secara jabatan sebagai tindak lanjut ekstensifikasi, sebelum mempertimbangkan langkah lain yang lebih berat seperti pemeriksaan atau penegakan hukum.", "topic": "Ekstensifikasi — SP2DK", "id": "pengawasan_sk_50"}, {"q": "KPP mengidentifikasi seorang WP yang terdaftar sejak 5 tahun lalu namun selama 3 tahun terakhir tidak pernah menyampaikan SPT, alamat sesuai KTP tidak dapat ditemukan saat kunjungan lapangan (KPDL), dan tidak terdeteksi adanya transaksi/kegiatan usaha dari data pihak ketiga.\nBerdasarkan kondisi tersebut, status administrasi apa yang paling tepat diberikan kepada WP ini?", "o": ["WP dinyatakan Non-Efektif (NE)", "NPWP dihapus secara permanen tanpa proses lebih lanjut", "WP otomatis dikenai sanksi pidana perpajakan", "Status WP tidak berubah karena NPWP bersifat berlaku seumur hidup dan tidak dapat diberi status khusus"], "c": 0, "e": "WP yang tidak menunjukkan aktivitas kewajiban perpajakan dan tidak dapat ditemukan keberadaannya dapat diberikan status administratif Non-Efektif (NE) — ini adalah status sementara (bukan penghapusan permanen, bukan sanksi pidana) yang mengeluarkan WP dari daftar pengawasan rutin sampai ditemukan indikasi aktivitas kembali, di mana status NE dapat diaktifkan kembali secara otomatis jika terdeteksi transaksi baru.", "topic": "Ekstensifikasi — WP Non-Aktif", "id": "pengawasan_sk_51"}, {"q": "Pemeriksa melakukan ekualisasi omzet PPN (total DPP Keluaran setahun dari SPT Masa PPN) terhadap omzet yang dilaporkan WP di SPT Tahunan PPh Badan. Ditemukan omzet versi PPN lebih tinggi Rp500.000.000 dibanding omzet versi PPh, tanpa penjelasan transaksi yang sah (seperti pemakaian sendiri atau retur) yang dapat menjelaskan selisih tersebut.\nKesimpulan paling tepat atas temuan profiling/ekualisasi ini?", "o": ["Ada indikasi omzet yang belum dilaporkan di PPh Badan sehingga memerlukan klarifikasi lebih lanjut (SP2DK atau pemeriksaan)", "Tidak ada masalah karena basis pengenaan PPN dan PPh memang berbeda secara konsep", "WP otomatis dikenai sanksi pidana tanpa klarifikasi", "DPP PPN yang telah dilaporkan harus diturunkan agar sama dengan omzet SPT PPh"], "c": 0, "e": "Ekualisasi omzet PPN vs PPh adalah salah satu teknik profiling/pemeriksaan standar untuk menemukan potensi pajak. Selisih signifikan tanpa penjelasan transaksi yang sah mengindikasikan adanya penghasilan/penyerahan yang belum dilaporkan sepenuhnya di SPT PPh Badan, sehingga tindak lanjutnya adalah klarifikasi melalui SP2DK atau pendalaman melalui pemeriksaan — bukan kesimpulan otomatis bersalah maupun pembiaran.", "topic": "Profiling — Ekualisasi", "id": "pengawasan_sk_52"}, {"q": "Hasil pemeriksaan menetapkan PPh kurang bayar sebesar Rp80.000.000 untuk Masa Pajak yang jatuh tempo 15 Maret 2024. SKPKB diterbitkan pada 10 November 2025, atau 20 bulan sejak jatuh tempo (belum melewati batas maksimal 24 bulan). Suku bunga acuan yang berlaku diasumsikan 6% per tahun, dengan uplift factor 15%, sehingga tarif sanksi bunga per bulan = (6%+15%)/12 = 1,75%.\nBerapa sanksi bunga Pasal 13 ayat (2) UU KUP yang dikenakan?", "o": ["Rp28.000.000", "Rp33.600.000", "Rp24.000.000", "Rp19.600.000"], "c": 0, "e": "Tarif bunga per bulan = 1,75% (sudah termasuk uplift factor). Sanksi bunga = jumlah bulan keterlambatan x tarif x pokok pajak = 20 x 1,75% x Rp80.000.000 = 20 x Rp1.400.000 = Rp28.000.000. Opsi Rp33.600.000 keliru karena memakai batas maksimal 24 bulan padahal keterlambatan aktual hanya 20 bulan; opsi lain merupakan hasil kesalahan hitung jumlah bulan.", "topic": "Sanksi Administrasi — Bunga", "id": "pengawasan_sk_53"}, {"q": "Pemeriksaan menemukan bahwa PKP tidak menyerahkan BKP/JKP namun telah mengkreditkan Pajak Masukan sebesar Rp40.000.000, yang berdasarkan Pasal 13 ayat (1) UU KUP dikenai SKPKB dengan sanksi kenaikan sebesar 75%.\nBerapa total yang harus dibayar WP (pokok pajak + sanksi kenaikan)?", "o": ["Rp70.000.000", "Rp40.000.000", "Rp46.000.000", "Rp100.000.000"], "c": 0, "e": "Sanksi kenaikan dihitung dari pokok pajak: 75% x Rp40.000.000 = Rp30.000.000. Total yang harus dibayar = pokok + sanksi = Rp40.000.000 + Rp30.000.000 = Rp70.000.000. Opsi Rp40.000.000 keliru karena mengabaikan sanksi; Rp46.000.000 keliru karena memakai tarif bunga (15%) bukan tarif kenaikan (75%); Rp100.000.000 keliru karena memakai persentase 150%.", "topic": "Sanksi Administrasi — Kenaikan", "id": "pengawasan_sk_54"}, {"q": "PT Abadi Jaya terlambat menyampaikan SPT Masa PPN untuk 3 Masa Pajak berturut-turut, dan juga terlambat menyampaikan SPT Tahunan PPh Badan.\nBerapa total sanksi denda administrasi (Pasal 7 ayat 1 UU KUP) yang dikenakan?", "o": ["Rp2.500.000", "Rp1.300.000", "Rp1.000.000", "Rp2.000.000"], "c": 0, "e": "Denda SPT Masa PPN = Rp500.000 per Masa Pajak x 3 = Rp1.500.000. Denda SPT Tahunan PPh Badan = Rp1.000.000. Total = Rp1.500.000 + Rp1.000.000 = Rp2.500.000. Opsi Rp1.300.000 keliru karena memakai tarif denda SPT Masa lainnya (Rp100.000) alih-alih tarif khusus SPT Masa PPN (Rp500.000).", "topic": "Sanksi Administrasi — Denda SPT", "id": "pengawasan_sk_55"}, {"q": "WP mengajukan keberatan atas SKPKB sebesar Rp200.000.000, dan DJP mengabulkan sebagian (disetujui WP Rp50.000.000 dalam pembahasan akhir, sisa sengketa Rp150.000.000 ditolak). WP kemudian mengajukan Banding atas sisa sengketa tersebut ke Pengadilan Pajak, dan Majelis Hakim memutus menolak permohonan banding WP sepenuhnya.\nBerapa sanksi denda Pasal 27 UU KUP yang dikenakan atas penolakan banding, dan dari jumlah berapa dihitung?", "o": ["Rp90.000.000, dihitung 60% dari sisa sengketa yang ditolak banding (Rp150.000.000)", "Rp120.000.000, dihitung 60% dari total SKPKB awal (Rp200.000.000)", "Rp45.000.000, dihitung 30% dari sisa sengketa (Rp150.000.000)", "Rp30.000.000, dihitung 60% dari jumlah yang telah disetujui WP (Rp50.000.000)"], "c": 0, "e": "Sanksi denda banding sebesar 60% dihitung dari jumlah pajak yang masih disengketakan dan ditolak oleh Putusan Banding — yaitu sisa sengketa pasca-keberatan (Rp150.000.000), bukan dari total SKPKB awal. 60% x Rp150.000.000 = Rp90.000.000. Tarif 30% adalah untuk sanksi denda keberatan (Pasal 25), bukan banding.", "topic": "Sanksi Administrasi — Keberatan vs Banding", "id": "pengawasan_sk_56"}, {"q": "Hasil pemeriksaan atas SPT Lebih Bayar yang diajukan WP menunjukkan bahwa jumlah lebih bayar sesuai dengan yang dilaporkan WP, tanpa ada koreksi.\nJenis Surat Ketetapan Pajak yang diterbitkan?", "o": ["SKPLB (Surat Ketetapan Pajak Lebih Bayar)", "SKPKB (Surat Ketetapan Pajak Kurang Bayar)", "SKPN (Surat Ketetapan Pajak Nihil)", "SKPKBT (Surat Ketetapan Pajak Kurang Bayar Tambahan)"], "c": 0, "e": "SKPLB diterbitkan berdasarkan hasil Pemeriksaan (atau hasil Penelitian) ketika jumlah kredit pajak atau pajak yang dibayar lebih besar dari pajak yang terutang, sesuai dengan kondisi SPT Lebih Bayar yang terbukti benar. SKPN diterbitkan jika jumlah pajak terutang sama dengan jumlah kredit pajak (nihil), bukan untuk kondisi lebih bayar.", "topic": "Teknis Prosedural — Jenis Ketetapan", "id": "pengawasan_sk_57"}, {"q": "KPP menerima Data Konkret berupa Faktur Pajak yang telah disetujui melalui sistem DJP namun belum dilaporkan oleh PKP dalam SPT Masa PPN-nya.\nJenis pemeriksaan dan jangka waktu pengujian yang berlaku atas kasus ini?", "o": ["Pemeriksaan berdasarkan Data Konkret, jangka waktu pengujian 10 hari kerja", "Pemeriksaan Lengkap, jangka waktu pengujian 5 bulan", "Pemeriksaan Terfokus, jangka waktu pengujian 3 bulan", "Pemeriksaan Spesifik tanpa dasar data konkret, jangka waktu pengujian 1 bulan"], "c": 0, "e": "Data Konkret (termasuk Faktur Pajak yang disetujui sistem namun belum dilaporkan) memerlukan pengujian yang sederhana sehingga diberikan jangka waktu pengujian tersingkat, yaitu 10 hari kerja — berbeda dari Pemeriksaan Lengkap (5 bulan), Terfokus (3 bulan), atau Spesifik tanpa data konkret (1 bulan) yang memerlukan pendalaman lebih luas.", "topic": "Teknis Prosedural — Jenis Pemeriksaan", "id": "pengawasan_sk_58"}, {"q": "Pemeriksa Pajak sedang mengidentifikasi informasi mana yang termasuk kategori 'Data Konkret' sesuai PER-18/PJ/2025. Berikut ini TERMASUK Data Konkret, KECUALI...", "o": ["Faktur Pajak yang telah disetujui sistem DJP namun belum/tidak dilaporkan di SPT Masa PPN", "Bukti Potput PPh yang belum/tidak dilaporkan oleh penerbit bukti potput pada SPT Masa PPh", "Bukti transaksi/data perpajakan lain yang dapat digunakan untuk menghitung kewajiban perpajakan WP", "Laporan keuangan auditan yang diserahkan WP secara sukarela tanpa ada indikasi ketidaksesuaian"], "c": 3, "e": "Data Konkret menurut PER-18/PJ/2025 mencakup 3 jenis: Faktur Pajak yang disetujui sistem namun belum dilaporkan, Bukti Potput PPh yang belum/tidak dilaporkan, dan Bukti Transaksi/Data Perpajakan lain yang dapat dipakai menghitung kewajiban pajak. Laporan keuangan auditan yang diserahkan sukarela tanpa indikasi ketidaksesuaian bukan termasuk kategori Data Konkret — itu adalah dokumen pendukung biasa, bukan data pemicu pemeriksaan berbasis data konkret.", "topic": "Teknis Prosedural — Data Konkret", "id": "pengawasan_sk_59"}, {"q": "PT Makmur Jaya (WP Badan, peredaran bruto Tahun Pajak 2023 Rp20.000.000.000, tarif PPh Badan umum 22%) membebankan biaya jasa konsultan sebesar Rp400.000.000 yang didukung Faktur Pajak dari PKP penerbit. Dalam pemeriksaan, terbukti transaksi tersebut fiktif (tidak ada penyerahan jasa yang sebenarnya terjadi). Akibatnya: (1) biaya Rp400.000.000 tidak dapat diakui sebagai pengurang penghasilan bruto karena bukan biaya yang benar-benar dikeluarkan untuk mendapatkan, menagih, dan memelihara penghasilan; dan (2) Pajak Masukan atas Faktur Pajak tersebut (yang telah dikreditkan WP) tidak dapat dikreditkan karena tidak memenuhi syarat material Pasal 9 ayat (8) huruf f UU PPN. Berapa total pokok pajak (PPh Badan + PPN) yang kurang dibayar akibat temuan ini (tarif PPN 11%)?", "o": ["Rp132.000.000", "Rp88.000.000", "Rp44.000.000", "Rp176.000.000"], "c": 0, "e": "Koreksi PPh Badan: biaya fiktif Rp400.000.000 dikoreksi positif (ditambahkan ke PKP) karena tidak memenuhi syarat biaya 3M (Pasal 6 UU PPh). PPh kurang bayar = 22% x Rp400.000.000 = Rp88.000.000.\nKoreksi PPN: Pajak Masukan yang telah dikreditkan atas Faktur Pajak fiktif tersebut dibatalkan pengkreditannya (Pasal 9 ayat 8 huruf f UU PPN — Faktur Pajak tidak memenuhi persyaratan material). PPN kurang bayar = 11% x Rp400.000.000 = Rp44.000.000.\nTotal pokok pajak kurang bayar = Rp88.000.000 + Rp44.000.000 = Rp132.000.000.", "topic": "Gabungan PPh+PPN — Faktur Fiktif", "id": "pengawasan_sk_60"}, {"q": "WP Orang Pribadi pedagang eceran tidak dapat menunjukkan pembukuan yang lengkap saat pemeriksaan, sehingga Pemeriksa Pajak menggunakan Metode Tidak Langsung — pendekatan Penghitungan Rasio (gross profit margin industri sejenis 25% dari peredaran usaha). Diketahui Harga Pokok Penjualan (HPP) yang dapat diyakini kebenarannya sebesar Rp600.000.000, sedangkan dalam SPT WP melaporkan peredaran usaha hanya Rp500.000.000. Dengan margin laba kotor 25% (artinya HPP = 75% dari peredaran usaha), berapa PPN yang kurang dibayar akibat selisih peredaran usaha hasil penghitungan secara jabatan tersebut (tarif PPN 11%)?", "o": ["Rp33.000.000", "Rp66.000.000", "Rp25.000.000", "Rp0 (penghitungan secara jabatan hanya berlaku untuk PPh)"], "c": 0, "e": "Peredaran usaha hasil penghitungan secara jabatan = HPP / (1 - margin) = Rp600.000.000 / (1 - 0,25) = Rp600.000.000 / 0,75 = Rp800.000.000.\nSelisih peredaran usaha = Rp800.000.000 - Rp500.000.000 (yang dilaporkan) = Rp300.000.000.\nKarena peredaran usaha riil lebih tinggi, omzet PPN yang seharusnya dilaporkan juga lebih tinggi sejumlah selisih tersebut (prinsip ekualisasi omzet PPh-PPN). PPN kurang bayar = 11% x Rp300.000.000 = Rp33.000.000. Penghitungan secara jabatan tidak hanya berlaku untuk PPh — begitu peredaran usaha dikoreksi, implikasinya beruntun ke PPN karena keduanya berbasis omzet yang sama.", "topic": "Gabungan — Metode Tidak Langsung & Ekualisasi PPN", "id": "pengawasan_sk_61"}, {"q": "PT Sentosa menjual barang kepada perusahaan afiliasi di luar negeri senilai Rp10.000.000.000. Berdasarkan analisis kesebandingan dengan metode Comparable Uncontrolled Price (CUP), harga wajar (arm's length price) atas transaksi sejenis adalah Rp11.000.000.000 (10% lebih tinggi dari harga yang digunakan PT Sentosa). Pemeriksa memastikan bahwa transaksi ini BUKAN merupakan ekspor (barang diserahkan dan dikonsumsi di dalam Daerah Pabean melalui skema tertentu, sehingga tetap terutang PPN dengan tarif normal, bukan tarif ekspor 0%). Selain koreksi PPh atas selisih harga jual sesuai Prinsip Kewajaran dan Kelaziman Usaha (PKKU), berapa PPN Keluaran yang kurang dipungut akibat penyesuaian harga wajar tersebut (tarif PPN 11%)?", "o": ["Rp110.000.000", "Rp100.000.000", "Rp1.100.000.000", "Rp0 (karena transaksi ekspor, tarif PPN 0%)"], "c": 0, "e": "Selisih harga akibat penyesuaian PKKU = Rp11.000.000.000 - Rp10.000.000.000 = Rp1.000.000.000. Karena transaksi ini ditegaskan BUKAN ekspor (dikenakan PPN tarif normal, bukan 0%), DPP PPN juga harus disesuaikan mengikuti harga wajar hasil analisis PKKU. PPN Keluaran yang kurang dipungut = 11% x Rp1.000.000.000 = Rp110.000.000. (Catatan: jika transaksi ini benar ekspor, PPN tetap 0% dan tidak ada PPN kurang dipungut — namun skenario ini eksplisit menyatakan bukan ekspor.)", "topic": "Gabungan — Transfer Pricing & PPN", "id": "pengawasan_sk_62"}, {"q": "PT Abadi Karya (peredaran bruto di atas Rp4,8 miliar, tarif PPh Badan umum 22%) menjual bangunan yang sebelumnya digunakan untuk kegiatan usaha (bukan aktiva yang menurut tujuan semula untuk diperjualbelikan) kepada pihak ketiga senilai Rp2.000.000.000. Nilai buku fiskal bangunan tersebut saat dijual adalah Rp1.700.000.000. WP TIDAK memungut PPN atas penjualan ini (beranggapan bukan objek PPN), padahal Pajak Masukan atas perolehan bangunan tersebut dahulu telah dikreditkan oleh WP, sehingga penjualan ini tetap terutang PPN sesuai Pasal 16D UU PPN. WP juga tidak melaporkan laba penjualan aset tersebut sebagai penghasilan kena pajak. Berapa total pokok pajak (PPh Badan atas laba penjualan + PPN Pasal 16D) yang kurang dibayar?", "o": ["Rp286.000.000", "Rp220.000.000", "Rp66.000.000", "Rp33.000.000"], "c": 0, "e": "Laba penjualan aset = harga jual - nilai buku fiskal = Rp2.000.000.000 - Rp1.700.000.000 = Rp300.000.000. Laba ini merupakan objek PPh (Pasal 4 ayat 1 huruf d UU PPh — keuntungan karena penjualan harta). PPh kurang bayar = 22% x Rp300.000.000 = Rp66.000.000.\nPPN Pasal 16D UU PPN: penyerahan aktiva yang menurut tujuan semula tidak untuk diperjualbelikan tetap terutang PPN KECUALI Pajak Masukannya tidak dapat dikreditkan — di sini PM telah dikreditkan, sehingga penjualan ini terutang PPN. DPP = harga jual = Rp2.000.000.000. PPN kurang dipungut = 11% x Rp2.000.000.000 = Rp220.000.000.\nTotal pokok pajak kurang bayar = Rp66.000.000 + Rp220.000.000 = Rp286.000.000.", "topic": "Gabungan — Penjualan Aset & Pasal 16D", "id": "pengawasan_sk_63"}, {"q": "PT Nusantara (peredaran bruto di atas Rp4,8 miliar, tarif PPh Badan umum 22%) membebankan biaya jamuan/entertainment sebesar Rp150.000.000 sebagai pengurang penghasilan bruto, dan turut mengkreditkan Pajak Masukan atas pembelian makanan dan minuman untuk keperluan jamuan tersebut. Dalam pemeriksaan, WP tidak dapat menunjukkan daftar nominatif biaya entertainment sesuai ketentuan yang berlaku, sehingga biaya tersebut tidak dapat dibiayakan secara fiskal. Pajak Masukan atas perolehan makanan dan minuman juga tidak dapat dikreditkan sesuai Pasal 9 ayat (8) UU PPN. Berapa total pokok pajak (PPh Badan + PPN) yang kurang dibayar (tarif PPN 11%)?", "o": ["Rp49.500.000", "Rp33.000.000", "Rp16.500.000", "Rp66.000.000"], "c": 0, "e": "Koreksi PPh Badan: biaya entertainment Rp150.000.000 dikoreksi positif karena tidak didukung daftar nominatif (syarat formal agar dapat dibiayakan). PPh kurang bayar = 22% x Rp150.000.000 = Rp33.000.000.\nKoreksi PPN: Pajak Masukan atas makanan dan minuman yang telah dikreditkan dibatalkan sesuai Pasal 9 ayat (8) UU PPN. PPN kurang bayar = 11% x Rp150.000.000 = Rp16.500.000.\nTotal pokok pajak kurang bayar = Rp33.000.000 + Rp16.500.000 = Rp49.500.000.", "topic": "Gabungan — Biaya Entertainment & Pengkreditan PM", "id": "pengawasan_sk_64"}, {"q": "Dari suatu temuan pemeriksaan, total pokok pajak kurang bayar gabungan (PPh Badan + PPN) ditetapkan sebesar Rp132.000.000. Tarif bunga per bulan yang berlaku (sudah termasuk uplift factor sesuai Pasal 13 ayat (2) UU KUP) ditetapkan sebesar 1% per bulan, dengan keterlambatan pembayaran selama 8 bulan sejak saat terutangnya pajak (belum melebihi batas maksimal pengenaan 24 bulan). Berapa total sanksi bunga yang dikenakan atas pokok pajak tersebut?", "o": ["Rp10.560.000", "Rp13.200.000", "Rp1.320.000", "Rp0 (sanksi bunga hanya dikenakan untuk PPh, tidak untuk PPN)"], "c": 0, "e": "Sanksi bunga Pasal 13 ayat (2) UU KUP dihitung dari pokok pajak kurang bayar dikalikan tarif bunga per bulan dikalikan jumlah bulan keterlambatan (maksimal 24 bulan). Sanksi bunga = Rp132.000.000 x 1% x 8 = Rp10.560.000. Sanksi bunga berlaku untuk seluruh jenis pajak yang kurang dibayar berdasarkan hasil pemeriksaan, baik PPh maupun PPN, bukan hanya PPh.", "topic": "Gabungan — Sanksi atas Koreksi Gabungan", "id": "pengawasan_sk_65"}, {"q": "Dalam satu pemeriksaan terhadap WP Badan untuk Tahun Pajak yang sama, Pemeriksa menemukan baik koreksi PPh Badan maupun koreksi PPN untuk beberapa Masa Pajak. Bagaimana penerbitan Surat Ketetapan Pajaknya yang benar?", "o": ["Diterbitkan terpisah: satu SKPKB PPh Badan untuk Tahun Pajak terkait, dan SKPKB PPN tersendiri untuk setiap Masa Pajak yang dikoreksi", "Digabung dalam satu SKPKB yang sekaligus mencakup PPh Badan dan seluruh Masa Pajak PPN", "Hanya diterbitkan SKPKB PPh Badan karena koreksi PPN otomatis mengikuti tanpa ketetapan terpisah", "WP dapat memilih sendiri jenis pajak mana yang akan diterbitkan surat ketetapannya"], "c": 0, "e": "Setiap Surat Ketetapan Pajak berlaku untuk satu jenis pajak dan satu Masa Pajak/Tahun Pajak (prinsip yang sama dengan pengajuan keberatan: 1 keberatan untuk 1 jenis pajak dan 1 Masa/Tahun Pajak, Pasal 25 UU KUP). Oleh karena itu, atas temuan koreksi PPh Badan diterbitkan satu SKPKB PPh Badan untuk Tahun Pajak terkait, sedangkan atas koreksi PPN diterbitkan SKPKB PPN tersendiri untuk masing-masing Masa Pajak yang dikoreksi — tidak digabung dalam satu dokumen ketetapan.", "topic": "Gabungan — Prosedur Penerbitan Ketetapan", "id": "pengawasan_sk_66"}, {"q": "PT Graha Properti (pengembang perumahan) menjual sebuah rumah kepada konsumen melalui Perjanjian Pengikatan Jual Beli (PPJB) senilai Rp1.500.000.000. WP tidak menyetor PPh Final atas Penghasilan dari Pengalihan Hak atas Tanah dan/atau Bangunan (tarif final 2,5% dari nilai pengalihan sesuai PMK 261/2016) atas transaksi tersebut. Selain itu, saat penyerahan unit kepada konsumen, WP juga tidak memungut PPN meskipun rumah tersebut termasuk kategori yang tidak dibebaskan dari pengenaan PPN (tarif 11%). Berapa total kewajiban pajak (PPh Final PHTB + PPN) yang kurang dibayar/dipungut oleh WP?", "o": ["Rp202.500.000", "Rp165.000.000", "Rp37.500.000", "Rp240.000.000"], "c": 0, "e": "PPh Final atas Pengalihan Hak atas Tanah dan/atau Bangunan = 2,5% x Rp1.500.000.000 = Rp37.500.000 (PMK 261/2016, bersifat final, dibayar sendiri oleh penjual/pengembang sebelum/saat penandatanganan akta).\nPPN atas penyerahan rumah (BKP) oleh pengembang = 11% x Rp1.500.000.000 = Rp165.000.000 — kedua jenis pajak ini dikenakan SEKALIGUS atas transaksi penjualan properti oleh pengembang (PPh Final PHTB di sisi penjual, PPN di sisi penyerahan BKP), bukan saling menggantikan.\nTotal kurang bayar = Rp37.500.000 + Rp165.000.000 = Rp202.500.000.", "topic": "Gabungan — PHTB & PPN Properti", "id": "pengawasan_sk_67"}, {"q": "Dari hasil konfirmasi kepada pembeli dan rekonsiliasi arus kas bank, Pemeriksa menemukan PT Cahaya Abadi (peredaran bruto di atas Rp4,8 miliar, tarif PPh Badan umum 22%) menjual barang dengan harga sebenarnya Rp5.000.000.000, namun hanya melaporkan Rp4.200.000.000 dalam SPT Tahunan PPh dan Faktur Pajak (under-invoicing). Berapa total pokok pajak (PPh Badan + PPN) yang kurang dibayar akibat selisih omzet yang tidak dilaporkan tersebut (tarif PPN 11%)?", "o": ["Rp264.000.000", "Rp176.000.000", "Rp88.000.000", "Rp352.000.000"], "c": 0, "e": "Selisih omzet yang tidak dilaporkan = Rp5.000.000.000 - Rp4.200.000.000 = Rp800.000.000. Karena under-invoicing mempengaruhi baik SPT PPh maupun Faktur Pajak PPN secara bersamaan atas transaksi yang sama, koreksi dilakukan pada kedua jenis pajak atas dasar yang sama (selisih Rp800.000.000), bukan dihitung dari total omzet Rp5.000.000.000.\nPPh Badan kurang bayar = 22% x Rp800.000.000 = Rp176.000.000.\nPPN kurang bayar = 11% x Rp800.000.000 = Rp88.000.000.\nTotal = Rp176.000.000 + Rp88.000.000 = Rp264.000.000.", "topic": "Gabungan — Under-invoicing Omzet", "id": "pengawasan_sk_68"}, {"q": "Dalam satu pemeriksaan, ditemukan koreksi PPh Badan yang berujung pada penerbitan SKPKB (WP berencana mengajukan keberatan), sekaligus ditemukan indikasi tindak pidana perpajakan berupa penerbitan dan penggunaan Faktur Pajak yang tidak berdasarkan transaksi sebenarnya (faktur fiktif). Bagaimana proses yang akan dijalani WP atas kedua temuan tersebut?", "o": ["Proses keberatan atas SKPKB PPh Badan tetap berjalan secara administratif terpisah, sementara indikasi faktur fiktif ditindaklanjuti melalui jalur penegakan hukum (pemeriksaan bukti permulaan/penyidikan), karena keduanya berada pada ranah berbeda", "Proses penegakan hukum pidana secara otomatis membatalkan SKPKB PPh Badan yang telah diterbitkan", "WP tidak dapat mengajukan keberatan atas SKPKB PPh Badan karena adanya indikasi tindak pidana", "Kedua proses (keberatan dan tindak pidana) digabung menjadi satu berkas penyelesaian sengketa"], "c": 0, "e": "Proses administratif (keberatan atas SKPKB) dan proses penegakan hukum pidana (atas indikasi penerbitan/penggunaan Faktur Pajak fiktif) berjalan pada ranah yang berbeda dan tidak saling meniadakan. WP tetap berhak mengajukan keberatan atas SKPKB PPh Badan sesuai haknya menurut UU KUP, sementara indikasi tindak pidana perpajakan ditindaklanjuti secara terpisah melalui pemeriksaan bukti permulaan dan, jika cukup bukti, penyidikan — kedua proses berjalan paralel, bukan digabung maupun saling membatalkan.", "topic": "Gabungan — Keberatan vs Tindak Pidana", "id": "pengawasan_sk_69"}, {"q": "Kontraktor Migas B membayar dana talangan pembiayaan operasi kontrak bagi hasil (kewajiban partisipasi Kontraktor lain) sebesar Rp2.500.000.000 dan menerima imbalan Uplift senilai jumlah tersebut dari Kontraktor yang dibantu. Berapa PPh final yang wajib dipotong oleh Kontraktor pembayar Uplift, dan bagaimana perlakuan PKP setelah dikurangi PPh final tersebut?", "o": ["Rp500.000.000 (20% x Rp2,5 miliar), bersifat final dan PKP setelahnya tidak dikenai PPh lagi", "Rp175.000.000 (7% x Rp2,5 miliar), karena dianggap pengalihan Participating Interest masa eksploitasi", "Rp125.000.000 (5% x Rp2,5 miliar), karena dianggap pengalihan Participating Interest masa eksplorasi", "Rp0, karena Uplift bukan objek PPh di luar Kontrak Kerja Sama"], "c": 0, "e": "Sesuai PMK 257/2011, Uplift (imbalan atas dana talangan pembiayaan operasi yang seharusnya jadi kewajiban partisipasi Kontraktor lain) dikenakan PPh final tarif 20% dari jumlah bruto, terutang saat dibayar/diakui sebagai biaya, dan dipotong oleh Kontraktor pembayar. PPh = 20% x Rp2.500.000.000 = Rp500.000.000. Sesuai Pasal 27 ayat (1a) PP 27/2017, PKP setelah dikurangi PPh final dari Uplift TIDAK dikenai PPh lagi — berbeda dengan tarif 5%/7% yang berlaku untuk pengalihan Participating Interest, bukan Uplift.", "id": "pengawasan_sk_70"}, {"q": "Kontraktor C mengalihkan Participating Interest (PI) miliknya pada masa Eksploitasi dengan nilai bruto pengalihan Rp10.000.000.000. Transaksi ini tidak memenuhi syarat pengecualian PPh final (bukan pengalihan sebagian, dimiliki kurang dari 3 tahun). Berapa PPh final yang terutang atas pengalihan tersebut?", "o": ["Rp2.000.000.000 (20%)", "Rp500.000.000 (5%, tarif masa Eksplorasi)", "Rp700.000.000 (7%, tarif masa Eksploitasi)", "Rp0, karena pengalihan PI tidak dikenai PPh"], "c": 2, "e": "PMK 257/2011 mengenakan PPh final atas pengalihan Participating Interest dengan tarif berbeda menurut tahapan kontrak: 5% dari jumlah bruto untuk masa Eksplorasi, dan 7% dari jumlah bruto untuk masa Eksploitasi. Karena transaksi terjadi pada masa Eksploitasi dan tidak memenuhi syarat pengecualian (kepemilikan PI >3 tahun, tidak mengalihkan seluruh PI, dsb), maka PPh final = 7% x Rp10.000.000.000 = Rp700.000.000. Tarif 20% adalah tarif Uplift, bukan pengalihan PI — jangan tertukar antara dua jenis penghasilan lain Kontraktor ini.", "id": "pengawasan_sk_71"}, {"q": "SKK Migas menerima Laporan Bulanan Penerimaan Negara (LPN) dari Kontraktor untuk Masa Pajak Januari 2026, yang disamakan kedudukannya dengan SPT Masa PPh. Sesuai PMK 79/2012, kapan batas akhir penyampaian LPN tersebut, dan apa konsekuensinya jika terlambat?", "o": ["Paling lambat 20 Februari 2026; keterlambatan dikenai sanksi sesuai ketentuan perundang-undangan perpajakan", "Paling lambat akhir Februari 2026 (sama seperti SPT Masa PPN); tidak ada sanksi khusus", "Paling lambat 31 Januari 2026 (akhir bulan berjalan); dianggap SPT tidak disampaikan jika lewat", "Paling lambat 15 Februari 2026; dikenai sanksi bunga 2% per bulan"], "c": 0, "e": "Sesuai PMK 79/PMK.02/2012, Laporan Penerimaan Negara (LPN) — Laporan Bulanan yang disamakan dengan SPT Masa PPh — disampaikan paling lambat tanggal 20 bulan berikutnya (jika bertepatan hari libur, disampaikan hari kerja berikutnya). Untuk Masa Pajak Januari 2026, batas waktunya adalah 20 Februari 2026. Keterlambatan dikenai sanksi sesuai ketentuan perundang-undangan perpajakan (bukan ketentuan khusus migas).", "id": "pengawasan_sk_72"}, {"q": "Bank Y melaporkan Laporan Keuangan ke OJK yang menunjukkan penghasilan neto sejak awal Tahun Pajak sebesar Rp120.000.000.000, tanpa kredit pajak PPh 21/22/23/24 tahun berjalan. Tarif PPh Badan yang berlaku adalah 22%. Berapa angsuran PPh Pasal 25 bulanan Bank Y menurut PMK 215/2018?", "o": ["Rp2.200.000.000 per bulan", "Rp8.800.000.000 per bulan (dibagi 3 bulan, mengikuti rumus WP Masuk Bursa)", "Rp10.000.000.000 per bulan (dibagi 12 tanpa dikalikan tarif terlebih dahulu)", "Rp220.000.000 per bulan (tarif dianggap 2,2%)"], "c": 0, "e": "PMK 215/2018 mengatur formula khusus untuk Bank: Angsuran PPh 25 = (Penghasilan Neto berdasarkan Laporan Keuangan yang disampaikan ke OJK sejak awal Tahun Pajak x Tarif PPh Badan − Kredit Pajak tahun berjalan) ÷ 12 bulan. Perhitungan: (Rp120.000.000.000 x 22% − Rp0) ÷ 12 = Rp26.400.000.000 ÷ 12 = Rp2.200.000.000. Pembagian dengan 3 bulan berlaku untuk WP Masuk Bursa/WP Lainnya (Laporan Keuangan triwulanan), BUKAN untuk Bank yang Laporan Keuangannya disampaikan sejak awal Tahun Pajak dan dibagi 12 bulan.", "id": "pengawasan_sk_73"}, {"q": "Sebuah Kontraktor Kontrak Kerja Sama Migas, yang ditunjuk sebagai Pemungut PPN sesuai PMK 73/PMK.03/2010, menerima dua tagihan dari rekanan: Tagihan A senilai Rp9.000.000 dan Tagihan B senilai Rp15.000.000. Tagihan mana yang WAJIB dipungut PPN oleh Kontraktor tersebut?", "o": ["Kedua tagihan wajib dipungut PPN oleh Kontraktor", "Hanya Tagihan B (Rp15.000.000) yang wajib dipungut; Tagihan A dikecualikan karena nilainya ≤Rp10 juta", "Hanya Tagihan A (Rp9.000.000) yang wajib dipungut; Tagihan B harus dipungut sendiri oleh rekanan", "Kedua tagihan dikecualikan dari pemungutan PPN oleh Kontraktor"], "c": 1, "e": "Mekanisme Kontraktor Migas/Panas Bumi/IUPK sebagai Pemungut PPN (PMK 73/2010 & PMK 166/2018) sama dengan skema BUMN Pemungut, termasuk pengecualian pemungutan untuk pembayaran yang nilainya ≤Rp10.000.000 (tidak termasuk PPN). Tagihan A sebesar Rp9.000.000 berada di bawah ambang batas sehingga dikecualikan dari pemungutan (PPN disetor sendiri oleh rekanan secara umum), sedangkan Tagihan B sebesar Rp15.000.000 melebihi ambang batas sehingga wajib dipungut, disetor (SSP atas nama Kontraktor, paling lambat akhir bulan berikutnya), dan dilaporkan oleh Kontraktor selaku Pemungut PPN.", "id": "pengawasan_sk_74"}, {"q": "CV Makmur Jaya terdaftar sebagai WP Badan sejak tahun 2020 dan menggunakan PPh Final UMKM 0,5% (PP 55/2022) sejak saat itu. Pada tahun pajak 2025 (tahun ke-6 sejak terdaftar), CV tersebut masih menghitung dan membayar PPh terutangnya menggunakan tarif Final 0,5%. Apakah hal ini sesuai ketentuan?", "o": ["Sesuai, karena CV mendapat jangka waktu penggunaan 7 tahun sama seperti WP Orang Pribadi", "Tidak sesuai — jangka waktu penggunaan untuk CV/Firma/Koperasi/BUMDes hanya 4 tahun (2020–2023), sejak Tahun Pajak 2024 CV tersebut seharusnya sudah menggunakan tarif PPh Badan umum", "Sesuai, selama peredaran bruto CV masih di bawah Rp4,8 miliar setahun, jangka waktu tidak membatasi", "Tidak sesuai — jangka waktu penggunaan untuk CV hanya 3 tahun (2020–2022) sama seperti PT"], "c": 1, "e": "PP 55/2022 membatasi jangka waktu penggunaan PPh Final UMKM 0,5% berdasarkan bentuk WP, dihitung sejak terdaftar: WP OP 7 tahun; WP Badan berbentuk PT 3 tahun; WP Badan berbentuk CV/Firma/Koperasi/BUMDes/PT WP OP 4 tahun. CV Makmur Jaya terdaftar 2020, sehingga jangka waktu 4 tahunnya adalah 2020–2023. Pada Tahun Pajak 2025 (tahun ke-6), CV tersebut sudah melewati jangka waktu dan seharusnya menggunakan tarif PPh Badan umum (Pasal 17/31E UU PPh) sejak Tahun Pajak 2024 — penggunaan tarif Final pada 2025 tidak sesuai ketentuan dan berpotensi dikoreksi saat pemeriksaan.", "id": "pengawasan_sk_75"}, {"q": "Firma Abadi (bentuk usaha firma) ingin tetap menggunakan PPh Final UMKM 0,5% pada Tahun Pajak 2027, dengan peredaran bruto Rp3.000.000.000 (di bawah batas Rp4,8 miliar) dan masih dalam jangka waktu penggunaan. Berdasarkan PP 20/2026 (perubahan Pasal 57 PP 55/2022), apakah Firma Abadi masih berhak menggunakan tarif Final tersebut?", "o": ["Berhak, karena peredaran bruto masih di bawah Rp4,8 miliar dan masih dalam jangka waktu", "Berhak, karena firma termasuk kategori badan usaha kecil yang dikecualikan dari pembatasan", "Tidak berhak — PP 20/2026 mempersempit subjek badan yang boleh menggunakan PPh Final 0,5% hanya menjadi PT perorangan yang didirikan oleh 1 orang dan koperasi; CV/firma/PT biasa/BUMDes tidak lagi termasuk, terlepas dari peredaran bruto atau jangka waktu", "Tidak berhak, hanya karena jangka waktu penggunaan firma sudah habis, bukan karena perubahan subjek"], "c": 2, "e": "PP 20/2026 mengubah Pasal 57 PP 55/2022: subjek badan yang berhak atas PPh Final UMKM 0,5% dipersempit dari (koperasi, CV/firma, PT termasuk PT WP OP, BUMDes) menjadi HANYA PT perseroan perorangan yang didirikan oleh 1 orang, dan koperasi. Firma (bentuk firma) tidak lagi termasuk subjek yang berhak sejak berlakunya PP 20/2026, berapa pun peredaran brutonya dan meski masih dalam jangka waktu 4 tahun — Firma Abadi wajib beralih ke tarif PPh Badan umum.", "id": "pengawasan_sk_76"}, {"q": "Seorang Agen Asuransi menerima komisi sebesar Rp50.000.000 dari Perusahaan Asuransi pada periode sebelum tarif PPN 12% berlaku. Berapa PPN yang wajib dipungut, disetor, dan dilaporkan oleh Perusahaan Asuransi atas komisi tersebut sesuai PMK 67/PMK.03/2022?", "o": ["Rp550.000 (1,1% dari komisi)", "Rp1.100.000 (2,2% dari komisi, tarif untuk Pialang Asuransi)", "Rp5.500.000 (11% dari komisi, tarif PPN umum)", "Rp6.000.000 (12% dari komisi)"], "c": 0, "e": "PMK 67/PMK.03/2022 mewajibkan Perusahaan Asuransi/Reasuransi memungut, menyetor, dan melaporkan PPN atas komisi yang dibayarkan ke Agen Asuransi dan Perusahaan Pialang Asuransi/Reasuransi dengan besaran tertentu: Agen Asuransi 1,1% dari komisi (sebelum tarif PPN 12% berlaku), sedangkan Pialang Asuransi/Reasuransi 2,2% dari komisi. PPN = 1,1% x Rp50.000.000 = Rp550.000. Tarif 2,2% hanya berlaku untuk Pialang, bukan Agen — jangan tertukar antara kedua jenis perantara ini.", "id": "pengawasan_sk_77"}, {"q": "Dalam CRM Specific Risk Sektor Rokok, prediktor SR10_X_013 pada Klaster Peredaran Usaha ditemukan aktif pada profil WP Industri Rokok golongan Kretek Mesin (KLU 12013). Kondisi apa yang diindikasikan oleh prediktor tersebut, dan apa tindak lanjut yang paling tepat?", "o": ["Penjualan produk hasil tembakau per SPT Tahunan lebih kecil dari data Total Harga Jual Eceran (HJE) pada CK1 & DPP Ekspor PEB — mengindikasikan potensi peredaran usaha yang belum dilaporkan, perlu ditindaklanjuti dengan SP2DK/analisis lebih lanjut", "Rasio biaya tenaga kerja terhadap total biaya produksi melebihi rata-rata industri sejenis", "WP tidak melaporkan kepemilikan mesin produksi rokok dalam SPT Tahunan", "Selisih kurs valuta asing atas pembelian bahan baku impor tidak dilaporkan sebagai penghasilan"], "c": 0, "e": "Klaster Prediktor Peredaran Usaha pada CRM Specific Risk Sektor Rokok (termasuk SR10_X_013, SR10_X_002, SR10_X_003) mendeteksi kondisi di mana penjualan produk hasil tembakau yang dilaporkan WP dalam SPT Tahunan lebih kecil dibandingkan data Total Harga Jual Eceran (HJE) pada CK1 (dokumen pemesanan pita cukai) dan DPP Ekspor pada PEB (Pemberitahuan Ekspor Barang) — sebuah indikasi kuat adanya peredaran usaha yang belum sepenuhnya dilaporkan. Karena ini adalah indikasi berbasis data (bukan data konkret formal), tindak lanjut yang tepat adalah analisis risiko lebih lanjut/SP2DK, bukan langsung pemeriksaan data konkret.", "id": "pengawasan_sk_78"}, {"q": "Seorang Pedagang Emas Perhiasan menjual emas senilai Rp500.000.000 kepada konsumen akhir, namun tidak memiliki faktur pajak atau dokumen tertentu yang lengkap atas perolehan/impor emas yang dijualnya (sesuai PMK-48/2023). Berapa PPN yang terutang atas penyerahan tersebut?", "o": ["Rp5.500.000 (1,1% — tarif Pedagang Emas dengan dokumen perolehan lengkap)", "Rp8.250.000 (1,65% — tarif Pedagang Emas tanpa dokumen perolehan lengkap)", "Rp8.250.000 (1,65% — tarif Pabrikan Emas Perhiasan ke konsumen akhir)", "Rp55.000.000 (11% — tarif PPN umum karena emas bukan barang strategis)"], "c": 1, "e": "PMK-48/2023 mengenakan PPN atas emas perhiasan dengan tarif berjenjang berdasarkan kelengkapan dokumen Pedagang Emas Perhiasan: 1,1% dari harga jual jika punya faktur pajak/dokumen tertentu lengkap atas perolehan/impor emas, dan 1,65% jika TIDAK punya dokumen lengkap (berbeda dari skema Pabrikan Emas Perhiasan yang tarifnya ditentukan oleh jenis pembeli, bukan kelengkapan dokumen). Karena Pedagang Emas pada kasus ini tidak memiliki dokumen lengkap, PPN = 1,65% x Rp500.000.000 = Rp8.250.000.", "id": "pengawasan_sk_79"}, {"q": "WP pelaku usaha penangkapan ikan tangkap melaporkan data produksi tahun terakhir sebelum Tahun Pajak PBB terutang sebagai berikut: produksi ikan tuna 500.000 kg dengan harga jual rata-rata per kg Rp30.000. Rasio Biaya Produksi yang ditetapkan dengan Keputusan Direktur Jenderal Pajak untuk sektor ini adalah 60% dari Pendapatan Kotor.\nBerapa Pendapatan Bersih (dasar perhitungan Nilai Jual Pengganti sebelum dikalikan Angka Kapitalisasi) atas objek pajak PBB Perikanan Tangkap tersebut?", "o": ["Rp6.000.000.000", "Rp9.000.000.000", "Rp15.000.000.000", "Rp21.000.000.000"], "c": 0, "e": "Tata cara penetapan NJOP Bumi PBB Perikanan Tangkap: Nilai Jual Pengganti (NJP) = Pendapatan Bersih x Angka Kapitalisasi, dengan Pendapatan Bersih = Pendapatan Kotor - Biaya Produksi.\nPendapatan Kotor = jumlah produksi x harga jual rata-rata = 500.000 kg x Rp30.000 = Rp15.000.000.000.\nBiaya Produksi = Rasio Biaya Produksi x Pendapatan Kotor = 60% x Rp15.000.000.000 = Rp9.000.000.000.\nPendapatan Bersih = Rp15.000.000.000 - Rp9.000.000.000 = Rp6.000.000.000 (jawaban A).\nJawaban B keliru karena hanya mengambil angka Biaya Produksi, jawaban C keliru karena lupa mengurangkan Biaya Produksi, dan jawaban D keliru karena menjumlahkan alih-alih mengurangkan.", "p": 0, "topic": "PBB P5L — NJOP Perikanan Tangkap", "id": "pengawasan_sk_80"}, {"q": "Sebuah perusahaan migas mengoperasikan jaringan pipa yang membentang di atas tanah dengan luas bumi 50.000 m². Berdasarkan Keputusan Direktur Jenderal Pajak, NJOP per meter persegi untuk objek Jaringan Pipa di lokasi tersebut ditetapkan sebesar Rp150.000/m².\nBerapa NJOP Bumi atas objek PBB Sektor Lainnya (Jaringan Pipa) tersebut?", "o": ["Rp7.500.000.000", "Rp750.000.000", "Rp75.000.000.000", "Rp200.000.000"], "c": 0, "e": "Tata cara penetapan NJOP Bumi PBB Sektor Lainnya untuk objek Jaringan Pipa (juga berlaku untuk Jaringan Kabel dan Ruas Jalan Tol) dihitung dengan formula: NJOP Bumi = NJOP per m² x Luas Bumi.\nNJOP Bumi = Rp150.000/m² x 50.000 m² = Rp7.500.000.000 (jawaban A).\nJawaban B salah karena kehilangan satu angka nol, jawaban C salah karena pembagian/perkalian terbalik (seolah luas dikalikan 1.000.000), dan jawaban D salah karena hanya menjumlahkan kedua angka alih-alih mengalikannya.", "p": 0, "topic": "PBB P5L — NJOP Sektor Lainnya", "id": "pengawasan_sk_81"}, {"q": "WP menerima SPPT PBB Sektor Lainnya dengan PBB terutang Rp200.000.000, diterima WP pada tanggal 1 Maret 2026. Sampai dengan tanggal 15 Oktober 2026, WP belum melakukan pelunasan sama sekali.\nTindak lanjut apa yang tepat dilakukan KPP atas kondisi WP tersebut?", "o": ["Menerbitkan Surat Tagihan Pajak (STP) PBB, karena pelunasan telah melewati jatuh tempo 6 bulan sejak SPPT diterima (jatuh tempo 1 September 2026)", "Menerbitkan Surat Teguran, karena jatuh tempo pelunasan PBB adalah 1 bulan sejak SPPT diterima", "Tidak ada tindak lanjut karena WP masih memiliki waktu hingga akhir Tahun Pajak untuk melunasi", "Langsung melakukan penyitaan karena jatuh tempo pelunasan PBB adalah 30 hari sejak SPPT diterima"], "c": 0, "e": "Berdasarkan ketentuan penyampaian SPPT, WP wajib melunasi PBB terutang selambat-lambatnya 6 (enam) bulan sejak tanggal SPPT diterima. Jika tidak/kurang dibayar setelah jatuh tempo tersebut, diterbitkan STP PBB.\nSPPT diterima 1 Maret 2026 → jatuh tempo pelunasan adalah 1 September 2026. Karena sampai 15 Oktober 2026 WP belum melunasi (sudah melewati jatuh tempo lebih dari 1 bulan), tindak lanjut yang tepat adalah penerbitan STP PBB (jawaban A). Opsi B dan D salah karena jangka waktu jatuh tempo bukan 1 bulan/30 hari, melainkan 6 bulan.", "p": 0, "topic": "PBB P5L — Jatuh Tempo & STP", "id": "pengawasan_sk_82"}, {"q": "PT Tambang Makmur memperoleh Izin Usaha Pertambangan (IUP) mineral pada tanggal 10 Januari 2026 — tanggal ini merupakan saat terpenuhinya persyaratan subjektif Objek Pajak PBB Sektor Pertambangan Mineral/Batubara. Hingga tanggal 10 Maret 2026, PT Tambang Makmur belum menyampaikan pendaftaran objek pajak PBB ke KPP tempat terdaftar.\nApa yang dapat dilakukan Kepala KPP atas kondisi tersebut?", "o": ["Melakukan pemeriksaan/penelitian administrasi dan menerbitkan Surat Keterangan Terdaftar Objek Pajak PBB secara jabatan, karena WP telah melewati batas waktu pendaftaran 1 bulan sejak syarat subjektif terpenuhi", "Tidak dapat berbuat apa-apa karena pendaftaran objek pajak PBB hanya dapat dilakukan atas permohonan WP", "Langsung menerbitkan SKPKB tanpa pendaftaran objek pajak terlebih dahulu", "Menunggu hingga 1 tahun sejak IUP terbit sebelum dapat mendaftarkan secara jabatan"], "c": 0, "e": "Setiap WP wajib melakukan pendaftaran objek pajak PBB pada KPP tempat WP terdaftar paling lama 1 (satu) bulan setelah saat terpenuhinya persyaratan subjektif — untuk Objek Pajak PBB Sektor Pertambangan Mineral/Batubara, saat tersebut adalah tanggal izin/kontrak/perjanjian terkait.\nKarena IUP terbit 10 Januari 2026, batas waktu pendaftaran WP sendiri adalah 10 Februari 2026. Karena sampai 10 Maret 2026 (sudah lewat 1 bulan) WP belum mendaftar, Kepala KPP berwenang melakukan pemeriksaan/penelitian administrasi dan menerbitkan Surat Keterangan Terdaftar Objek Pajak PBB secara jabatan (jawaban A). Pendaftaran objek pajak PBB BISA dilakukan secara jabatan, bukan hanya atas permohonan WP, sehingga opsi B salah.", "p": 0, "topic": "PBB P5L — Pendaftaran Objek Pajak", "id": "pengawasan_sk_83"}, {"q": "Putusan Banding Pengadilan Pajak atas sengketa PPh Badan PT Y dikirim kepada PT Y pada tanggal 5 Januari 2026. PT Y kemudian menemukan surat bukti baru (novum) yang bersifat menentukan dan sebelumnya tidak dapat ditemukan pada tahap persidangan, ditemukan pada tanggal 20 Februari 2026. PT Y ingin mengajukan Peninjauan Kembali (PK) ke Mahkamah Agung atas dasar novum tersebut.\nPaling lambat tanggal berapa PK harus diajukan?", "o": ["20 Mei 2026", "5 April 2026", "5 Januari 2027", "Tidak ada batas waktu pengajuan"], "c": 0, "e": "Berdasarkan UU No. 14/2002 tentang Pengadilan Pajak, Peninjauan Kembali hanya dapat diajukan 1 (satu) kali ke Mahkamah Agung. Jangka waktu pengajuan PK adalah 3 (tiga) bulan, namun basis perhitungannya berbeda tergantung alasan PK: untuk alasan ditemukannya surat bukti baru (novum) atau adanya kebohongan/tipu muslihat pihak lawan, jangka waktu 3 bulan dihitung sejak DITEMUKANNYA bukti tersebut (bukan sejak putusan dikirim); untuk alasan lain, dihitung sejak putusan dikirim.\nKarena novum ditemukan 20 Februari 2026, batas pengajuan PK = 20 Februari 2026 + 3 bulan = 20 Mei 2026 (jawaban A). Jawaban B keliru karena menghitung 3 bulan dari tanggal putusan dikirim (basis yang salah untuk alasan novum), dan PK bukan tanpa batas waktu sehingga D salah.", "p": 0, "topic": "Upaya Hukum Lanjutan — Peninjauan Kembali", "id": "pengawasan_sk_84"}, {"q": "KPP menerbitkan dan melaksanakan Surat Paksa kepada WP Z pada tanggal 3 Maret 2026 sehubungan dengan tunggakan pajak yang belum dilunasi. WP Z berpendapat bahwa pelaksanaan penagihan (Surat Paksa) tersebut tidak sesuai prosedur dan ingin mengajukan upaya hukum atas pelaksanaan penagihan itu sendiri (bukan atas pokok sengketa pajaknya).\nUpaya hukum apa yang tepat, dan berapa batas waktu pengajuannya sejak tanggal pelaksanaan Surat Paksa?", "o": ["Gugatan ke Pengadilan Pajak, paling lama 14 hari sejak tanggal pelaksanaan penagihan", "Keberatan ke Direktur Jenderal Pajak, paling lama 3 bulan sejak Surat Paksa diterima", "Banding ke Pengadilan Pajak, paling lama 3 bulan sejak Surat Paksa diterima", "Peninjauan Kembali ke Mahkamah Agung, paling lama 3 bulan sejak Surat Paksa diterima"], "c": 0, "e": "Sengketa yang timbul dari PELAKSANAAN penagihan pajak (misalnya Surat Paksa, Surat Perintah Melaksanakan Penyitaan, atau pengumuman lelang) — bukan dari pokok ketetapan pajaknya — diselesaikan melalui upaya hukum Gugatan ke Pengadilan Pajak, dengan jangka waktu pengajuan paling lama 14 hari sejak tanggal pelaksanaan penagihan.\nIni berbeda dari Keberatan (atas SKP, 3 bulan) dan Banding (atas Keputusan Keberatan, 3 bulan) yang menyengketakan pokok materi pajak terutang, bukan prosedur pelaksanaan penagihannya. Jawaban A tepat.", "p": 0, "topic": "Upaya Hukum Lanjutan — Gugatan Pelaksanaan Penagihan", "id": "pengawasan_sk_85"}, {"q": "WP menerima SKPKB hasil Pemeriksaan sebesar Rp500.000.000 pada tanggal 10 Januari 2026. WP tidak setuju dengan sebagian besar koreksi, namun tidak mengajukan Keberatan dalam jangka waktu 3 bulan yang tersedia, dan juga tidak menempuh upaya hukum apa pun (Banding maupun Peninjauan Kembali).\nApa status dan konsekuensi atas SKPKB tersebut?", "o": ["SKPKB menjadi definitif dan merupakan utang pajak yang harus dilunasi; jika tidak dilunasi, dapat ditindaklanjuti dengan tindakan penagihan aktif (Surat Teguran, Surat Paksa, dst.)", "SKPKB otomatis batal demi hukum karena WP tidak merespons dalam 3 bulan", "SKPKB otomatis berubah menjadi SKPLB karena tidak ada tanggapan dari WP", "DJP wajib menerbitkan SKPKB baru dengan jumlah yang lebih kecil karena WP tidak keberatan"], "c": 0, "e": "Jika WP tidak mengajukan Keberatan dalam jangka waktu 3 bulan sejak SKPKB diterbitkan, dan tidak pula menempuh Banding maupun Peninjauan Kembali, maka SKPKB tersebut menjadi definitif/final dan merupakan utang pajak yang wajib dilunasi oleh WP sesuai nilai dalam SKPKB. Ketiadaan upaya hukum TIDAK membatalkan ketetapan pajak — justru sebaliknya, ketetapan tersebut mengikat secara hukum. Jika WP tetap tidak melunasi, DJP dapat menindaklanjuti dengan proses penagihan aktif (Surat Teguran, kemudian Surat Paksa, penyitaan, hingga lelang jika perlu). Jawaban A benar; opsi B, C, dan D semuanya keliru karena tidak ada mekanisme otomatis yang membatalkan atau mengubah SKPKB hanya karena WP diam.", "p": 0, "topic": "Upaya Hukum Lanjutan — Konsekuensi Tidak Menempuh Upaya Hukum", "id": "pengawasan_sk_86"}, {"q": "Seorang WP mengajukan permohonan Keberatan atas SKPKB-nya melalui sistem Legacy (Approweb/SIDJP) sebelum implementasi Coretax. Proses persidangan berlanjut hingga terbit Putusan Banding, dan Putusan Banding tersebut terbit setelah implementasi Coretax (per 1 Januari 2025), sehingga tercatat di sistem Coretax.\nBerdasarkan perubahan petunjuk tindak lanjut dalam ND-927/PJ.06/2025, aplikasi apa yang digunakan DJP untuk menerbitkan Surat Tagihan Pajak (STP) atas kasus ini?", "o": ["Coretax", "Legacy (Approweb/SIDJP)", "Kedua sistem secara bersamaan", "APPROWEB khusus, terpisah dari Coretax maupun Legacy"], "c": 0, "e": "ND-927/PJ.06/2025 mengatur perubahan penerbitan STP Denda Penagihan pada masa transisi Coretax berdasarkan kombinasi sistem permohonan Keberatan dan sistem Putusan Upaya Hukum Terakhir:\n- Permohonan Keberatan di Legacy + Putusan Upaya Hukum Terakhir di Legacy → STP diterbitkan di Legacy.\n- Permohonan Keberatan di Legacy + Putusan Upaya Hukum Terakhir di Coretax → STP diterbitkan di Coretax (melalui daftar nominatif yang tersedia, atau pembangkitan manual case jika dafnom STP belum tersedia).\n- Permohonan Keberatan di Coretax + Putusan di Coretax → STP diterbitkan di Coretax.\nPada skenario ini, Keberatan diajukan di Legacy tetapi Putusan Banding (upaya hukum terakhir) terbit di Coretax, sehingga sesuai tabel baris ke-2, STP diterbitkan melalui Coretax (jawaban A).", "p": 0, "topic": "Coretax — Transisi Penerbitan STP", "id": "pengawasan_sk_87"}, {"q": "KPP akan melakukan Penelitian Kepatuhan Formal atas seluruh kewajiban perpajakan WP untuk Tahun Pajak 2024 serta Masa Pajak sampai dengan Desember 2024.\nSistem/aplikasi mana yang digunakan untuk kegiatan Penelitian Kepatuhan Formal tersebut, berdasarkan ketentuan masa transisi penerapan Coretax?", "o": ["Approweb dan SIDJP (sistem Legacy), kecuali untuk kriteria STP tertentu (Bea Meterai dan PBB, imbalan bunga yang seharusnya tidak diberikan, serta denda penagihan Pasal 25/27 yang keberatannya disampaikan via Coretax) yang tetap diterbitkan di Coretax", "Coretax sepenuhnya, karena seluruh Penelitian Kepatuhan Formal sejak diberlakukannya ND-927/PJ.06/2025 wajib menggunakan Coretax", "Tidak ada ketentuan khusus — bebas dipilih petugas pajak yang bersangkutan", "Hanya Coretax untuk WP Badan, dan Legacy untuk WP Orang Pribadi"], "c": 0, "e": "Berdasarkan Petunjuk Pelaksanaan Kegiatan Pengawasan pada Masa Transisi Penerapan Coretax, Penelitian Kepatuhan Formal dibagi berdasarkan periode kewajiban perpajakan WP: (1) seluruh WP atas kewajiban sampai dengan Tahun Pajak 2024 serta Masa Pajak sampai dengan Desember 2024 diproses melalui Approweb dan SIDJP (sistem Legacy), KECUALI untuk kriteria STP tertentu (Bea Meterai dan PBB; imbalan bunga yang seharusnya tidak diberikan; serta denda penagihan Pasal 25 ayat 9, Pasal 27 ayat 5d dan 5f yang permohonan keberatannya disampaikan menggunakan Coretax) yang tetap diterbitkan melalui Coretax untuk seluruh Tahun Pajak; (2) kewajiban perpajakan Tahun Pajak 2025 dan seterusnya, serta Masa Januari 2025 dan seterusnya, diproses melalui Coretax. Karena skenario ini adalah Tahun Pajak 2024/Masa s.d. Desember 2024 (bukan termasuk pengecualian STP di atas), jawaban yang tepat adalah A.", "p": 0, "topic": "Coretax — Transisi Penelitian Kepatuhan", "id": "pengawasan_sk_88"}, {"q": "Seorang Account Representative (AR) di KPP Lokasi diminta menindaklanjuti kegiatan pengawasan atas WP Cabang untuk kewajiban perpajakan hingga Tahun Pajak 2024 serta Masa Pajak sampai dengan Desember 2024.\nBerdasarkan ketentuan pengaturan pola kerja pada masa transisi Coretax, siapa yang berwenang melakukan tindak lanjut tersebut dan melalui sistem apa?", "o": ["Dilakukan oleh petugas yang memiliki tugas dan fungsi pengawasan yang sama dengan petugas yang melakukan pengawasan kepada WP Pusat, melalui sistem Approweb", "Dilakukan oleh petugas di KPP Pusat WP yang bersangkutan, melalui sistem Coretax", "Dapat dilakukan oleh petugas KPP mana pun, melalui sistem Coretax", "Tidak dapat ditindaklanjuti sampai WP Cabang pindah ke sistem Coretax"], "c": 0, "e": "Pengaturan pola kerja pengawasan WP Cabang pada masa transisi Coretax membedakan dua periode: untuk pengawasan atas WP Cabang hingga Tahun Pajak 2024 serta Masa Pajak sampai dengan Desember 2024, tindak lanjut dilakukan oleh petugas yang memiliki tugas dan fungsi yang SAMA dengan petugas yang melakukan pengawasan kepada WP Pusat (bukan otomatis petugas KPP Pusat itu sendiri, melainkan petugas dengan tusi setara), dan dilakukan melalui sistem Approweb. Sementara itu, tindak lanjut pengawasan WP Cabang di KPP Lokasi untuk periode setelahnya mengikuti jalur administrasi WP Pusat sesuai Coretax. Karena skenario ini masih periode s.d. Tahun Pajak 2024/Desember 2024, jawaban A tepat.", "p": 0, "topic": "Coretax — Pengaturan Pola Kerja WP Cabang", "id": "pengawasan_sk_89"}, {"q": "PT Nusantara Ekspor mengirim barang tekstil senilai USD 80,000 (kurs KMK berlaku Rp15.500/USD) ke buyer di Jerman. Perusahaan telah menyerahkan barang ke pelabuhan dan menerima pembayaran, namun karena kesibukan administrasi, Pemberitahuan Ekspor Barang (PEB) baru diurus dan disetujui oleh Bea Cukai 2 bulan setelah tanggal pengapalan. Saat pemeriksaan, bagaimana perlakuan PPN atas transaksi ekspor BKP berwujud ini?", "o": ["Tetap PPN 0% karena PEB akhirnya disetujui Bea Cukai, terlepas dari keterlambatan pengurusan dokumen", "PPN terutang 11% penuh karena ekspor tanpa PEB pada saat pengapalan dianggap bukan ekspor yang sah", "PPN terutang 11% hanya atas selisih kurs yang timbul akibat keterlambatan", "Transaksi dibebaskan dari PPN tanpa syarat dokumen apa pun karena tujuannya luar negeri"], "c": 0, "e": "PEB (Pemberitahuan Ekspor Barang) yang telah difiat muat/disetujui oleh Direktorat Jenderal Bea dan Cukai berkedudukan sebagai dokumen yang dipersamakan dengan Faktur Pajak untuk ekspor BKP berwujud, dan ekspor BKP dikenai PPN dengan tarif 0% (bukan dibebaskan — tetap merupakan objek PPN, hanya tarifnya 0% sehingga Pajak Masukan terkait tetap dapat dikreditkan). Selama PEB pada akhirnya diterbitkan dan disetujui (fiat muat), keterlambatan administratif pengurusan tidak mengubah status PPN 0% atas penyerahan ekspor tersebut — berbeda dengan dokumen tertentu pengganti Faktur Pajak untuk transaksi domestik yang punya batas waktu 3 bulan, PEB untuk ekspor mengikuti proses kepabeanan sendiri.", "p": 0, "topic": "Ekspor BKP Berwujud", "id": "pengawasan_sk_90"}, {"q": "PT Mesin Industri mengimpor 1 unit mesin produksi dari Jepang dengan nilai CIF (Cost, Insurance, Freight) sebesar Rp2.000.000.000. Atas impor tersebut dikenakan Bea Masuk 10% dari nilai CIF. Perusahaan membayar PPN impor dan bea masuk sesuai dokumen Pemberitahuan Impor Barang (PIB) sebelum barang dikeluarkan dari kawasan pabean. Berapa PPN impor yang harus dibayar, dan dapatkah PT Mesin Industri mengkreditkan PPN tersebut sebagai Pajak Masukan?", "o": ["PPN impor Rp220.000.000, dapat dikreditkan menggunakan dokumen PIB sebagai dokumen yang dipersamakan dengan Faktur Pajak", "PPN impor Rp200.000.000, tidak dapat dikreditkan karena bukan transaksi dengan PKP dalam negeri", "PPN impor Rp242.000.000, dapat dikreditkan menggunakan dokumen PIB sebagai dokumen yang dipersamakan dengan Faktur Pajak", "PPN impor Rp220.000.000, tidak dapat dikreditkan karena PIB bukan Faktur Pajak"], "c": 0, "e": "Nilai Impor (dasar pengenaan PPN impor) = CIF + Bea Masuk = Rp2.000.000.000 + (10% x Rp2.000.000.000) = Rp2.200.000.000. PPN impor = 11% x Rp2.200.000.000 = Rp242.000.000 — bukan Rp220.000.000, karena dasar pengenaannya adalah Nilai Impor (termasuk bea masuk), bukan CIF saja (opsi distraktor 'Rp220.000.000, dapat dikreditkan' salah menghitung DPP tanpa menambahkan bea masuk). PIB yang dilampiri Surat Setoran Pajak (SSP) atau bukti pungutan PPN impor berkedudukan sebagai dokumen tertentu yang dipersamakan dengan Faktur Pajak, sehingga PPN impor yang telah dibayar dapat dikreditkan sebagai Pajak Masukan sepanjang berhubungan langsung dengan kegiatan usaha.", "p": 0, "topic": "Impor BKP", "id": "pengawasan_sk_91"}, {"q": "PT Konsultan Global, PKP dalam negeri, menggunakan jasa konsultan manajemen dari perusahaan di Singapura (tidak memiliki BUT di Indonesia) senilai Rp500.000.000 untuk proyek yang dimanfaatkan di Indonesia. PT Konsultan Global tidak menerbitkan dan menyetorkan sendiri PPN atas pemanfaatan JKP dari luar Daerah Pabean tersebut. Hal ini baru diketahui saat pemeriksaan. Berapa PPN yang kurang dibayar oleh PT Konsultan Global?", "o": ["Rp0, karena kewajiban PPN atas jasa dari luar negeri ada pada penyedia jasa di Singapura, bukan pada penerima jasa", "Rp55.000.000, karena pemanfaatan JKP dari luar Daerah Pabean oleh pihak yang bukan Pemungut PPN wajib di-self-assessment oleh penerima manfaat", "Rp50.000.000, dihitung dari tarif PPh Pasal 26 yang keliru diterapkan sebagai PPN", "Rp55.000.000, namun tidak perlu disetor karena transaksi antar-negara dibebaskan PPN berdasarkan asas teritorial"], "c": 1, "e": "Pemanfaatan Jasa Kena Pajak dari luar Daerah Pabean di dalam Daerah Pabean merupakan objek PPN (Pasal 4 ayat (1) huruf e UU PPN). Karena PT Konsultan Global bukan termasuk Pemungut PPN yang ditunjuk (seperti instansi pemerintah/BUMN), kewajiban PPN beralih menjadi self-assessment: pihak yang memanfaatkan JKP wajib memungut, menyetor, dan melaporkan sendiri PPN yang terutang. PPN = 11% x Rp500.000.000 = Rp55.000.000. Karena belum disetor dan baru ditemukan saat pemeriksaan, jumlah ini menjadi kurang bayar (ditambah sanksi administrasi sesuai hasil pemeriksaan).", "p": 0, "topic": "Pemanfaatan JKP Luar Daerah Pabean", "id": "pengawasan_sk_92"}, {"q": "WP Luar Negeri (perusahaan di Singapura, tidak memiliki BUT di Indonesia) menerima pembayaran royalti dari PT Lisensi Indonesia sebesar Rp1.000.000.000 atas penggunaan merek dagang. Indonesia memiliki Perjanjian Penghindaran Pajak Berganda (P3B/tax treaty) dengan Singapura yang menetapkan tarif royalti sebesar 10% (lebih rendah dari tarif umum PPh Pasal 26 sebesar 20%). Namun, saat pemeriksaan ditemukan bahwa WP Luar Negeri tersebut tidak menyerahkan Surat Keterangan Domisili (SKD/Form DGT) yang memenuhi syarat kepada PT Lisensi Indonesia selaku pemotong pajak. Tarif PPh Pasal 26 berapa yang seharusnya dipotong oleh PT Lisensi Indonesia?", "o": ["10% sesuai P3B, karena fasilitas tax treaty berlaku otomatis tanpa syarat dokumen", "20% sesuai tarif umum PPh Pasal 26, karena tanpa SKD/Form DGT yang valid, fasilitas tarif P3B tidak dapat diterapkan", "0%, karena royalti merek dagang dikecualikan dari objek PPh Pasal 26", "15% sebagai tarif tengah antara tarif umum dan tarif P3B"], "c": 1, "e": "Pemanfaatan tarif P3B yang lebih rendah dari tarif umum PPh Pasal 26 (20%) mensyaratkan WP Luar Negeri menyerahkan SKD/Form DGT yang memenuhi persyaratan formal dan material kepada pemotong pajak sebelum batas waktu pemotongan. Tanpa SKD/Form DGT yang sah, pemotong pajak wajib menerapkan tarif umum sesuai UU PPh, yaitu 20% x Rp1.000.000.000 = Rp200.000.000 (bukan tarif P3B 10%). Jika SKD menyusul terlambat diserahkan, PT Lisensi Indonesia berpotensi dikoreksi pada saat pemeriksaan atas selisih pemotongan yang kurang (10% x Rp1.000.000.000 = Rp100.000.000) beserta sanksinya.", "p": 0, "topic": "PPh Pasal 26", "id": "pengawasan_sk_93"}, {"q": "PT Konsumer Jaya membebankan biaya promosi dan penjualan sebesar Rp300.000.000 dalam SPT Tahunan PPh Badan 2025. Dari jumlah tersebut, Rp200.000.000 merupakan pemberian kepada pihak lain (hadiah/sponsorship) yang wajib dibuatkan daftar nominatif sesuai ketentuan biaya promosi, sedangkan Rp100.000.000 adalah biaya iklan media yang tidak memerlukan daftar nominatif. Saat pemeriksaan, Pemeriksa menemukan PT Konsumer Jaya tidak membuat daftar nominatif atas pemberian Rp200.000.000 tersebut. Berapa biaya promosi yang dikoreksi fiskal (tidak dapat dikurangkan)?", "o": ["Rp300.000.000, seluruh biaya promosi dikoreksi karena ada sebagian yang tidak memenuhi syarat", "Rp0, karena biaya promosi secara keseluruhan tetap dapat dibiayakan tanpa syarat administratif", "Rp200.000.000, hanya bagian yang wajib didukung daftar nominatif namun tidak dibuat yang dikoreksi", "Rp100.000.000, karena hanya biaya iklan media yang diakui sebagai biaya promosi yang sah"], "c": 2, "e": "Biaya promosi dapat dikurangkan dari penghasilan bruto sepanjang dikeluarkan untuk mempertahankan/meningkatkan penghasilan dan memenuhi syarat 3M (mendapatkan, menagih, memelihara penghasilan). Khusus untuk pemberian kepada pihak lain (sponsorship/hadiah) di atas ketentuan yang diatur, WP wajib membuat daftar nominatif yang memuat identitas penerima dan nilai pemberian sebagai syarat formal pembuktian. Karena hanya porsi Rp200.000.000 yang wajib didukung daftar nominatif dan tidak dibuat, maka hanya porsi tersebut yang dikoreksi positif (ditambahkan kembali ke penghasilan kena pajak); Rp100.000.000 biaya iklan media yang tidak memerlukan daftar nominatif tetap dapat dibiayakan karena didukung bukti pengeluaran yang memadai.", "p": 0, "topic": "Koreksi Fiskal — Biaya Promosi", "id": "pengawasan_sk_94"}, {"q": "PT Maju Bersama mengalami rugi fiskal tahun 2021 sebesar Rp1.000.000.000. Rugi tersebut dikompensasikan dan baru habis terserap pada tahun pajak 2025, saat Penghasilan Kena Pajak sebelum kompensasi adalah Rp1.000.000.000 dan tarif PPh Badan yang berlaku pada tahun 2025 adalah 22%. Staf pajak PT Maju Bersama keliru menghitung PPh terutang tahun 2025 menggunakan tarif yang berlaku pada tahun 2021 (saat rugi terjadi). Bagaimana koreksi yang seharusnya dilakukan?", "o": ["Tidak ada koreksi, karena tarif yang digunakan untuk menghitung dampak kompensasi kerugian mengikuti tahun terjadinya kerugian", "PKP setelah kompensasi kerugian (Rp0 dalam kasus ini, karena rugi Rp1 miliar sepenuhnya menyerap PKP Rp1 miliar) tetap dikalikan tarif yang berlaku pada tahun pajak 2025 saat kompensasi digunakan, bukan tarif tahun rugi", "PPh terutang dihitung dengan merata-ratakan tarif tahun 2021 dan tarif tahun 2025", "Kompensasi kerugian fiskal tidak diperkenankan lintas perubahan tarif pajak"], "c": 1, "e": "Kompensasi kerugian fiskal (Pasal 6 ayat (2) UU PPh) hanya memengaruhi besarnya Penghasilan Kena Pajak (PKP) pada tahun pajak saat kerugian tersebut dikompensasikan — bukan mengubah tarif yang berlaku. Tarif PPh yang digunakan untuk menghitung PPh terutang selalu mengikuti tarif yang berlaku pada tahun pajak yang bersangkutan (tahun kompensasi digunakan), bukan tarif pada tahun rugi fiskal terjadi. Dalam kasus ini, karena PKP Rp1.000.000.000 seluruhnya terserap oleh kompensasi rugi Rp1.000.000.000, PKP setelah kompensasi = Rp0, sehingga PPh terutang tahun 2025 = Rp0 — namun inti pembelajarannya: jika masih ada sisa PKP setelah kompensasi, perhitungan PPh-nya wajib memakai tarif tahun pajak berjalan (2025), bukan tarif 2021.", "p": 0, "topic": "Koreksi Fiskal — Kompensasi Kerugian Fiskal", "id": "pengawasan_sk_95"}, {"q": "CV Berkah Abadi mengalami rugi fiskal pada tahun pajak 2018 sebesar Rp400.000.000. Hingga tahun pajak 2024, CV Berkah Abadi belum pernah memperoleh laba fiskal yang cukup untuk menyerap seluruh rugi tersebut — baru terserap Rp250.000.000, menyisakan Rp150.000.000. Pada tahun pajak 2024, bagaimana perlakuan atas sisa rugi fiskal Rp150.000.000 tersebut?", "o": ["Sisa rugi Rp150.000.000 tetap dapat dikompensasikan ke tahun-tahun berikutnya tanpa batas waktu", "Sisa rugi Rp150.000.000 sudah hangus (tidak dapat dikompensasikan lagi) karena jangka waktu kompensasi kerugian fiskal dibatasi maksimal 5 tahun berturut-turut sejak tahun rugi terjadi (2018-2023), dan 2024 sudah melewati batas tersebut", "Sisa rugi dapat diperpanjang otomatis 5 tahun lagi tanpa syarat", "Sisa rugi dialihkan menjadi pengurang PPh Pasal 25 tahun berjalan"], "c": 1, "e": "Pasal 6 ayat (2) UU PPh membatasi kompensasi kerugian fiskal paling lama 5 (lima) tahun berturut-turut sejak tahun kerugian terjadi. Rugi fiskal tahun 2018 hanya dapat dikompensasikan sampai dengan tahun pajak 2023 (2019, 2020, 2021, 2022, 2023 = 5 tahun). Karena hingga tahun 2023 baru terserap Rp250.000.000 dari Rp400.000.000, sisa Rp150.000.000 yang belum terserap sampai batas waktu tersebut menjadi hangus dan tidak dapat lagi dikompensasikan pada tahun pajak 2024 dan seterusnya — ini adalah kesalahan koreksi yang sering ditemukan Pemeriksa saat WP salah menghitung PKP dengan tetap mengompensasikan rugi yang sudah kedaluwarsa.", "p": 0, "topic": "Koreksi Fiskal — Kompensasi Kerugian Fiskal", "id": "pengawasan_sk_96"}, {"q": "Direktorat Jenderal Pajak menerbitkan dan menyampaikan Surat Pemberitahuan Pemeriksaan (SP2) kepada PT Teliti Makmur pada tanggal 10 Maret 2025 untuk Tahun Pajak 2023. Pada tanggal 20 Maret 2025, PT Teliti Makmur menyadari ada kesalahan pencatatan penghasilan pada SPT Tahunan PPh Badan Tahun Pajak 2023 dan ingin membetulkan SPT tersebut. Apakah PT Teliti Makmur masih dapat melakukan pembetulan SPT biasa (Pasal 8 ayat (1) UU KUP) untuk Tahun Pajak 2023?", "o": ["Ya, pembetulan SPT dapat dilakukan kapan saja sepanjang belum ada SKPKB yang diterbitkan", "Tidak, karena Direktur Jenderal Pajak telah menyampaikan pemberitahuan dimulainya pemeriksaan (SP2), sehingga hak pembetulan SPT biasa untuk tahun pajak yang diperiksa sudah tertutup — upaya yang tersisa adalah mengungkapkan ketidakbenaran pengisian SPT melalui laporan tersendiri sebelum SPHP disampaikan", "Ya, selama pembetulan dilakukan sebelum tanggal jatuh tempo pelaporan SPT Tahunan tahun berikutnya", "Tidak, WP sama sekali tidak dapat memperbaiki kesalahan apa pun setelah SP2 terbit"], "c": 1, "e": "Pasal 8 ayat (1) UU KUP memberikan hak WP untuk membetulkan SPT atas kemauan sendiri, dengan syarat Direktur Jenderal Pajak belum melakukan tindakan pemeriksaan. Begitu SP2 (Surat Pemberitahuan Pemeriksaan) disampaikan, hak pembetulan SPT biasa untuk tahun pajak yang sedang diperiksa menjadi tertutup. Namun UU KUP tetap memberi ruang bagi WP untuk mengungkapkan ketidakbenaran pengisian SPT (Pasal 8 ayat (4)) melalui laporan tersendiri secara tertulis, sepanjang dilakukan sebelum Pemeriksa menyampaikan Surat Pemberitahuan Hasil Pemeriksaan (SPHP) — jalur ini umumnya memberikan konsekuensi sanksi yang berbeda dibanding jika ketidakbenaran baru ditemukan oleh Pemeriksa sendiri.", "p": 0, "topic": "Teknis Prosedural — Pembetulan SPT", "id": "pengawasan_sk_97"}, {"q": "PT Patuh Sejahtera adalah WP Badan berstatus PKP, selalu menyampaikan SPT Masa dan SPT Tahunan tepat waktu dalam 2 tahun terakhir, tidak memiliki tunggakan pajak, dan laporan keuangannya diaudit oleh Akuntan Publik dengan opini Wajar Tanpa Pengecualian (WTP) selama 3 tahun berturut-turut. Dalam SPT Masa PPN bulan tertentu, PT Patuh Sejahtera melaporkan kelebihan pembayaran (lebih bayar) PPN. Jalur restitusi manakah yang paling sesuai dengan profil PT Patuh Sejahtera, dan apa konsekuensinya jika dalam pemeriksaan/penelitian kemudian ditemukan ketidaksesuaian?", "o": ["Pasal 17C UU KUP (restitusi WP dengan Kriteria Tertentu/WP Patuh) — pengembalian pendahuluan tanpa pemeriksaan terlebih dahulu (berdasar penelitian), namun jika kemudian hari diperiksa dan ternyata terdapat kekurangan bayar, dikenai sanksi kenaikan atas jumlah kekurangan tersebut", "Pasal 25 UU KUP (keberatan) — karena restitusi hanya dapat diajukan melalui jalur sengketa pajak", "Pasal 36 UU KUP (pengurangan/penghapusan sanksi) — karena status WP Patuh otomatis menghapus kewajiban pemeriksaan selamanya", "WP Patuh tidak berhak atas restitusi dipercepat karena restitusi hanya berlaku untuk WP Badan dengan skala usaha tertentu"], "c": 0, "e": "Pasal 17C UU KUP mengatur pengembalian pendahuluan kelebihan pembayaran pajak bagi WP dengan Kriteria Tertentu ('WP Patuh') — di antaranya tepat waktu menyampaikan SPT, tidak memiliki tunggakan pajak, dan laporan keuangan diaudit dengan opini WTP berturut-turut — tanpa perlu menunggu hasil pemeriksaan lebih dulu, cukup berdasarkan penelitian formal kelengkapan SPT. Ini mempercepat pencairan restitusi dibanding jalur pemeriksaan restitusi biasa. Namun, karena pengembalian diberikan tanpa pemeriksaan substantif terlebih dahulu, DJP tetap berwenang melakukan pemeriksaan di kemudian hari; jika ditemukan SPT tersebut ternyata menyatakan kelebihan bayar yang tidak seharusnya (ada kekurangan), WP dikenai sanksi adm
