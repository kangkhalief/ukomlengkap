": 1, "e": "Data eksternal dari Ditjen Bea dan Cukai berupa Data Pita Cukai (CK1, CK2, CK3) dan Pemberitahuan Ekspor Barang (PEB), dibandingkan dengan Faktur Pajak dan SPT WP.", "p": 0, "topic": "CRM Sektor Rokok", "id": "pengawasan_q_291"}, {"q": "Salah satu klaster prediktor risiko CRM sektor rokok (bukan kotak merah) membandingkan rasio GPM dan CTTOR WP dengan industri sejenis. Apa tujuan perbandingan ini?", "o": ["Menentukan besaran PTKP WP", "Mendeteksi profitabilitas WP yang tidak wajar dibanding industri sejenis pada golongan pabrik yang sama sebagai indikasi potensi ketidakpatuhan", "Menghitung tarif cukai rokok", "Menentukan jenis Pemeriksaan yang akan dilakukan"], "c": 1, "e": "Perbandingan rasio Gross Profit Margin (GPM) dan Cost to Turn Over Ratio (CTTOR) WP dengan industri sejenis golongan pabrik yang sama digunakan untuk mendeteksi profitabilitas tidak wajar sebagai indikasi potensi ketidakpatuhan.", "p": 0, "topic": "CRM Sektor Rokok", "id": "pengawasan_q_292"}, {"q": "Dalam rantai pasok (supply chain) industri otomotif, komponen yang langsung dipakai oleh industri perakitan (inti) disebut...", "o": ["Komponen Tier 3", "Komponen Tier 1", "Industri komponen hulu", "Bahan baku mentah"], "c": 1, "e": "Komponen Tier 1 adalah komponen yang langsung dipakai oleh industri perakitan (inti); Komponen Tier 2 dipakai oleh industri Tier 1 (pelengkap); industri komponen hulu/Tier 3 mengolah bahan baku mentah menjadi material industri.", "p": 0, "topic": "CRM Sektor Otomotif", "id": "pengawasan_q_293"}, {"q": "Klaster prediktor 'Profil WP' pada CRM Specific Risk sektor otomotif memanfaatkan data apa untuk mendeteksi WP yang tergabung dalam grup usaha multinasional?", "o": ["Data SPT Masa PPN", "Country by Country Reporting (CbCR)", "Data BPJS Ketenagakerjaan", "Data LHKPN"], "c": 1, "e": "Klaster Profil WP memanfaatkan data Country by Country Reporting (CbCR) untuk mendeteksi WP yang masuk dalam grup usaha tertentu dan membandingkan laba sebelum pajak WP dengan rata-rata laba grup.", "p": 0, "topic": "CRM Sektor Otomotif", "id": "pengawasan_q_294"}, {"q": "Apa yang dimaksud dengan 'leverage ratio' (debt to asset) sebagai salah satu klaster prediktor Profil WP dalam CRM sektor otomotif, dan bagaimana indikasi risikonya?", "o": ["Rasio laba terhadap aset; risiko jika terlalu rendah", "Rasio utang terhadap aset; indikasi risiko jika leverage ratio WP lebih besar dari leverage ratio industri", "Rasio kas terhadap utang jangka pendek", "Rasio penjualan terhadap jumlah karyawan"], "c": 1, "e": "Leverage ratio (debt to asset) mengukur proporsi utang terhadap aset WP; jika leverage ratio WP lebih besar dari rata-rata industri, ini menjadi indikasi risiko (misal skema thin capitalization untuk mengurangi PKP).", "p": 0, "topic": "CRM Sektor Otomotif", "id": "pengawasan_q_295"}, {"q": "Pada alur Pembangunan Data untuk Analisis Potensi Pajak, data dari instansi/lembaga/asosiasi/pihak lain dalam negeri yang bersifat wajib (ber-PMK) diatur dalam ketentuan apa?", "o": ["Pasal 35A ayat (1) UU KUP — Data ILAP ber-PMK", "Pasal 35A ayat (2) UU KUP — Data ILAP non-PMK", "Pasal 35 UU KUP", "Pasal 36 UU KUP"], "c": 0, "e": "Data Eksternal/Pihak Ketiga Dalam Negeri terbagi: Data ILAP ber-PMK (Pasal 35A ayat 1 UU KUP, wajib diatur PMK) dan Data ILAP non-PMK (Pasal 35A ayat 2).", "p": 0, "topic": "Data & Analisis Potensi", "id": "pengawasan_q_296"}, {"q": "Salah satu jenis data pemicu kepatuhan yang dipertahankan adalah 'Faktur Pajak sudah approve tapi belum lapor SPT'. Jenis mismatch ini mengindikasikan potensi pelanggaran kewajiban apa?", "o": ["Kewajiban membuat Faktur Pajak", "Kewajiban melaporkan Faktur Pajak yang telah diterbitkan dalam SPT Masa PPN", "Kewajiban membayar PPh Pasal 25", "Kewajiban mendaftar sebagai PKP"], "c": 1, "e": "Jika Faktur Pajak sudah di-approve namun belum dilaporkan dalam SPT Masa PPN, ini mengindikasikan potensi pelanggaran kewajiban pelaporan PPN keluaran yang sudah terbit.", "p": 0, "topic": "Data & Analisis Potensi", "id": "pengawasan_q_297"}, {"q": "Hubungan Istimewa karena kepemilikan modal terjadi apabila penyertaan modal langsung atau tidak langsung paling rendah berapa persen?", "o": ["15%", "20%", "25%", "50%"], "c": 2, "e": "Pasal 2 PMK 172/2023: penyertaan modal paling rendah 25%, atau hubungan dua WP yang sama-sama memiliki penyertaan 25% pada pihak ketiga yang sama.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_298"}, {"q": "Apa tujuan utama penerapan Prinsip Kewajaran dan Kelaziman Usaha (PKKU)?", "o": ["Meningkatkan penerimaan pajak negara secara langsung", "Menentukan Harga Transfer yang wajar antar pihak afiliasi", "Mencegah seluruh transaksi antar pihak afiliasi", "Menetapkan tarif pajak khusus untuk transaksi afiliasi"], "c": 1, "e": "Pasal 3 PMK 172/2023: PKKU diterapkan untuk menentukan Harga Transfer wajar dengan membandingkan kondisi dan indikator harga transaksi afiliasi dengan transaksi independen sebanding.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_299"}, {"q": "Penerapan PKKU secara digabungkan untuk dua atau lebih jenis Transaksi Afiliasi dilakukan apabila...", "o": ["WP meminta secara tertulis kepada DJP", "transaksi tersebut saling berkaitan dan mempengaruhi satu sama lain sehingga penerapan terpisah tidak andal/akurat", "jumlah transaksinya melebihi batas tertentu", "pihak afiliasinya berada di luar negeri"], "c": 1, "e": "Pasal 4: penggabungan dilakukan jika dua/lebih jenis transaksi afiliasi saling berkaitan dan mempengaruhi satu sama lain dalam penentuan Harga Transfer, sehingga penerapan terpisah tidak dapat dilakukan secara andal dan akurat.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_300"}, {"q": "Manakah urutan yang BENAR dari enam tahapan penerapan PKKU?", "o": ["Analisis industri → identifikasi transaksi → metode → analisis kesebandingan", "Identifikasi transaksi & pihak afiliasi → analisis industri → analisis kondisi transaksi → analisis kesebandingan → penentuan metode → penerapan metode", "Penentuan metode → analisis kesebandingan → identifikasi transaksi → analisis industri", "Analisis kesebandingan → identifikasi transaksi → analisis industri → penentuan metode"], "c": 1, "e": "Pasal 4 menetapkan urutan: identifikasi transaksi dan pihak afiliasi, analisis industri, analisis kondisi transaksi, analisis kesebandingan, penentuan metode, lalu penerapan metode.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_301"}, {"q": "Dalam analisis kondisi transaksi (Pasal 7 PMK 172/2023), berikut ini termasuk salah satu dari 5 faktor kesebandingan, KECUALI...", "o": ["Ketentuan Kontraktual", "Fungsi, Aset, dan Risiko", "Jumlah pegawai perusahaan", "Strategi Bisnis"], "c": 2, "e": "Lima faktor kesebandingan adalah Ketentuan Kontraktual, Fungsi/Aset/Risiko, Karakteristik Produk, Strategi Bisnis, dan Keadaan Ekonomi. Jumlah pegawai bukan salah satu faktor tersebut.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_302"}, {"q": "Jika tersedia pembanding internal dan eksternal dengan tingkat kesebandingan dan keandalan yang sama, pembanding manakah yang harus dipilih?", "o": ["Pembanding eksternal karena lebih objektif", "Pembanding internal", "Keduanya digunakan sekaligus", "Dipilih berdasarkan keputusan pemeriksa"], "c": 1, "e": "Pasal 8: dalam hal tersedia pembanding internal dan eksternal dengan tingkat kesebandingan dan keandalan yang sama, pembanding internal yang dipilih dan digunakan.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_303"}, {"q": "Metode Comparable Uncontrolled Price (CUP) paling sesuai digunakan untuk transaksi...", "o": ["Jasa manajemen antar afiliasi", "Produk komoditas atau barang/jasa dengan karakteristik sama/serupa dengan transaksi independen sebanding", "Restrukturisasi usaha", "Harta tidak berwujud yang unik"], "c": 1, "e": "Pasal 9: CUP sesuai untuk transaksi produk komoditas, atau barang/jasa dengan karakteristik yang sama atau serupa dengan barang/jasa pada Transaksi Independen dalam kondisi sebanding.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_304"}, {"q": "Apabila CUP dan metode lain memiliki tingkat keandalan yang setara, metode manakah yang diutamakan?", "o": ["TNMM", "PSM", "CUP", "CPM"], "c": 2, "e": "Pasal 9: dalam hal CUP dan metode lain yang dapat digunakan memiliki keandalan setara, CUP lebih diutamakan.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_305"}, {"q": "Resale Price Method (RPM) paling sesuai untuk transaksi yang melibatkan...", "o": ["Pabrikan yang membeli bahan baku", "Distributor/reseller yang menjual kembali tanpa menanggung risiko bisnis signifikan atau nilai tambah signifikan", "Pemberi lisensi harta tidak berwujud", "Pemberi pinjaman antar afiliasi"], "c": 1, "e": "Pasal 9: RPM sesuai untuk transaksi yang melibatkan distributor/reseller yang melakukan penjualan dengan harga sudah memenuhi PKKU, dan tidak menanggung risiko bisnis atau memberikan nilai tambah signifikan.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_306"}, {"q": "Dalam metode pembagian laba (Profit Split Method) dengan pendekatan residual analysis, laba gabungan dipisah menjadi dua bagian, yaitu...", "o": ["Laba kotor dan laba bersih", "Laba dari kontribusi masing-masing pihak yang dapat dibandingkan secara andal, dan sisa laba gabungan yang dibagi berdasarkan faktor pembagi", "Laba domestik dan laba luar negeri", "Laba tahun berjalan dan laba tahun sebelumnya"], "c": 1, "e": "Pasal 11: residual analysis memisahkan laba gabungan menjadi (a) laba dari kontribusi masing-masing pihak yang dapat diperoleh secara andal pembandingnya dalam Transaksi Independen, dan (b) sisa laba gabungan yang dibagi berdasarkan faktor pembagi.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_307"}, {"q": "Rentang kewajaran berbentuk interquartile range digunakan apabila pembanding yang tersedia berjumlah...", "o": ["Satu pembanding", "Dua pembanding", "Tiga atau lebih pembanding", "Lima atau lebih pembanding"], "c": 2, "e": "Pasal 12: full range (minimum-maksimum) digunakan jika terbentuk dari dua pembanding; interquartile range (kuartil 1 - kuartil 3) digunakan jika terbentuk dari tiga atau lebih pembanding.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_308"}, {"q": "Apabila Harga Transfer tidak memenuhi PKKU dan titik paling tepat dalam rentang kewajaran tidak dapat ditentukan, penentuan Harga Transfer menggunakan...", "o": ["Titik maksimum rentang", "Titik minimum rentang", "Titik tengah (median) rentang kewajaran", "Rata-rata aritmatika sederhana"], "c": 2, "e": "Pasal 12: jika titik paling tepat tidak dapat ditentukan, digunakan titik tengah (median) di dalam rentang kewajaran.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_309"}, {"q": "Untuk transaksi jasa antar pihak afiliasi, pembuktian pada tahapan pendahuluan mensyaratkan bahwa jasa tersebut BUKAN merupakan...", "o": ["Jasa yang nyata diberikan", "Shareholder activity (aktivitas kepentingan pemegang saham)", "Jasa yang dibutuhkan penerima jasa", "Jasa yang memberikan manfaat ekonomis"], "c": 1, "e": "Pasal 13: transaksi jasa harus dibuktikan bukan merupakan shareholder activity (aktivitas untuk kepentingan pemegang saham semata), bukan passive association, bukan duplikasi, dan bukan manfaat insidental.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_310"}, {"q": "Jika Wajib Pajak tidak dapat membuktikan Transaksi Afiliasi tertentu berdasarkan tahapan pendahuluan (Pasal 13), konsekuensinya adalah...", "o": ["Transaksi tersebut otomatis dikenakan sanksi administrasi", "Transaksi tersebut dianggap tidak memenuhi PKKU", "WP wajib membatalkan transaksi tersebut", "DJP wajib melakukan pemeriksaan khusus"], "c": 1, "e": "Pasal 13: dalam hal WP tidak dapat membuktikan Transaksi Afiliasi tertentu berdasarkan tahapan pendahuluan, transaksi tersebut tidak memenuhi PKKU.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_311"}, {"q": "Penerapan PKKU atas WPDN yang juga ditetapkan sebagai BUT (Pasal 14) mewajibkan BUT tersebut untuk...", "o": ["Membubarkan usahanya di Indonesia", "Menyampaikan seluruh data dan/atau informasi terkait transaksi Pihak Afiliasi di luar negeri", "Membayar pajak dua kali", "Mengubah statusnya menjadi WP Badan biasa"], "c": 1, "e": "Pasal 14: BUT harus menyampaikan seluruh data/informasi terkait transaksi Pihak Afiliasi di luar negeri; jika tidak disampaikan, nilai transaksi ditentukan dengan menerapkan PKKU.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_312"}, {"q": "Jalur pengawasan atas WP yang sudah terdaftar namun terindikasi SPT tidak disampaikan sesuai batas waktu, per PMK-111/2025, ditindaklanjuti melalui...", "o": ["Surat Imbauan", "Surat Teguran", "SP2DK langsung", "Pemeriksaan tujuan lain"], "c": 1, "e": "Proses bisnis Pengawasan cfm PMK-111/2025: untuk WP Terdaftar, indikasi SPT tidak disampaikan sesuai batas waktu ditindaklanjuti dengan Surat Teguran, berbeda dengan Surat Imbauan yang menyangkut pengukuhan PKP, pembayaran, pelaporan, dll.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_313"}, {"q": "Jalur pengawasan WP belum terdaftar per PMK-111/2025 ditempuh melalui tahapan...", "o": ["Surat Teguran langsung ke NPWP jabatan", "SP2DK - SPHPP", "Surat Imbauan - BAP2DK langsung", "Pemeriksaan - LHP"], "c": 1, "e": "Proses bisnis Pengawasan atas WP Belum Terdaftar cfm PMK-111/2025 ditempuh melalui jalur SP2DK - SPHPP.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_314"}, {"q": "Dalam persandingan alur PMK Pengawasan dan PMK Pemeriksaan, dokumen BAP2DK pada jalur Pengawasan setara dengan dokumen apa pada jalur Pemeriksaan?", "o": ["Surat Perintah Pemeriksaan (SP2)", "Risalah/Ikhtisar Pembahasan Akhir Hasil Pemeriksaan (PAHP)", "Laporan Hasil Pemeriksaan (LHP)", "Surat Pemberitahuan Hasil Pemeriksaan (SPHP)"], "c": 1, "e": "Dalam persandingan alur, tahapan Undangan Pembahasan Akhir - BAP2DK pada jalur Pengawasan bersanding dengan Undangan PAHP - Risalah/Ikhtisar PAHP pada jalur Pemeriksaan PMK-15/2025.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_315"}, {"q": "Ruang Lingkup Kegiatan Ekstensifikasi 2026 difokuskan pada Aktivasi WP, yang terbagi menjadi dua kategori yaitu...", "o": ["WP Terdaftar dan WP Belum Terdaftar", "WP Baru dan WP NA (Non-Aktif)", "WP Strategis dan WP Non-Strategis", "WP OP dan WP Badan"], "c": 1, "e": "Ruang Lingkup Kegiatan Ekstensifikasi 2026 terfokus pada Aktivasi WP, mencakup WP Baru (melalui DPE dan KPD) dan WP NA (melalui NA TD dan KPD).", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_316"}, {"q": "Dalam Gambaran Umum Proses Bisnis Pengawasan atas WP belum ber-NPWP, WP yang teridentifikasi berisiko LOW ditindaklanjuti melalui...", "o": ["Analisis/Penelitian Potensi Pajak dan penerbitan SP2DK", "Edukasi", "Langsung diterbitkan NPWP secara jabatan", "Pemeriksaan bukti permulaan"], "c": 1, "e": "Dalam alur Perencanaan Ekstensifikasi: WP risiko High & Medium ditindaklanjuti dengan Analisis/Penelitian Potensi Pajak lalu SP2DK, sedangkan WP risiko Low ditindaklanjuti dengan Edukasi.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_317"}, {"q": "Tim Ekstensifikasi yang ditugaskan dalam satu DPE (Daftar Prioritas Ekstensifikasi) terdiri dari berapa orang dengan peran apa?", "o": ["2 orang: Kasi Pengawasan sebagai Supervisor dan 1 AR sebagai Ketua Tim", "3 orang: Kasi Pengawasan sebagai Supervisor, 1 AR pengampu/Kepala KP2KP sebagai Ketua Tim, dan 1 AR lain sebagai Anggota Tim", "4 orang dari seksi yang berbeda-beda", "1 orang yaitu Account Representative pengampu WP"], "c": 1, "e": "Tim ekstensifikasi terdiri dari Kepala Seksi Pengawasan (Supervisor), 1 AR pengampu/Kepala KP2KP (Ketua Tim), dan 1 AR lain dalam satu seksi pengawasan (Anggota Tim).", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_318"}, {"q": "Berapa lama jangka waktu yang diberikan kepada Wajib Pajak untuk menanggapi SP2DK dalam proses Ekstensifikasi (tanpa perpanjangan)?", "o": ["7 hari kalender", "10 hari kerja", "14 hari kalender", "30 hari kalender"], "c": 2, "e": "WP diberikan jangka waktu 14 hari kalender untuk menyampaikan tanggapan atau klarifikasi atas SP2DK.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_319"}, {"q": "Apabila WP mengajukan perpanjangan jangka waktu tanggapan SP2DK, berapa lama maksimal perpanjangan yang dapat diberikan, dan kapan pemberitahuan tersebut harus diterima KPP?", "o": ["Maksimal 7 hari, diterima sebelum jangka waktu 14 hari berakhir", "Maksimal 14 hari, diterima kapan saja", "Maksimal 3 hari, diterima setelah jangka waktu berakhir", "Tidak ada batas perpanjangan"], "c": 0, "e": "WP dapat menyampaikan pemberitahuan perpanjangan secara tertulis maksimal 7 hari, dan pemberitahuan tersebut harus diterima KPP yang menerbitkan SP2DK sebelum jangka waktu 14 hari berakhir.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_320"}, {"q": "Dalam penyusunan SPHPP, Tim Ekstensifikasi menggunakan Examination Working Sheet (EWS) untuk masa pajak maksimal berapa tahun sebelum tahun berjalan pelaksanaan ekstensifikasi?", "o": ["2 tahun", "3 tahun", "5 tahun", "10 tahun"], "c": 2, "e": "Penelitian Potensi Pajak dilakukan menggunakan EWS untuk seluruh jenis pajak dengan masa pajak maksimal 5 tahun sebelum tahun berjalan pelaksanaan ekstensifikasi.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_321"}, {"q": "Apabila hasil penghitungan menunjukkan tidak ada indikasi kewajiban perpajakan yang masih harus dipenuhi WP, maka setelah SPHPP diterbitkan, proses langsung menuju ke...", "o": ["Undangan Pembahasan dan Surat Undangan Pembahasan Akhir", "BAP2DK", "Pemeriksaan bukti permulaan", "Penerbitan SKPKB"], "c": 1, "e": "Jika tidak ada indikasi kewajiban perpajakan yang masih harus dipenuhi, SPHPP langsung menuju BAP2DK, tanpa melalui Undangan Pembahasan.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_322"}, {"q": "Dalam pembahasan dengan WP pada proses Ekstensifikasi, apabila WP tidak hadir dalam pembahasan, maka...", "o": ["Proses ekstensifikasi otomatis dihentikan (case closed)", "Pembahasan dianggap telah dilaksanakan dan kewajiban perpajakan dihitung sendiri oleh DJP", "WP diberi kesempatan hadir hingga 3 kali", "Kasus langsung diusulkan untuk pemeriksaan bukti permulaan"], "c": 1, "e": "Jika WP tidak hadir, pembahasan dianggap telah dilaksanakan dan kewajiban perpajakan yang masih harus dipenuhi WP dihitung oleh DJP.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_323"}, {"q": "Jika Wajib Pajak tidak bisa melakukan tanda tangan elektronik (TTE) atas konsep BAP2DK yang disampaikan secara daring, berapa lama batas waktu WP mengirimkan kembali konsep yang telah ditandatangani?", "o": ["Maksimal 3 hari kerja", "Maksimal 5 hari kerja", "Maksimal 7 hari kerja", "Maksimal 14 hari kerja"], "c": 1, "e": "Jika WP tidak bisa TTE, WP mengirim kembali konsep BAP2DK yang telah ditandatangani maksimal 5 hari kerja sejak konsep dikirim oleh AR/Pegawai DJP.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_324"}, {"q": "Dokumen LHP2DK (Laporan Hasil Permintaan Penjelasan atas Data dan/atau Keterangan) memuat hal-hal berikut, KECUALI...", "o": ["Informasi profil Wajib Pajak", "Hasil klarifikasi Wajib Pajak", "Putusan pengadilan pajak", "Rekomendasi atau tindak lanjut"], "c": 2, "e": "LHP2DK memuat informasi profil WP, penyampaian SP2DK, hasil klarifikasi WP, indikasi kewajiban perpajakan, tanggapan WP, dan rekomendasi/tindak lanjut — tidak memuat putusan pengadilan pajak.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_325"}, {"q": "Manakah yang BUKAN merupakan kriteria Wajib Pajak Non-Aktif sesuai PER-07/PJ/2025?", "o": ["WP OP yang merupakan WNI berstatus Penduduk yang tidak lagi memenuhi persyaratan subjektif dan objektif karena telah menjadi SPLN", "WP OP yang melakukan kegiatan usaha dan rutin membayar pajak setiap bulan", "WP Badan yang tidak memenuhi persyaratan subjektif dan objektif namun masih dalam proses penghapusan NPWP", "Instansi Pemerintah yang tidak memenuhi persyaratan sebagai pemotong/pemungut pajak namun belum dilakukan penghapusan NPWP"], "c": 1, "e": "WP yang aktif melakukan usaha dan rutin membayar pajak bukan kriteria WP Non-Aktif; kriteria WP Non-Aktif justru berkaitan dengan WP yang tidak lagi memenuhi syarat subjektif/objektif atau berstatus SPLN.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_326"}, {"q": "Salah satu kriteria penetapan WP Non-Aktif secara jabatan adalah WP tidak melaporkan SPT Masa atau Tahunan secara berturut-turut dalam jangka waktu...", "o": ["2 tahun terakhir", "3 tahun terakhir", "5 tahun terakhir", "10 tahun terakhir"], "c": 2, "e": "Salah satu kriteria penetapan WP Non-Aktif secara jabatan (PER-7/PJ/2025) adalah WP tidak melaporkan SPT Masa/Tahunan berturut-turut dalam 5 tahun terakhir.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_327"}, {"q": "Pengaktifan kembali WP Non-Efektif (NE) secara otomatis by system (SE-27/PJ/2020) melalui pelaporan SPT berlaku untuk formulir apa?", "o": ["1770 dan 1771", "1770S atau 1770SS", "Seluruh jenis formulir SPT tanpa kecuali", "1721"], "c": 1, "e": "Pengaktifan otomatis via pelaporan SPT berlaku untuk WP yang menyampaikan formulir 1770S atau 1770SS, tidak melewati batas waktu, bukan pembetulan, nihil/kurang bayar, dan tidak disampaikan dalam bentuk e-SPT.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_328"}, {"q": "Dirjen Pajak berwenang melakukan pemeriksaan untuk dua tujuan utama, yaitu...", "o": ["Menguji kepatuhan dan untuk tujuan lain melaksanakan ketentuan peraturan perpajakan", "Menagih utang pajak dan menyita aset WP", "Menerbitkan NPWP dan mencabut NPWP", "Menyidik tindak pidana dan menuntut WP"], "c": 0, "e": "Pasal 2 PMK 15/2025: Dirjen Pajak berwenang melakukan pemeriksaan untuk menguji kepatuhan pemenuhan kewajiban perpajakan dan untuk tujuan lain dalam rangka melaksanakan ketentuan peraturan perundang-undangan perpajakan.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_329"}, {"q": "Pemeriksaan yang mencakup satu atau beberapa pos dalam SPT dan/atau SPOP secara mendalam disebut...", "o": ["Pemeriksaan Lengkap", "Pemeriksaan Terfokus", "Pemeriksaan Spesifik", "Pemeriksaan Dakon"], "c": 1, "e": "Pemeriksaan Terfokus mencakup satu atau beberapa pos dalam SPT dan/atau SPOP secara mendalam, berbeda dari Pemeriksaan Lengkap (seluruh pos secara mendalam) dan Pemeriksaan Spesifik (satu/beberapa pos secara sederhana).", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_330"}, {"q": "Berikut ini termasuk kriteria pemeriksaan untuk menguji kepatuhan, KECUALI...", "o": ["WP mengajukan permohonan pengembalian kelebihan pembayaran pajak sesuai Pasal 17B KUP", "WP melakukan penggabungan, peleburan, pemekaran, likuidasi, atau pembubaran usaha", "WP mengajukan permohonan Nomor Pokok Wajib Pajak baru secara sukarela", "Terdapat data konkret yang menyebabkan pajak terutang tidak atau kurang dibayar"], "c": 2, "e": "Permohonan NPWP baru secara sukarela bukan kriteria pemeriksaan uji kepatuhan (Pasal 4 ayat 1), melainkan proses pendaftaran administratif biasa.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_331"}, {"q": "Berapa lama jangka waktu pengujian untuk Pemeriksaan Lengkap, dihitung sejak Surat Pemberitahuan Pemeriksaan disampaikan?", "o": ["1 bulan", "3 bulan", "5 bulan", "10 hari kerja"], "c": 2, "e": "Jangka waktu pengujian: Pemeriksaan Lengkap paling lama 5 bulan, Pemeriksaan Terfokus 3 bulan, Pemeriksaan Spesifik 1 bulan, dan Pemeriksaan Dakon 10 hari kerja.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_332"}, {"q": "Jangka waktu PAHP dan pelaporan untuk Pemeriksaan Dakon (data konkret), dihitung sejak SPHP disampaikan, adalah paling lama...", "o": ["10 hari kerja", "30 hari kerja", "1 bulan", "3 bulan"], "c": 0, "e": "Jangka waktu PAHP & pelaporan untuk Pemeriksaan Lengkap/Terfokus/Spesifik adalah 30 hari kerja, sedangkan untuk Pemeriksaan Dakon paling lama 10 hari kerja.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_333"}, {"q": "Jangka waktu Pemeriksaan untuk Tujuan Lain, dihitung sejak Surat Pemberitahuan Pemeriksaan disampaikan, paling lama adalah...", "o": ["1 bulan", "2 bulan", "4 bulan", "6 bulan"], "c": 2, "e": "Jangka waktu Pemeriksaan untuk Tujuan Lain paling lama 4 bulan sejak Surat Pemberitahuan Pemeriksaan disampaikan.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_334"}, {"q": "Pemeriksaan atas Wajib Pajak Kontraktor Kontrak Kerja Sama (K3S) Migas dengan skema pengembalian biaya operasi (Production Sharing Contract Cost Recovery) mengikuti ketentuan...", "o": ["Jangka waktu Pemeriksaan Lengkap biasa (5 bulan)", "Pedoman pelaksanaan Pemeriksaan bersama atas pelaksanaan kontrak kerja sama minyak dan gas bumi", "Tidak ada jangka waktu khusus, mengikuti kebijakan internal DJP", "Jangka waktu Pemeriksaan Spesifik (1 bulan)"], "c": 1, "e": "Jangka waktu Pemeriksaan atas WP K3S Migas dengan skema PSC Cost Recovery mengikuti ketentuan dalam Peraturan Menteri mengenai pedoman pelaksanaan Pemeriksaan bersama atas pelaksanaan kontrak kerja sama minyak dan gas bumi.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_335"}, {"q": "Kriteria tambahan pemeriksaan uji kepatuhan khusus untuk PBB, selain kriteria umum, adalah...", "o": ["WP tidak menyampaikan SPOP setelah ditegur, dan indikasi PBB lebih besar dari yang dihitung dari SPOP", "WP tidak membayar PBB tepat waktu", "WP mengajukan keberatan PBB", "WP memindahtangankan objek PBB"], "c": 0, "e": "Kriteria m dan n khusus PBB: WP tidak menyampaikan SPOP (setelah ditegur), dan terdapat indikasi jumlah PBB yang terutang lebih besar daripada PBB yang dihitung berdasarkan SPOP.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_336"}, {"q": "Dalam siklus penatausahaan PBB P5L, apabila Surat Teguran atas SPOP tidak ditanggapi WP, tahapan berikutnya adalah...", "o": ["Langsung diterbitkan SPPT", "Anris Pemeriksaan lalu Pemeriksaan PBB hingga SKP PBB", "Pembetulan SPOP otomatis oleh sistem", "Pengaktifan kembali NPWP secara jabatan"], "c": 1, "e": "Jika Surat Teguran tidak ditanggapi, alur berlanjut ke Anris Pemeriksaan, kemudian Pemeriksaan PBB, hingga diterbitkan SKP PBB.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_337"}, {"q": "Pada Pemeriksaan PBB, Kepala Unit Pelaksana Pemeriksaan (UP2) melibatkan pihak yang memiliki keahlian khusus untuk menetapkan NJOP, yaitu...", "o": ["Juru Sita Pajak", "Penilai Pajak", "Account Representative", "Fungsional Penyuluh Pajak"], "c": 1, "e": "Dalam Pemeriksaan PBB, Kepala UP2 melibatkan Penilai Pajak sebagai pihak yang memiliki keahlian khusus untuk menetapkan NJOP PBB.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_338"}, {"q": "Berdasarkan PER-18/PJ/2025, manakah yang termasuk salah satu dari 3 jenis Data Konkret?", "o": ["Faktur Pajak yang disetujui sistem tetapi belum/tidak dilaporkan dalam SPT Masa PPN", "Surat Keputusan Keberatan", "Laporan Hasil Pemeriksaan tahun sebelumnya", "Surat Pemberitahuan Pajak Terhutang (SPPT)"], "c": 0, "e": "Tiga jenis Data Konkret: Faktur Pajak yang disetujui sistem tapi belum/tidak dilaporkan dalam SPT Masa PPN, Bukti Potput PPh yang belum/tidak dilaporkan penerbitnya, dan Bukti Transaksi/Data Perpajakan.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_339"}, {"q": "Bukti Transaksi/Data Perpajakan sebagai salah satu jenis Data Konkret dapat berupa hal-hal berikut, KECUALI...", "o": ["Kelebihan kompensasi pada SPT Masa PPN yang tidak didukung kelebihan bayar pada SPT Masa PPN sebelumnya", "Penghasilan yang tidak atau kurang dilaporkan berdasarkan data bukti potong yang dimiliki DJP", "Keputusan pengangkatan pejabat struktural DJP", "Data dan/atau keterangan yang bersumber dari ketetapan/putusan sengketa perpajakan yang bersifat inkrah"], "c": 2, "e": "Keputusan pengangkatan pejabat struktural DJP bukan termasuk Bukti Transaksi/Data Perpajakan dalam definisi Data Konkret Pasal 2 ayat (1) huruf c PER-18/PJ/2025.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_340"}, {"q": "LHP2DK dalam proses Pengawasan berpeluang menjadi salah satu bentuk Data Konkret apabila...", "o": ["WP mengajukan keberatan atas LHP2DK", "Data dan/atau keterangan telah diterbitkan surat permintaan penjelasan dan dibuat BA yang disetujui WP, namun pemenuhan kewajiban perpajakan belum/tidak dipenuhi sampai batas waktu yang disetujui", "LHP2DK diterbitkan lebih dari 1 tahun yang lalu", "WP menyatakan tidak keberatan secara lisan"], "c": 1, "e": "Bukti transaksi/data perpajakan huruf h mensyaratkan: telah diterbitkan surat permintaan penjelasan dan dibuat BA yang memuat persetujuan WP, namun pemenuhan kewajiban belum/tidak dipenuhi sampai batas waktu yang disetujui — LHP2DK dalam Pengawasan berpeluang masuk kategori ini.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_341"}, {"q": "Tim Pemeriksa Pajak yang terdiri dari Pejabat Fungsional Pemeriksa Pajak bertanggung jawab atas pemeriksaan jenis apa?", "o": ["Pemeriksaan PBB saja", "Pemeriksaan restitusi PPN tahun berjalan, ruang lingkup seluruh jenis pajak, dan pemeriksaan ulang", "Pemeriksaan khusus berdasarkan data konkret saja", "Pemeriksaan SPT Masa Pengungkapan Aset Sukarela"], "c": 1, "e": "Tim dengan Pejabat Fungsional Pemeriksa Pajak bertanggung jawab atas pemeriksaan restitusi PPN tahun berjalan, pemeriksaan ruang lingkup seluruh jenis pajak, dan pemeriksaan ulang.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_342"}, {"q": "Manakah yang BUKAN termasuk kriteria Pemeriksaan Efektif menurut SE-15/PJ/2018?", "o": ["Pemeriksaan selesai dan pencairan optimal", "Upaya hukum minimal", "Jumlah pemeriksaan sebanyak-banyaknya tanpa memperhatikan kualitas", "Menciptakan kepatuhan berkelanjutan"], "c": 2, "e": "Empat kriteria pemeriksaan efektif adalah: pemeriksaan selesai & pencairan optimal, upaya hukum minimal, restitusi terkendali, dan menciptakan kepatuhan berkelanjutan — bukan sekadar jumlah pemeriksaan sebanyak-banyaknya.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_343"}, {"q": "Pemeriksaan khusus berdasarkan data konkret atas WP Strategis untuk tahun pajak berjalan dapat diusulkan apabila...", "o": ["Telah dilakukan penelitian satu/beberapa jenis pajak dan/atau satu/beberapa masa pajak serta kegiatan P2DK selesai", "WP mengajukan permohonan secara sukarela", "Tanpa syarat apapun, dapat langsung diusulkan", "Hanya dapat diusulkan untuk tahun pajak sebelumnya"], "c": 0, "e": "Untuk tahun pajak berjalan, pemeriksaan atas WP Strategis berdasarkan data konkret dapat diusulkan setelah dilakukan penelitian satu/beberapa jenis pajak dan/atau satu/beberapa masa pajak serta kegiatan P2DK selesai.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_344"}, {"q": "Pemeriksaan khusus berdasarkan analisis risiko (baik satu/beberapa jenis pajak maupun all taxes) atas WP Strategis untuk TAHUN PAJAK BERJALAN...", "o": ["Dapat diusulkan tanpa syarat", "Tidak dapat diusulkan", "Dapat diusulkan hanya dengan persetujuan Dirjen Pajak", "Dapat diusulkan setelah penelitian sederhana"], "c": 1, "e": "Untuk tahun pajak berjalan, pemeriksaan khusus berdasarkan analisis risiko atas WP Strategis — baik satu/beberapa jenis pajak maupun all taxes — TIDAK DAPAT diusulkan; hanya dapat diusulkan untuk tahun pajak sebelum tahun berjalan dengan penelitian komprehensif dan P2DK selesai.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_345"}, {"q": "Penggalian potensi pajak dalam tahun berjalan pada setiap KPP hanya dapat dilakukan terhadap Wajib Pajak yang...", "o": ["Telah terdapat dalam Daftar Sasaran Penggalian Potensi Pajak (DSP3)", "Memiliki NPWP aktif lebih dari 5 tahun", "Mengajukan permohonan pemeriksaan sendiri", "Berlokasi di wilayah kerja KPP Pratama"], "c": 0, "e": "Penggalian potensi dalam tahun berjalan pada setiap KPP hanya dapat dilakukan terhadap WP yang telah terdapat dalam DSP3, kecuali KPP memperoleh keterangan lain berupa data konkret yang dapat ditindaklanjuti tersendiri.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_346"}, {"q": "Kepala KPP bertanggung jawab atas penerbitan persetujuan/penugasan pemeriksaan untuk hal-hal berikut, KECUALI...", "o": ["Penugasan pemeriksaan rutin berdasarkan Daftar Nominatif", "Persetujuan pemeriksaan khusus berdasarkan keterangan lain berupa data konkret", "Penugasan pemeriksaan tujuan lain yang bersifat administratif", "Penetapan sanksi pidana perpajakan"], "c": 3, "e": "Penetapan sanksi pidana perpajakan bukan kewenangan persetujuan pemeriksaan Kepala KPP, melainkan ranah penyidikan dan proses hukum pidana.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_347"}, {"q": "Tujuan utama kegiatan pengumpulan data lapangan (KPDL) menurut SE-11/PJ/2020 mencakup hal-hal berikut, KECUALI...", "o": ["Memperoleh data/informasi baru terkait Wajib Pajak dan potensi pajak", "Menindaklanjuti dan/atau memutakhirkan data/informasi yang telah dimiliki DJP", "Memetakan Wajib Pajak serta mengidentifikasi potensi pajak dalam wilayah kerja KPP", "Menetapkan sanksi administrasi atas pelanggaran Wajib Pajak"], "c": 3, "e": "Tiga tujuan KPDL: memperoleh data baru, pemutakhiran data, dan pemetaan WP — bukan menetapkan sanksi administrasi.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_348"}, {"q": "KPDL yang dilakukan oleh Petugas Pengawasan berdasarkan zona pengawasan atau WP yang diampu, dengan cara menyisir bidang/persil/lokasi WP di wilayah kerja KPP, termasuk jenis...", "o": ["KPD Analisis", "KPD Berbasis Kewilayahan", "KPD Eksternal", "KPD Non TUSI"], "c": 1, "e": "KPD Berbasis Kewilayahan dilakukan oleh Petugas Pengawasan berdasarkan Zona Pengawasan dan/atau WP yang diampu, atau Tim KPD berdasarkan Peta Kerja, menyisir bidang/persil/unit/lokasi WP.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_349"}, {"q": "KPD yang dapat dilaksanakan oleh seluruh pegawai DJP saat menemukan data terkait WP di luar pelaksanaan tugas dan fungsinya disebut...", "o": ["KPD TUSI Lainnya", "KPD Non TUSI", "KPD Analisis", "KPD Eksternal"], "c": 1, "e": "KPD Non TUSI dapat dilaksanakan oleh pegawai DJP pada saat menemukan data dan/atau informasi terkait WP di luar pelaksanaan tugas dan fungsinya.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_350"}, {"q": "KPDL yang dilakukan oleh pihak eksternal berdasarkan perjanjian kerja sama dengan DJP (contoh: kerja sama dengan PT Pos Indonesia) termasuk jenis...", "o": ["KPD Berbasis Kewilayahan", "KPD Analisis", "KPD Eksternal", "KPD TUSI Lainnya"], "c": 2, "e": "KPD Eksternal dilakukan oleh pihak eksternal berdasarkan perjanjian kerja sama dengan DJP, dengan mempertimbangkan efektivitas, kompetensi, kerahasiaan data, dan jangka waktu pelaksanaan.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_351"}, {"q": "Dalam pelaksanaan KPDL, jumlah pegawai minimal yang harus terlibat dalam satu kegiatan KPDL adalah...", "o": ["1 orang", "2 orang", "3 orang", "5 orang"], "c": 1, "e": "KPDL dilaksanakan minimal oleh 2 orang pegawai, dengan menggunakan pakaian kerja dan dilengkapi tanda pengenal, Surat Tugas, serta dokumen terkait.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_352"}, {"q": "Prinsip Continuous Supervision dalam kegiatan KPD berarti bahwa KPD...", "o": ["Hanya digunakan untuk mengumpulkan data tanpa tindak lanjut", "Dapat langsung menindaklanjuti update data profil WP atau tindakan lain secara jabatan jika ditemukan kondisi tertentu", "Harus dilakukan setiap hari tanpa henti", "Hanya berlaku untuk WP Badan, tidak untuk WP OP"], "c": 1, "e": "Continuous Supervision berarti KPD tidak hanya untuk mengumpulkan data, tapi juga dapat langsung menindaklanjuti update data profil WP atau action lain secara jabatan (misal perubahan data, pengukuhan PKP, aktivasi NIK) yang ditemukan selama KPD.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_353"}, {"q": "Profil Wajib Pajak didefinisikan sebagai rangkaian data dan informasi fiskal yang memuat identitas dan kegiatan usaha serta riwayat perpajakan WP secara...", "o": ["Berkesinambungan, dapat diklasifikasikan atas data permanen, data akumulatif, dan data lainnya", "Acak dan tidak terstruktur", "Hanya untuk satu tahun pajak berjalan", "Rahasia yang tidak dapat diakses pegawai DJP lain"], "c": 0, "e": "Profil WP adalah rangkaian data dan informasi fiskal WP yang memuat identitas, kegiatan usaha, dan riwayat perpajakan secara berkesinambungan, diklasifikasikan atas data permanen, data akumulatif, dan data lainnya.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_354"}, {"q": "Manakah yang BUKAN merupakan komponen minimum yang wajib termuat dalam Profil Wajib Pajak?", "o": ["Identitas Wajib Pajak", "Profil risiko ketertagihan", "Daftar harga saham perusahaan di bursa efek", "Riwayat keberatan dan banding"], "c": 2, "e": "Komponen minimum Profil WP meliputi Identitas, Kegiatan Usaha, Daftar Keluarga/Keterkaitan, Profil Risiko (CRM), Riwayat Pengawasan, Riwayat Pemeriksaan, Riwayat Keberatan & Banding, dan Profil Risiko Ketertagihan — bukan daftar harga saham di bursa efek.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_355"}, {"q": "Dalam langkah-langkah metodologi profiling WP (Approach One), pengecekan terhadap alamat Masterfile dibandingkan dengan alamat usaha saat ini termasuk dalam langkah...", "o": ["Pengumpulan data Wajib Pajak", "Identitas Wajib Pajak", "Proses bisnis Wajib Pajak", "Teliti kepatuhan formal Wajib Pajak"], "c": 1, "e": "Langkah 'Identitas Wajib Pajak' mencakup pengecekan alamat Masterfile vs alamat usaha, pemegang saham AHU vs SPT, KLU Masterfile vs lapangan, pohon kepemilikan, struktur organisasi, dan posisi CRM WP.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_356"}, {"q": "Teknik ekualisasi dalam kegiatan profiling antara lain membandingkan hal-hal berikut, KECUALI...", "o": ["Omzet PPN dengan PPh Badan/OP", "Biaya gaji dengan jumlah penghasilan di SPT PPh Pasal 21", "Biaya sewa dengan pemotongan PPh 23/PPh Final", "Jumlah karyawan dengan luas kantor perusahaan"], "c": 3, "e": "Teknik ekualisasi membandingkan data fiskal lintas jenis pajak (omzet PPN vs PPh, biaya gaji vs PPh21, biaya sewa vs PPh23/Final, dan 28 data pemicu lain) — bukan membandingkan jumlah karyawan dengan luas kantor.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_357"}, {"q": "Langkah 'jembreng SPT PPN' dalam metodologi profiling WP termasuk dalam pendekatan...", "o": ["Approach One, langkah 1", "Approach Two, langkah 6", "Approach One, langkah 5", "Approach Two, langkah 9"], "c": 1, "e": "Approach Two terdiri dari langkah 6-9: jembreng SPT PPN (langkah 6), lakukan ekualisasi (langkah 7), analisis laporan keuangan menyeluruh (langkah 8), dan pemanfaatan data eksternal (langkah 9).", "p": 0, "topic": "Profiling", "id": "pengawasan_q_358"}], "studiKasus": [{"q": "PT Sejahtera Makmur adalah WP Badan dengan peredaran bruto tahun 2025 sebesar Rp3.000.000.000 (di bawah Rp4,8 miliar, sehingga berhak atas fasilitas Pasal 31E UU PPh berupa pengurangan tarif 50% dari tarif normal 22% atas seluruh PKP). Dalam SPT Tahunan, WP melaporkan PKP Rp200.000.000 dan membayar PPh terutang sesuai fasilitas tersebut. Dalam pemeriksaan, Pemeriksa Pajak menemukan WP membebankan biaya sumbangan kepada yayasan keluarga sebesar Rp50.000.000 sebagai pengurang penghasilan bruto, padahal sumbangan tersebut tidak memenuhi syarat sebagai biaya yang dapat dikurangkan menurut Pasal 6 jo. Pasal 9 UU PPh. Berapa PPh Badan yang masih harus dibayar (kurang bayar) akibat koreksi fiskal ini?", "o": ["Rp5.500.000", "Rp11.000.000", "Rp0 (sumbangan tetap dapat dibiayakan)", "Rp27.500.000"], "c": 0, "e": "Karena peredaran bruto ≤ Rp4,8 miliar, seluruh PKP mendapat tarif efektif 50% x 22% = 11%. PPh semula = 11% x Rp200.000.000 = Rp22.000.000. Biaya sumbangan Rp50.000.000 dikoreksi positif (ditambahkan kembali) karena tidak memenuhi syarat Pasal 6/Pasal 9 UU PPh, sehingga PKP baru = Rp200.000.000 + Rp50.000.000 = Rp250.000.000. PPh baru = 11% x Rp250.000.000 = Rp27.500.000. PPh kurang bayar = Rp27.500.000 - Rp22.000.000 = Rp5.500.000.", "topic": "Koreksi Fiskal PPh Badan", "id": "pengawasan_sk_0"}, {"q": "PT Baja Nusantara (peredaran bruto Rp60.000.000.000/tahun, di atas Rp50 miliar sehingga tidak mendapat fasilitas Pasal 31E, tarif penuh 22%) melaporkan PKP Rp2.000.000.000 dan membayar PPh sesuai itu. Pemeriksaan menemukan dua koreksi: (1) kelebihan pembebanan biaya penyusutan sebesar Rp80.000.000 karena WP keliru menerapkan tarif penyusutan kelompok harta berwujud; (2) PPh Pasal 29 (PPh yang ditanggung sendiri oleh WP) dibebankan sebagai biaya sebesar Rp15.000.000, padahal menurut Pasal 9 ayat (1) huruf h UU PPh, PPh tidak boleh dikurangkan sebagai biaya. Berapa PPh Badan kurang bayar akibat kedua koreksi tersebut?", "o": ["Rp20.900.000", "Rp17.600.000", "Rp3.300.000", "Rp95.000.000"], "c": 0, "e": "Total koreksi fiskal positif = Rp80.000.000 + Rp15.000.000 = Rp95.000.000. Karena WP tidak mendapat fasilitas Pasal 31E (omzet > Rp50 miliar), seluruh koreksi dikenai tarif penuh 22%. PPh kurang bayar = 22% x Rp95.000.000 = Rp20.900.000. Opsi B salah karena hanya menghitung dari koreksi penyusutan saja dan mengabaikan koreksi PPh Pasal 29 yang tidak boleh dibiayakan.", "topic": "Koreksi Fiskal PPh Badan", "id": "pengawasan_sk_1"}, {"q": "WP OP berstatus Kawin dengan 2 tanggungan (PTKP K/2) melaporkan penghasilan neto usaha tahun 2025 sebesar Rp300.000.000 pada SPT Tahunan. PTKP K/2 = Rp54.000.000 (diri WP) + Rp4.500.000 (kawin) + 2 x Rp4.500.000 (tanggungan) = Rp67.500.000, sehingga PKP yang dilaporkan = Rp232.500.000. Pemeriksaan menemukan tambahan penghasilan usaha yang belum dilaporkan sebesar Rp50.000.000 (ditemukan melalui ekualisasi omzet PPN dengan peredaran usaha SPT PPh). Berapa PPh Pasal 29 kurang bayar akibat temuan ini? (Tarif progresif: s.d. Rp60jt=5%, >Rp60jt-250jt=15%, >Rp250jt-500jt=25%)", "o": ["Rp10.750.000", "Rp7.500.000", "Rp12.500.000", "Rp2.500.000"], "c": 0, "e": "PKP baru = Rp232.500.000 + Rp50.000.000 = Rp282.500.000. PPh semula: (60jtx5%)+(172,5jtx15%) = 3.000.000 + 25.875.000 = Rp28.875.000. PPh baru: (60jtx5%)+(190jtx15%)+(32,5jtx25%) = 3.000.000 + 28.500.000 + 8.125.000 = Rp39.625.000. Kurang bayar = Rp39.625.000 - Rp28.875.000 = Rp10.750.000. Opsi C (Rp12.500.000) adalah kesalahan umum: menerapkan tarif tertinggi (25%) ke seluruh tambahan Rp50.000.000 tanpa memperhitungkan lapisan tarif progresif (hanya sebagian menyentuh lapisan 25%).", "topic": "Koreksi Fiskal PPh OP", "id": "pengawasan_sk_2"}, {"q": "PT Sehat Sentosa membebankan biaya fasilitas kesehatan karyawan berupa klinik perusahaan (natura/kenikmatan) sebesar Rp120.000.000 sebagai biaya. Berdasarkan UU HPP dan PMK turunannya, natura/kenikmatan tertentu (termasuk fasilitas kesehatan di tempat kerja) dapat dibiayakan, namun pemeriksaan menemukan bahwa dari jumlah tersebut, Rp40.000.000 merupakan fasilitas mobil dinas pribadi bagi direksi yang penggunaannya melebihi batasan yang diperbolehkan sehingga termasuk kategori yang tidak dapat dibiayakan. PKP sebelum koreksi adalah Rp500.000.000 dengan tarif 22% (tidak mendapat fasilitas Pasal 31E). Berapa PPh Badan kurang bayar akibat koreksi ini?", "o": ["Rp8.800.000", "Rp26.400.000", "Rp0", "Rp4.400.000"], "c": 0, "e": "Hanya porsi Rp40.000.000 (fasilitas mobil dinas yang melebihi batas) yang dikoreksi positif karena tidak memenuhi syarat sebagai natura yang dapat dibiayakan; Rp80.000.000 sisanya (fasilitas kesehatan di tempat kerja) tetap dapat dibiayakan. PKP baru = Rp500.000.000 + Rp40.000.000 = Rp540.000.000. PPh kurang bayar = 22% x Rp40.000.000 = Rp8.800.000.", "topic": "Koreksi Fiskal PPh Badan", "id": "pengawasan_sk_3"}, {"q": "PT Cipta Mandiri tahun pajak 2023 melaporkan rugi fiskal Rp100.000.000 (dapat dikompensasikan hingga 5 tahun ke depan sesuai Pasal 6 ayat (2) UU PPh). Tahun 2025, WP melaporkan penghasilan neto Rp150.000.000 dan mengompensasikan seluruh rugi fiskal 2023 (Rp100.000.000), sehingga PKP yang dilaporkan = Rp50.000.000 dan PPh dibayar = 22% x Rp50.000.000 = Rp11.000.000 (tidak mendapat fasilitas Pasal 31E). Pemeriksaan terhadap SPT 2023 menemukan bahwa rugi fiskal yang sebenarnya hanya Rp60.000.000 (karena ada koreksi biaya pada tahun tersebut). Berapa PPh Badan kurang bayar tahun 2025 akibat koreksi jumlah rugi fiskal yang dapat dikompensasikan ini?", "o": ["Rp8.800.000", "Rp19.800.000", "Rp22.000.000", "Rp2.200.000"], "c": 0, "e": "Rugi fiskal yang dapat dikompensasikan terkoreksi dari Rp100.000.000 menjadi Rp60.000.000 (selisih Rp40.000.000). PKP baru 2025 = Rp150.000.000 - Rp60.000.000 = Rp90.000.000. PPh baru = 22% x Rp90.000.000 = Rp19.800.000. PPh kurang bayar = Rp19.800.000 - Rp11.000.000 (yang sudah dibayar) = Rp8.800.000. Opsi B salah karena lupa mengurangkan PPh yang sudah disetor sebelumnya.", "topic": "Koreksi Fiskal PPh Badan", "id": "pengawasan_sk_4"}, {"q": "PT Teknologi Maju (bukan UMKM, tidak mendapat fasilitas Pasal 31E) mengeluarkan akumulasi biaya kegiatan litbang (5 tahun terakhir) sebesar Rp200.000.000. Pada tahun 2025, WP baru memperoleh Hak Paten di dalam negeri atas hasil litbang tersebut, namun BELUM mencapai tahap komersialisasi. Dalam SPT, WP mengklaim tambahan pengurangan penghasilan bruto sebesar 200% dari biaya litbang (Rp400.000.000) sesuai PMK 153/PMK.010/2020, dengan PKP yang dilaporkan Rp100.000.000 dan PPh dibayar 22% x Rp100.000.000 = Rp22.000.000. Pemeriksa Pajak menemukan bahwa syarat yang telah dipenuhi WP baru sebatas memperoleh Paten di dalam negeri (hak atas tambahan pengurangan 50%), karena tahap komersialisasi (yang memberi tambahan 100%) belum tercapai. Berapa PPh Badan kurang bayar akibat koreksi ini?", "o": ["Rp66.000.000", "Rp88.000.000", "Rp0", "Rp33.000.000"], "c": 0, "e": "Sesuai PMK 153/PMK.010/2020 Pasal 432, tambahan pengurangan penghasilan bruto litbang terdiri dari: 50% jika menghasilkan Paten/Hak PVT di dalam negeri, +25% jika juga di luar negeri, dan +100% jika mencapai tahap komersialisasi (maksimal total 300%: 100% dasar + 200% tambahan). Karena WP baru memenuhi syarat Paten dalam negeri saja, tambahan yang berhak diperoleh hanya 50% x Rp200.000.000 = Rp100.000.000 (bukan 200% x Rp200.000.000 = Rp400.000.000 yang diklaim). Koreksi fiskal positif = Rp400.000.000 - Rp100.000.000 = Rp300.000.000. PKP baru = Rp100.000.000 + Rp300.000.000 = Rp400.000.000. PPh baru = 22% x Rp400.000.000 = Rp88.000.000. PPh kurang bayar = Rp88.000.000 - Rp22.000.000 = Rp66.000.000.", "topic": "Koreksi Fiskal PPh Badan — Fasilitas Litbang", "id": "pengawasan_sk_5"}, {"q": "PT Dagang Sejahtera (PKP) melaporkan SPT Masa PPN Masa Januari 2025: PPN Keluaran Rp120.000.000, Pajak Masukan yang dikreditkan Rp90.000.000, sehingga PPN kurang bayar yang disetor = Rp30.000.000. Pemeriksaan menemukan bahwa dari Pajak Masukan yang dikreditkan tersebut, Rp15.000.000 berasal dari Faktur Pajak yang tidak mencantumkan identitas pembeli secara lengkap (tidak memenuhi syarat formal Pasal 13 ayat (5) UU PPN), sehingga sesuai Pasal 9 ayat (8) huruf f UU PPN, Pajak Masukan tersebut tidak dapat dikreditkan. Berapa PPN kurang bayar tambahan yang harus disetor PT Dagang Sejahtera?", "o": ["Rp15.000.000", "Rp45.000.000", "Rp0", "Rp30.000.000"], "c": 0, "e": "Pajak Masukan yang dapat dikreditkan terkoreksi dari Rp90.000.000 menjadi Rp75.000.000 (Rp90jt - Rp15jt). PPN yang seharusnya kurang bayar = Rp120.000.000 - Rp75.000.000 = Rp45.000.000. Karena WP sudah menyetor Rp30.000.000, maka PPN kurang bayar tambahan = Rp45.000.000 - Rp30.000.000 = Rp15.000.000.", "topic": "Koreksi Fiskal PPN — Pengkreditan PM", "id": "pengawasan_sk_6"}, {"q": "PT Properti Guna membangun gedung kantor untuk digunakan sendiri dengan luas bangunan 500 m² (di atas batas minimal Kegiatan Membangun Sendiri/KMS, yaitu 200 m²). Total biaya konstruksi yang dikeluarkan hingga bulan berjalan (tidak termasuk harga perolehan tanah) adalah Rp2.000.000.000. WP tidak melaporkan dan menyetorkan PPN atas KMS tersebut. Dengan DPP KMS sebesar 20% dari jumlah biaya yang dikeluarkan dan tarif PPN 12%, berapa PPN KMS yang terutang dan harus disetor?", "o": ["Rp48.000.000", "Rp240.000.000", "Rp24.000.000", "Rp400.000.000"], "c": 0, "e": "DPP KMS = 20% x Rp2.000.000.000 = Rp400.000.000. PPN terutang = 12% x Rp400.000.000 = Rp48.000.000. Opsi B keliru karena langsung mengalikan tarif PPN ke total biaya tanpa menerapkan DPP 20% terlebih dahulu.", "topic": "Koreksi Fiskal PPN — KMS", "id": "pengawasan_sk_7"}, {"q": "PT Makmur Jaya adalah PKP yang bergerak di bidang jasa, melaporkan ekspor Jasa Kena Pajak (JKP) dengan tarif PPN 0% atas penggantian sebesar Rp500.000.000 pada SPT Masa PPN. Pemeriksaan menemukan bahwa dari jumlah tersebut, jasa senilai Rp150.000.000 ternyata hasilnya dimanfaatkan DI DALAM Daerah Pabean (tidak memenuhi kriteria ekspor JKP), sehingga seharusnya dikenakan PPN dengan tarif umum, bukan 0%. Dengan tarif PPN 12%, berapa PPN kurang bayar yang timbul akibat koreksi ini?", "o": ["Rp18.000.000", "Rp0", "Rp16.500.000", "Rp60.000.000"], "c": 0, "e": "Hanya porsi Rp150.000.000 yang dikoreksi dari tarif ekspor 0% menjadi tarif umum. PPN kurang bayar = 12% x Rp150.000.000 = Rp18.000.000. Opsi D keliru karena menghitung dari total Rp500.000.000, padahal porsi Rp350.000.000 sisanya tetap memenuhi kriteria ekspor JKP dan tetap bertarif 0%.", "topic": "Koreksi Fiskal PPN — Ekspor JKP", "id": "pengawasan_sk_8"}, {"q": "PT Auto Prima (PKP) mengkreditkan Pajak Masukan sebesar Rp11.000.000 dari perolehan sedan untuk operasional direksi (bukan barang dagangan dan tidak disewakan kepada pihak lain) dalam SPT Masa PPN. Pemeriksaan mengoreksi Pajak Masukan tersebut karena sesuai Pasal 9 ayat (8) huruf b UU PPN, Pajak Masukan atas perolehan kendaraan sedan/station wagon (selain sebagai barang dagangan atau disewakan) tidak dapat dikreditkan. Jika sebelum koreksi SPT tersebut nihil (PPN Keluaran = PPN Masukan yang dikreditkan), berapa PPN kurang bayar yang timbul akibat koreksi ini?", "o": ["Rp11.000.000", "Rp0", "Rp22.000.000", "Rp1.320.000"], "c": 0, "e": "Karena Pajak Masukan Rp11.000.000 tidak dapat dikreditkan, jumlah PPN yang mengurangi PPN Keluaran berkurang sebesar itu. Dari posisi semula nihil, PPN menjadi kurang bayar sebesar Rp11.000.000.", "topic": "Koreksi Fiskal PPN — PM Tidak Dapat Dikreditkan", "id": "pengawasan_sk_9"}, {"q": "PT Sentosa Abadi menyerahkan aktiva berupa kendaraan operasional (bukan barang dagangan) yang sudah tidak digunakan lagi kepada pihak lain, dengan harga jual Rp200.000.000. WP tidak memungut PPN atas penyerahan tersebut dengan dalih aktiva tersebut bukan barang dagangan. Pemeriksaan menemukan bahwa Pajak Masukan atas perolehan aktiva tersebut DAPAT dikreditkan pada saat perolehan (bukan termasuk pengecualian Pasal 9 ayat (8) huruf b/c UU PPN). Apakah penyerahan aktiva tersebut terutang PPN, dan berapa PPN yang kurang dipungut (tarif 11%)?", "o": ["Terutang PPN Pasal 16D, PPN kurang dipungut = Rp22.000.000", "Tidak terutang PPN karena bukan barang dagangan", "Terutang PPN tetapi tarifnya 0%", "Terutang PPN hanya jika aktiva dijual dalam 1 tahun sejak perolehan"], "c": 0, "e": "Sesuai Pasal 16D UU PPN, PPN dikenakan atas penyerahan aktiva yang menurut tujuan semula tidak untuk diperjualbelikan, KECUALI atas aktiva yang Pajak Masukannya tidak dapat dikreditkan menurut Pasal 9 ayat (8) huruf b dan c. Karena Pajak Masukan atas aktiva ini dapat dikreditkan saat perolehan, penyerahannya terutang PPN Pasal 16D. PPN = tarif berlaku saat itu, Rp200.000.000 x 11% = Rp22.000.000 (menggunakan tarif 11% sesuai soal).", "topic": "Koreksi Fiskal PPN — Pasal 16D", "id": "pengawasan_sk_10"}, {"q": "Pak Budi memiliki penghasilan signifikan dari kegiatan usaha namun belum terdaftar sebagai Wajib Pajak (belum ber-NPWP). DJP mengidentifikasi hal ini melalui data pihak ketiga. KPP menerbitkan SP2DK kepada Pak Budi. Sampai dengan batas waktu 14 hari sejak SP2DK diterima (dapat diperpanjang), Pak Budi tidak memberikan tanggapan apapun. Apa tindak lanjut yang paling tepat sesuai alur Pengawasan PMK-111/2025?", "o": ["Dilanjutkan ke tahap pembahasan/kunjungan, dan apabila tetap tidak ada tanggapan/kehadiran, dapat berujung pada penerbitan NPWP secara jabatan", "Langsung dilakukan pemeriksaan bukti permulaan (bukper)", "Langsung diterbitkan SKPKB tanpa proses lebih lanjut", "Kasus otomatis ditutup karena WP tidak merespons"], "c": 0, "e": "Sesuai alur PMK-111/2025, jika WP tidak menyampaikan tanggapan dalam batas waktu, proses dilanjutkan ke tahap pembahasan/kunjungan. Apabila WP tetap tidak kooperatif, rangkaian proses (berujung BAP2DK dan LHP2DK) dapat ditindaklanjuti dengan tindakan administratif seperti penerbitan NPWP secara jabatan bagi WP yang terbukti memiliki kewajiban subjektif dan objektif perpajakan.", "topic": "Ekstensifikasi — SP2DK", "id": "pengawasan_sk_11"}, {"q": "Dalam proses Pengawasan Kepatuhan WP, setelah SPHPP (Surat Pemberitahuan Hasil Penelitian dan Pengawasan) disampaikan dan WP tidak hadir dalam undangan pembahasan serta tidak menyampaikan tanggapan tertulis, dokumen apa yang disusun KPP sebagai hasil akhir rangkaian kegiatan pengawasan tersebut?", "o": ["Berita Acara Pelaksanaan Pengawasan Kepatuhan WP (BAP2DK) dan Laporan Hasil Pengawasan Kepatuhan WP (LHP2DK)", "Surat Ketetapan Pajak Kurang Bayar (SKPKB) langsung", "Surat Perintah Pemeriksaan", "Laporan Hasil Pemeriksaan (LHP) biasa"], "c": 0, "e": "Alur Pengawasan Kepatuhan WP per PMK-111/2025 adalah: SP2DK → tanggapan WP → (jika perlu) SPHPP → undangan pembahasan/kunjungan → Berita Acara Pelaksanaan Pengawasan Kepatuhan WP (BAP2DK) → Laporan Hasil Pengawasan Kepatuhan WP (LHP2DK) → tindak lanjut (dapat berupa imbauan, teguran, atau tindakan administratif lain). SKPKB adalah hasil Pemeriksaan formal, bukan hasil Pengawasan/SP2DK.", "topic": "Ekstensifikasi — SP2DK", "id": "pengawasan_sk_12"}, {"q": "WP terdaftar menerima SP2DK terkait dugaan kurang bayar PPN atas penjualan yang tidak dilaporkan. WP memberikan tanggapan tertulis dalam 14 hari yang menyatakan penjualan tersebut adalah retur barang, namun TIDAK melampirkan bukti pendukung yang memadai (misalnya nota retur, bukti penerimaan barang kembali). Apa klasifikasi tindak lanjut yang tepat atas tanggapan tersebut?", "o": ["Tanggapan WP dinilai tidak sesuai/tidak didukung bukti memadai, sehingga dilanjutkan ke tahap pembahasan/kunjungan", "SP2DK otomatis dianggap selesai dan tidak ditindaklanjuti", "WP otomatis dikukuhkan sebagai PKP baru", "Kasus dihentikan karena WP sudah memberikan tanggapan apapun bentuknya"], "c": 0, "e": "Tanggapan WP yang tidak didukung bukti yang memadai dikategorikan sebagai 'tanggapan tidak sesuai', sehingga proses tetap dilanjutkan ke tahap pembahasan/kunjungan untuk klarifikasi lebih lanjut, bukan otomatis dianggap selesai.", "topic": "Ekstensifikasi — SP2DK", "id": "pengawasan_sk_13"}, {"q": "Seorang WP OP terdaftar sejak 2015, namun tidak pernah melaporkan SPT dan tidak melakukan transaksi perpajakan apapun selama 5 tahun terakhir, serta alamat yang terdaftar sudah tidak ditemukan. Status apa yang tepat diberikan DJP terhadap WP tersebut, dan apa konsekuensinya?", "o": ["WP Non-Aktif (NE) — kewajiban pelaporan SPT untuk sementara tidak diwajibkan, NPWP tetap ada dan dapat diaktifkan kembali secara otomatis jika WP kembali beraktivitas perpajakan", "NPWP dihapus secara permanen tanpa dapat diaktifkan kembali", "WP langsung dikenakan sanksi pidana perpajakan", "WP otomatis dianggap sudah meninggal dunia secara administratif"], "c": 0, "e": "Berdasarkan ketentuan tentang WP Non-Aktif (NE/NA), WP yang memenuhi kriteria tertentu (antara lain tidak menyampaikan SPT dan tidak ada aktivitas perpajakan dalam jangka waktu tertentu) dapat diberikan status Non-Aktif, sehingga untuk sementara tidak diwajibkan menyampaikan SPT. NPWP tidak dihapus, dan status ini dapat diaktifkan kembali secara otomatis apabila WP kembali melakukan aktivitas perpajakan.", "topic": "Ekstensifikasi — WP Non-Aktif", "id": "pengawasan_sk_14"}, {"q": "PT Mandiri Jaya (WPDN) menjual produk barang berwujud ke PT Mandiri Global Pte Ltd (afiliasi di Singapura, kepemilikan saham 80%) dengan harga yang diduga tidak wajar. Tersedia data pembanding independen atas transaksi penjualan barang identik/sejenis dalam kondisi yang sebanding. Metode PKKU manakah yang PALING TEPAT digunakan untuk menguji kewajaran harga transaksi tersebut?", "o": ["Comparable Uncontrolled Price (CUP) Method", "Cost Plus Method (CPM)", "Profit Split Method (PSM)", "Transactional Net Margin Method (TNMM)"], "c": 0, "e": "CUP Method adalah metode yang paling tepat dan diutamakan ketika tersedia data pembanding independen atas harga barang/jasa identik atau sejenis dalam kondisi yang sebanding, karena membandingkan harga secara langsung.", "topic": "Transfer Pricing / PKKU", "id": "pengawasan_sk_15"}, {"q": "PT Sumber Rejeki adalah distributor yang membeli barang jadi dari perusahaan afiliasi di luar negeri untuk dijual kembali di pasar domestik, tanpa melakukan pengolahan atau penambahan nilai signifikan atas barang tersebut. Dalam menguji kewajaran margin laba kotor yang diperoleh PT Sumber Rejeki dari penjualan kembali tersebut, metode PKKU manakah yang paling sesuai?", "o": ["Resale Price Method (RPM)", "Cost Plus Method (CPM)", "Comparable Uncontrolled Price (CUP)", "Comparable Uncontrolled Transaction (CUT)"], "c": 0, "e": "RPM cocok digunakan untuk menguji kewajaran margin laba kotor pada transaksi penjualan kembali (resale) oleh distributor yang tidak memberikan nilai tambah signifikan terhadap barang yang diperjualbelikan.", "topic": "Transfer Pricing / PKKU", "id": "pengawasan_sk_16"}, {"q": "Dua perusahaan afiliasi, PT A dan PT B, sama-sama memberikan kontribusi yang unik dan bernilai (valuable) dalam pengembangan suatu produk inovatif, sehingga kontribusi masing-masing pihak sulit dinilai secara terpisah menggunakan metode transaksional biasa. Metode PKKU manakah yang paling sesuai digunakan untuk menguji kewajaran transaksi ini?", "o": ["Profit Split Method (PSM)", "Transactional Net Margin Method (TNMM)", "Comparable Uncontrolled Price (CUP)", "Penilaian harta"], "c": 0, "e": "PSM digunakan ketika kedua pihak dalam transaksi afiliasi sama-sama memberikan kontribusi unik dan bernilai yang sulit dipisahkan menilainya secara individual, sehingga laba gabungan dibagi berdasarkan kontribusi relatif masing-masing pihak.", "topic": "Transfer Pricing / PKKU", "id": "pengawasan_sk_17"}, {"q": "PT Delta Jaya menerima SKPKB dari hasil Pemeriksaan dengan pokok pajak kurang bayar Rp100.000.000. Jangka waktu dari saat terutangnya pajak sampai dengan tanggal diterbitkannya SKPKB adalah 10 bulan (tidak melebihi batas maksimal 24 bulan). Tarif sanksi bunga per bulan yang berlaku (suku bunga acuan ditambah uplift factor 15%, dibagi 12) adalah 1,75%. Berapa total sanksi bunga Pasal 13 ayat (2) UU KUP yang harus dibayar?", "o": ["Rp17.500.000", "Rp21.000.000", "Rp42.000.000", "Rp1.750.000"], "c": 0, "e": "Sanksi bunga = pokok pajak x tarif bunga per bulan x jumlah bulan = Rp100.000.000 x 1,75% x 10 = Rp17.500.000.", "topic": "Sanksi Administrasi — Bunga", "id": "pengawasan_sk_18"}, {"q": "Dari hasil Pemeriksaan, ditemukan PPN yang tidak/kurang dibayar oleh PT Karya Abadi (PKP) sebesar Rp50.000.000, yang terjadi karena PT tersebut tidak membuat Faktur Pajak atas penyerahan BKP yang dilakukannya. Sanksi administrasi apa dan berapa besar yang dikenakan atas pokok pajak tersebut?", "o": ["Sanksi kenaikan 75% x Rp50.000.000 = Rp37.500.000, sesuai Pasal 13 ayat (3) huruf c/d UU KUP", "Sanksi bunga 2% per bulan dari pokok pajak", "Sanksi denda tetap Rp500.000", "Tidak ada sanksi karena sudah dibayar sebelum pemeriksaan selesai"], "c": 0, "e": "Sesuai Pasal 13 ayat (3) huruf c/d UU KUP, PPN/PPnBM yang tidak/kurang dibayar berdasarkan hasil Pemeriksaan dikenai sanksi kenaikan sebesar 75% dari pokok pajak. Sanksi = 75% x Rp50.000.000 = Rp37.500.000.", "topic": "Sanksi Administrasi — Kenaikan", "id": "pengawasan_sk_19"}, {"q": "WP mengajukan keberatan atas SKPKB hasil pemeriksaan sebesar Rp200.000.000, namun permohonan keberatan tersebut DITOLAK oleh DJP. Berapa sanksi denda yang dikenakan kepada WP atas penolakan keberatan tersebut?", "o": ["30% x Rp200.000.000 = Rp60.000.000", "60% x Rp200.000.000 = Rp120.000.000", "75% x Rp200.000.000 = Rp150.000.000", "50% x Rp200.000.000 = Rp100.000.000"], "c": 0, "e": "Sesuai Pasal 25 UU KUP, apabila permohonan keberatan ditolak atau dikabulkan sebagian, WP dikenai sanksi denda 30% dari jumlah pajak berdasarkan keputusan keberatan dikurangi pajak yang telah dibayar sebelum mengajukan keberatan. Catatan: sanksi denda untuk BANDING yang ditolak/dikabulkan sebagian adalah 60% (Pasal 27 UU KUP) — jangan tertukar dengan sanksi keberatan 30%.", "topic": "Sanksi Administrasi — Keberatan vs Banding", "id": "pengawasan_sk_20"}, {"q": "Pemeriksaan dilakukan terhadap WP berdasarkan Data Konkret berupa Faktur Pajak yang telah disetujui melalui sistem DJP namun belum dilaporkan dalam SPT Masa PPN. Apa tipe Pemeriksaan ini, dan berapa jangka waktu pengujian (sejak Surat Pemberitahuan Pemeriksaan disampaikan sampai dengan SPHP) sesuai PMK 15/2025?", "o": ["Tipe Pemeriksaan Spesifik dengan Data Konkret, jangka waktu pengujian 10 hari kerja", "Tipe Pemeriksaan Lengkap, jangka waktu 5 bulan", "Tipe Pemeriksaan Terfokus, jangka waktu 3 bulan", "Tidak ada jangka waktu khusus yang diatur"], "c": 0, "e": "Data Konkret memerlukan pengujian sederhana sehingga masuk kategori Pemeriksaan Spesifik dengan jangka waktu pengujian 10 hari kerja sesuai Pasal 6 PMK 15/2025, jauh lebih singkat dibanding tipe Lengkap (5 bulan) maupun Terfokus (3 bulan).", "topic": "Teknis Prosedural — Jenis Pemeriksaan", "id": "pengawasan_sk_21"}, {"q": "WP Badan telah diberikan pengembalian pendahuluan kelebihan pembayaran pajak sesuai Pasal 17C UU KUP (restitusi dipercepat) sebesar Rp80.000.000. Pemeriksaan kemudian menemukan bahwa pengembalian pendahuluan tersebut ternyata tidak seharusnya diberikan karena koreksi fiskal mengubah status WP menjadi kurang bayar. Jenis ketetapan pajak apa yang diterbitkan, dan sanksi apa yang dikenakan?", "o": ["SKPKB diterbitkan, ditambah sanksi kenaikan 100% dari jumlah kekurangan pembayaran pajak", "SKPLB diterbitkan tanpa sanksi tambahan", "SKPN diterbitkan tanpa sanksi", "STP diterbitkan dengan sanksi bunga 2% per bulan"], "c": 0, "e": "Khusus bagi WP yang telah diberikan pengembalian pendahuluan sesuai Pasal 17C/17D UU KUP namun hasil Pemeriksaan menunjukkan ketetapan seharusnya adalah kurang bayar, diterbitkan SKPKB dengan sanksi administrasi berupa kenaikan sebesar 100% dari jumlah kekurangan pembayaran pajak — lebih berat dibanding sanksi kenaikan 75% pada SKPKB biasa, karena WP sudah terlanjur menerima pengembalian yang ternyata tidak berhak.", "topic": "Teknis Prosedural — Restitusi Dipercepat", "id": "pengawasan_sk_22"}, {"q": "Dalam pemeriksaan, Penghasilan Kena Pajak WP tidak dapat dihitung karena WP tidak memenuhi kewajiban pembukuannya (tidak dapat menunjukkan pembukuan yang lengkap) meskipun telah diberikan kesempatan. Upaya apa yang dilakukan Pemeriksa Pajak dalam kondisi ini, dan dasar hukumnya?", "o": ["Penghitungan Penghasilan Kena Pajak secara jabatan berdasarkan Pasal 31 ayat (3) UU KUP", "Pemeriksaan dihentikan karena tidak dapat dilanjutkan", "WP otomatis dikenakan sanksi pidana perpajakan", "Diterbitkan SKPN karena data dianggap tidak ada"], "c": 0, "e": "Sesuai Pasal 31 ayat (3) UU KUP, jika WP tidak memenuhi kewajiban pembukuan sehingga Penghasilan Kena Pajak tidak dapat dihitung, maka Penghasilan Kena Pajak dapat dihitung secara jabatan. DJP tetap wajib menyampaikan SPHP dan memberi hak hadir dalam PAHP, dengan dokumen yang dipertimbangkan terbatas pada dokumen peredaran usaha/penghasilan bruto dan dokumen kredit pajak.", "topic": "Teknis Prosedural — Penghitungan Secara Jabatan", "id": "pengawasan_sk_23"}, {"q": "PT Abadi Jaya membeli mesin produksi (Kelompok 2, masa manfaat 8 tahun) senilai Rp800.000.000 pada awal tahun 2024, menggunakan metode garis lurus. Dalam SPT Tahunan 2024, WP membebankan biaya penyusutan sebesar Rp200.000.000 (seolah-olah mesin tersebut masuk Kelompok 1 dengan masa manfaat 4 tahun). Pemeriksa Pajak mengoreksi karena mesin tersebut seharusnya diklasifikasikan sebagai harta Kelompok 2. Berapa koreksi fiskal positif atas biaya penyusutan tahun 2024?", "o": ["Rp0 (tidak ada koreksi)", "Rp100.000.000", "Rp200.000.000", "Rp700.000.000"], "c": 1, "e": "Penyusutan yang benar untuk harta Kelompok 2 (masa manfaat 8 tahun) metode garis lurus = Rp800.000.000 / 8 = Rp100.000.000 per tahun. WP membebankan Rp200.000.000 (menghitung seolah Kelompok 1/4 tahun). Koreksi fiskal positif = biaya yang dibebankan WP dikurangi biaya yang seharusnya = Rp200.000.000 - Rp100.000.000 = Rp100.000.000.", "topic": "Koreksi Fiskal PPh Badan — Penyusutan", "id": "pengawasan_sk_24"}, {"q": "PT Makmur Sentosa mengalami rugi fiskal tahun 2019 sebesar Rp300.000.000. Pada SPT Tahunan PPh Badan 2025, WP masih mengompensasikan sisa rugi fiskal tahun 2019 tersebut sebesar Rp50.000.000 terhadap penghasilan neto tahun 2025. Pemeriksa Pajak mengoreksi kompensasi tersebut. Apa dasar koreksi yang tepat?", "o": ["Rugi fiskal tahun 2019 sudah melewati batas waktu kompensasi 5 tahun (berakhir pada tahun pajak 2024), sehingga tidak dapat lagi dikompensasikan pada tahun 2025", "Kompensasi rugi fiskal tidak dibatasi jangka waktu, sehingga koreksi tersebut tidak tepat", "Rugi fiskal hanya dapat dikompensasikan maksimal 3 tahun berturut-turut", "Kompensasi rugi fiskal memerlukan persetujuan tertulis dari DJP sebelum digunakan"], "c": 0, "e": "Berdasarkan Pasal 6 ayat (2) UU PPh, kerugian fiskal dapat dikompensasikan dengan penghasilan neto berturut-turut selama 5 (lima) tahun pajak sejak tahun kerugian terjadi. Rugi fiskal tahun 2019 hanya dapat dikompensasikan sampai dengan tahun pajak 2024 (2020-2024). Pada tahun pajak 2025, hak kompensasi atas rugi fiskal 2019 sudah habis, sehingga koreksi Pemeriksa Pajak tepat.", "topic": "Koreksi Fiskal PPh Badan — Kompensasi Rugi", "id": "pengawasan_sk_25"}, {"q": "PT Sentosa melakukan revaluasi aktiva tetap berupa tanah dan bangunan pada tahun 2025. Nilai sisa buku fiskal sebelum revaluasi adalah Rp2.000.000.000, sedangkan nilai pasar wajar hasil penilaian adalah Rp5.000.000.000. WP tidak melaporkan/menyetorkan PPh atas selisih lebih revaluasi tersebut dengan alasan revaluasi bukan merupakan transaksi jual-beli. Pemeriksa Pajak mengoreksi. Dengan tarif PPh Final umum atas selisih lebih revaluasi aktiva tetap sebesar 10%, berapa PPh Final yang terutang?", "o": ["Rp0 (revaluasi tidak dikenai pajak)", "Rp150.000.000", "Rp300.000.000", "Rp500.000.000"], "c": 2, "e": "Selisih lebih revaluasi = nilai pasar wajar dikurangi nilai sisa buku fiskal = Rp5.000.000.000 - Rp2.000.000.000 = Rp3.000.000.000. Selisih lebih penilaian kembali aktiva tetap dikenai PPh bersifat final dengan tarif umum 10% (Pasal 19 UU PPh jo. ketentuan pelaksananya). PPh Final terutang = 10% x Rp3.000.000.000 = Rp300.000.000. Revaluasi tetap merupakan objek PPh Final meskipun bukan transaksi jual-beli, karena menimbulkan tambahan kemampuan ekonomis berupa nilai buku fiskal yang lebih tinggi.", "topic": "Koreksi Fiskal PPh Badan — Revaluasi Aktiva Tetap", "id": "pengawasan_sk_26"}, {"q": "CV Bahagia Sejahtera memiliki dua jenis penghasilan: penghasilan sewa bangunan sebesar Rp200.000.000 (dikenai PPh Final Pasal 4 ayat (2) tarif 10%) dan penghasilan usaha reguler (non-final) sebesar Rp500.000.000. Dalam SPT Tahunan, WP menggabungkan biaya-biaya yang berkaitan dengan sewa bangunan tersebut sebagai pengurang penghasilan usaha reguler (non-final), sehingga Penghasilan Kena Pajak non-final menjadi lebih kecil. Pemeriksa Pajak mengoreksi perlakuan ini. Apa dasar koreksi yang tepat?", "o": ["Biaya yang berkaitan dengan penghasilan yang telah dikenai PPh Final tidak boleh dikurangkan dari penghasilan bruto non-final", "Seluruh biaya operasional boleh digabungkan selama berada dalam tahun pajak yang sama", "Biaya atas penghasilan final dapat dikreditkan langsung sebagai pengurang PPh terutang non-final", "Penggabungan biaya diperbolehkan khusus untuk WP berbentuk CV"], "c": 0, "e": "Berdasarkan Pasal 4 ayat (2) jo. Pasal 9 ayat (1) huruf b UU PPh, biaya-biaya untuk mendapatkan, menagih, dan memelihara penghasilan yang pengenaan pajaknya bersifat final tidak boleh dikurangkan dari penghasilan bruto yang dikenai PPh secara umum (non-final). Pencampuran biaya ini menyebabkan PKP non-final menjadi understated, sehingga Pemeriksa Pajak wajib mengoreksi positif biaya yang salah digabungkan tersebut.", "topic": "Koreksi Fiskal — Biaya Final vs Non-Final", "id": "pengawasan_sk_27"}, {"q": "Pak Hartono (berstatus kawin, memiliki 2 anak kandung yang menjadi tanggungan, istri tidak bekerja) melaporkan SPT Tahunan PPh OP tahun 2025 dengan menggunakan PTKP sebesar Rp54.000.000 (status TK/0 — tidak kawin tanpa tanggungan). Pemeriksa Pajak mengoreksi status PTKP sesuai kondisi riil Pak Hartono (status K/2). Berapa PTKP yang seharusnya digunakan?", "o": ["Rp54.000.000", "Rp58.500.000", "Rp63.000.000", "Rp67.500.000"], "c": 3, "e": "PTKP terdiri atas: Rp54.000.000 untuk diri WP, tambahan Rp4.500.000 untuk WP kawin, dan tambahan Rp4.500.000 untuk setiap tanggungan (maksimal 3 orang). Untuk status K/2: Rp54.000.000 + Rp4.500.000 (kawin) + (2 x Rp4.500.000) (2 tanggungan) = Rp54.000.000 + Rp4.500.000 + Rp9.000.000 = Rp67.500.000.", "topic": "Koreksi Fiskal PPh OP — PTKP", "id": "pengawasan_sk_28"}, {"q": "PT Gemilang Abadi memberikan fasilitas kendaraan dinas untuk kepentingan pribadi (di luar kebutuhan operasional/jabatan) kepada seluruh jajaran direksi, dengan nilai manfaat ekonomis sebesar Rp120.000.000 per tahun, namun tidak memasukkan nilai tersebut sebagai objek PPh Pasal 21 bagi direksi yang menerimanya. Berdasarkan ketentuan mengenai natura/kenikmatan pasca UU HPP (PP 55/2022), bagaimana perlakuan yang tepat atas fasilitas tersebut?", "o": ["Merupakan objek PPh Pasal 21 bagi penerima, karena natura/kenikmatan pada dasarnya objek pajak kecuali termasuk dalam daftar pengecualian", "Bukan objek pajak, karena seluruh natura/kenikmatan dikecualikan dari objek PPh sejak berlakunya UU HPP", "Bukan objek PPh 21, karena diberikan kepada direksi, bukan karyawan biasa", "Merupakan objek PPN, bukan objek PPh Pasal 21"], "c": 0, "e": "Sejak berlakunya UU HPP dan PP 55/2022, prinsip pemajakan natura/kenikmatan berbalik: pada dasarnya SELURUH natura/kenikmatan merupakan objek PPh bagi penerimanya, kecuali yang secara eksplisit dikecualikan (misalnya fasilitas untuk jabatan/pekerjaan tertentu dengan batasan nilai, atau di daerah tertentu). Kendaraan dinas yang dipakai untuk kepentingan PRIBADI di luar kebutuhan jabatan/operasional tidak termasuk pengecualian, sehingga nilai manfaatnya wajib dihitung sebagai objek PPh Pasal 21 bagi direksi penerima.", "topic": "Koreksi Fiskal PPh 21 — Natura/Kenikmatan", "id": "pengawasan_sk_29"}, {"q": "PT Mitra Global (WP Dalam Negeri) menjual produk ke perusahaan afiliasinya di luar negeri dengan harga jual Rp8.000.000 per unit. Berdasarkan analisis kesebandingan menggunakan metode Comparable Uncontrolled Price (CUP) dalam penerapan Prinsip Kewajaran dan Kelaziman Usaha (PKKU), harga wajar atas transaksi serupa dengan pihak independen adalah Rp10.000.000 per unit. Dalam tahun pajak tersebut, PT Mitra Global menjual 1.000 unit kepada afiliasinya. Berapa koreksi positif atas penghasilan bruto PT Mitra Global akibat penerapan PKKU?", "o": ["Rp0", "Rp2.000.000.000", "Rp8.000.000.000", "Rp10.000.000.000"], "c": 1, "e": "Selisih harga wajar per unit = Rp10.000.000 - Rp8.000.000 = Rp2.000.000. Karena penjualan ke afiliasi menggunakan harga di bawah harga wajar (merugikan basis pajak Indonesia), PKKU mengoreksi penghasilan bruto PT Mitra Global sebesar selisih tersebut dikalikan jumlah unit: Rp2.000.000 x 1.000 unit = Rp2.000.000.000. Koreksi ini bersifat positif karena menambah penghasilan bruto yang seharusnya dilaporkan WP.", "topic": "Koreksi Fiskal PPh Badan — Transfer Pricing", "id": "pengawasan_sk_30"}, {"q": "PT Investama Nusantara (WP Badan Dalam Negeri) menerima dividen dari PT Anak Perusahaan (kepemilikan saham 30%, telah dimiliki selama 2 tahun) sebesar Rp500.000.000, yang berasal dari laba setelah pajak PT Anak Perusahaan. WP memasukkan dividen tersebut sebagai objek PPh Badan dan membayar PPh atasnya. Apakah perlakuan WP tersebut sudah tepat?", "o": ["Tidak tepat — dividen tersebut seharusnya dikecualikan dari objek PPh karena kepemilikan saham mencapai 25% atau lebih", "Tepat — seluruh dividen yang diterima WP Badan wajib dikenai PPh tanpa pengecualian", "Tidak tepat — dividen tersebut seharusnya dikenai PPh Final tarif 10%, bukan PPh Badan reguler", "Tepat, karena kepemilikan saham di bawah 50% sehingga tidak termasuk pengecualian"], "c": 0, "e": "Berdasarkan Pasal 4 ayat (3) huruf f UU PPh, dividen yang diterima WP Badan Dalam Negeri dapat dikecualikan dari objek PPh apabila kepemilikan saham pada badan yang membagikan dividen paling rendah 25% dan dividen tersebut berasal dari laba setelah pajak. PT Investama Nusantara memenuhi syarat ini (kepemilikan 30%), sehingga perlakuan WP yang memasukkan dividen sebagai objek PPh Badan tidak tepat — seharusnya dikecualikan dari objek pajak.", "topic": "Koreksi Fiskal PPh Badan — Dividen", "id": "pengawasan_sk_31"}, {"q": "Dalam pemeriksaan terhadap seorang WP Orang Pribadi pengusaha yang tidak menyelenggarakan pembukuan secara memadai, Pemeriksa Pajak hanya memperoleh data berupa mutasi rekening bank WP serta sejumlah transaksi tunai yang dapat ditelusuri selama tahun pajak yang diperiksa. Pendekatan Metode Tidak Langsung manakah yang paling tepat digunakan Pemeriksa Pajak dalam kondisi ini?", "o": ["Pendekatan Transaksi Tunai dan Bank", "Pendekatan Penghitungan Biaya Hidup", "Pendekatan Satuan dan/atau Volume", "Pendekatan Penghitungan Rasio"], "c": 0, "e": "Metode Tidak Langsung memiliki 6 pendekatan: Transaksi Tunai & Bank, Sumber & Penggunaan Dana, Pertambahan Kekayaan Bersih, Penghitungan Rasio, Penghitungan Biaya Hidup, dan Satuan/Volume. Karena data yang tersedia adalah arus masuk-keluar dana pada rekening bank dan transaksi tunai, pendekatan yang paling relevan dan langsung dapat diterapkan adalah Pendekatan Transaksi Tunai dan Bank, yang menghitung penghasilan berdasarkan seluruh penerimaan tunai dan melalui bank dikurangi penerimaan yang bukan objek pajak.", "topic": "Teknik Pemeriksaan — Metode Tidak Langsung", "id": "pengawasan_sk_32"}, {"q": "WP Orang Pribadi seorang pedagang tidak memiliki pembukuan maupun pencatatan sama sekali. Pemeriksa Pajak hanya dapat memperoleh data mengenai harta dan kewajiban WP pada awal dan akhir tahun pajak, di mana harta WP bertambah signifikan dibandingkan kemampuan penghasilan yang dilaporkan dalam SPT. Pendekatan Metode Tidak Langsung manakah yang paling sesuai digunakan dalam kondisi ini?", "o": ["Pendekatan Pertambahan Kekayaan Bersih", "Pendekatan Satuan dan/atau Volume", "Pendekatan Transaksi Tunai dan Bank", "Pendekatan Penghitungan Rasio"], "c": 0, "e": "Karena data yang tersedia hanya berupa posisi harta dan kewajiban (kekayaan bersih) pada awal dan akhir tahun pajak, pendekatan yang paling sesuai adalah Pendekatan Pertambahan Kekayaan Bersih — penghasilan kena pajak dihitung dari selisih kekayaan bersih akhir dan awal tahun, ditambah pengeluaran/biaya hidup yang bukan berasal dari penghasilan yang telah dikenai pajak final/bukan objek pajak.", "topic": "Teknik Pemeriksaan — Metode Tidak Langsung", "id": "pengawasan_sk_33"}, {"q": "Berdasarkan Pendekatan Pertambahan Kekayaan Bersih, diketahui kekayaan bersih WP pada awal tahun pajak sebesar Rp1.200.000.000 dan pada akhir tahun pajak sebesar Rp2.000.000.000. Selama tahun tersebut, WP diketahui mengeluarkan biaya hidup (termasuk untuk keluarga) sebesar Rp300.000.000 yang tidak berasal dari penghasilan yang telah dikenai pajak final atau bukan objek pajak. Berapa penghasilan kena pajak yang dihitung menurut pendekatan ini?", "o": ["Rp800.000.000", "Rp1.100.000.000", "Rp1.500.000.000", "Rp300.000.000"], "c": 1, "e": "Pertambahan kekayaan bersih = kekayaan bersih akhir tahun dikurangi kekayaan bersih awal tahun = Rp2.000.000.000 - Rp1.200.000.000 = Rp800.000.000. Karena biaya hidup sebesar Rp300.000.000 juga berasal dari penghasilan yang harus diperhitungkan (bukan dari penghasilan final/bukan objek), nilai tersebut ditambahkan kembali: Rp800.000.000 + Rp300.000.000 = Rp1.100.000.000. Inilah penghasilan kena pajak menurut Pendekatan Pertambahan Kekayaan Bersih.", "topic": "Teknik Pemeriksaan — Metode Tidak Langsung", "id": "pengawasan_sk_34"}, {"q": "Pemeriksa Pajak memeriksa WP Badan yang bergerak di bidang usaha pabrik tekstil. WP tidak dapat menunjukkan catatan penjualan yang lengkap, namun Pemeriksa dapat memperoleh data mengenai jumlah bahan baku yang dibeli selama tahun pajak serta rasio konversi standar industri tekstil untuk mengubah bahan baku menjadi unit barang jadi yang dapat dijual. Pendekatan Metode Tidak Langsung manakah yang paling tepat digunakan Pemeriksa Pajak dalam kondisi ini?", "o": ["Pendekatan Satuan dan/atau Volume", "Pendekatan Sumber dan Penggunaan Dana", "Pendekatan Penghitungan Biaya Hidup", "Pendekatan Transaksi Tunai dan Bank"], "c": 0, "e": "Karena data yang tersedia berupa jumlah bahan baku dan rasio konversi fisik menjadi unit barang jadi, pendekatan yang paling tepat adalah Pendekatan Satuan dan/atau Volume — penghasilan/omzet dihitung dengan mengonversi kuantitas input (bahan baku) menjadi estimasi kuantitas output (barang jadi terjual) menggunakan rasio/standar teknis produksi, kemudian dikalikan harga jual rata-rata untuk memperoleh estimasi peredaran usaha.", "topic": "Teknik Pemeriksaan — Metode Tidak Langsung", "id": "pengawasan_sk_35"}, {"q": "PT Trans Selular menerima jasa telekomunikasi dari PT Operator Prima (PKP) pada Januari 2024 dan dikenakan PPN atas tagihan tersebut, dibuktikan dengan bukti tagihan jasa telekomunikasi (dokumen yang dipersamakan dengan Faktur Pajak). Bukti tagihan untuk periode Januari 2024 — yang seharusnya terbit paling lambat akhir Januari 2024 — baru diterima PT Trans Selular pada Juni 2024, telah melewati 3 bulan sejak seharusnya dibuat. Nilai PPN dalam bukti tagihan tersebut adalah Rp8.000.000.\nBagaimana perlakuan pengkreditan Pajak Masukan atas dokumen tersebut?", "o": ["Dapat dikreditkan penuh karena bukti tagihan termasuk dokumen tertentu yang dipersamakan Faktur Pajak", "Dianggap tidak membuat dokumen tertentu sehingga PPN Rp8.000.000 tidak dapat dikreditkan sebagai Pajak Masukan", "Dapat dikreditkan 50% sebagai sanksi keterlambatan", "Dapat dikreditkan pada Masa Pajak berikutnya tanpa batas waktu"], "c": 1, "e": "Dokumen tertentu yang dipersamakan dengan Faktur Pajak (termasuk bukti tagihan jasa telekomunikasi) yang dibuat/diterima melewati 3 bulan sejak seharusnya dibuat, dianggap tidak membuat dokumen tertentu — konsekuensinya PPN di dalamnya tidak dapat diperlakukan sebagai Pajak Masukan yang dapat dikreditkan. Seharusnya terbit akhir Januari 2024; batas 3 bulan jatuh akhir April 2024; diterima Juni 2024 sudah melewati batas tersebut, sehingga seluruh Rp8.000.000 dikoreksi.", "topic": "Koreksi Fiskal PPN — Dokumen Tertentu Terlambat", "id": "pengawasan_sk_36"}, {"q": "PT Sentosa Elektronik (PKP) menjual barang elektronik kepada PT Mitra Jaya pada Maret 2024 senilai Rp150.000.000 (belum termasuk PPN 11% = Rp16.500.000), dan telah melaporkan PPN tersebut sebagai Pajak Keluaran dalam SPT Masa PPN Maret 2024. Pada April 2024, PT Mitra Jaya mengembalikan (retur) sebagian barang senilai Rp30.000.000 karena cacat produksi, dan membuat Nota Retur sesuai ketentuan yang disampaikan ke PT Sentosa Elektronik.\nBagaimana perlakuan PPN atas retur tersebut bagi PT Sentosa Elektronik selaku penjual?", "o": ["Mengurangi Pajak Keluaran sebesar Rp3.300.000 pada SPT Masa PPN April 2024 (Masa Pajak terjadinya retur)", "Membetulkan SPT Masa PPN Maret 2024 untuk mengurangi Pajak Keluaran", "Tidak ada perubahan karena retur tidak mempengaruhi PPN yang sudah dilaporkan", "Mengurangi Pajak Masukan PT Sentosa Elektronik sebesar Rp3.300.000"], "c": 0, "e": "Nota Retur mengurangi Pajak Kelu
