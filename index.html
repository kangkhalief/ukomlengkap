abila...", "o": ["Divalidasi sistem perbendaharaan dan anggaran negara", "Divalidasi dengan NTPN", "Ditandatangani WP sendiri", "Dicetak di atas kertas kop resmi"], "c": 0, "e": "SP2D sah apabila divalidasi sistem perbendaharaan dan anggaran negara — berbeda dari BPN/Setoran Pabean yang sah via NTPN, atau Bukti Pbk yang sah via tanda tangan pejabat berwenang.", "p": 0, "topic": "Pembayaran & Penyetoran Pajak", "id": "pengawasan_q_144"}, {"q": "Deposit Pajak dapat diisi dari sumber-sumber berikut, KECUALI...", "o": ["Sistem Penerimaan Negara secara elektronik (SPN)", "Pemindahbukuan (Pbk)", "Sisa kelebihan pajak atau sisa imbalan bunga", "Pinjaman bank komersial"], "c": 3, "e": "Deposit Pajak dapat diisi dari SPN elektronik, Pemindahbukuan, atau sisa kelebihan pajak/imbalan bunga — bukan dari pinjaman bank komersial.", "p": 0, "topic": "Pembayaran & Penyetoran Pajak", "id": "pengawasan_q_145"}, {"q": "Surat Setoran Pajak (SSP) Multiple berbeda dari SSP Single karena dapat digunakan untuk...", "o": ["Satu jenis pajak dengan satu Masa Pajak saja", "Beberapa dokumen ketetapan (STP, SKPKB, SKPKBT, dll) dalam satu setoran", "Pembayaran pajak luar negeri saja", "Pembayaran yang dilakukan secara tunai di kasir bank"], "c": 1, "e": "SSP Multiple mencakup pembayaran untuk beberapa jenis dokumen (STP, SKPKB, SKPKBT, SKPPBB, STPPBB, SPT Terutang, SK Pembetulan, SK Keberatan, SK Persetujuan Bersama, Putusan Banding, Putusan PK), berbeda dari SSP Single yang untuk satu transaksi.", "p": 0, "topic": "Pembayaran & Penyetoran Pajak", "id": "pengawasan_q_146"}, {"q": "WP Badan yang mendapat izin menyelenggarakan pembukuan dalam bahasa Inggris dan dolar AS wajib membayar PPh Pasal 25/29 dalam mata uang apa?", "o": ["Rupiah", "Dolar Amerika Serikat", "Euro", "Sesuai pilihan WP"], "c": 1, "e": "PMK 242/2014 mewajibkan WP Badan berizin pembukuan bahasa Inggris/dolar AS membayar/menyetor PPh 25/29 dan kewajiban terkait dalam mata uang dolar AS.", "p": 0, "topic": "PMK 242/2014 - Mata Uang Asing", "id": "pengawasan_q_147"}, {"q": "Pemindahbukuan (Pbk) hanya dapat dilakukan antar pembayaran pajak dengan ketentuan apa?", "o": ["Dalam mata uang yang sama", "Dalam jenis pajak yang sama", "Dalam tahun pajak yang sama", "Dalam KPP yang sama"], "c": 0, "e": "Pbk hanya dapat dilakukan antar pembayaran pajak dalam mata uang yang sama (rupiah dengan rupiah, atau dolar AS dengan dolar AS).", "p": 0, "topic": "PMK 242/2014 - Pemindahbukuan", "id": "pengawasan_q_148"}, {"q": "Manakah yang TERMASUK kriteria pembayaran pajak yang TIDAK DAPAT dilakukan Pemindahbukuan?", "o": ["Pembayaran pajak sebagai satu kesatuan dengan penyampaian SPT", "Deposit Pajak yang tidak digunakan untuk pelunasan pajak terutang", "Penyetoran di muka Bea Meterai yang belum digunakan", "PPh atas pengalihan tanah yang belum diteliti"], "c": 0, "e": "Pembayaran pajak sebagai satu kesatuan dengan penyampaian SPT termasuk kriteria yang TIDAK DAPAT dilakukan Pbk, karena sudah melekat sebagai bagian penyampaian SPT itu sendiri.", "p": 0, "topic": "PMK 242/2014 - Pemindahbukuan", "id": "pengawasan_q_149"}, {"q": "Permohonan penambahan saldo deposit pada Mesin Teraan Meterai Digital (MTMD) harus mencantumkan nilai nominal sebesar...", "o": ["Rp5.000.000 atau kelipatannya", "Rp10.000.000 atau kelipatannya", "Rp15.000.000 atau kelipatannya", "Rp20.000.000 atau kelipatannya"], "c": 2, "e": "Nilai nominal penambahan saldo deposit MTMD harus Rp15.000.000,00 (lima belas juta rupiah) atau kelipatannya.", "p": 0, "topic": "PMK 242/2014 - MTMD", "id": "pengawasan_q_150"}, {"q": "Syarat jumlah SPT yang telah disampaikan WP agar dapat mengajukan permohonan pengangsuran/penundaan pembayaran karena kesulitan likuiditas adalah...", "o": ["SPT Tahunan PPh 1 tahun terakhir dan SPT Masa PPN 1 masa pajak terakhir", "SPT Tahunan PPh 2 tahun terakhir dan SPT Masa PPN 3 masa pajak terakhir", "SPT Tahunan PPh 3 tahun terakhir dan SPT Masa PPN 2 masa pajak terakhir", "Tidak disyaratkan riwayat penyampaian SPT"], "c": 1, "e": "WP harus telah menyampaikan SPT Tahunan PPh untuk 2 tahun pajak terakhir dan SPT Masa PPN untuk 3 masa pajak terakhir.", "p": 0, "topic": "PMK 242/2014 - Pengangsuran", "id": "pengawasan_q_151"}, {"q": "Permohonan pengangsuran/penundaan terkait kekurangan pembayaran berdasarkan SPT Tahunan PPh (PPh Pasal 29) sekarang harus disampaikan...", "o": ["Paling lama 9 hari kerja sebelum jatuh tempo pembayaran", "Paling lama sebelum batas waktu penyampaian SPT Tahunan dan sebelum SPT disampaikan", "Paling lama 1 bulan setelah SPT Tahunan disampaikan", "Kapan saja sebelum pemeriksaan dimulai"], "c": 1, "e": "Ketentuan baru PMK 242/2014 mensyaratkan permohonan disampaikan sebelum batas waktu penyampaian SPT Tahunan PPh dan sebelum SPT Tahunan disampaikan (bukan lagi 9 hari kerja sebelum jatuh tempo).", "p": 0, "topic": "PMK 242/2014 - Pengangsuran PPh 29", "id": "pengawasan_q_152"}, {"q": "Berapa jangka waktu paling lama Direktur Jenderal Pajak memberikan keputusan atas permohonan pengangsuran/penundaan terkait Pasal 115 (utang pajak STP/SKP)?", "o": ["3 hari kerja", "5 hari kerja", "7 hari kerja", "14 hari kerja"], "c": 2, "e": "Untuk permohonan Pasal 115, keputusan diberikan paling lama 7 hari kerja sejak bukti penerimaan diterbitkan (berbeda dengan Pasal 114 yang 3 hari kerja).", "p": 0, "topic": "PMK 242/2014 - Jangka Waktu Keputusan", "id": "pengawasan_q_153"}, {"q": "Jaminan aset berwujud atas permohonan pengangsuran/penundaan berdasarkan Pembahasan Akhir Hasil Pemeriksaan harus diserahkan kepada Direktur Jenderal Pajak dalam jangka waktu...", "o": ["Paling lama 1 hari kerja", "Paling lama 3 hari kerja", "Paling lama 7 hari kerja", "Paling lama 14 hari kerja"], "c": 1, "e": "Jaminan aset berwujud diserahkan kepada Dirjen Pajak paling lama 3 hari kerja setelah permohonan disampaikan.", "p": 0, "topic": "PMK 242/2014 - Pengangsuran PAHP", "id": "pengawasan_q_154"}, {"q": "Surat keputusan persetujuan pengangsuran menjadi tidak berlaku jika WP tidak memenuhi pembayaran berdasarkan surat keputusan tersebut sebanyak...", "o": ["Paling banyak 1 kali", "Paling banyak 2 kali", "Paling banyak 3 kali", "Tidak ada batasan jumlah"], "c": 1, "e": "Surat keputusan persetujuan pengangsuran menjadi tidak berlaku dan dilakukan penagihan jika WP tidak memenuhi pembayaran paling banyak 2 kali (ketentuan baru).", "p": 0, "topic": "PMK 242/2014 - Keputusan Tidak Berlaku", "id": "pengawasan_q_155"}, {"q": "Berdasarkan PMK 187/2015, dasar hukum pengembalian kelebihan pembayaran pajak yang seharusnya tidak terutang adalah...", "o": ["Pasal 11 ayat (3) UU KUP", "Pasal 17 ayat (2) UU KUP", "Pasal 17B UU KUP", "Pasal 27B UU KUP"], "c": 1, "e": "Dasar hukum PMK 187/2015 adalah Pasal 17 ayat (2) UU KUP tentang pengembalian pajak yang seharusnya tidak terutang berdasarkan permohonan WP.", "p": 0, "topic": "PMK 187/2015 - Dasar Hukum", "id": "pengawasan_q_156"}, {"q": "KECUALI manakah yang termasuk objek pajak yang dapat diajukan permohonan pengembalian pajak seharusnya tidak terutang menurut PMK 187/2015?", "o": ["Pajak Penghasilan", "Bea Meterai", "Deposit Pajak yang tidak digunakan untuk pelunasan pajak", "Pajak Karbon"], "c": 2, "e": "Deposit Pajak yang tidak digunakan untuk pelunasan pajak terutang justru DIKECUALIKAN dari objek pengembalian menurut PMK 187/2015, karena bukan merupakan pembayaran pajak yang seharusnya tidak terutang.", "p": 0, "topic": "PMK 187/2015 - Objek", "id": "pengawasan_q_157"}, {"q": "Jika KPP tidak memberikan SKPLB atau pemberitahuan penolakan dalam 3 bulan sejak permohonan diterima, maka...", "o": ["Permohonan dianggap ditolak otomatis", "Permohonan dianggap dikabulkan dan SKPLB diterbitkan 5 hari kerja setelah batas waktu 3 bulan berakhir", "WP harus mengajukan permohonan baru", "Permohonan dilimpahkan ke Kanwil DJP"], "c": 1, "e": "Jika lewat 3 bulan tanpa keputusan, permohonan WP dianggap dikabulkan, dan Direktur Jenderal Pajak menerbitkan SKPLB dalam jangka waktu 5 hari kerja sejak berakhirnya batas waktu 3 bulan tersebut.", "p": 0, "topic": "PMK 187/2015 - Penelitian", "id": "pengawasan_q_158"}, {"q": "Permohonan pengembalian atas kesalahan pemotongan/pemungutan PPh dapat diajukan oleh pihak terpungut dengan melampirkan, KECUALI...", "o": ["Penghitungan pajak yang seharusnya tidak terutang", "Bukti pemotongan/pemungutan pajak", "Alasan permohonan pengembalian", "Laporan Keuangan Konsolidasi perusahaan induk"], "c": 3, "e": "Laporan Keuangan Konsolidasi perusahaan induk bukan lampiran yang dipersyaratkan untuk permohonan pengembalian kesalahan pemotongan/pemungutan — itu adalah syarat kelengkapan SPT Tahunan PPh (PMK 243/2014).", "p": 0, "topic": "PMK 187/2015 - Kesalahan Pemotongan", "id": "pengawasan_q_159"}, {"q": "Imbalan bunga atas keterlambatan pengembalian kelebihan pembayaran pajak diatur dalam...", "o": ["Pasal 11 ayat (3) UU KUP", "Pasal 17B ayat (3) UU KUP", "Pasal 27B ayat (1) UU KUP", "Pasal 27B ayat (3) UU KUP"], "c": 0, "e": "Keterlambatan pengembalian kelebihan pembayaran pajak diatur dalam Pasal 11 ayat (3) UU KUP, salah satu dari 5 ruang lingkup pemberian Imbalan Bunga pada PMK 18/2021.", "p": 0, "topic": "PMK 18/2021 - Ruang Lingkup", "id": "pengawasan_q_160"}, {"q": "Urutan mekanisme pemberian Imbalan Bunga setelah SKPIB diterbitkan adalah...", "o": ["SKPIB → SPMIB → SKPKPP → SP2D", "SKPIB → SKPKPP → SPMIB → SP2D", "SKPKPP → SKPIB → SPMIB → SP2D", "SKPIB → SP2D → SKPKPP → SPMIB"], "c": 1, "e": "Urutan yang benar: SKPIB (Surat Keputusan Pemberian Imbalan Bunga) → SKPKPP → SPMIB → SP2D, dalam jangka waktu 1 bulan.", "p": 0, "topic": "PMK 18/2021 - Mekanisme", "id": "pengawasan_q_161"}, {"q": "Dasar pengembalian berupa SKPLB berdasarkan Pasal 17B UU KUP diterbitkan melalui proses apa?", "o": ["Penelitian", "Pemeriksaan wajib", "Konfirmasi data pihak ketiga", "Analisis risiko"], "c": 1, "e": "SKPLB Pasal 17B KUP diterbitkan dari hasil Pemeriksaan wajib atas SPT restitusi yang dilaporkan WP — berbeda dengan SKPLB Pasal 17(2) KUP yang melalui Penelitian.", "p": 0, "topic": "PMK 244/2014 - Perbandingan SKPLB", "id": "pengawasan_q_162"}, {"q": "SKPKPP (Surat Keputusan Pengembalian Kelebihan Pembayaran Pajak) diterbitkan paling lama dalam jangka waktu...", "o": ["15 hari sejak diterima/diterbitkan/diterima dasar pengembalian", "1 bulan sejak diterima/diterbitkan/diterima dasar pengembalian", "2 bulan sejak diterima/diterbitkan/diterima dasar pengembalian", "3 bulan sejak diterima/diterbitkan/diterima dasar pengembalian"], "c": 1, "e": "SKPKPP diterbitkan paling lama 1 bulan, terhitung sejak diterimanya permohonan nomor rekening (jika SKPKPP butuh itu), diterbitkannya dasar pengembalian, atau diterimanya Putusan Banding/PK oleh KPP.", "p": 0, "topic": "PMK 244/2014 - Jangka Waktu", "id": "pengawasan_q_163"}, {"q": "Kelebihan pembayaran pajak dan Imbalan Bunga diperhitungkan terlebih dahulu dengan...", "o": ["Utang Pajak", "Pajak Masukan periode berjalan", "Sanksi administrasi yang belum lunas", "Pajak tahun sebelumnya"], "c": 0, "e": "Sesuai Pasal 54 ayat (1) PMK PSIAP, kelebihan pembayaran pajak dan Imbalan Bunga diperhitungkan terlebih dahulu dengan Utang Pajak sebelum dikembalikan kepada WP.", "p": 0, "topic": "PMK 244/2014 - Kompensasi", "id": "pengawasan_q_164"}, {"q": "Jika WP tidak menyampaikan persetujuan atas permintaan konfirmasi kompensasi dari DJP, maka...", "o": ["Kompensasi tetap dilakukan secara otomatis", "Sisa kelebihan pembayaran pajak dikembalikan kepada WP", "Permohonan pengembalian dianggap batal", "Kelebihan pembayaran menjadi hangus"], "c": 1, "e": "Dalam hal WP tidak menyampaikan persetujuan, sisa kelebihan pembayaran pajak dikembalikan kepada WP (bukan dikompensasikan secara paksa).", "p": 0, "topic": "PMK 244/2014 - Kompensasi", "id": "pengawasan_q_165"}, {"q": "Pengembalian kelebihan pembayaran pajak kepada WP yang dinyatakan pailit menggunakan rekening atas nama...", "o": ["WP sendiri", "Kurator", "Hakim Pengawas Kepailitan", "Balai Harta Peninggalan"], "c": 1, "e": "Untuk WP yang dinyatakan pailit, pengembalian menggunakan rekening dalam negeri atas nama kurator.", "p": 0, "topic": "PMK 244/2014 - Rekening Pengembalian", "id": "pengawasan_q_166"}, {"q": "SPT yang disampaikan secara elektronik dengan cara LAIN (bukan melalui Portal WP/aplikasi terintegrasi) akibatnya adalah...", "o": ["Tetap diberi bukti penerimaan", "Tidak diberi bukti penerimaan dan dianggap tidak menyampaikan SPT", "Dianggap terlambat 1 hari", "Harus diulang dalam bentuk kertas"], "c": 1, "e": "WP yang wajib SPT Elektronik namun menyampaikan dengan cara lain tidak diberikan bukti penerimaan dan dianggap tidak menyampaikan SPT.", "p": 0, "topic": "PMK 243/2014 - Cara Penyampaian", "id": "pengawasan_q_167"}, {"q": "Jika WP merupakan perusahaan induk, selain laporan keuangan WP sendiri, SPT Tahunan PPh juga harus dilampiri...", "o": ["Laporan keuangan anak perusahaan masing-masing", "Laporan keuangan konsolidasi", "Laporan keuangan kuartalan", "Laporan arus kas tersendiri"], "c": 1, "e": "WP yang merupakan perusahaan induk wajib melampirkan laporan keuangan konsolidasi, selain laporan keuangan WP itu sendiri.", "p": 0, "topic": "PMK 243/2014 - Kelengkapan SPT", "id": "pengawasan_q_168"}, {"q": "Batas waktu penyampaian SPT Tahunan PPh Wajib Pajak Badan adalah...", "o": ["2 bulan setelah akhir Tahun Pajak", "3 bulan setelah akhir Tahun Pajak", "4 bulan setelah akhir Tahun Pajak", "6 bulan setelah akhir Tahun Pajak"], "c": 2, "e": "SPT Tahunan PPh Badan disampaikan paling lambat 4 bulan setelah akhir Tahun Pajak atau akhir Bagian Tahun Pajak.", "p": 0, "topic": "PMK 243/2014 - Batas Waktu", "id": "pengawasan_q_169"}, {"q": "SPOP (Surat Pemberitahuan Objek Pajak PBB) wajib disampaikan WP paling lama...", "o": ["15 hari setelah tanggal diterimanya SPOP", "20 hari setelah tanggal diterimanya SPOP", "30 hari setelah tanggal diterimanya SPOP", "60 hari setelah tanggal diterimanya SPOP"], "c": 2, "e": "SPOP wajib disampaikan paling lama 30 hari setelah tanggal diterimanya SPOP oleh WP.", "p": 0, "topic": "PMK 243/2014 - SPOP", "id": "pengawasan_q_170"}, {"q": "Ketentuan \"pelaporan dapat dilakukan paling lambat hari kerja berikutnya\" apabila batas waktu pelaporan bertepatan dengan hari libur, berlaku untuk...", "o": ["SPT Tahunan dan SPT Masa", "Hanya SPT Masa", "Hanya SPT Tahunan", "Hanya SPOP"], "c": 1, "e": "Ketentuan ini khusus berlaku untuk SPT Masa dan TIDAK berlaku untuk SPT Tahunan.", "p": 0, "topic": "PMK 243/2014 - Batas Waktu Hari Libur", "id": "pengawasan_q_171"}, {"q": "WP dapat memperpanjang jangka waktu penyampaian SPT Tahunan PPh untuk paling lama...", "o": ["1 bulan sejak batas waktu penyampaian SPT Tahunan", "2 bulan sejak batas waktu penyampaian SPT Tahunan", "3 bulan sejak batas waktu penyampaian SPT Tahunan", "6 bulan sejak batas waktu penyampaian SPT Tahunan"], "c": 1, "e": "Perpanjangan jangka waktu penyampaian SPT Tahunan PPh paling lama 2 bulan sejak batas waktu penyampaian SPT Tahunan.", "p": 0, "topic": "PMK 243/2014 - Perpanjangan SPT", "id": "pengawasan_q_172"}, {"q": "Manakah WP yang DIKECUALIKAN dari pengenaan sanksi administratif denda keterlambatan/tidak lapor SPT?", "o": ["WP Badan yang masih menjalankan usaha namun rugi", "WP OP yang sudah tidak melakukan kegiatan usaha atau pekerjaan bebas", "WP Badan yang baru berdiri", "WP yang mengajukan keberatan atas SKP"], "c": 1, "e": "WP OP yang sudah tidak melakukan kegiatan usaha atau pekerjaan bebas termasuk salah satu kategori yang dikecualikan dari sanksi administratif denda keterlambatan/tidak lapor SPT.", "p": 0, "topic": "PMK 243/2014 - Pengecualian Sanksi", "id": "pengawasan_q_173"}, {"q": "Pembetulan SPT yang menyatakan rugi atau lebih bayar dapat dilakukan paling lama...", "o": ["1 tahun sebelum daluwarsa", "2 tahun sebelum daluwarsa", "3 tahun sebelum daluwarsa", "Tidak ada batasan waktu"], "c": 1, "e": "Pembetulan SPT yang menyatakan rugi atau lebih bayar dapat dilakukan paling lama 2 tahun sebelum daluwarsa penetapan.", "p": 0, "topic": "PMK 243/2014 - Pembetulan SPT", "id": "pengawasan_q_174"}, {"q": "Sanksi bunga atas pembetulan SPT yang mengakibatkan utang pajak lebih besar dihitung berdasarkan Pasal berapa UU KUP?", "o": ["Pasal 7 ayat (1) UU KUP", "Pasal 8 UU KUP", "Pasal 13 ayat (2) UU KUP", "Pasal 14 UU KUP"], "c": 1, "e": "Sanksi bunga atas pembetulan SPT yang mengakibatkan utang pajak lebih besar dihitung berdasarkan Pasal 8 UU KUP.", "p": 0, "topic": "PMK 243/2014 - Sanksi Pembetulan", "id": "pengawasan_q_175"}, {"q": "Jika WP menerima SK Keberatan yang menyatakan rugi fiskal berbeda dengan yang telah dikompensasikan dalam SPT Tahunan dan tidak membetulkan SPT-nya, maka...", "o": ["Dirjen Pajak menghitung kembali kompensasi kerugian secara jabatan", "SPT dianggap batal demi hukum", "WP otomatis dikenai sanksi 100%", "Kompensasi kerugian tahun sebelumnya dihapus"], "c": 0, "e": "Jika WP tidak membetulkan SPT setelah menerima SK/Putusan yang menyatakan rugi fiskal berbeda, Dirjen Pajak menghitung kembali kompensasi kerugian dalam SPT secara jabatan.", "p": 0, "topic": "PMK 243/2014 - Pembetulan karena Ketetapan", "id": "pengawasan_q_176"}, {"q": "SPT yang disampaikan melalui pos dianggap TIDAK disampaikan apabila...", "o": ["Dikirim melalui perusahaan ekspedisi berizin", "Dalam satu amplop terdapat lebih dari satu Surat Pemberitahuan", "Dikirim 1 hari sebelum batas waktu", "Dilampiri bukti bayar sesuai jumlah kurang bayar"], "c": 1, "e": "Jika dalam satu amplop terdapat lebih dari satu Surat Pemberitahuan, SPT dianggap tidak disampaikan.", "p": 0, "topic": "PMK 243/2014 - Penelitian SPT", "id": "pengawasan_q_177"}, {"q": "Tarif PPh final atas pengalihan hak atas tanah dan/atau bangunan kepada pemerintah dalam rangka pengadaan tanah untuk kepentingan umum adalah...", "o": ["0%", "1%", "2,5%", "5%"], "c": 0, "e": "Pengalihan kepada pemerintah, BUMN/BUMD penugasan khusus pengadaan tanah untuk kepentingan umum, dikenai tarif 0%.", "p": 0, "topic": "PMK 261/2016 - Tarif", "id": "pengawasan_q_178"}, {"q": "Untuk pengalihan tanah/bangunan kepada Instansi Pemerintah (ketentuan terbaru), siapa yang memungut PPh final PHTB?", "o": ["WP penjual menyetor sendiri", "Instansi Pemerintah selaku pemungut", "Notaris/PPAT", "Kantor Pertanahan"], "c": 1, "e": "Ketentuan baru: atas pengalihan kepada pemerintah, PPh final PHTB dipungut oleh Instansi Pemerintah, bukan lagi disetor sendiri oleh WP penjual sebagaimana aturan sebelumnya.", "p": 0, "topic": "PMK 261/2016 - Mekanisme Pembayaran", "id": "pengawasan_q_179"}, {"q": "Tempat terutang PPh final PHTB bagi WP yang melakukan pengalihan hak atas tanah dan/atau bangunan, sesuai ketentuan terbaru, adalah...", "o": ["Lokasi tanah/bangunan untuk semua WP", "Tempat tinggal OP atau tempat kedudukan Badan di mana SPT Tahunan diadministrasikan", "Tempat PPAT berkedudukan", "Kantor BPN setempat"], "c": 1, "e": "Ketentuan baru menetapkan tempat terutang di tempat tinggal OP/tempat kedudukan Badan di mana SPT Tahunan PPh WP diadministrasikan — berbeda dari aturan lama yang membedakan developer (lokasi tanah) dan non-developer.", "p": 0, "topic": "PMK 261/2016 - Tempat Terutang", "id": "pengawasan_q_180"}, {"q": "PHTB sehubungan dengan hibah yang DIKECUALIKAN dari PPh final adalah hibah kepada, KECUALI...", "o": ["Keluarga sedarah garis lurus satu derajat", "Badan keagamaan", "Koperasi", "Orang pribadi yang bukan menjalankan usaha mikro/kecil"], "c": 3, "e": "Pengecualian hibah berlaku untuk keluarga sedarah garis lurus 1 derajat, badan keagamaan/pendidikan/sosial termasuk yayasan, koperasi, atau OP yang menjalankan usaha mikro dan kecil — bukan untuk OP yang tidak menjalankan usaha mikro/kecil.", "p": 0, "topic": "PMK 261/2016 - Pengecualian", "id": "pengawasan_q_181"}, {"q": "Special Purpose Company (SPC) dalam skema DIRE berbentuk KIK adalah PT yang sahamnya dimiliki DIRE paling kurang...", "o": ["51%", "75%", "90%", "99,9%"], "c": 3, "e": "SPC adalah PT yang sahamnya dimiliki oleh DIRE berbentuk KIK paling kurang 99,9% dari modal disetor, dibentuk semata-mata untuk kepentingan DIRE berbentuk KIK.", "p": 0, "topic": "PMK 37/2017 - Definisi", "id": "pengawasan_q_182"}, {"q": "Tarif PPh final atas penghasilan dari pengalihan Real Estat kepada SPC atau KIK dalam skema KIK tertentu (DIRE) adalah...", "o": ["0,1%", "0,5%", "1%", "2,5%"], "c": 1, "e": "Tarif PPh final atas pengalihan Real Estat kepada SPC/KIK dalam skema KIK tertentu adalah 0,5% dari jumlah bruto nilai pengalihan.", "p": 0, "topic": "PMK 37/2017 - Tarif", "id": "pengawasan_q_183"}, {"q": "Jumlah bruto nilai pengalihan Real Estat yang dijadikan DPP PPh final DIRE, apabila Wajib Pajak memiliki hubungan istimewa dengan SPC/KIK, menggunakan...", "o": ["Jumlah yang sesungguhnya diterima atau diperoleh", "Jumlah yang seharusnya diterima atau diperoleh", "Nilai pasar objek pada saat pengalihan", "Nilai appraisal independen"], "c": 1, "e": "Jika WP memiliki hubungan istimewa dengan SPC atau KIK, DPP menggunakan jumlah yang SEHARUSNYA diterima/diperoleh, bukan jumlah yang sesungguhnya diterima.", "p": 0, "topic": "PMK 37/2017 - DPP", "id": "pengawasan_q_184"}, {"q": "Uplift (atau imbalan lain yang sejenis) yang diterima Kontraktor migas adalah imbalan atas...", "o": ["Jasa konsultasi teknis pengeboran", "Penyediaan dana talangan pembiayaan operasi kontrak bagi hasil yang seharusnya kewajiban partisipasi kontraktor lain", "Penjualan hasil produksi minyak mentah", "Sewa peralatan pengeboran kepada kontraktor lain"], "c": 1, "e": "Uplift adalah imbalan yang diterima Kontraktor sehubungan dengan penyediaan dana talangan untuk pembiayaan operasi kontrak bagi hasil, yang seharusnya merupakan kewajiban partisipasi kontraktor lain dalam satu kontrak kerja sama.", "p": 0, "topic": "PMK 257/2011 - Uplift", "id": "pengawasan_q_185"}, {"q": "Tarif PPh final atas penghasilan Uplift yang diterima Kontraktor migas adalah...", "o": ["10% dari jumlah bruto", "15% dari jumlah bruto", "20% dari jumlah bruto", "25% dari jumlah bruto"], "c": 2, "e": "Penghasilan Uplift dikenai PPh final sebesar 20% dari jumlah bruto, terutang saat dibayar atau diakui sebagai biaya (mana yang lebih dahulu).", "p": 0, "topic": "PMK 257/2011 - Tarif Uplift", "id": "pengawasan_q_186"}, {"q": "Tarif PPh final atas pengalihan Participating Interest (PI) secara langsung pada masa Eksploitasi adalah...", "o": ["5% dari jumlah bruto", "7% dari jumlah bruto", "10% dari jumlah bruto", "20% dari jumlah bruto"], "c": 1, "e": "Pengalihan PI langsung pada masa Eksploitasi dikenai tarif 7% dari jumlah bruto; pada masa Eksplorasi tarifnya 5%.", "p": 0, "topic": "PMK 257/2011 - Tarif PI", "id": "pengawasan_q_187"}, {"q": "Pengalihan PI secara Tidak Langsung dalam rangka restrukturisasi dikecualikan dari PPh final apabila, KECUALI...", "o": ["Mendapatkan persetujuan menggunakan nilai buku", "Bertujuan tidak untuk mencari keuntungan dan tidak mengubah ultimate parent entity", "Kontraktor menyampaikan pemberitahuan ke DJP maksimal 4 bulan setelah akhir tahun pajak pengalihan", "Dilakukan dengan tujuan mencari keuntungan dari selisih nilai saham"], "c": 3, "e": "Pengecualian PPh final berlaku jika restrukturisasi TIDAK bertujuan mencari keuntungan (dan tidak mengubah kantor pusat/ultimate parent entity) — bukan sebaliknya.", "p": 0, "topic": "PMK 257/2011 - Pengecualian PI", "id": "pengawasan_q_188"}, {"q": "Pemungutan PPh Pasal 22 atas pembelian barang oleh Instansi Pemerintah dikenakan tarif sebesar...", "o": ["0,5% dari harga pembelian termasuk PPN", "1,5% dari harga pembelian tidak termasuk PPN", "2,5% dari harga pembelian tidak termasuk PPN", "3% dari harga pembelian termasuk PPN"], "c": 1, "e": "Pembayaran atas pembelian barang oleh Instansi Pemerintah dikenai PPh Pasal 22 sebesar 1,5% dari harga pembelian, tidak termasuk PPN.", "p": 0, "topic": "PMK 34/2017 - PPh 22 Instansi Pemerintah", "id": "pengawasan_q_189"}, {"q": "Pengenaan tarif PPh Pasal 22 100% lebih tinggi bagi WP tanpa NPWP (pemberlakuan NPWP=NIK), sesuai PMK 34/2017, sekarang...", "o": ["Tetap berlaku untuk semua objek", "Dihapus", "Hanya berlaku untuk impor", "Diturunkan menjadi 50% lebih tinggi"], "c": 1, "e": "Ketentuan pengenaan tarif 100% lebih tinggi bagi WP tanpa NPWP (akibat pemberlakuan NPWP=NIK) telah DIHAPUS dalam PMK 34/2017.", "p": 0, "topic": "PMK 34/2017 - NPWP=NIK", "id": "pengawasan_q_190"}, {"q": "Batas waktu penyetoran PPh Pasal 22 yang dipungut Instansi Pemerintah/Pemungut (ketentuan baru) adalah...", "o": ["Tanggal 7 bulan berikutnya", "Tanggal 10 bulan berikutnya", "Tanggal 15 bulan berikutnya", "Tanggal 20 bulan berikutnya"], "c": 2, "e": "Ketentuan baru menetapkan jatuh tempo penyetoran tanggal 15 bulan berikutnya setelah Masa Pajak berakhir — sebelumnya UP disetor tanggal 7, LS pada hari yang sama.", "p": 0, "topic": "PMK 34/2017 - Penyetoran", "id": "pengawasan_q_191"}, {"q": "Rumus umum Angsuran PPh Pasal 25 adalah PPh Terutang menurut SPT Tahunan tahun sebelumnya dikurangi kredit pajak PPh 21/22/23/24, kemudian dibagi...", "o": ["3 bulan", "6 bulan", "12 bulan atau banyaknya bulan dalam Bagian Tahun Pajak", "24 bulan"], "c": 2, "e": "Angsuran PPh Pasal 25 = (PPh Terutang − Kredit Pajak) ÷ 12 bulan, atau dibagi banyaknya bulan dalam Bagian Tahun Pajak.", "p": 0, "topic": "PMK 215/2018 - Rumus Umum", "id": "pengawasan_q_192"}, {"q": "Bagi WP Bank, Angsuran PPh Pasal 25 dihitung berdasarkan Laporan Keuangan yang disampaikan kepada OJK dengan periode...", "o": ["Setiap triwulan", "Setiap semester", "Setiap awal Tahun Pajak s.d. Masa Pajak yang dilaporkan", "Setiap tahun sekali"], "c": 2, "e": "Bank menghitung angsuran berdasarkan laporan keuangan yang disampaikan ke OJK sejak awal Tahun Pajak s.d. Masa Pajak yang dilaporkan, dibagi 12 bulan.", "p": 0, "topic": "PMK 215/2018 - WP Bank", "id": "pengawasan_q_193"}, {"q": "Bagi BUMN dan BUMD, Angsuran PPh Pasal 25 dihitung berdasarkan...", "o": ["Laporan Keuangan triwulanan ke bursa", "RKAP (Rencana Kerja dan Anggaran Perusahaan) Tahun Pajak bersangkutan yang telah disahkan", "Laporan Keuangan bulanan internal", "Proyeksi laba dari manajemen"], "c": 1, "e": "BUMN/BUMD menghitung Angsuran PPh Pasal 25 berdasarkan RKAP Tahun Pajak bersangkutan yang telah disahkan, dibagi 12 bulan untuk setiap Masa Pajak.", "p": 0, "topic": "PMK 215/2018 - BUMN/BUMD", "id": "pengawasan_q_194"}, {"q": "Jika Laporan Keuangan WP masuk bursa belum dilaporkan sampai batas waktu setor PPh Pasal 25 Masa Pajak terakhir, besarnya angsuran untuk Masa Pajak terakhir tersebut adalah...", "o": ["Sama dengan Masa Pajak sebelumnya", "Nihil", "Dihitung ulang dari awal tahun", "Ditetapkan oleh KPP secara jabatan"], "c": 0, "e": "Sebagai pengecualian dari rekalkulasi, jika Lapkeu belum dilaporkan ke bursa, besarnya Angsuran PPh Pasal 25 Masa Pajak terakhir sama dengan Masa Pajak sebelumnya.", "p": 0, "topic": "PMK 215/2018 - Pengecualian Rekalkulasi", "id": "pengawasan_q_195"}, {"q": "Jika hasil rekalkulasi Angsuran PPh Pasal 25 menunjukkan jumlah yang lebih besar dibanding sebelum rekalkulasi (kurang setor), maka WP...", "o": ["Dibebaskan dari kewajiban menyetor kekurangan", "Wajib menyetor kekurangan dan dikenai sanksi administratif sesuai UU KUP", "Hanya wajib menyetor tanpa sanksi", "Dapat memilih untuk tidak menyetor"], "c": 1, "e": "Jika PPh 25 sebelum rekalkulasi lebih kecil dari setelah rekalkulasi (kurang setor), WP wajib menyetor kekurangan tersebut DAN dikenai sanksi administratif sesuai UU KUP.", "p": 0, "topic": "PMK 215/2018 - Rekalkulasi", "id": "pengawasan_q_196"}, {"q": "Angsuran PPh Pasal 25 bagi Wajib Pajak Orang Pribadi Pengusaha Tertentu (OPPT) dihitung sebesar...", "o": ["0,5% dari peredaran bruto tiap bulan dari masing-masing tempat usaha", "0,75% dari peredaran bruto tiap bulan dari masing-masing tempat usaha", "1% dari peredaran bruto tiap bulan dari masing-masing tempat usaha", "1,5% dari peredaran bruto tiap bulan dari masing-masing tempat usaha"], "c": 1, "e": "Angsuran PPh Pasal 25 WP OPPT = 0,75% × jumlah peredaran bruto setiap bulan dari masing-masing tempat usaha, termasuk tempat usaha yang berada di tempat tinggal WP (ketentuan baru).", "p": 0, "topic": "PMK 215/2018 - WP OPPT", "id": "pengawasan_q_197"}, {"q": "Untuk WP Baru hasil pemekaran usaha, Angsuran PPh Pasal 25 masing-masing WP dihitung berdasarkan...", "o": ["Jumlah yang sama rata antar WP hasil pemekaran", "Persentase nilai harta yang dialihkan", "Jumlah peredaran bruto masing-masing WP", "Kesepakatan antar WP hasil pemekaran"], "c": 1, "e": "Jumlah Angsuran PPh Pasal 25 untuk seluruh WP hasil pemekaran usaha ditetapkan sebesar Angsuran PPh 25 sebelum pemekaran, kemudian dihitung per WP berdasarkan persentase nilai harta yang dialihkan.", "p": 0, "topic": "PMK 215/2018 - WP Baru", "id": "pengawasan_q_198"}, {"q": "Tarif PPh Pasal 26 atas keuntungan dari penjualan saham oleh WPLN selain BUT, sesuai KMK 434/1999, adalah...", "o": ["10% dari perkiraan penghasilan neto", "15% dari perkiraan penghasilan neto", "20% dari perkiraan penghasilan neto", "25% dari perkiraan penghasilan neto"], "c": 2, "e": "Dikenakan PPh Pasal 26 sebesar 20% dari perkiraan penghasilan neto (= 25% dari harga jual) dan bersifat final, dengan mengacu P3B apabila ada.", "p": 0, "topic": "KMK 434/1999 - Tarif", "id": "pengawasan_q_199"}, {"q": "Batas waktu penyetoran PPh Pasal 26 atas penjualan saham oleh WPLN selain BUT, sesuai ketentuan terbaru, adalah...", "o": ["Tanggal 10 bulan berikutnya", "Tanggal 15 bulan berikutnya", "Tanggal 20 bulan berikutnya", "Tanggal 25 bulan berikutnya"], "c": 1, "e": "Ketentuan baru menetapkan batas waktu setor tanggal 15 bulan berikutnya (sebelumnya tanggal 10).", "p": 0, "topic": "KMK 434/1999 - Batas Waktu", "id": "pengawasan_q_200"}, {"q": "Besaran persentase perkiraan penghasilan neto atas premi asuransi/reasuransi yang dibayarkan ke perusahaan asuransi luar negeri (KMK 624/1994) bergantung pada...", "o": ["Jumlah premi yang dibayarkan saja", "Pihak pembayar dan penerima premi (50%/10%/5%)", "Negara asal perusahaan asuransi luar negeri", "Jenis valuta pembayaran premi"], "c": 1, "e": "Persentase tertentu untuk menghitung perkiraan penghasilan neto (50%, 10%, atau 5%) tergantung pada pihak pembayar dan penerima premi asuransi/reasuransi.", "p": 0, "topic": "KMK 624/1994 - Perkiraan Penghasilan Neto", "id": "pengawasan_q_201"}, {"q": "Tarif final PPh atas transaksi penjualan saham di bursa efek menurut KMK 282/1997 adalah...", "o": ["0,1% dari jumlah bruto nilai transaksi", "0,5% dari jumlah bruto nilai transaksi", "1% dari jumlah bruto nilai transaksi", "2,5% dari jumlah bruto nilai transaksi"], "c": 0, "e": "PPh final atas penjualan saham di bursa efek adalah 0,1% dari jumlah bruto nilai transaksi, dipotong oleh BEI melalui Anggota Bursa.", "p": 0, "topic": "KMK 282/1997 - Tarif Saham Bursa", "id": "pengawasan_q_202"}, {"q": "Kewajiban penyelenggara bursa efek (BEI) dalam membuat bukti pemotongan PPh, menurut ketentuan terbaru, dilakukan...", "o": ["Secara gunggungan (digabung semua nasabah)", "Per nasabah berdasarkan data trade confirmation dari Anggota Bursa", "Per transaksi harian secara keseluruhan", "Per bulan secara agregat"], "c": 1, "e": "Ketentuan baru mewajibkan BEI membuat bukti pemotongan PPh per nasabah berdasarkan data trade confirmation yang dikirimkan Anggota Bursa — sebelumnya pemotongan dilakukan secara gunggungan.", "p": 0, "topic": "KMK 282/1997 - Kewajiban BEI", "id": "pengawasan_q_203"}, {"q": "Tarif PPh final tambahan atas nilai saham pendiri pada saat IPO adalah...", "o": ["0,1%", "0,5%", "1%", "2,5%"], "c": 1, "e": "Pemilik saham pendiri yang diperdagangkan setelah 1997 dikenai tambahan PPh final sebesar 0,5% dari nilai saham pada saat IPO.", "p": 0, "topic": "KMK 282/1997 - Saham Pendiri", "id": "pengawasan_q_204"}, {"q": "Jika Emiten tidak melakukan penyetoran tambahan PPh saham pendiri dalam waktu 1 bulan setelah IPO, maka atas penjualan saham pendiri tersebut...", "o": ["Tetap dikenai PPh final 0,5%", "Dikenai PPh sesuai tarif umum Pasal 17 UU PPh", "Dibebaskan dari pengenaan PPh", "Dikenai sanksi administrasi saja tanpa pengenaan PPh tambahan"], "c": 1, "e": "Jika penyetoran tambahan PPh saham pendiri tidak dilakukan dalam 1 bulan sejak IPO, maka atas penjualan saham pendiri dikenai PPh sesuai tarif umum Pasal 17 UU PPh (bukan lagi tarif final 0,5%).", "p": 0, "topic": "KMK 282/1997 - Sanksi Saham Pendiri", "id": "pengawasan_q_205"}, {"q": "Penerimaan Negara dari kegiatan usaha hulu migas terdiri dari Bagian Negara dan...", "o": ["Royalti Daerah", "Pajak Penghasilan Migas", "Dana Bagi Hasil Migas", "Pajak Bumi dan Bangunan Migas"], "c": 1, "e": "Penerimaan Negara dari kegiatan usaha hulu migas terdiri dari Bagian Negara dan Pajak Penghasilan (PPh) Migas.", "p": 0, "topic": "PMK 79/2012 - Penerimaan Negara", "id": "pengawasan_q_206"}, {"q": "Pembayaran PPh dapat berupa volume Minyak Bumi dan/atau Gas Bumi dari bagian Kontraktor, dalam hal...", "o": ["Kontraktor memilih sendiri metode pembayaran", "Pemerintah membutuhkan Migas", "Harga minyak dunia sedang tinggi", "Kontraktor mengalami kesulitan likuiditas"], "c": 1, "e": "Pembayaran PPh dapat berupa volume minyak bumi dan/atau gas bumi dari bagian Kontraktor dalam hal Pemerintah membutuhkan Migas.", "p": 0, "topic": "PMK 79/2012 - Pembayaran PPh Volume", "id": "pengawasan_q_207"}, {"q": "Dokumen yang menjadi dasar dan tanggal pengakuan pembayaran PPh migas dalam bentuk volume minyak/gas bumi adalah...", "o": ["Invoice penjualan migas", "Berita Acara Serah Terima (BAST)", "Surat Setoran Pajak (SSP)", "Bukti Penerimaan Negara (BPN)"], "c": 1, "e": "Pembayaran dalam bentuk volume migas dituangkan dalam Berita Acara Serah Terima (BAST) yang ditandatangani Kontraktor dan Pemerintah; tanggal BAST menjadi tanggal pembayaran PPh.", "p": 0, "topic": "PMK 79/2012 - BAST", "id": "pengawasan_q_208"}, {"q": "SKK Migas atau BP Migas Aceh wajib menyampaikan Laporan Bulanan hasil perhitungan Penerimaan Negara kepada, KECUALI...", "o": ["DJA cq. Direktorat PNBP", "DJP tempat Operator/Partner terdaftar", "SKK Migas atau BP Migas Aceh", "Otoritas Jasa Keuangan (OJK)"], "c": 3, "e": "Laporan Bulanan Penerimaan Negara disampaikan kepada DJA cq. Dit. PNBP, DJP tempat Operator/Partner terdaftar, dan SKK Migas/BP Migas Aceh — bukan kepada OJK, yang tidak terkait pengawasan migas.", "p": 0, "topic": "PMK 79/2012 - Pelaporan", "id": "pengawasan_q_209"}, {"q": "Laporan Penerimaan Negara (LPN) oleh Kontraktor migas (Laporan Bulanan yang disamakan dengan SPT Masa PPh per PMK 79/PMK.02/2012) wajib disampaikan paling lambat...", "o": ["Tanggal 10 bulan berikutnya", "Tanggal 15 bulan berikutnya", "Tanggal 20 bulan berikutnya", "Akhir bulan berikutnya"], "c": 2, "e": "LPN wajib disampaikan paling lambat tanggal 20 bulan berikutnya; jika bertepatan hari libur, disampaikan hari kerja berikutnya.", "p": 0, "topic": "PMK 79/2012 - Migas", "id": "pengawasan_q_210"}, {"q": "Turis Asing yang berhak mengajukan VAT Refund atas pembelian Barang Bawaan harus memenuhi syarat berada di Indonesia tidak lebih dari...", "o": ["30 hari sejak kedatangan", "60 hari sejak kedatangan", "90 hari sejak kedatangan", "6 bulan sejak kedatangan"], "c": 1, "e": "Turis Asing yang dapat mengajukan VAT Refund adalah bukan WNI/bukan permanent resident Indonesia dan berada di Indonesia tidak lebih dari 60 hari sejak kedatangan.", "p": 0, "topic": "VAT Refund", "id": "pengawasan_q_211"}, {"q": "Nilai PPN minimal yang dapat diajukan VAT Refund oleh Turis Asing adalah...", "o": ["Rp250.000", "Rp500.000", "Rp1.000.000", "Rp5.000.000"], "c": 1, "e": "Nilai PPN paling sedikit Rp500.000, tercantum dalam 1 FP atau gabungan FP, dengan nilai PPN masing-masing FP paling sedikit Rp50.000.", "p": 0, "topic": "VAT Refund", "id": "pengawasan_q_212"}, {"q": "Dalam skema VAT Refund, pengembalian PPN secara tunai dilakukan jika nilai PPN yang dikembalikan...", "o": ["Melebihi Rp10 juta", "Paling banyak Rp5 juta", "Paling banyak Rp1 juta", "Tidak ada batasan, selalu tunai"], "c": 1, "e": "PPN dikembalikan secara tunai jika nilai yang dikembalikan ≤ Rp5 juta; jika > Rp5 juta dikembalikan melalui transfer.", "p": 0, "topic": "VAT Refund", "id": "pengawasan_q_213"}, {"q": "Pembelian Barang Bawaan oleh Turis Asing harus dilakukan dalam jangka waktu berapa sebelum keberangkatan agar berhak VAT Refund?", "o": ["7 hari", "14 hari", "1 bulan (30 hari kalender)", "3 bulan"], "c": 2, "e": "Pembelian Barang Bawaan harus dilakukan dalam jangka waktu 1 bulan (30 hari kalender) sebelum keberangkatan ke luar Daerah Pabean.", "p": 0, "topic": "VAT Refund", "id": "pengawasan_q_214"}, {"q": "Ekspor Jasa Kena Pajak dikenai PPN dengan tarif...", "o": ["11%", "12%", "0%", "Dibebaskan tanpa dasar hukum"], "c": 2, "e": "PPN atas Ekspor JKP = DPP (Penggantian) × Tarif 0%, berdasarkan PMK 32/PMK.010/2019.", "p": 0, "topic": "Ekspor JKP", "id": "pengawasan_q_215"}, {"q": "Jasa Maklon dapat dikategorikan Ekspor JKP kategori (a) apabila memenuhi syarat, KECUALI...", "o": ["Spesifikasi dan bahan baku disediakan oleh Penerima Ekspor JKP", "Kepemilikan BKP hasil maklon berada pada Penerima Ekspor JKP", "BKP hasil maklon dikirim ke luar Daerah Pabean dengan mekanisme ekspor barang", "Pembayaran dilakukan dalam bentuk barter dengan BKP lain yang setara"], "c": 3, "e": "Jasa maklon kategori (a) mensyaratkan bahan baku dari Penerima Ekspor JKP, kepemilikan BKP hasil tetap pada Penerima, dan pengiriman BKP via mekanisme ekspor barang — bukan pembayaran barter.", "p": 0, "topic": "Ekspor JKP", "id": "pengawasan_q_216"}, {"q": "Agar Ekspor JKP dikenai PPN tarif 0%, syarat yang harus dipenuhi adalah...", "o": ["Hanya memerlukan perikatan tertulis saja", "Hanya memerlukan bukti pembayaran saja", "Perikatan/perjanjian tertulis mencantumkan jenis/rincian/nilai JKP, DAN terdapat bukti pembayaran yang sah", "Cukup dengan invoice tanpa perjanjian tertulis"], "c": 2, "e": "Syarat kumulatif: didasarkan perikatan/perjanjian tertulis yang mencantumkan jenis, rincian kegiatan, dan nilai penyerahan JKP, DAN terdapat pembayaran disertai bukti pembayaran sah.", "p": 0, "topic": "Ekspor JKP", "id": "pengawasan_q_217"}, {"q": "Saat terutang PPN atas Ekspor JKP adalah...", "o": ["Saat penandatanganan kontrak", "Saat penggantian jasa dicatat/diakui sebagai piutang atau penghasilan", "Saat barang fisik dikirim", "Saat SPT Masa PPN dilaporkan"], "c": 1, "e": "Saat terutang PPN Ekspor JKP adalah saat Ekspor JKP, yaitu saat penggantian atas jasa yang diekspor dicatat/diakui sebagai piutang atau penghasilan.", "p": 0, "topic": "Ekspor JKP", "id": "pengawasan_q_218"}, {"q": "Pengembalian BKP (retur) dianggap TIDAK terjadi apabila...", "o": ["Nota retur dibuat tepat waktu", "BKP diganti dengan BKP yang sama baik jumlah fisik, jenis, maupun harganya", "Nota retur disampaikan kepada PKP penjual", "Retur dilakukan dalam Masa Pajak yang sama dengan penyerahan"], "c": 1, "e": "Pengembalian BKP dianggap tidak terjadi dalam hal BKP yang dikembalikan diganti dengan BKP yang sama, baik jumlah fisik, jenis, maupun harganya.", "p": 0, "topic": "Retur BKP", "id": "pengawasan_q_219"}, {"q": "Nota Retur mengurangi Pajak Keluaran bagi PKP penjual pada...", "o": ["Masa Pajak sebelum terjadinya pengembalian", "Masa Pajak saat terjadinya pengembalian BKP", "Masa Pajak setelah SPT Tahunan dilaporkan", "Tidak ada pengaruh terhadap Pajak Keluaran"], "c": 1, "e": "Nota Retur mengurangi Pajak Keluaran dan PPnBM yang terutang bagi PKP penjual, dilakukan dalam Masa Pajak saat terjadinya pengembalian BKP.", "p": 0, "topic": "Retur BKP", "id": "pengawasan_q_220"}, {"q": "Nota Retur dan Nota Pembatalan wajib dibuat dengan ketentuan berikut, KECUALI...", "o": ["Berbentuk elektronik", "Ditandatangani dengan Tanda Tangan Elektronik", "Memperoleh persetujuan Direktorat Jenderal Pajak", "Boleh dibuat dalam bentuk cetak fisik biasa tanpa unggah sistem"], "c": 3, "e": "Nota Retur/Pembatalan wajib berbentuk elektronik, dibuat/diunggah melalui modul Portal Wajib Pajak, ditandatangani TTE, dan memperoleh persetujuan DJP.", "p": 0, "topic": "Retur BKP", "id": "pengawasan_q_221"}, {"q": "BUMN dapat ditunjuk sebagai Pemungut PPN apabila dilakukan restrukturisasi oleh Pemerintah setelah tanggal...", "o": ["1 Januari 2015", "1 April 2015", "1 Januari 2020", "1 April 2021"], "c": 1, "e": "BUMN yang direstrukturisasi Pemerintah setelah 1 April 2015 melalui pengalihan saham negara kepada BUMN lain dapat ditetapkan sebagai Pemungut PPN.", "p": 0, "topic": "BUMN Pemungut PPN", "id": "pengawasan_q_222"}, {"q": "Pembayaran oleh Pemungut PPN kepada Rekanan yang nilainya paling banyak Rp10.000.000 (termasuk PPN/PPnBM terutang) dan bukan pemecahan dari transaksi yang nilai sebenarnya lebih besar, mengakibatkan PPN...", "o": ["Tetap dipungut oleh Pemungut PPN seperti biasa", "Dikecualikan dari pemungutan dan dipungut, disetor, dilaporkan sendiri oleh Rekanan", "Tidak terutang sama sekali", "Ditangguhkan sampai akhir tahun pajak"], "c": 1, "e": "Pembayaran paling banyak Rp10 juta (bukan pemecahan transaksi) termasuk dalam pengecualian pemungutan oleh Pemungut PPN — PPN dipungut, disetor, dan dilaporkan sendiri oleh Rekanan.", "p": 0, "topic": "BUMN Pemungut PPN", "id": "pengawasan_q_223"}, {"q": "Besaran tertentu PPN atas komisi yang dibayarkan kepada Agen Asuransi (sebelum tarif PPN 12% berlaku) adalah...", "o": ["1,1% dari komisi", "2,2% dari komisi", "0,5% dari komisi", "5% dari komisi"], "c": 0, "e": "Besaran tertentu PPN untuk jasa Agen Asuransi adalah 1,1% dari nilai komisi/imbalan (sebelum dipotong pajak penghasilan/pungutan lain); naik menjadi 1,2% saat tarif PPN 12% berlaku.", "p": 0, "topic": "Agen/Pialang Asuransi", "id": "pengawasan_q_224"}, {"q": "Besaran tertentu PPN atas komisi Perusahaan Pialang Asuransi/Reasuransi (sebelum tarif PPN 12%) adalah...", "o": ["1,1%", "2,2%", "3,3%", "0,2%"], "c": 1, "e": "Besaran tertentu PPN untuk Pialang Asuransi/Reasuransi adalah 2,2% dari komisi, naik menjadi 2,4% saat tarif PPN 12% berlaku.", "p": 0, "topic": "Agen/Pialang Asuransi", "id": "pengawasan_q_225"}, {"q": "SPT Masa PPN Agen Asuransi dianggap telah dilaporkan apabila...", "o": ["Agen melaporkan sendiri setiap bulan", "Kegiatan usaha Agen hanya jasa agen asuransi saja (tanpa BKP/JKP lain melebihi batasan pengusaha kecil)", "Agen membayar PPN secara tunai", "Perusahaan asuransi melaporkan langsung ke KPP Agen"], "c": 1, "e": "Jika kegiatan usaha Agen hanya jasa agen asuransi, SPT Masa PPN-nya dianggap telah dilaporkan; jika ada penyerahan BKP/JKP lain melebihi batasan pengusaha kecil, wajib dilaporkan sendiri.", "p": 0, "topic": "Agen/Pialang Asuransi", "id": "pengawasan_q_226"}, {"q": "Kriteria bangunan yang terutang PPN atas Kegiatan Membangun Sendiri (KMS) adalah luas bangunan paling sedikit...", "o": ["100 m2", "150 m2", "200 m2", "300 m2"], "c": 2, "e": "Kriteria bangunan KMS: konstruksi dapat berupa kayu/beton/bata/baja, diperuntukkan tempat tinggal/usaha, dan luas keseluruhan paling sedikit 200 m2.", "p": 0, "topic": "KMS", "id": "pengawasan_q_227"}, {"q": "PPN terutang atas Kegiatan Membangun Sendiri (KMS) dihitung dengan formula...", "o": ["10% × Tarif PPN × DPP", "20% × Tarif PPN × DPP", "Tarif PPN × DPP penuh tanpa besaran tertentu", "30% × Tarif PPN × DPP"], "c": 1, "e": "PPN Terutang KMS = 20% (besaran tertentu) × Tarif PPN × DPP, di mana DPP adalah biaya membangun tidak termasuk biaya perolehan tanah.", "p": 0, "topic": "KMS", "id": "pengawasan_q_228"}, {"q": "Pembangunan bertahap dalam KMS dianggap satu kesatuan KMS apabila jeda antartahap...", "o": ["Tidak lebih dari 1 tahun", "Tidak lebih dari 2 tahun", "Tidak lebih dari 3 tahun", "Tidak ada batasan jeda waktu"], "c": 1, "e": "Pembangunan bertahap yang berjeda tidak lebih dari 2 tahun antartahap dianggap satu kesatuan KMS; jeda lebih dari 2 tahun dianggap KMS terpisah.", "p": 0, "topic": "KMS", "id": "pengawasan_q_229"}, {"q": "Pajak Masukan atas perolehan BKP/JKP sehubungan dengan KMS...", "o": ["Dapat dikreditkan sepenuhnya", "Tidak dapat dikreditkan", "Dapat dikreditkan 50%", "Dapat dikreditkan jika bangunan untuk usaha"], "c": 1, "e": "Pajak Masukan atas perolehan BKP/JKP sehubungan dengan KMS tidak dapat dikreditkan oleh pelaku KMS; yang dapat dikreditkan (jika memenuhi syarat) adalah PPN yang tercantum dalam SSP PPN KMS.", "p": 0, "topic": "KMS", "id": "pengawasan_q_230"}, {"q": "Dalam skema PPN PMSE, Pemanfaat Barang/Jasa dianggap berada di Indonesia apabila memenuhi kriteria berikut, KECUALI...", "o": ["Alamat korespondensi/penagihan berada di Indonesia", "Pembayaran menggunakan fasilitas institusi di Indonesia", "Bertransaksi menggunakan alamat IP atau kode telepon Indonesia", "Menggunakan bahasa Indonesia dalam komunikasi dengan penjual"], "c": 3, "e": "Kriteria Pemanfaat Barang/Jasa di Indonesia meliputi alamat korespondensi/registrasi, metode pembayaran via institusi Indonesia, atau alamat IP/kode telepon Indonesia — bukan bahasa yang digunakan.", "p": 0, "topic": "PPN PMSE", "id": "pengawasan_q_231"}, {"q": "Penunjukan Pelaku Usaha PMSE sebagai Pihak Lain pemungut PPN didasarkan pada kriteria...", "o": ["Jumlah karyawan perusahaan", "Nilai transaksi dengan Pemanfaat di Indonesia dan/atau jumlah traffic/akses melebihi jumlah tertentu dalam 12 bulan", "Lokasi kantor pusat perusahaan", "Jenis produk yang dijual"], "c": 1, "e": "Penunjukan sebagai Pihak Lain didasarkan pada nilai transaksi dengan Pemanfaat di Indonesia dan/atau jumlah traffic/pengakses melebihi jumlah tertentu dalam 12 bulan, ditetapkan Dirjen Pajak.", "p": 0, "topic": "PPN PMSE", "id": "pengawasan_q_232"}, {"q": "Identitas perpajakan yang diberikan kepada Pihak Lain pemungut PPN PMSE berupa...", "o": ["Nomor Pokok Wajib Pajak (NPWP)", "Nomor Identitas Perdagangan Elektronik", "Nomor Induk Berusaha", "Tidak ada identitas khusus"], "c": 0, "e": "Pemungut PPN PMSE diberikan nomor identitas perpajakan dalam bentuk NPWP sebagai sarana administrasi perpajakan.", "p": 0, "topic": "PPN PMSE", "id": "pengawasan_q_233"}, {"q": "Tarif PPh Pasal 22 atas transaksi perdagangan aset kripto jika exchanger TERDAFTAR di Bappebti adalah...", "o": ["0,1%", "0,2%", "1%", "2%"], "c": 0, "e": "Tarif PPh Pasal 22 atas transaksi aset kripto: 0,1% jika exchanger terdaftar di Bappebti; 0,2% jika tidak terdaftar.", "p": 0, "topic": "Aset Kripto", "id": "pengawasan_q_234"}, {"q": "Penghasilan dari aktivitas Mining (penambangan) aset kripto dikenai PPh Pasal 22 sebesar...", "o": ["0,1% dari penghasilan yang diterima/diperoleh", "1% dari penghasilan", "0,2% dari penghasilan", "Tidak dikenai PPh"], "c": 0, "e": "Penghasilan dari Mining dikenai PPh Pasal 22 sebesar 0,1% dari penghasilan yang diterima/diperoleh, tidak termasuk imbalan jasa manajemen Mining Pool.", "p": 0, "topic": "Aset Kripto", "id": "pengawasan_q_235"}, {"q": "Jika PPMSE Luar Negeri ditunjuk sebagai pemungut PPN atas transaksi aset kripto, maka PPMSE tersebut...", "o": ["Tidak perlu memungut PPh apapun", "Sekaligus ditunjuk sebagai pemungut PPh Pasal 22 dan wajib lapor SPT Masa PPh Unifikasi", "Hanya wajib memungut PPN tanpa kewajiban PPh", "Dibebaskan dari seluruh kewajiban administrasi"], "c": 1, "e": "Dalam hal PPMSE LN ditunjuk sebagai pemungut PPN transaksi aset kripto, PPMSE tersebut sekaligus ditunjuk sebagai pemungut PPh Pasal 22 dan wajib menyetor serta melapor dalam SPT Masa PPh Unifikasi.", "p": 0, "topic": "Aset Kripto", "id": "pengawasan_q_236"}, {"q": "Dividen dari luar negeri yang diterima WP OP/Badan dalam negeri dapat dikecualikan dari objek PPh apabila memenuhi syarat kumulatif berikut...", "o": ["Hanya perlu melaporkan SPT Tahunan tepat waktu", "Memenuhi kriteria bentuk/tata cara/jangka waktu investasi DAN kewajiban laporan realisasi investasi", "Cukup disimpan di rekening bank dalam negeri", "Hanya berlaku untuk WP Badan, tidak untuk WP OP"], "c": 1, "e": "Dividen dari luar negeri dapat dikecualikan dari objek PPh jika memenuhi kriteria bentuk investasi, tata cara, dan jangka waktu investasi, serta memenuhi kewajiban penyampaian laporan realisasi investasi.", "p": 0, "topic": "Dividen LN", "id": "pengawasan_q_237"}, {"q": "Jangka waktu holding minimal investasi dalam rangka pengecualian PPh atas dividen/penghasilan luar negeri adalah...", "o": ["1 Tahun Pajak", "2 Tahun Pajak", "3 Tahun Pajak", "5 Tahun Pajak"], "c": 2, "e": "Investasi harus dipegang (holding) paling singkat 3 Tahun Pajak terhitung sejak Tahun Pajak dividen/penghasilan lain diterima atau diperoleh, dan tidak dapat dialihkan kecuali ke bentuk investasi lain yang sesuai ketentuan.", "p": 0, "topic": "Dividen LN", "id": "pengawasan_q_238"}, {"q": "Jika WP Orang Pribadi tidak memenuhi syarat pengecualian PPh atas dividen dalam negeri, maka WP wajib...", "o": ["Tidak dikenai pajak apapun", "Menyetor sendiri PPh final 10% paling lambat tanggal 15 bulan berikutnya dan melaporkan SPT Masa PPh Unifikasi", "Menunggu ketetapan pajak dari DJP", "Membayar sanksi administrasi tanpa kewajiban pelaporan"], "c": 1, "e": "WP OP yang tidak memenuhi syarat wajib menyetor sendiri PPh final 10% atas dividen, paling lambat tanggal 15 bulan berikutnya setelah dividen diterima/diperoleh, dan menyampaikan SPT Masa PPh Unifikasi.", "p": 0, "topic": "Dividen LN", "id": "pengawasan_q_239"}, {"q": "Pajak Masukan yang tercantum dalam dokumen tertentu yang dipersamakan dengan Faktur Pajak, belum dikreditkan pada Masa Pajak sama, dapat dikreditkan pada Masa Pajak berikutnya paling lama...", "o": ["1 Masa Pajak", "2 Masa Pajak", "3 Masa Pajak", "6 Masa Pajak"], "c": 2, "e": "Pajak Masukan dimaksud dapat dikreditkan pada Masa Pajak berikutnya paling lama 3 Masa Pajak setelah berakhirnya Masa Pajak saat dokumen tertentu dibuat, sepanjang belum dibebankan sebagai biaya/dikapitalisasi.", "p": 0, "topic": "Pengkreditan PM", "id": "pengawasan_q_240"}, {"q": "Faktur Pajak yang mencantumkan nama, alamat, dan NIK (bagi subjek pajak dalam negeri orang pribadi) berkedudukan sama dengan...", "o": ["Dokumen tidak sah", "NPWP dalam rangka pembuatan Faktur Pajak dan pengkreditan Pajak Masukan", "Hanya berlaku untuk keperluan administrasi kependudukan", "Bukti potong PPh"], "c": 1, "e": "NIK mempunyai kedudukan yang sama dengan NPWP dalam rangka pembuatan Faktur Pajak dan pengkreditan Pajak Masukan, sesuai Pasal 13(5) huruf b angka 1 UU PPN.", "p": 0, "topic": "Pengkreditan PM", "id": "pengawasan_q_241"}, {"q": "Pajak Masukan atas perolehan BKP/JKP SEBELUM pengusaha dikukuhkan sebagai PKP...", "o": ["Dapat dikreditkan penuh", "Tidak dapat dikreditkan, namun Pajak Keluaran yang seharusnya dipungut dapat menggunakan pedoman 80%", "Dapat dikreditkan 50%", "Otomatis dihapuskan tanpa konsekuensi"], "c": 1, "e": "PPN dalam Faktur Pajak/dokumen tertentu atas perolehan sebelum dikukuhkan PKP tidak dapat dikreditkan; sebaliknya Pajak Keluaran yang seharusnya dipungut PKP pada masa sebelum dikukuhkan dihitung dengan pedoman pengkreditan 80% dari Pajak Keluaran.", "p": 0, "topic": "Pengkreditan PM", "id": "pengawasan_q_242"}, {"q": "Pajak Masukan yang ditagih dengan penerbitan ketetapan pajak dapat dikreditkan oleh PKP sebesar jumlah...", "o": ["Pokok pajak yang tercantum dalam ketetapan, dengan syarat tertentu", "Sanksi administrasi dalam ketetapan", "2 kali jumlah pokok pajak", "Tidak dapat dikreditkan sama sekali"], "c": 0, "e": "Pajak Masukan yang ditagih dengan ketetapan pajak dapat dikreditkan sebesar jumlah pokok pajak, dengan syarat ketetapan hanya untuk menagih PM, PKP menyetujui seluruh hasil pemeriksaan, PPN telah dilunasi, dan tidak ada upaya hukum.", "p": 0, "topic": "Pengkreditan PM", "id": "pengawasan_q_243"}, {"q": "PKP dapat membuat 1 Faktur Pajak gabungan untuk seluruh penyerahan kepada pembeli yang sama dalam jangka waktu...", "o": ["1 minggu", "1 bulan kalender", "1 triwulan", "1 tahun"], "c": 1, "e": "PKP dapat membuat 1 Faktur Pajak gabungan meliputi seluruh penyerahan kepada pembeli/penerima yang sama selama 1 bulan kalender, dibuat paling lambat akhir bulan penyerahan.", "p": 0, "topic": "Faktur Pajak", "id": "pengawasan_q_244"}, {"q": "Faktur Pajak yang dibuat setelah melewati jangka waktu berapa bulan sejak seharusnya dibuat tidak diperlakukan sebagai Faktur Pajak?", "o": ["1 bulan", "2 bulan", "3 bulan", "6 bulan"], "c": 2, "e": "Faktur Pajak yang dibuat setelah melewati jangka waktu 3 bulan sejak seharusnya dibuat tidak diperlakukan sebagai Faktur Pajak — PKP dianggap tidak membuat Faktur Pajak dan dikenai sanksi UU KUP.", "p": 0, "topic": "Faktur Pajak", "id": "pengawasan_q_245"}, {"q": "Faktur Pajak atas ekspor BKP tidak berwujud/JKP yang tidak mendapatkan persetujuan DJP melalui Portal Wajib Pajak berakibat...", "o": ["Tetap sah sebagai Faktur Pajak", "Bukan merupakan Faktur Pajak", "Hanya berlaku sebagian", "Perlu ditandatangani ulang secara manual"], "c": 1, "e": "Faktur Pajak dan dokumen tertentu atas ekspor BKP tidak berwujud/JKP yang tidak mendapatkan persetujuan DJP bukan merupakan Faktur Pajak.", "p": 0, "topic": "Faktur Pajak", "id": "pengawasan_q_246"}, {"q": "Selisih antara harga pasar dengan nilai sisa buku harta yang dialihkan dalam rangka penggabungan/peleburan/pemekaran usaha merupakan...", "o": ["Bukan objek pajak", "Penghasilan yang dikenakan pajak", "Pengurang penghasilan bruto", "Kredit pajak"], "c": 1, "e": "Selisih antara harga pasar dengan nilai sisa buku harta yang dialihkan merupakan penghasilan yang dikenakan pajak, sesuai Pasal 10(3) UU PPh.", "p": 0, "topic": "Nilai Buku Merger", "id": "pengawasan_q_247"}, {"q": "Agar dapat menggunakan nilai buku (bukan harga pasar) atas pengalihan harta dalam rangka penggabungan usaha, WP badan harus memenuhi, KECUALI...", "o": ["Business purpose test", "Memiliki Surat Keterangan Fiskal berlaku", "Persetujuan Direktur Jenderal Pajak", "Wajib terdaftar sebagai perusahaan terbuka (Tbk) sejak awal"], "c": 3, "e": "Syarat penggunaan nilai buku: business purpose test, SKF berlaku, dan persetujuan Dirjen Pajak — tidak disyaratkan harus berstatus Tbk sejak awal (status Tbk hanya relevan untuk pemekaran dalam rangka IPO).", "p": 0, "topic": "Nilai Buku Merger", "id": "pengawasan_q_248"}, {"q": "Aktiva tetap hasil restrukturisasi (penggabungan/peleburan/pemekaran) dengan nilai buku tidak boleh dipindahtangankan paling singkat...", "o": ["1 tahun sejak tanggal efektif", "2 tahun sejak tanggal efektif", "3 tahun sejak tanggal efektif", "5 tahun sejak tanggal efektif"], "c": 1, "e": "Aktiva tetap hasil restrukturisasi dengan nilai buku tidak boleh dipindahtangankan paling singkat 2 tahun sejak tanggal efektif, kecuali untuk tujuan peningkatan efisiensi perusahaan.", "p": 0, "topic": "Nilai Buku Merger", "id": "pengawasan_q_249"}, {"q": "Fasilitas Tax Allowance berupa pengurangan penghasilan neto sebesar...", "o": ["20% dari nilai Penanaman Modal, dibebankan 5%/tahun selama 4 tahun", "30% dari nilai Penanaman Modal, dibebankan 5%/tahun selama 6 tahun", "60% dari nilai Penanaman Modal, dibebankan 10%/tahun selama 6 tahun", "50% dari nilai Penanaman Modal, dibebankan 10%/tahun selama 5 tahun"], "c": 1, "e": "Tax Allowance memberikan pengurangan penghasilan neto 30% dari nilai Penanaman Modal, dibebankan 5% per tahun selama 6 tahun sejak Saat Mulai Berproduksi Komersial.", "p": 0, "topic": "Tax Allowance", "id": "pengawasan_q_250"}, {"q": "Dividen yang dibayarkan kepada WP Luar Negeri (selain BUT) oleh WP penerima Tax Allowance dikenai tarif PPh...", "o": ["20% tanpa pengecualian", "10% atau tarif lebih rendah sesuai P3B", "15% final", "Dibebaskan sepenuhnya dari PPh"], "c": 1, "e": "Dividen yang dibayarkan kepada WP Luar Negeri dikenai tarif PPh 10% atau tarif yang lebih rendah berdasarkan P3B.", "p": 0, "topic": "Tax Allowance", "id": "pengawasan_q_251"}, {"q": "Aktiva tetap berwujud (selain tanah) yang diperoleh melalui mekanisme berikut TIDAK termasuk aktiva yang diberikan fasilitas Tax Allowance...", "o": ["Pembelian tunai langsung", "Sewa Guna Usaha tanpa hak opsi (operating lease)", "Impor baru dari luar negeri", "Pembangunan sendiri untuk kegiatan usaha utama"], "c": 1, "e": "Aktiva yang diperoleh melalui SGU tanpa hak opsi (operating lease), atau SGU dengan hak opsi sebelum opsi dilakukan, tidak termasuk aktiva yang diberikan fasilitas Tax Allowance.", "p": 0, "topic": "Tax Allowance", "id": "pengawasan_q_252"}, {"q": "KMK Persetujuan Pemberian Fasilitas Tax Allowance diterbitkan paling lama berapa hari kerja setelah permohonan diterima lengkap dan benar?", "o": ["3 hari kerja", "5 hari kerja", "15 hari kerja", "45 hari kerja"], "c": 1, "e": "Jangka waktu penerbitan KMK Persetujuan Pemberian Fasilitas adalah 5 hari kerja setelah permohonan diterima secara lengkap dan benar.", "p": 0, "topic": "Tax Allowance", "id": "pengawasan_q_253"}, {"q": "Perpanjangan kompensasi kerugian Tax Allowance tambahan 2 tahun dapat diberikan apabila WP memenuhi kriteria, antara lain...", "o": ["Menambah minimal 100 orang TKI", "Mengeluarkan biaya litbang dalam negeri minimal 5% dari nilai Penanaman Modal dalam jangka waktu 5 tahun", "Hanya berlokasi di Pulau Jawa", "Melakukan ekspor minimal 10%"], "c": 1, "e": "Tambahan 2 tahun kompensasi kerugian (kriteria G-I) antara lain diberikan jika WP mengeluarkan biaya litbang dalam negeri minimal 5% dari nilai Penanaman Modal dalam jangka waktu 5 tahun, melakukan ekspor minimal 30%, atau menambah minimal 600 TKI selama 4 tahun berturut-turut.", "p": 0, "topic": "Tax Allowance", "id": "pengawasan_q_254"}, {"q": "Jumlah minimal Tenaga Kerja Indonesia yang harus dipekerjakan untuk mendapatkan fasilitas Pengurangan Penghasilan Neto 60% (Industri Padat Karya, PMK 16/PMK.010/2020) adalah...", "o": ["100 orang", "200 orang", "300 orang", "500 orang"], "c": 2, "e": "Fasilitas pengurangan penghasilan neto 60% (padat karya) mensyaratkan WP mempekerjakan Tenaga Kerja Indonesia minimal 300 orang.", "p": 0, "topic": "Fasilitas Padat Karya", "id": "pengawasan_q_255"}, {"q": "Fasilitas pengurangan penghasilan neto 60% bagi industri padat karya (PMK 16/PMK.010/2020) dibebankan sebesar...", "o": ["5% per tahun selama 6 tahun", "10% per tahun selama 6 tahun", "20% per tahun selama 3 tahun", "15% per tahun selama 4 tahun"], "c": 1, "e": "Fasilitas 60% dibebankan 10% per tahun selama 6 tahun sejak Saat Mulai Berproduksi Komersial — berbeda dengan Tax Allowance reguler (30%, 5%/tahun selama 6 tahun).", "p": 0, "topic": "Fasilitas Padat Karya", "id": "pengawasan_q_256"}, {"q": "WP yang telah mendapatkan fasilitas Tax Allowance atau Tax Holiday atas suatu penanaman modal...", "o": ["Dapat sekaligus memperoleh fasilitas pengurangan penghasilan neto 60% padat karya untuk penanaman modal yang sama", "Tidak dapat memperoleh fasilitas padat karya 60% atas penanaman modal yang sama", "Wajib memperoleh fasilitas padat karya 60% tambahan", "Harus memilih salah satu secara bergantian setiap tahun"], "c": 1, "e": "Fasilitas padat karya 60% hanya diberikan atas penanaman modal yang TIDAK mendapat fasilitas Tax Allowance, Tax Holiday, atau fasilitas PPh di KEK — bersifat eksklusif, tidak dapat ditumpuk untuk penanaman modal yang sama.", "p": 0, "topic": "Fasilitas Padat Karya", "id": "pengawasan_q_257"}, {"q": "WP penerima fasilitas Investment Allowance (pengurang penghasilan neto 60%) wajib menyampaikan laporan apa saja melalui sistem OSS?", "o": ["Laporan Keuangan Tahunan dan Laporan Audit", "Laporan Realisasi Penanaman Modal dan Laporan Penggunaan Tenaga Kerja Indonesia", "Laporan Produksi dan Laporan Penjualan", "Laporan Pajak Masukan dan Laporan Pajak Keluaran"], "c": 1, "e": "Pasal 428 PMK 16/PMK.010/2020 mewajibkan 2 laporan via OSS: Laporan Realisasi Penanaman Modal dan Laporan Penggunaan Tenaga Kerja Indonesia, paling lambat 30 hari setelah akhir tahun pajak.", "p": 0, "topic": "Investment Allowance", "id": "pengawasan_q_258"}, {"q": "Berapa jangka waktu minimal sebuah aktiva tetap berwujud yang mendapat fasilitas Investment Allowance dilarang dialihkan/digunakan selain untuk tujuan pemberian fasilitas?", "o": ["3 tahun", "4 tahun", "5 tahun", "6 tahun"], "c": 3, "e": "Pasal 429 PMK 16/PMK.010/2020: larangan berlaku selama 6 tahun sejak dimulainya pemanfaatan fasilitas Pajak Penghasilan.", "p": 0, "topic": "Investment Allowance", "id": "pengawasan_q_259"}, {"q": "PT X mulai berproduksi komersial pada Mei 2024 dengan rata-rata TKI dihitung hanya 8 bulan (Mei-Des) sebesar 297,5 orang, gagal memenuhi syarat minimal 300 orang. Bagaimana cara penghitungan yang benar menurut PMK 16/PMK.010/2020?", "o": ["Dihitung dari rata-rata 8 bulan sejak SMB saja", "Dihitung dari rata-rata jumlah TKI selama 12 bulan penuh dalam tahun pajak tersebut", "Dihitung dari jumlah TKI tertinggi dalam setahun", "Dihitung dari jumlah TKI pada bulan SMB saja"], "c": 1, "e": "Jumlah rata-rata TKI dihitung dari total TKI per bulan dibagi 12 (bukan hanya sejak SMB) — pada contoh PMK, jika dihitung 12 bulan penuh rata-ratanya 300, sehingga syarat terpenuhi.", "p": 0, "topic": "Investment Allowance", "id": "pengawasan_q_260"}, {"q": "Jika WP penerima fasilitas Investment Allowance dalam masa pemanfaatan tidak memenuhi syarat jumlah minimal tenaga kerja, lalu di tahun berikutnya syarat tersebut terpenuhi kembali, apa konsekuensinya?", "o": ["Fasilitas hangus permanen", "Fasilitas dapat dimanfaatkan kembali dengan tambahan jangka waktu pemanfaatan", "Fasilitas dapat dimanfaatkan kembali TANPA tambahan jangka waktu pemanfaatan", "WP wajib mengajukan permohonan fasilitas baru dari awal"], "c": 2, "e": "Pasal 430: PPh yang seharusnya terutang wajib dibayar kembali, dan fasilitas dapat dimanfaatkan lagi tahun berikutnya jika syarat terpenuhi kembali, namun TIDAK diberikan tambahan jangka waktu pemanfaatan.", "p": 0, "topic": "Investment Allowance", "id": "pengawasan_q_261"}, {"q": "Berikut ini manakah yang TERMASUK kriteria kegiatan Penelitian dan Pengembangan (Litbang) menurut PMK 153/PMK.010/2020?", "o": ["Kendali mutu rutin selama produksi komersial", "Perbaikan rancangan musiman dari produk yang telah ada", "Bertujuan memperoleh penemuan baru berdasarkan konsep/hipotesis orisinal dengan ketidakpastian hasil akhir", "Rekayasa konstruksi terkait fasilitas permulaan (start-up of facilities)"], "c": 2, "e": "5 kriteria Litbang Pasal 434: bertujuan penemuan baru, berdasar konsep/hipotesis orisinal, ada ketidakpastian hasil, terencana & berangaran, dan hasilnya dapat ditransfer bebas/diperdagangkan. Opsi lain termasuk daftar 'tidak termasuk Litbang'.", "p": 0, "topic": "Litbang Superdeduction", "id": "pengawasan_q_262"}, {"q": "Berapa persentase tambahan pengurangan penghasilan bruto bagi WP yang Litbangnya menghasilkan Paten/Hak PVT di dalam negeri DAN mencapai tahap Komersialisasi (kumulatif)?", "o": ["50% saja", "100% saja", "150% (50%+100%)", "300% (maksimum mutlak tanpa syarat)"], "c": 2, "e": "Persentase tambahan bersifat kumulatif sesuai kondisi yang dipenuhi: 50% (Paten/Hak PVT dalam negeri) + 100% (mencapai tahap Komersialisasi) = 150%, dengan batas keseluruhan pengurangan maksimum 300% dari biaya litbang.", "p": 0, "topic": "Litbang Superdeduction", "id": "pengawasan_q_263"}, {"q": "Tambahan pengurang penghasilan bruto dari kegiatan Litbang TIDAK DAPAT diberikan dalam kondisi apa?", "o": ["Jika Litbang dilakukan sendiri oleh WP tanpa kerja sama", "Jika aktiva yang digunakan untuk Litbang telah mendapat fasilitas Tax Allowance Pasal 31A UU PPh atau Investment Allowance Pasal 29A PP 45", "Jika biaya Litbang dibebankan secara proporsional antar proposal", "Jika Litbang belum mencapai tahap Komersialisasi"], "c": 1, "e": "Pasal 434 PMK 153/PMK.010/2020 menegaskan tambahan pengurang tidak dapat diberikan jika aktiva yang digunakan sudah mendapat fasilitas Tax Allowance atau Investment Allowance atas aktiva yang sama.", "p": 0, "topic": "Litbang Superdeduction", "id": "pengawasan_q_264"}, {"q": "Berapa lama jangka waktu WNA dengan keahlian tertentu (TKA pos jabatan tertentu/peneliti asing) yang menjadi SPDN hanya dikenai PPh atas penghasilan dari Indonesia saja, menurut PMK 18/PMK.03/2021?", "o": ["2 Tahun Pajak", "4 Tahun Pajak", "5 Tahun Pajak", "7 Tahun Pajak"], "c": 1, "e": "WNA berkeahlian tertentu yang jadi SPDN dikenai PPh hanya atas penghasilan dari Indonesia selama 4 Tahun Pajak sejak menjadi SPDN, kecuali memanfaatkan P3B.", "p": 0, "topic": "PMK 18/2021 WNA", "id": "pengawasan_q_265"}, {"q": "Apa saja bukti yang dapat digunakan WNA untuk membuktikan 'keahlian tertentu' di bidang STEM menurut PMK 18/PMK.03/2021?", "o": ["Hanya sertifikat keahlian", "Hanya ijazah pendidikan", "Sertifikat keahlian, ijazah pendidikan, atau pengalaman kerja minimal 5 tahun", "Rekomendasi dari kedutaan besar negara asal"], "c": 2, "e": "Keahlian tertentu dibuktikan dengan sertifikat keahlian, ijazah pendidikan, ATAU pengalaman kerja minimal 5 tahun di bidang ilmu pengetahuan/teknologi/matematika.", "p": 0, "topic": "PMK 18/2021 WNA", "id": "pengawasan_q_266"}, {"q": "WP OP yang menggunakan NPPN tetapi TIDAK menyampaikan pemberitahuan NPPN kepada Dirjen Pajak sesuai batas waktu, dianggap...", "o": ["Tetap boleh menggunakan NPPN", "Memilih menyelenggarakan Pembukuan", "Wajib diperiksa secara otomatis", "Dikenai sanksi pembekuan NPWP"], "c": 1, "e": "PMK 54/PMK.03/2021: WP OP yang tidak melakukan Pemberitahuan NPPN sesuai jangka waktu dianggap memilih menyelenggarakan Pembukuan.", "p": 0, "topic": "Pencatatan Pembukuan", "id": "pengawasan_q_267"}, {"q": "Pada Pembukuan dengan Stelsel Kas (pembukuan sederhana), kapan penghasilan dan biaya diakui?", "o": ["Penghasilan diakui saat tagihan diterbitkan, biaya saat kontrak ditandatangani", "Penghasilan diakui saat diterima tunai, biaya diakui saat benar-benar dibayar tunai", "Keduanya diakui berdasarkan prinsip akrual", "Penghasilan diakui di akhir tahun pajak, biaya kapan saja"], "c": 1, "e": "Stelsel Kas: penghasilan diakui apabila telah diterima secara tunai, dan biaya diakui apabila benar-benar telah dibayar secara tunai dalam suatu Tahun Pajak.", "p": 0, "topic": "Pencatatan Pembukuan", "id": "pengawasan_q_268"}, {"q": "Dalam alur SP2DK PMK-111/2025, berapa lama WP diberi waktu menanggapi, dan berapa lama perpanjangan yang dapat diberikan?", "o": ["7 hari, dapat diperpanjang 7 hari", "14 hari, dapat diperpanjang 7 hari", "14 hari, dapat diperpanjang 14 hari", "30 hari, tidak dapat diperpanjang"], "c": 1, "e": "WP menanggapi SP2DK dalam 14 hari sejak diterima, dapat diperpanjang 7 hari melalui pemberitahuan tertulis sebelum jangka waktu 14 hari berakhir.", "p": 0, "topic": "SP2DK PMK-111/2025", "id": "pengawasan_q_269"}, {"q": "Jika petugas DJP menyampaikan SP2DK secara langsung, namun WP/wakil/kuasa/pegawai/anggota keluarga dewasa tidak ditemukan atau tidak bersedia menerima, apa akibatnya?", "o": ["SP2DK dianggap batal dan harus diterbitkan ulang", "WP dianggap menerima SP2DK dan tidak memberikan tanggapan", "Petugas wajib kembali lagi keesokan harinya", "SP2DK dikirim ulang melalui pos"], "c": 1, "e": "Jika SP2DK tidak dapat diserahkan langsung karena pihak yang berwenang tidak ditemukan/tidak bersedia menerima, WP dianggap menerima SP2DK dan tidak memberikan tanggapan.", "p": 0, "topic": "SP2DK PMK-111/2025", "id": "pengawasan_q_270"}, {"q": "Dalam penandatanganan BA Pelaksanaan P2DK secara daring, jika WP tidak mengirim kembali konsep BAP2DK yang telah ditandatangani dalam waktu 5 hari kerja sejak konsep dikirim, apa konsekuensinya?", "o": ["Pembahasan dibatalkan dan diulang dari awal", "WP dianggap menghadiri pembahasan namun tidak bersedia menandatangani BAP2DK", "BAP2DK otomatis dianggap ditandatangani WP", "DJP wajib menerbitkan SP2DK baru"], "c": 1, "e": "Jika WP tidak menyampaikan kembali konsep BAP2DK yang telah di-TTE dalam 5 hari kerja, WP dianggap menghadiri pembahasan namun tidak bersedia menandatangani BAP2DK.", "p": 0, "topic": "SP2DK PMK-111/2025", "id": "pengawasan_q_271"}, {"q": "Manakah berikut ini yang BUKAN termasuk kemungkinan hasil tindak lanjut kegiatan P2DK (usulan lain huruf b-q) menurut PMK-111/2025?", "o": ["Penghapusan NPWP secara jabatan", "Pengukuhan PKP secara jabatan", "Putusan Pengadilan Pajak atas sengketa banding", "Pelaksanaan kegiatan pengamatan dan/atau kegiatan intelijen"], "c": 2, "e": "Putusan Pengadilan Pajak bukan hasil kegiatan P2DK — itu ranah proses sengketa pajak terpisah. Usulan lain P2DK meliputi perubahan data jabatan, NPWP/PKP jabatan, penilaian, pengamatan/intelijen, Pemeriksaan, dan Buper.", "p": 0, "topic": "SP2DK PMK-111/2025", "id": "pengawasan_q_272"}, {"q": "Surat Teguran dalam kegiatan Pengawasan WP Terdaftar (PMK-111/2025) diterbitkan dalam hal apa?", "o": ["WP tidak membayar pajak terutang hasil Pemeriksaan", "SPT tidak disampaikan sesuai batas waktu, atau pelaksanaan ketentuan perpajakan lainnya", "WP pindah alamat tanpa pemberitahuan", "WP mengajukan keberatan atas ketetapan pajak"], "c": 1, "e": "Surat Teguran diterbitkan dalam hal: (a) SPT tidak disampaikan sesuai batas waktu yang diatur peraturan perundang-undangan perpajakan; dan (b) pelaksanaan ketentuan perundang-undangan perpajakan lainnya.", "p": 0, "topic": "SP2DK PMK-111/2025", "id": "pengawasan_q_273"}, {"q": "Dalam masa transisi penerapan Coretax, Penyusunan DPP (Daftar Pengawasan Potensi) Kolaboratif untuk pengawasan kepatuhan WP sampai dengan Tahun Pajak 2024 diproses melalui sistem apa?", "o": ["Coretax", "APPROWEB (menjadi PKM)", "SIDJP", "e-Faktur"], "c": 1, "e": "Penyusunan DPP Kolaboratif s.d. Tahun Pajak 2024 diproses di APPROWEB sebagai PKM (Penelitian Kepatuhan Material); DPP Tahun Pajak 2025 dst diproses di Coretax (PPM & PKM).", "p": 0, "topic": "Masa Transisi Coretax", "id": "pengawasan_q_274"}, {"q": "Berdasarkan ND-927/PJ.06/2025, untuk data RBP Tahun Pajak s.d. 2024 dengan pilihan tindak lanjut Penelitian Kepatuhan Material pada WP Nontunggal, bagaimana penanganannya di Coretax?", "o": ["Disetujui langsung di Coretax menjadi DPP", "Ditolak di Coretax, kemudian diusulkan DPP di Legacy dengan alasan 'Ditindaklanjuti di Legacy'", "Dibiarkan menunggu tanpa tindak lanjut", "Otomatis dihapus dari sistem"], "c": 1, "e": "Untuk Tahun Pajak s.d. 2024, WP Nontunggal dengan pilihan Penelitian Kepatuhan Material ditolak di Coretax lalu diusulkan sebagai DPP di sistem Legacy (APPROWEB) dengan alasan penolakan 'Ditindaklanjuti di Legacy'.", "p": 0, "topic": "Masa Transisi Coretax", "id": "pengawasan_q_275"}, {"q": "Penilaian untuk tujuan perpajakan menurut PMK 79/2023 dibagi menjadi dua jenis berdasarkan kebutuhan peninjauan lapangan, yaitu...", "o": ["Penilaian Formal dan Penilaian Material", "Penilaian Kantor dan Penilaian Lapangan", "Penilaian Internal dan Penilaian Eksternal", "Penilaian Cepat dan Penilaian Mendalam"], "c": 1, "e": "Penilaian Kantor tidak memerlukan peninjauan lapangan atas objek Penilaian, sedangkan Penilaian Lapangan memerlukan peninjauan lapangan.", "p": 0, "topic": "Penilaian PMK 79/2023", "id": "pengawasan_q_276"}, {"q": "Berapa jangka waktu paling lama pelaksanaan Penilaian, dihitung sejak Surat Perintah Penilaian ditetapkan sampai dengan Laporan Penilaian ditandatangani?", "o": ["1 bulan", "2 bulan", "3 bulan", "6 bulan"], "c": 2, "e": "Pasal 6 PMK 79/2023: Penilaian dilakukan dalam jangka waktu paling lama 3 (tiga) bulan terhitung sejak ditetapkannya Surat Perintah Penilaian sampai dengan Laporan Penilaian ditandatangani.", "p": 0, "topic": "Penilaian PMK 79/2023", "id": "pengawasan_q_277"}, {"q": "Urutan tahapan Tata Cara Penilaian untuk Tujuan Perpajakan menurut PMK 79/2023 (Pasal 7) yang benar adalah...", "o": ["Analisis data → Penyiapan bahan → Pengumpulan data → Penerapan pendekatan → Penyusunan laporan", "Penyiapan bahan Penilaian → Pengumpulan data objek & pendukung → Analisis data → Penerapan pendekatan Penilaian → Penyusunan Laporan Penilaian", "Pengumpulan data → Penyusunan laporan → Analisis data → Penyiapan bahan → Penerapan pendekatan", "Penerapan pendekatan → Analisis data → Pengumpulan data → Penyiapan bahan → Penyusunan laporan"], "c": 1, "e": "5 tahap sesuai Pasal 7: Penyiapan bahan (Ps 8) → Pengumpulan data (Ps 9-11) → Analisis data (Ps 12) → Penerapan Pendekatan Penilaian (Ps 13-28) → Penyusunan Laporan Penilaian (Ps 29-31).", "p": 0, "topic": "Penilaian PMK 79/2023", "id": "pengawasan_q_278"}, {"q": "'Jembreng PPN' dalam konteks Analisis Mandiri kepatuhan WP (SE-05/PJ/2022) adalah teknik...", "o": ["Membandingkan harga jual dengan harga pasar", "Menyandingkan SPT PPN dalam satu halaman untuk mendeteksi kompensasi tidak nyambung dan setoran ganda di masa yang sama", "Menghitung ulang tarif PPN berdasarkan jenis barang", "Memverifikasi NPWP lawan transaksi secara manual"], "c": 1, "e": "Jembreng PPN adalah penyandingan SPT PPN dalam satu halaman, sering ditemukan kasus kompensasi tidak nyambung dan PPN disetorkan di masa yang sama tanpa setoran yang jelas asalnya.", "p": 0, "topic": "Analisis Mandiri", "id": "pengawasan_q_279"}, {"q": "Dalam penggalian potensi WP Orang Pribadi, mengapa WP OP dianggap memiliki tantangan analisis yang lebih besar (Cons) dibanding WP Badan?", "o": ["Karena WP OP selalu memiliki NPWP ganda", "Karena perilaku sangat beragam, data internal/eksternal terbatas, karakteristik defensif-tertutup, dan banyak transaksi cash", "Karena WP OP wajib diaudit oleh akuntan publik", "Karena WP OP tidak memiliki kewajiban SPT Tahunan"], "c": 1, "e": "Cons analisis Galpot OP: perilaku sangat beragam, data internal & eksternal sangat terbatas, karakteristik defensif/tertutup, transaksi cash, serta memerlukan communication skill yang mumpuni.", "p": 0, "topic": "Analisis Potensi OP", "id": "pengawasan_q_280"}, {"q": "Metode penghitungan omzet dengan pendekatan 'Pertambahan Kekayaan Bersih' menghitung penghasilan WP OP dengan cara...", "o": ["Hanya menghitung biaya hidup WP", "Menjumlahkan selisih kekayaan bersih (harta dikurangi kewajiban) awal dan akhir tahun dengan biaya hidup", "Mengalikan volume usaha dengan harga jual", "Membandingkan rasio laba industri sejenis"], "c": 1, "e": "Penghasilan WP OP dihitung dengan menjumlahkan pertambahan kekayaan bersih (selisih kekayaan bersih awal-akhir tahun) dengan biaya hidup WP beserta tanggungannya.", "p": 0, "topic": "Analisis Potensi OP", "id": "pengawasan_q_281"}, {"q": "Menurut skema tarif PPN emas perhiasan sesuai PMK-48/2023, PKP Pedagang Emas Perhiasan dikenai tarif berapa untuk penjualan JIKA TIDAK memiliki faktur pajak/dokumen tertentu lengkap atas perolehan/impor emas?", "o": ["1,1%", "1,65%", "0,25%", "11%"], "c": 1, "e": "PKP Pedagang Emas Perhiasan dikenai tarif 1,65% dari harga jual jika TIDAK memiliki faktur pajak/dokumen tertentu lengkap atas perolehan/impor emas perhiasan.", "p": 0, "topic": "Analisis Emas Perhiasan", "id": "pengawasan_q_282"}, {"q": "Tarif PPh Pasal 22 atas penjualan emas perhiasan dan/atau emas batangan menurut PMK-48/2023 adalah...", "o": ["0,25% dari harga jual", "1,1% dari harga jual", "1,65% dari harga jual", "0,5% dari harga jual"], "c": 0, "e": "Tarif PPh Pasal 22 atas emas perhiasan/batangan sebesar 0,25% dari harga jual — kecuali penjualan ke konsumen akhir, WP dikenai PPh final PP 20/2026, atau WP memiliki SKB.", "p": 0, "topic": "Analisis Emas Perhiasan", "id": "pengawasan_q_283"}, {"q": "PP 20/2026 menambahkan Pasal 20A yang mengatur bahwa pengeluaran berupa suap, gratifikasi, dan/atau pemberian lain (termasuk ke pejabat publik asing) tidak dapat menjadi pengurang penghasilan bruto. Apa istilah untuk ketentuan ini?", "o": ["Deductibility rule", "Non-deductibility", "Tax holiday", "Tax sparing"], "c": 1, "e": "Pasal 20A mengatur prinsip Non-deductibility atas pengeluaran suap/gratifikasi/pemberian lain terkait tindak pidana korupsi/suap, termasuk yang diberikan kepada pejabat publik asing.", "p": 0, "topic": "PP 20/2026", "id": "pengawasan_q_284"}, {"q": "Manakah profesi berikut yang BARU DITAMBAHKAN sebagai jasa sehubungan dengan pekerjaan bebas yang dikecualikan dari PPh Final 0,5% berdasarkan Pasal 56 ayat (4) PP 20/2026?", "o": ["Akuntan dan pengacara", "Dokter dan konsultan", "Pembuat/pencipta konten media daring (influencer, selebgram, bloger, vloger) dan seniman lainnya", "Notaris dan penilai"], "c": 2, "e": "PP 20/2026 menambahkan kategori baru: pemahat, pelukis, pembuat/pencipta konten pada media yang dibagikan secara daring (influencer/pemengaruh, selebgram, bloger, vloger, dan sejenisnya), serta seniman lainnya.", "p": 0, "topic": "PP 20/2026", "id": "pengawasan_q_285"}, {"q": "Sejak PP 20/2026, WP Badan berbentuk apa saja yang MASIH DAPAT menggunakan tarif PPh Final 0,5% WP PBT?", "o": ["CV, firma, dan PT biasa", "Hanya PT perseroan perorangan yang didirikan 1 orang, dan koperasi", "Semua bentuk badan usaha tanpa pengecualian", "BUMDes dan firma"], "c": 1, "e": "PP 20/2026 mempersempit subjek badan PPh Final 0,5% hanya untuk PT perseroan perorangan yang didirikan 1 orang dan koperasi — CV, firma, PT biasa, dan BUMDes tidak lagi bisa menggunakan skema ini.", "p": 0, "topic": "PP 20/2026", "id": "pengawasan_q_286"}, {"q": "Tuan A memiliki penghasilan dari usaha dagang (PPh Final 0,5%) Rp2M, usaha jasa konstruksi (PPh Final tersendiri) Rp1M, dan jasa penceramah (PPh tarif umum Pasal 17) Rp1,5M — total Rp4,5M. Menurut Pasal 58 PP 20/2026, apakah Tuan A termasuk WP dengan Peredaran Bruto Tertentu (PBT)?", "o": ["Ya, karena total keseluruhan peredaran bruto Rp4,5M masih di bawah Rp4,8M", "Tidak, karena hanya omzet dagang yang dihitung", "Ya, tetapi hanya untuk usaha jasa konstruksi saja", "Tidak, karena penghasilan dari 3 jenis usaha berbeda tidak dapat digabung"], "c": 0, "e": "Pasal 58 PP 20/2026: kriteria subjek PBT kini dihitung dari jumlah KESELURUHAN peredaran bruto usaha & jasa pekerjaan bebas (baik final maupun non-final). Karena total Rp4,5M < Rp4,8M, Tuan A tetap WP PBT.", "p": 0, "topic": "PP 20/2026", "id": "pengawasan_q_287"}, {"q": "Apa perubahan utama Pasal 59 PP 20/2026 dibandingkan PP 55/2022 terkait jangka waktu pemanfaatan PPh Final 0,5%?", "o": ["Jangka waktu diperpanjang menjadi 10 tahun untuk WP OP", "Jangka waktu tertentu (7 tahun WP OP, 4 tahun PT OP) DIHAPUS — berlaku sampai WP tidak lagi memenuhi kriteria subjek", "Jangka waktu dipersingkat menjadi 3 tahun untuk semua WP", "Tidak ada perubahan pada Pasal 59"], "c": 1, "e": "Pasal 59 PP 55/2022 (jangka waktu 7 tahun WP OP, 4 tahun PT OP) DIHAPUS oleh PP 20/2026 — PPh Final 0,5% kini berlaku terus sampai WP tidak lagi memenuhi kriteria subjek atau memilih tarif umum.", "p": 0, "topic": "PP 20/2026", "id": "pengawasan_q_288"}, {"q": "Dalam modus penghindaran pajak sektor perbankan terkait PMK 207/2012, apa masalah utama yang sering ditemukan pemeriksa?", "o": ["Bank tidak memiliki izin usaha yang sah", "Daftar Nominatif Piutang Nyata-Nyata Tak Dapat Ditagih tidak disertakan/tidak sesuai format/tidak sesuai persyaratan dalam SPT Tahunan Badan", "Bank tidak membayar PPh Badan sama sekali", "Bank tidak memiliki laporan keuangan"], "c": 1, "e": "Modus terkait PMK 207/2012: WP tidak menyertakan Daftar Nominatif Piutang Nyata-Nyata Tak Dapat Ditagih dalam SPT Tahunan Badan, atau daftar tersebut tidak sesuai format/persyaratan yang ditentukan.", "p": 0, "topic": "Analisis Perbankan", "id": "pengawasan_q_289"}, {"q": "Sesuai KEP-184/PJ/2002 dan SE-08/PJ/2002, kapan penghasilan bank berupa bunga kredit non-performing (dalam penyelesaian) diakui?", "o": ["Secara akrual sejak jatuh tempo", "Secara cash basis pada saat diterima oleh bank, dengan syarat ada perjanjian tambahan/addendum yang dilampirkan di SPT", "Secara proporsional setiap bulan tanpa syarat tambahan", "Tidak diakui sampai kredit dilunasi penuh"], "c": 1, "e": "Penghasilan bunga kredit non-performing diakui pada saat penghasilan tersebut diterima bank (cash basis), dengan syarat bank dan debitur terlebih dahulu membuat perjanjian tambahan/addendum yang dilampirkan pada SPT Tahunan.", "p": 0, "topic": "Analisis Perbankan", "id": "pengawasan_q_290"}, {"q": "Dalam CRM Specific Risk sektor rokok, KLU utama industri rokok yang menjadi ruang lingkup meliputi kode 12011, 12012, 12013, dan 12019. Data eksternal apa yang digunakan dari Ditjen Bea dan Cukai?", "o": ["Data SPT Tahunan WP lain", "Data Pita Cukai (CK1, CK2, CK3) dan Pemberitahuan Ekspor Barang (PEB)", "Data harga saham perusahaan rokok", "Data gaji karyawan pabrik rokok"], "c
