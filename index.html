 OP akan meninggalkan Indonesia selamanya, WP tidak sampaikan SPOP PBB; ruang lingkup satu/seluruh jenis pajak); (2) persetujuan pemeriksaan khusus berdasarkan keterangan lain berupa data konkret; (3) penugasan pemeriksaan tujuan lain administratif (NPWP/PKP jabatan, Pemeriksaan Fisik Barang dalam rangka Pencocokan Data/TLDDP ke Kawasan Bebas).</p>", "id": "pengawasan_r_343"}, {"heading": "Tujuan dan Jenis KPDL (Kegiatan Pengumpulan Data Lapangan)", "p": 0, "page": "hlm 824-825", "html": "<p>Tujuan KPDL (SE-11/PJ/2020): (1) memperoleh data/informasi baru, (2) pemutakhiran data yang sudah dimiliki, (3) pemetaan WP dan potensi pajak di wilayah kerja KPP. Lima jenis KPD:</p><ul><li><strong>KPD Berbasis Kewilayahan</strong>: oleh AR berdasarkan zona/WP yang diampu, atau Tim KPD berdasarkan Peta Kerja</li><li><strong>KPD Analisis</strong>: oleh AR dalam rangka pengawasan berbasis risiko (analisis laporan keuangan/fasilitas)</li><li><strong>KPD TUSI Lainnya</strong>: oleh petugas saat menjalankan fungsi (pendaftaran, pelayanan, penyuluhan, pemeriksaan, penyidikan, intelijen, penilaian, penagihan, dll)</li><li><strong>KPD Non TUSI</strong>: oleh pegawai DJP saat menemukan data secara nyata di lapangan, di luar tusi</li><li><strong>KPD Eksternal</strong>: oleh pihak eksternal berdasarkan perjanjian kerja sama dengan DJP</li></ul>", "id": "pengawasan_r_344"}, {"heading": "KPDL Eksternal dan Hal yang Diperhatikan dalam KPDL", "p": 0, "page": "hlm 827, 833", "html": "<p>KPDL Eksternal mempertimbangkan efektivitas/efisiensi, kompetensi pihak eksternal, kerahasiaan data, jangka waktu, dan pertimbangan lain (dasar SE-19/PJ/2014, contoh kerja sama DJP dengan Pos Indonesia). Hal yang diperhatikan dalam pelaksanaan KPDL: koordinasi dengan pemda/Babinsa/Bhabinkamtibmas; membekali pengetahuan teknik & data wilayah; dilaksanakan minimal 2 pegawai dengan pakaian kerja, tanda pengenal, dan Surat Tugas; dilakukan pada hari &amp; jam kerja (dapat di luar jika ada penugasan pimpinan); mengutamakan nilai Kemenkeu, kehati-hatian, dan mitigasi konflik kepentingan.</p>", "id": "pengawasan_r_345"}, {"heading": "Tahapan Proses Bisnis KPD", "p": 0, "page": "hlm 829-830", "html": "<p>Tiga tahap: <strong>Perencanaan</strong> (penyusunan rencana, PZP/Peta Kerja, penyusunan Daftar Prioritas KPD); <strong>Pelaksanaan</strong> (4 jenis KPD lapangan/kantor, Action Selection seperti permintaan bantuan penilaian/intelijen, pembuatan profil WP, berbagai ex-officio, input Formulir KPD); <strong>Tindak Lanjut</strong> (Penjaminan Kualitas Data: Validasi Material oleh atasan langsung, Validasi Formal oleh Kasi Penjaminan Kualitas Data).</p><p>Prinsip <strong>Continuous Supervision</strong>: KPD tidak hanya mengumpulkan data, tapi dapat langsung menindaklanjuti update data profil WP atau tindakan lain secara jabatan (perubahan data/status WP, pengukuhan PKP, pendaftaran PBB, aktivasi NIK, usulan pencabutan fasilitas) jika ditemukan kondisi tertentu saat KPD.</p>", "id": "pengawasan_r_346"}, {"heading": "Definisi, Maksud, dan Tujuan Profil Wajib Pajak", "p": 0, "page": "hlm 835", "html": "<p>Profil WP adalah <strong>rangkaian data dan informasi fiskal</strong> yang memuat identitas, kegiatan usaha, dan riwayat perpajakan WP secara berkesinambungan, diklasifikasikan atas data permanen, data akumulatif, dan data lainnya. Tujuannya: mendapatkan data lengkap WP, menyempurnakan &amp; memperbaiki basis data DJP, pertukaran data internal, pondasi penggalian potensi pajak, penghitungan potensi &amp; tax gap, serta sebagai alat ukur kepatuhan WP.</p>", "id": "pengawasan_r_347"}, {"heading": "Komponen Minimum Profil Wajib Pajak", "p": 0, "page": "hlm 836", "html": "<p>Profil WP memuat paling sedikit: Identitas WP, Kegiatan Usaha WP, Daftar Keluarga/Keterkaitan WP, Profil Risiko (CRM), Riwayat Pengawasan, Riwayat Pemeriksaan, Riwayat Keberatan dan Banding, serta Profil Risiko Ketertagihan.</p>", "id": "pengawasan_r_348"}, {"heading": "Langkah-Langkah Metodologi Profiling WP", "p": 0, "page": "hlm 838, 846", "html": "<p>Metodologi profiling terdiri 9 langkah dalam 2 pendekatan:</p><p><strong>Approach One</strong>: (1) pengumpulan data WP, (2) identitas WP (alamat masterfile vs usaha, pemegang saham AHU vs SPT, KLU masterfile vs lapangan, pohon kepemilikan, struktur organisasi, posisi CRM), (3) proses bisnis WP (arus dokumen/uang vs arus barang: supplier-WP-customer via gudang/toko/outlet cabang), (4) teliti kepatuhan formal WP (riwayat pelaporan masa/tahunan/pemeriksaan), (5) supplier dan customer utama.</p><p><strong>Approach Two</strong>: (6) jembreng SPT PPN, (7) lakukan ekualisasi, (8) analisis laporan keuangan menyeluruh, (9) pemanfaatan data eksternal (jika ada).</p>", "id": "pengawasan_r_349"}, {"heading": "Teknik Ekualisasi dalam Profiling", "p": 0, "page": "hlm 845", "html": "<p>Ekualisasi membandingkan data lintas jenis pajak untuk mendeteksi ketidaksesuaian, antara lain: Omzet PPN vs PPh Badan/OP, Biaya Gaji vs penghasilan pada SPT PPh Pasal 21, Biaya Sewa vs pemotongan PPh 23/PPh Final, serta ekualisasi-ekualisasi lain (termasuk 28 data pemicu).</p>", "id": "pengawasan_r_350"}], "soal": [{"q": "Kepala KPP telah melampaui jangka waktu yang ditentukan untuk memutuskan permohonan penghapusan NPWP Wajib Pajak Badan tanpa menerbitkan keputusan. Apa akibat hukumnya?", "o": ["Permohonan WP dianggap ditolak secara otomatis", "Permohonan WP dianggap dikabulkan, dan Kepala KPP wajib menerbitkan SK Penghapusan paling lama 1 bulan sejak jangka waktu berakhir", "Proses penghapusan batal dan WP harus mengajukan ulang", "Kewenangan beralih ke Kantor Wilayah DJP"], "c": 1, "e": "Ini adalah mekanisme deemed approval: keterlambatan keputusan oleh Kepala KPP mengakibatkan permohonan dianggap dikabulkan, dan SK tetap wajib diterbitkan paling lama 1 bulan setelah jangka waktu berakhir.", "p": 1, "topic": "Penghapusan WP Badan", "id": "pengawasan_q_0"}, {"q": "Berapa lama jangka waktu maksimal bagi Kepala KPP untuk menerbitkan Surat Keputusan Penghapusan NPWP Wajib Pajak Badan setelah jangka waktu penyelesaian permohonan berakhir (dalam kondisi deemed approval)?", "o": ["7 hari kerja", "14 hari kerja", "1 bulan", "3 bulan"], "c": 2, "e": "Kepala KPP wajib menerbitkan Surat Keputusan Penghapusan NPWP paling lama 1 bulan setelah jangka waktu penyelesaian berakhir, meskipun permohonan telah dianggap dikabulkan.", "p": 1, "topic": "Penghapusan WP Badan", "id": "pengawasan_q_1"}, {"q": "Dalam perhitungan PPN atas Kegiatan Membangun Sendiri (KMS) sesuai PMK 61/PMK.03/2022, bagaimana perlakuan biaya-biaya administrasi terhadap dasar pengenaan pajak?", "o": ["Biaya administrasi dikurangkan sebelum dikenakan tarif KMS", "PPN KMS dikenakan tanpa pengurangan biaya-biaya administrasi dari total biaya membangun", "Biaya administrasi dikenakan tarif tersendiri sebesar 5%", "Biaya administrasi dibebaskan dari PPN KMS"], "c": 1, "e": "PMK 61/PMK.03/2022 menegaskan PPN KMS dikenakan tanpa pengurangan biaya-biaya administrasi — DPP dihitung dari total biaya membangun (tidak termasuk tanah) apa adanya.", "p": 1, "topic": "PPN KMS", "id": "pengawasan_q_2"}, {"q": "PPN atas Kegiatan Membangun Sendiri (KMS) wajib disetor paling lambat kapan?", "o": ["Tanggal 10 bulan berikutnya", "Tanggal 15 bulan berikutnya", "Akhir bulan berikutnya setelah berakhirnya masa pajak dibangunnya bangunan", "Sebelum bangunan selesai dibangun"], "c": 2, "e": "Sesuai materi KMS, PPN KMS wajib disetor paling lambat akhir bulan berikutnya setelah berakhirnya masa pajak saat bangunan tersebut dibangun.", "p": 1, "topic": "PPN KMS", "id": "pengawasan_q_3"}, {"q": "Dalam ketentuan pengecualian PPN KMS pada PMK 61/PMK.03/2022, syarat apa yang harus dipenuhi oleh pihak yang membangunkan agar terbebas dari kewajiban PPN KMS?", "o": ["Membayar PPN di muka sebesar 50%", "Memberikan data/informasi paling sedikit identitas dan alamat pihak lain yang sesungguhnya membangun bangunan tersebut kepada DJP", "Mendapatkan izin tertulis dari Kepala KPP terlebih dahulu", "Menyampaikan laporan keuangan yang telah diaudit"], "c": 1, "e": "Pengecualian berlaku sepanjang pihak yang membangunkan memberikan data/informasi paling sedikit berupa identitas dan alamat pihak lain yang sesungguhnya membangun bangunan — tanggung jawab PPN KMS kemudian beralih ke pihak tersebut.", "p": 1, "topic": "PPN KMS", "id": "pengawasan_q_4"}, {"q": "Fasilitas Tax Allowance (PPh Pasal 31A UU PPh) diberikan kepada Wajib Pajak Badan yang menanamkan modal dengan kriteria tertentu. Manakah yang BUKAN merupakan bentuk fasilitas Tax Allowance?", "o": ["Pengurangan penghasilan neto", "Penyusutan/amortisasi dipercepat", "Perpanjangan kompensasi kerugian", "Pembebasan total PPh selama 20 tahun"], "c": 3, "e": "Tax Allowance mencakup pengurangan penghasilan neto, penyusutan/amortisasi dipercepat, perpanjangan kompensasi kerugian, dan penurunan tarif PPh dividen WPLN — bukan pembebasan total PPh (itu karakteristik Tax Holiday).", "p": 1, "topic": "Tax Allowance", "id": "pengawasan_q_5"}, {"q": "Sesuai Pasal 421 PMK 11/PMK.010/2020 tentang fasilitas Tax Allowance, apa akibatnya jika aktiva tetap berwujud yang telah mendapatkan fasilitas dialihkan untuk tujuan selain yang diberikan fasilitas dalam jangka waktu tertentu?", "o": ["Tidak ada konsekuensi apapun", "Fasilitas dicabut dan dikenakan sanksi", "WP wajib membayar denda administrasi tetap sebesar 2%", "Hanya perlu melapor ke KPP tanpa sanksi"], "c": 1, "e": "Aktiva yang telah mendapat fasilitas Tax Allowance dilarang dialihkan/digunakan untuk tujuan selain yang diberikan fasilitas dalam jangka waktu tertentu — pelanggaran mengakibatkan fasilitas dicabut dan dikenakan sanksi.", "p": 1, "topic": "Tax Allowance", "id": "pengawasan_q_6"}, {"q": "Larangan pengalihan aktiva yang mendapat fasilitas berlaku serupa pada fasilitas Tax Holiday (PMK 16/PMK.010/2020). Apa prinsip dasar yang mendasari larangan ini?", "o": ["Fasilitas fiskal terikat pada penggunaan aktiva sesuai tujuan pemberian fasilitas", "Aktiva tersebut menjadi milik negara", "WP dilarang menjual aktiva apapun selama 50 tahun", "Larangan hanya berlaku untuk aktiva impor"], "c": 0, "e": "Baik Pasal 421 PMK 11/2020 (Tax Allowance) maupun ketentuan serupa pada PMK 16/2020 (Tax Holiday) didasarkan pada prinsip bahwa fasilitas fiskal terikat pada penggunaan aktiva sesuai tujuan pemberian fasilitas tersebut.", "p": 1, "topic": "Tax Holiday", "id": "pengawasan_q_7"}, {"q": "Fasilitas pengurangan penghasilan bruto untuk kegiatan penelitian dan pengembangan (litbang) sesuai PMK 153/PMK.010/2020 TIDAK berlaku bagi Wajib Pajak badan dalam negeri yang menjalankan usaha berdasarkan apa?", "o": ["Kontrak bagi hasil, kontrak karya, atau perjanjian kerja sama pengusahaan pertambangan", "Perjanjian waralaba internasional", "Kontrak kerja sama dengan BUMN", "Perjanjian sewa guna usaha (leasing)"], "c": 0, "e": "Pasal 434 & 437 PMK 153/PMK.010/2020 mengecualikan fasilitas litbang bagi WP badan DN yang usahanya berdasarkan kontrak bagi hasil, kontrak karya, atau perjanjian kerja sama pengusahaan pertambangan — karena rezim fiskal sektor tersebut sudah diatur tersendiri.", "p": 1, "topic": "Fasilitas Litbang", "id": "pengawasan_q_8"}, {"q": "Mengapa Wajib Pajak badan dalam negeri yang menjalankan usaha berdasarkan kontrak karya atau kontrak bagi hasil dikecualikan dari fasilitas pengurangan penghasilan bruto untuk litbang?", "o": ["Karena rezim fiskal sektor tersebut sudah diatur tersendiri dalam kontrak/perjanjiannya", "Karena sektor tersebut tidak melakukan kegiatan litbang", "Karena fasilitas litbang hanya untuk perusahaan rintisan (startup)", "Karena nilai investasinya dianggap terlalu kecil"], "c": 0, "e": "Pengecualian ini konsisten dengan prinsip bahwa WP dengan kontrak karya/kontrak bagi hasil pertambangan sudah memiliki rezim fiskal tersendiri yang diatur dalam kontrak/perjanjiannya, sehingga tidak tunduk pada fasilitas pengurangan penghasilan bruto litbang yang bersifat umum.", "p": 1, "topic": "Fasilitas Litbang", "id": "pengawasan_q_9"}, {"q": "Pasal 3 PMK-111/2025 tentang Pengawasan Kepatuhan Wajib Pajak menegaskan ruang lingkup pengawasan mencakup kolom apa sebagai salah satu sasaran utama pengawasan kepatuhan?", "o": ["WP Terdaftar", "WP yang baru lahir", "WP yang telah meninggal dunia", "WP badan usaha milik asing saja"], "c": 0, "e": "Pasal 3 PMK-111/2025 menegaskan ruang lingkup pengawasan kepatuhan mencakup kolom \"WP Terdaftar\" sebagai sasaran utama, dibedakan dari pengawasan ekstensifikasi atas WP yang belum terdaftar.", "p": 1, "topic": "PMK-111/2025 Ruang Lingkup", "id": "pengawasan_q_10"}, {"q": "Dasar hukum NPWP sebagai nomor identitas WP dalam administrasi perpajakan diatur dalam...", "o": ["Pasal 1 angka 6 UU KUP", "Pasal 2 ayat (1) UU KUP", "Pasal 1 angka 24 UU PPN", "Pasal 28 UU KUP"], "c": 0, "e": "Pasal 1 angka 6 UU KUP mendefinisikan NPWP sebagai nomor identitas WP dalam administrasi hak dan kewajiban perpajakan.", "p": 0, "topic": "NPWP", "id": "pengawasan_q_11"}, {"q": "Seorang wanita kawin ingin menjalankan hak dan kewajiban perpajakannya sendiri terpisah dari suami tanpa ada putusan hakim atau perjanjian pisah harta. Konsekuensinya adalah...", "o": ["Tidak diperbolehkan sama sekali", "Istri wajib mendaftarkan diri untuk memperoleh NPWP", "Otomatis menggunakan NPWP suami", "Harus menunggu perceraian terlebih dahulu"], "c": 1, "e": "Jika istri memilih menjalankan hak dan kewajiban perpajakannya sendiri (meski tanpa putusan hakim/pisah harta tertulis), konsekuensinya istri wajib mendaftarkan diri untuk memperoleh NPWP.", "p": 0, "topic": "NPWP", "id": "pengawasan_q_12"}, {"q": "Badan wajib mendaftarkan diri untuk memperoleh NPWP paling lama...", "o": ["1 bulan setelah saat pendirian", "Akhir bulan berikutnya setelah berdiri", "3 bulan setelah saat pendirian", "Sebelum melakukan kegiatan usaha"], "c": 0, "e": "Badan wajib mendaftarkan diri paling lama 1 (satu) bulan setelah saat pendirian.", "p": 0, "topic": "NPWP", "id": "pengawasan_q_13"}, {"q": "Dirjen Pajak harus memberikan keputusan atas permohonan pencabutan pengukuhan PKP dalam jangka waktu...", "o": ["3 bulan sejak permohonan diterima lengkap", "6 bulan sejak permohonan diterima lengkap", "1 bulan sejak permohonan diterima lengkap", "12 bulan sejak permohonan diterima lengkap"], "c": 1, "e": "Jangka waktu keputusan pencabutan pengukuhan PKP adalah 6 bulan sejak tanggal permohonan diterima secara lengkap.", "p": 0, "topic": "PKP", "id": "pengawasan_q_14"}, {"q": "NPWP Cabang suatu badan usaha menggunakan format...", "o": ["16 digit angka sama dengan NPWP pusat", "Nomor Identitas Tempat Kegiatan Usaha (NITKU)", "Nomor Induk Kependudukan (NIK) pengurus cabang", "Kombinasi NPWP pusat dan kode wilayah"], "c": 1, "e": "NPWP Cabang menggunakan Nomor Identitas Tempat Kegiatan Usaha (NITKU), berbeda dari NPWP pusat yang berupa 16 digit angka.", "p": 0, "topic": "NPWP", "id": "pengawasan_q_15"}, {"q": "Berdasarkan Pasal 28 UU KUP, dokumen dasar pembukuan termasuk dokumen yang mendukung bahwa transaksi dengan pihak hubungan istimewa sesuai prinsip kewajaran dan kelaziman usaha wajib disimpan selama...", "o": ["5 tahun", "10 tahun", "7 tahun", "15 tahun"], "c": 1, "e": "Buku, catatan, dan dokumen dasar pembukuan/pencatatan termasuk dokumen pendukung transfer pricing wajib disimpan 10 tahun di Indonesia.", "p": 0, "topic": "Pembukuan", "id": "pengawasan_q_16"}, {"q": "WP OP berikut TIDAK wajib menyelenggarakan pembukuan, KECUALI...", "o": ["WP OP yang memilih menggunakan NPPN", "WP OP yang tidak melakukan kegiatan usaha/pekerjaan bebas", "WP OP dengan kriteria tertentu berdasarkan peredaran bruto (PMK 54/2021)", "WP OP yang menjalankan usaha dengan peredaran bruto di atas Rp4,8 miliar"], "c": 3, "e": "WP OP dengan peredaran bruto di atas Rp4,8 miliar wajib menyelenggarakan pembukuan; tiga pilihan lainnya adalah pengecualian kewajiban pembukuan.", "p": 0, "topic": "Pembukuan", "id": "pengawasan_q_17"}, {"q": "PPh Pasal 21/26 yang dipotong wajib disetor paling lama tanggal...", "o": ["10 bulan berikutnya", "15 bulan berikutnya", "20 bulan berikutnya", "Akhir bulan berikutnya"], "c": 0, "e": "PPh Pasal 21/26, 23/26, 15, dan 4(2) yang dipotong disetor paling lama tanggal 10 bulan berikutnya.", "p": 0, "topic": "Pembayaran Pajak", "id": "pengawasan_q_18"}, {"q": "Sanksi bunga atas keterlambatan pembayaran pajak (Pasal 9 ayat 2a UU KUP) dihitung dengan formula tarif bunga per bulan sebesar...", "o": ["suku bunga acuan + uplift factor 5% dibagi 12", "suku bunga acuan + uplift factor 15% dibagi 12", "suku bunga acuan + uplift factor 20% dibagi 12", "suku bunga acuan dibagi 12 tanpa uplift"], "c": 0, "e": "Sanksi bunga keterlambatan pembayaran = suku bunga acuan + uplift factor 5%, dibagi 12, paling lama 24 bulan.", "p": 0, "topic": "Sanksi", "id": "pengawasan_q_19"}, {"q": "STP, SKPKB, SKPKBT, SK Keberatan, SK Pembetulan, Putusan Banding, dan Putusan PK harus dilunasi paling lama...", "o": ["1 bulan sejak tanggal diterbitkan", "2 bulan sejak tanggal diterbitkan", "3 bulan sejak tanggal diterbitkan", "Sejak Surat Paksa disampaikan"], "c": 0, "e": "Pasal 9 ayat (3) UU KUP mengatur batas waktu pembayaran STP/ketetapan/keputusan paling lama 1 bulan sejak tanggal diterbitkan (dapat diperpanjang maks 2 bulan untuk WP usaha kecil/daerah tertentu).", "p": 0, "topic": "Sanksi", "id": "pengawasan_q_20"}, {"q": "SPT Tahunan PPh Wajib Pajak Badan disampaikan paling lambat...", "o": ["3 bulan setelah akhir Tahun Pajak", "4 bulan setelah akhir Tahun Pajak", "6 bulan setelah akhir Tahun Pajak", "20 hari setelah akhir Tahun Pajak"], "c": 1, "e": "SPT Tahunan PPh Badan disampaikan paling lambat 4 bulan setelah akhir Tahun Pajak (berbeda dengan PPh OP yang 3 bulan).", "p": 0, "topic": "SPT", "id": "pengawasan_q_21"}, {"q": "SPT Masa PPN disampaikan paling lambat...", "o": ["10 hari setelah Masa Pajak berakhir", "20 hari setelah Masa Pajak berakhir", "Akhir bulan berikutnya setelah Masa Pajak berakhir", "15 hari setelah Masa Pajak berakhir"], "c": 2, "e": "SPT Masa PPN disampaikan paling lambat akhir bulan berikutnya setelah Masa Pajak berakhir.", "p": 0, "topic": "SPT", "id": "pengawasan_q_22"}, {"q": "Manakah yang menyebabkan SPT dianggap TIDAK disampaikan?", "o": ["SPT disampaikan tepat waktu dengan lampiran lengkap", "SPT ditandatangani oleh kuasa WP yang sah", "SPT disampaikan setelah dilakukan pemeriksaan atau diterbitkan SKP", "SPT dilaporkan secara elektronik melalui e-filing"], "c": 2, "e": "SPT yang disampaikan setelah dilakukan pemeriksaan atau diterbitkan SKP dianggap tidak disampaikan, demikian pula jika tidak ditandatangani atau tidak lengkap lampirannya.", "p": 0, "topic": "SPT", "id": "pengawasan_q_23"}, {"q": "WP dapat memperpanjang jangka waktu penyampaian SPT Tahunan PPh paling lama...", "o": ["1 bulan sejak batas waktu", "2 bulan sejak batas waktu", "3 bulan sejak batas waktu", "6 bulan sejak batas waktu"], "c": 1, "e": "Perpanjangan penyampaian SPT Tahunan PPh paling lama 2 bulan sejak batas waktu penyampaian SPT Tahunan.", "p": 0, "topic": "SPT", "id": "pengawasan_q_24"}, {"q": "Sanksi denda keterlambatan pelaporan SPT Tahunan PPh Badan sesuai Pasal 7 ayat (1) UU KUP adalah sebesar...", "o": ["Rp100.000", "Rp500.000", "Rp1.000.000", "Rp2.000.000"], "c": 2, "e": "SPT Tahunan PPh Badan dikenai sanksi denda Rp1.000.000; SPT Tahunan OP Rp100.000; SPT Masa PPN Rp500.000; SPT Masa lainnya Rp100.000.", "p": 0, "topic": "Sanksi", "id": "pengawasan_q_25"}, {"q": "WP dapat membetulkan SPT yang mengakibatkan rugi atau lebih bayar paling lama...", "o": ["1 tahun sebelum daluwarsa", "2 tahun sebelum daluwarsa", "3 tahun sebelum daluwarsa", "Sampai dengan daluwarsa tanpa batas"], "c": 1, "e": "Pembetulan SPT yang menyatakan rugi atau lebih bayar dibatasi paling lama 2 tahun sebelum daluwarsa; pembetulan lain yang tidak mengurangi penerimaan dapat dilakukan sampai daluwarsa.", "p": 0, "topic": "SPT", "id": "pengawasan_q_26"}, {"q": "Dasar hukum penggabungan penghasilan suami, istri, dan anak yang belum dewasa sebagai satu kesatuan ekonomis diatur dalam...", "o": ["Pasal 6 UU PPh", "Pasal 8 UU PPh", "Pasal 4 UU PPh", "Pasal 2 UU PPh"], "c": 1, "e": "Pasal 8 UU PPh mengatur bahwa keluarga merupakan satu kesatuan ekonomis sehingga penghasilan digabung dan dilaporkan dalam 1 NPWP kepala keluarga.", "p": 0, "topic": "PPh", "id": "pengawasan_q_27"}, {"q": "WP Badan Dalam Negeri dengan peredaran bruto sampai dengan Rp50 miliar mendapat fasilitas pengurangan tarif PPh sebesar 50% dari tarif umum atas Penghasilan Kena Pajak dari bagian peredaran bruto sampai dengan...", "o": ["Rp2,4 miliar", "Rp4,8 miliar", "Rp50 miliar", "Rp10 miliar"], "c": 1, "e": "Fasilitas Pasal 31E memberikan pengurangan tarif 50% atas PKP dari bagian peredaran bruto sampai dengan Rp4,8 miliar, bagi WP Badan dengan total peredaran bruto s.d. Rp50 miliar.", "p": 0, "topic": "PPh Badan", "id": "pengawasan_q_28"}, {"q": "Besaran PTKP untuk diri Wajib Pajak orang pribadi adalah...", "o": ["Rp36.000.000", "Rp54.000.000", "Rp4.500.000", "Rp24.300.000"], "c": 1, "e": "PTKP untuk diri WP OP sendiri adalah Rp54.000.000, ditambah Rp4.500.000 untuk status kawin dan Rp4.500.000 per tanggungan (maks 3 orang).", "p": 0, "topic": "PTKP", "id": "pengawasan_q_29"}, {"q": "Jumlah maksimal tanggungan yang dapat ditambahkan dalam perhitungan PTKP untuk setiap keluarga adalah...", "o": ["2 orang", "3 orang", "4 orang", "Tidak dibatasi"], "c": 1, "e": "Tambahan tanggungan dalam PTKP dibatasi paling banyak 3 orang untuk setiap keluarga (keluarga sedarah/semenda garis lurus serta anak angkat).", "p": 0, "topic": "PTKP", "id": "pengawasan_q_30"}, {"q": "PPh Final atas penghasilan WP dengan peredaran bruto tertentu (PP 55/2022) dikenakan tarif sebesar...", "o": ["0,5% dari peredaran bruto", "1% dari peredaran bruto", "2% dari laba bersih", "0,5% dari laba bersih"], "c": 0, "e": "PPh Final UMKM dikenakan 0,5% dari peredaran bruto (omzet), bukan dari laba bersih.", "p": 0, "topic": "PPh Final UMKM", "id": "pengawasan_q_31"}, {"q": "Bagi WP OP yang menggunakan skema PPh Final UMKM, peredaran bruto berapa yang tidak dikenai PPh (dihitung kumulatif sejak masa pajak pertama dalam tahun pajak)?", "o": ["Sampai dengan Rp54.000.000 setahun", "Sampai dengan Rp500.000.000 setahun", "Sampai dengan Rp4.800.000.000 setahun", "Sampai dengan Rp50.000.000 setahun"], "c": 1, "e": "Khusus WP OP, atas bagian peredaran bruto sampai dengan Rp500 juta dalam 1 Tahun Pajak tidak dikenai PPh, dihitung kumulatif sejak Masa Pajak pertama.", "p": 0, "topic": "PPh Final UMKM", "id": "pengawasan_q_32"}, {"q": "Jangka waktu penggunaan skema PPh Final UMKM (PP 55/2022) bagi WP Badan berbentuk PT adalah...", "o": ["3 Tahun Pajak", "4 Tahun Pajak", "7 Tahun Pajak", "Tidak dibatasi"], "c": 0, "e": "Jangka waktu PPh Final UMKM: OP 7 tahun; PT (Perseroan Terbatas) 3 tahun; CV/Firma/Koperasi/BUMDes/PT OP 4 tahun, dihitung sejak terdaftar.", "p": 0, "topic": "PPh Final UMKM", "id": "pengawasan_q_33"}, {"q": "Natura dan/atau kenikmatan berikut DIKECUALIKAN dari objek PPh bagi penerima, KECUALI...", "o": ["Makanan/minuman bagi seluruh pegawai", "Natura di daerah tertentu", "Natura/kenikmatan untuk keharusan pekerjaan (misal alat K3)", "Fasilitas mobil dinas bagi direktur yang melebihi batasan jenis dan nilai tertentu"], "c": 3, "e": "Natura/kenikmatan dengan jenis dan/atau nilai melebihi batasan tertentu (diatur PMK) tetap merupakan objek pajak; tiga lainnya dikecualikan dari objek PPh.", "p": 0, "topic": "Natura", "id": "pengawasan_q_34"}, {"q": "Biaya natura dan/atau kenikmatan dapat dibebankan sebagai biaya (deductible) oleh pemberi sepanjang...", "o": ["Nilainya di bawah Rp5 juta", "Merupakan biaya untuk mendapatkan, menagih, dan memelihara penghasilan (3M)", "Diberikan kepada seluruh pegawai tanpa kecuali", "Disetujui terlebih dahulu oleh Dirjen Pajak"], "c": 1, "e": "Biaya natura/kenikmatan dapat dikurangkan dari penghasilan bruto (deductible) sepanjang merupakan biaya 3M, sesuai prinsip umum Pasal 6 UU PPh.", "p": 0, "topic": "Natura", "id": "pengawasan_q_35"}, {"q": "Syarat penggunaan Norma Penghitungan Penghasilan Neto (NPPN) oleh WP OP sesuai Pasal 14 UU PPh antara lain, KECUALI...", "o": ["Peredaran bruto kurang dari Rp4,8 miliar setahun", "Memberitahukan Dirjen Pajak dalam 3 bulan pertama Tahun Pajak", "Wajib menyelenggarakan Pencatatan", "Merupakan WP Badan dengan peredaran bruto besar"], "c": 3, "e": "NPPN hanya dapat digunakan oleh WP Orang Pribadi, bukan WP Badan.", "p": 0, "topic": "NPPN", "id": "pengawasan_q_36"}, {"q": "Jika WP yang memilih menggunakan pembukuan tidak meminjamkan buku/catatan saat diperiksa, maka Penghasilan Neto dihitung dengan...", "o": ["Langsung ditetapkan nihil", "Penetapan Peredaran Bruto dengan cara lain menggunakan NPPN", "Diberikan pengampunan sanksi", "Wajib membayar PPh 50% dari total aset"], "c": 1, "e": "WP yang tidak meminjamkan buku/catatan atau tidak menyelenggarakan pembukuan/pencatatan saat diperiksa, Penghasilan Netonya dihitung dengan cara lain (penetapan peredaran bruto dengan cara lain) menggunakan NPPN, sesuai Pasal 14(5) jo. Pasal 16(2) UU PPh.", "p": 0, "topic": "NPPN", "id": "pengawasan_q_37"}, {"q": "Pengusaha Kecil dalam konteks PPN adalah pengusaha dengan jumlah peredaran bruto dan/atau penerimaan bruto selama satu tahun buku tidak lebih dari...", "o": ["Rp500 juta", "Rp1,8 miliar", "Rp4,8 miliar", "Rp50 miliar"], "c": 2, "e": "Pengusaha Kecil adalah pengusaha dengan peredaran bruto/penerimaan bruto setahun tidak lebih dari Rp4.800.000.000 (PMK 197/PMK.03/2013).", "p": 0, "topic": "PKP", "id": "pengawasan_q_38"}, {"q": "Berdasarkan PMK-164/2023, saat terbit SPPKP TIDAK LAGI otomatis sama dengan saat mulainya kewajiban/hak PKP. WP dapat memilih saat mulainya kewajiban memungut, menyetor, dan melaporkan PPN...", "o": ["Setahun setelah SPPKP terbit", "Sebelum awal tahun buku berikutnya, dengan menyampaikan pemberitahuan", "Kapan saja tanpa pemberitahuan", "Hanya pada tanggal 1 Januari"], "c": 1, "e": "PMK-164/2023 memberi grace period: WP dapat memilih saat mulainya kewajiban pungut/setor/lapor PPN sebelum awal tahun buku berikutnya, dengan menyampaikan pemberitahuan bersamaan permohonan pengukuhan PKP.", "p": 0, "topic": "PKP", "id": "pengawasan_q_39"}, {"q": "Manakah dari berikut ini yang merupakan objek PPN berdasarkan Pasal 4 ayat (1) UU PPN?", "o": ["Penyerahan BKP di dalam Daerah Pabean oleh Pengusaha", "Hibah antar keluarga sedarah", "Pembagian warisan", "Setoran modal berupa saham"], "c": 0, "e": "Penyerahan BKP di dalam Daerah Pabean oleh Pengusaha adalah objek PPN sesuai Pasal 4 ayat (1) huruf a UU PPN; tiga lainnya bukan objek pajak.", "p": 0, "topic": "Objek PPN", "id": "pengawasan_q_40"}, {"q": "PPN atas Kegiatan Membangun Sendiri (KMS) berdasarkan Pasal 16C UU PPN dikenakan dengan tarif...", "o": ["11% × total biaya pembangunan", "20% × 11% × total biaya pembangunan (tidak termasuk tanah)", "2,2% × harga jual", "10% × DPP"], "c": 1, "e": "PPN KMS = 20% × 11% × total biaya pembangunan (tidak termasuk perolehan tanah), disetor paling lama tanggal 15 bulan berikutnya.", "p": 0, "topic": "PPN KMS", "id": "pengawasan_q_41"}, {"q": "Syarat luas bangunan minimal untuk dikenakan PPN Kegiatan Membangun Sendiri (KMS) adalah...", "o": ["100 m²", "150 m²", "200 m²", "300 m²"], "c": 2, "e": "PPN KMS dikenakan atas bangunan dengan luas keseluruhan paling sedikit 200 m² sesuai PMK-61/PMK.03/2022.", "p": 0, "topic": "PPN KMS", "id": "pengawasan_q_42"}, {"q": "Penyerahan BKP berupa aktiva yang menurut tujuan semula tidak untuk diperjualbelikan (Pasal 16D UU PPN) TIDAK dikenakan PPN apabila...", "o": ["Aktiva tersebut berumur lebih dari 10 tahun", "Pajak Masukan atas perolehan aktiva tersebut tidak dapat dikreditkan menurut Pasal 9 ayat (8) huruf b dan c", "Aktiva tersebut telah disusutkan penuh", "Nilai aktiva di bawah Rp100 juta"], "c": 1, "e": "Pasal 16D mengecualikan PPN atas penyerahan aktiva tersebut jika Pajak Masukannya tidak dapat dikreditkan menurut Pasal 9 ayat (8) huruf b dan c UU PPN.", "p": 0, "topic": "Objek PPN", "id": "pengawasan_q_43"}, {"q": "Manakah berikut ini yang TERMASUK dalam pengertian penyerahan BKP menurut Pasal 1A ayat (1) UU PPN?", "o": ["Penyerahan BKP untuk jaminan utang-piutang", "Pengalihan BKP karena perjanjian sewa guna usaha (leasing) dengan hak opsi", "Penyerahan BKP kepada makelar", "Penyerahan BKP dalam rangka pemusatan tempat pajak terutang"], "c": 1, "e": "Pengalihan BKP karena leasing dengan hak opsi termasuk penyerahan BKP (Pasal 1A ayat 1 huruf b); tiga lainnya justru TIDAK termasuk penyerahan BKP (Pasal 1A ayat 2).", "p": 0, "topic": "Penyerahan BKP", "id": "pengawasan_q_44"}, {"q": "Sejak berlakunya UU Cipta Kerja, bentuk penyerahan BKP berikut ini telah DIHAPUS dari definisi penyerahan BKP...", "o": ["Pemakaian sendiri dan/atau pemberian cuma-cuma", "Penyerahan BKP secara konsinyasi", "Penyerahan dari pusat ke cabang", "Penyerahan kepada pedagang perantara"], "c": 1, "e": "Pasal 4(1) huruf g lama, \"penyerahan BKP secara konsinyasi\", sudah tidak lagi masuk definisi penyerahan BKP sejak diundangkannya UU Cipta Kerja.", "p": 0, "topic": "Penyerahan BKP", "id": "pengawasan_q_45"}, {"q": "Tarif normal PPN yang berlaku sejak 1 April 2022 adalah...", "o": ["10%", "11%", "12%", "0%"], "c": 1, "e": "Tarif PPN normal naik dari 10% menjadi 11% sejak 1 April 2022, dan direncanakan naik menjadi 12% paling lambat 1 Januari 2025.", "p": 0, "topic": "Tarif PPN", "id": "pengawasan_q_46"}, {"q": "Pada cara hitung PPN menggunakan Besaran Tertentu (Pasal 9A UU PPN), perlakuan terhadap Pajak Masukan yang berhubungan dengan penyerahan tersebut adalah...", "o": ["Dapat dikreditkan sepenuhnya", "Tidak dapat dikreditkan karena dianggap sudah diperhitungkan dalam Pajak Keluaran", "Dapat dikreditkan 50%", "Dikembalikan melalui restitusi"], "c": 1, "e": "Pada mekanisme Besaran Tertentu (Pasal 9A), PM tidak dapat dikreditkan karena pada prinsipnya telah diperhitungkan/dianggap telah dikreditkan dalam penghitungan Pajak Keluaran dengan besaran tertentu.", "p": 0, "topic": "DPP Besaran Tertentu", "id": "pengawasan_q_47"}, {"q": "Pemungutan PPN dan PPnBM menganut prinsip akrual, artinya terutangnya pajak terjadi pada saat...", "o": ["Pembayaran diterima penuh", "Faktur Pajak diterbitkan", "Penyerahan BKP/JKP, meskipun pembayaran belum/belum sepenuhnya diterima", "Akhir Masa Pajak"], "c": 2, "e": "Prinsip akrual PPN: terutangnya pajak terjadi pada saat penyerahan BKP/JKP, meskipun pembayaran belum diterima/belum sepenuhnya diterima, atau pada saat impor BKP.", "p": 0, "topic": "Saat Terutang PPN", "id": "pengawasan_q_48"}, {"q": "Dalam hal pembayaran diterima sebelum penyerahan BKP/JKP, saat terutangnya PPN adalah...", "o": ["Saat penyerahan barang dilakukan", "Saat Faktur Pajak diterbitkan", "Saat pembayaran diterima", "Akhir bulan penyerahan"], "c": 2, "e": "Jika pembayaran diterima sebelum penyerahan BKP/JKP, saat terutangnya pajak adalah pada saat pembayaran diterima, bukan saat penyerahan.", "p": 0, "topic": "Saat Terutang PPN", "id": "pengawasan_q_49"}, {"q": "Untuk pemanfaatan BKP Tidak Berwujud dan/atau JKP dari luar Daerah Pabean, saat terutangnya PPN ditentukan oleh peristiwa mana yang lebih dahulu terjadi di antara, KECUALI...", "o": ["Saat BKPTB/JKP secara nyata digunakan", "Saat harga perolehan dinyatakan sebagai utang", "Saat harga jual/penggantian ditagih", "Saat Faktur Pajak diterbitkan oleh penerima manfaat"], "c": 3, "e": "Faktur Pajak tidak diterbitkan oleh penerima manfaat; saat terutang ditentukan oleh nyata digunakan, dinyatakan sebagai utang, ditagih, atau dibayar - mana yang lebih dahulu.", "p": 0, "topic": "Saat Terutang PPN", "id": "pengawasan_q_50"}, {"q": "Tempat terutang PPN bagi PKP Orang Pribadi adalah...", "o": ["Tempat tinggal dan/atau tempat kegiatan usaha", "Hanya tempat kedudukan KPP terdaftar", "Tempat domisili orang tua", "Kantor pusat DJP"], "c": 0, "e": "Tempat terutang PPN bagi PKP OP adalah tempat tinggal dan/atau tempat kegiatan usaha, sedangkan PKP Badan di tempat kedudukan dan tempat kegiatan usaha.", "p": 0, "topic": "Tempat Terutang PPN", "id": "pengawasan_q_51"}, {"q": "PKP dengan lebih dari satu tempat kegiatan usaha dapat memilih satu tempat atau lebih sebagai tempat pemusatan pajak terutang dengan cara...", "o": ["Otomatis tanpa pemberitahuan", "Menyampaikan pemberitahuan tertulis kepada Direktur Jenderal Pajak", "Mengajukan gugatan ke Pengadilan Pajak", "Menunggu penetapan dari KPP"], "c": 1, "e": "Pemusatan tempat pajak terutang dilakukan dengan menyampaikan pemberitahuan tertulis kepada Direktur Jenderal Pajak.", "p": 0, "topic": "Tempat Terutang PPN", "id": "pengawasan_q_52"}, {"q": "PKP wajib membuat Faktur Pajak untuk setiap, KECUALI...", "o": ["Penyerahan BKP", "Penyerahan JKP", "Ekspor BKP Berwujud", "Pembelian BKP dari PKP lain"], "c": 3, "e": "Faktur Pajak dibuat PKP yang MELAKUKAN penyerahan/ekspor BKP-JKP, bukan atas pembelian dari PKP lain (yang membuat faktur adalah penjual/pemberi jasa).", "p": 0, "topic": "Faktur Pajak", "id": "pengawasan_q_53"}, {"q": "PKP dapat membuat Faktur Pajak gabungan yang meliputi seluruh penyerahan kepada pembeli yang sama, paling lama dibuat pada...", "o": ["Setiap tanggal penyerahan", "Akhir bulan penyerahan BKP/JKP", "Awal bulan berikutnya", "Akhir tahun pajak"], "c": 1, "e": "Faktur Pajak gabungan meliputi penyerahan selama 1 bulan kalender ke pembeli yang sama, dan harus dibuat paling lama pada akhir bulan penyerahan BKP/JKP.", "p": 0, "topic": "Faktur Pajak", "id": "pengawasan_q_54"}, {"q": "Identitas pembeli yang harus dicantumkan dalam Faktur Pajak bagi subjek pajak dalam negeri orang pribadi adalah...", "o": ["Nomor paspor", "Nama dan alamat saja", "NPWP atau NIK sesuai ketentuan peraturan perundang-undangan", "Nomor KTP tanpa alamat"], "c": 2, "e": "Bagi subjek pajak dalam negeri orang pribadi, identitas yang dicantumkan adalah nama, alamat, dan NPWP atau NIK sesuai ketentuan yang berlaku.", "p": 0, "topic": "Faktur Pajak", "id": "pengawasan_q_55"}, {"q": "PKP Pedagang Eceran yang menyerahkan BKP/JKP kepada konsumen akhir dapat membuat Faktur Pajak eceran tanpa mencantumkan...", "o": ["Jenis barang yang diserahkan", "PPN yang dipungut", "Identitas pembeli serta nama dan tanda tangan penjual", "Tanggal transaksi"], "c": 2, "e": "Faktur Pajak eceran dapat dibuat tanpa mencantumkan identitas pembeli serta nama dan tanda tangan penjual, karena ditujukan untuk konsumen akhir.", "p": 0, "topic": "Faktur Pajak", "id": "pengawasan_q_56"}, {"q": "Dokumen tertentu yang kedudukannya dipersamakan dengan Faktur Pajak, jika dibuat melewati jangka waktu berapa bulan sejak seharusnya dibuat, maka dianggap tidak membuat dokumen tertentu dan PPN tidak dapat dikreditkan?", "o": ["1 bulan", "2 bulan", "3 bulan", "6 bulan"], "c": 2, "e": "Dokumen tertentu yang dibuat melewati 3 bulan sejak seharusnya dibuat dianggap tidak dibuat, sehingga PPN yang tercantum tidak dapat dikreditkan.", "p": 0, "topic": "Faktur Pajak", "id": "pengawasan_q_57"}, {"q": "Pajak Masukan dalam suatu Masa Pajak pada dasarnya dikreditkan dengan Pajak Keluaran...", "o": ["Dalam Masa Pajak yang sama", "Dalam Masa Pajak sebelumnya", "Pada akhir tahun buku", "Setelah dilakukan pemeriksaan"], "c": 0, "e": "Pasal 9 ayat (2) UU PPN: Pajak Masukan dalam suatu Masa Pajak dikreditkan dengan Pajak Keluaran dalam Masa Pajak yang sama.", "p": 0, "topic": "Pengkreditan PM", "id": "pengawasan_q_58"}, {"q": "Pajak Masukan yang dapat namun belum dikreditkan pada Masa Pajak yang sama, dapat dikreditkan pada Masa Pajak berikutnya paling lama...", "o": ["1 Masa Pajak", "2 Masa Pajak", "3 Masa Pajak setelah berakhirnya Masa Pajak saat Faktur Pajak dibuat", "6 Masa Pajak"], "c": 2, "e": "PM yang belum dikreditkan dapat dikreditkan paling lama 3 Masa Pajak setelah berakhirnya Masa Pajak saat Faktur Pajak dibuat, sepanjang belum dibebankan sebagai biaya/dikapitalisasi.", "p": 0, "topic": "Pengkreditan PM", "id": "pengawasan_q_59"}, {"q": "Pengkreditan Pajak Masukan TIDAK berlaku bagi pengeluaran untuk perolehan BKP/JKP yang Faktur Pajaknya tidak mencantumkan...", "o": ["Harga jual barang", "Identitas pembeli (nama, alamat, NPWP)", "Tanda tangan basah penjual", "Tanggal pembuatan faktur"], "c": 1, "e": "Pasal 9 ayat (8) huruf f UU PPN mengecualikan pengkreditan PM atas Faktur Pajak yang tidak memenuhi ketentuan Pasal 13(5)/(9) atau tidak mencantumkan nama, alamat, dan NPWP pembeli.", "p": 0, "topic": "PM Tidak Dapat Dikreditkan", "id": "pengawasan_q_60"}, {"q": "Pengusaha yang belum dikukuhkan sebagai PKP dapat mengkreditkan Pajak Masukan atas perolehan sebelum dikukuhkan menggunakan pedoman Deemed Pajak Masukan sebesar...", "o": ["50% dari Pajak Keluaran yang seharusnya dipungut", "80% dari Pajak Keluaran yang seharusnya dipungut", "100% dari Pajak Keluaran yang seharusnya dipungut", "0% (tidak dapat dikreditkan sama sekali)"], "c": 1, "e": "Pengusaha sebelum dikukuhkan PKP dapat mengkreditkan PM dengan pedoman Deemed PM sebesar 80% dari Pajak Keluaran yang seharusnya dipungut.", "p": 0, "topic": "Pengkreditan PM", "id": "pengawasan_q_61"}, {"q": "Jika dalam 3 tahun pertama sejak PM mulai dikreditkan belum ada penyerahan BKP/JKP sama sekali oleh PKP yang belum melakukan penyerahan, maka PPN yang telah dikreditkan...", "o": ["Tetap sah dan tidak perlu dikoreksi", "Menjadi tidak dapat dikreditkan (dibatalkan)", "Otomatis direstitusi penuh", "Dialihkan menjadi kredit pajak PPh"], "c": 1, "e": "Jika 3 tahun pertama sejak mengkreditkan PM belum ada penyerahan BKP/JKP, PPN yang telah dikreditkan menjadi tidak dapat dikreditkan (dibatalkan) sesuai Pasal 9 ayat (6a) UU PPN.", "p": 0, "topic": "Pengkreditan PM", "id": "pengawasan_q_62"}, {"q": "Pajak Masukan yang tidak dilaporkan dalam SPT Masa PPN namun ditemukan saat pemeriksaan...", "o": ["Tidak dapat dikreditkan sama sekali", "Dapat dikreditkan sepanjang sesuai bukti Faktur Pajak yang dimiliki dan memenuhi ketentuan pengkreditan", "Hanya dapat dikreditkan 50%", "Otomatis dianggap sebagai temuan pelanggaran pidana"], "c": 1, "e": "PM yang ditemukan saat pemeriksaan tetap dapat dikreditkan oleh PKP sepanjang sesuai bukti Faktur Pajak yang dimiliki dan memenuhi ketentuan pengkreditan UU PPN.", "p": 0, "topic": "Pengkreditan PM", "id": "pengawasan_q_63"}, {"q": "Penilaian harta dalam hal tukar-menukar antara pihak yang tidak memiliki hubungan istimewa, menggunakan nilai...", "o": ["Nilai buku penjual", "Harga pasar", "Harga perolehan awal", "Nilai taksiran appraisal independen wajib"], "c": 1, "e": "Pasal 10 ayat (2) UU PPh: penilaian harta dalam tukar-menukar menggunakan jumlah yang seharusnya dikeluarkan/diterima berdasarkan harga pasar.", "p": 0, "topic": "Penilaian Harta", "id": "pengawasan_q_64"}, {"q": "Kerugian fiskal suatu tahun pajak dapat dikompensasikan secara vertikal selama berapa tahun berturut-turut sejak tahun berikutnya?", "o": ["3 tahun", "5 tahun", "7 tahun", "10 tahun"], "c": 1, "e": "Pasal 6 ayat (2) UU PPh: kerugian fiskal dapat dikompensasikan selama 5 tahun berturut-turut dimulai sejak tahun berikutnya sesudah tahun didapatnya kerugian tersebut.", "p": 0, "topic": "Kompensasi Kerugian", "id": "pengawasan_q_65"}, {"q": "Harta berwujud bukan bangunan dengan masa manfaat lebih dari 20 tahun, sejak Tahun Pajak 2022 WP dapat memilih untuk menyusutkan menggunakan...", "o": ["Masa manfaat 20 tahun atau masa manfaat sebenarnya sesuai pembukuan WP", "Hanya masa manfaat 20 tahun tanpa pilihan lain", "Hanya metode saldo menurun", "Masa manfaat minimal 30 tahun"], "c": 0, "e": "Sejak Tahun Pajak 2022 (Pasal 11 ayat 6a & 11A ayat 2a UU PPh), untuk harta masa manfaat >20 tahun, WP dapat memilih menggunakan masa manfaat 20 tahun atau masa manfaat sebenarnya sesuai pembukuan WP.", "p": 0, "topic": "Penyusutan", "id": "pengawasan_q_66"}, {"q": "Di antara berikut, mana yang BUKAN termasuk klasifikasi Objek Pajak Bumi PBB sektor P5L menurut ketentuan terbaru?", "o": ["Sektor Perkebunan", "Sektor Perhutanan", "Sektor Pertambangan Minyak dan Gas Bumi", "Sektor Pertanian Pangan"], "c": 3, "e": "Klasifikasi PBB P5L: Perkebunan, Perhutanan, Pertambangan Migas, Pertambangan Panas Bumi, Pertambangan Mineral/Batubara, dan Lainnya — tidak ada kategori 'Pertanian Pangan'.", "p": 0, "topic": "Objek Pajak P5L", "id": "pengawasan_q_67"}, {"q": "Areal di luar areal yang tercantum dalam IUP-B dapat tetap menjadi Objek Pajak Bumi Sektor Perkebunan apabila...", "o": ["Berjarak kurang dari 5 km", "Merupakan satu kesatuan yang digunakan untuk kegiatan usaha perkebunan dan secara fisik tidak terpisahkan", "Dimiliki oleh perusahaan afiliasi", "Memiliki luas lebih dari 100 hektar"], "c": 1, "e": "Pasal 3: areal di luar areal huruf a tetap menjadi objek jika merupakan satu kesatuan yang digunakan untuk usaha perkebunan dan secara fisik tidak terpisahkan (misal terhubung lewat sungai/parit/jalan/jembatan).", "p": 0, "topic": "Objek Pajak P5L", "id": "pengawasan_q_68"}, {"q": "Khusus pada Objek Pajak Bumi sektor Pertambangan Migas, konsep 'terhubung' antar areal mencakup koneksi melalui media tambahan apa dibanding sektor lain?", "o": ["Jaringan pipa", "Jaringan kabel listrik", "Jalan tol", "Rel kereta api"], "c": 0, "e": "Pada sektor Migas, Pasal 5 menambahkan 'jaringan pipa' sebagai media penghubung areal, selain sungai/parit/jalan/jembatan yang berlaku di sektor lain.", "p": 0, "topic": "Objek Pajak P5L", "id": "pengawasan_q_69"}, {"q": "Objek Pajak Bumi Sektor Lainnya mencakup perairan NKRI yang digunakan untuk hal-hal berikut, KECUALI...", "o": ["Perikanan tangkap", "Jaringan pipa", "Ruas jalan tol", "Kawasan industri daratan"], "c": 3, "e": "Sektor Lainnya mencakup perairan untuk perikanan tangkap, pembudidayaan ikan, jaringan pipa, jaringan kabel, ruas jalan tol, dan fasilitas penyimpanan/pengolahan (FSO/FPS/FPU/FSU/FPSO/FSRU) — bukan kawasan industri daratan.", "p": 0, "topic": "Objek Pajak P5L", "id": "pengawasan_q_70"}, {"q": "Bumi pada kawasan pertambangan TIDAK dikenakan PBB P5L apabila...", "o": ["Dipunyai haknya dan dimanfaatkan sepenuhnya secara nyata oleh pihak lain selain subjek pajak", "Tidak dipunyai haknya dan tidak diperoleh manfaatnya oleh subjek pajak/WP", "Luasnya kurang dari 1 hektar", "Berada di luar Pulau Jawa"], "c": 1, "e": "Untuk sektor pertambangan, bumi tidak dikenakan PBB jika tidak dipunyai haknya dan tidak diperoleh manfaatnya oleh subjek pajak/WP (berbeda dari kriteria sektor perkebunan/perhutanan).", "p": 0, "topic": "Objek Pajak P5L", "id": "pengawasan_q_71"}, {"q": "NJOP Bumi Areal Produktif Hutan Alam dihitung dengan metode...", "o": ["Perbandingan harga dengan objek sejenis", "Nilai Jual Pengganti = Pendapatan Bersih Hasil Hutan × Angka Kapitalisasi", "NJOP per meter persegi × luas bumi", "Ditetapkan langsung dengan Keputusan Dirjen Pajak"], "c": 1, "e": "Areal Produktif Hutan Alam menggunakan Nilai Jual Pengganti (NJP) = Pendapatan Bersih Hasil Hutan × Angka Kapitalisasi, bukan perbandingan harga seperti areal tanah perkebunan.", "p": 0, "topic": "NJOP P5L", "id": "pengawasan_q_72"}, {"q": "Pendapatan bersih hasil hutan dihitung dari...", "o": ["Pendapatan kotor hasil hutan ditambah biaya produksi perhutanan", "Pendapatan kotor hasil hutan dikurangi biaya produksi perhutanan", "Jumlah produksi hasil hutan dikali dua", "Harga jual rata-rata hasil hutan saja"], "c": 1, "e": "Pendapatan bersih hasil hutan = Pendapatan kotor hasil hutan − Biaya Produksi Perhutanan.", "p": 0, "topic": "NJOP P5L", "id": "pengawasan_q_73"}, {"q": "NJOP Tubuh Bumi untuk tahap Eksplorasi pertambangan migas ditetapkan melalui...", "o": ["Perbandingan harga dengan objek sejenis", "Nilai Jual Pengganti berbasis FQR", "Keputusan Direktur Jenderal Pajak", "Rata-rata harga pasar internasional"], "c": 2, "e": "Tahap Eksplorasi (tubuh bumi belum/tidak menghasilkan) ditetapkan dengan Keputusan Dirjen Pajak, berbeda dengan tahap Eksploitasi yang memakai Nilai Jual Pengganti berbasis FQR.", "p": 0, "topic": "NJOP P5L", "id": "pengawasan_q_74"}, {"q": "Nilai Jual Pengganti Tubuh Bumi Eksploitasi Migas dihitung dari Pendapatan Minyak/Gas Bumi, yang diambil dari dokumen apa?", "o": ["Laporan Keuangan Tahunan diaudit", "Financial Quarterly Report (FQR) triwulan IV", "SPT Tahunan PPh Badan", "Neraca perusahaan"], "c": 1, "e": "Pendapatan minyak/gas bumi = gross sales sebagaimana tertuang dalam FQR triwulan IV WP sebelum Tahun Pajak PBB terutang.", "p": 0, "topic": "NJOP P5L", "id": "pengawasan_q_75"}, {"q": "Jika harga jual rata-rata minerba lebih rendah dari harga patokan rata-rata, maka NJOP dihitung berdasarkan...", "o": ["Harga jual rata-rata tetap digunakan", "Harga patokan rata-rata (HPM/HPB)", "Rata-rata keduanya", "Ditetapkan oleh Kementerian ESDM tanpa perhitungan"], "c": 1, "e": "Jika harga jual rata-rata lebih rendah dari harga patokan rata-rata, atau tidak terdapat harga jual rata-rata, maka digunakan harga patokan rata-rata (HPM Logam/HPM Bukan Logam/Harga Patokan Batuan/HPB).", "p": 0, "topic": "NJOP P5L", "id": "pengawasan_q_76"}, {"q": "Harga Patokan Rata-rata minerba (selain batubara jenis tertentu) ditentukan berdasarkan dua basis, yaitu...", "o": ["FOB vessel dan lokasi tambang", "CIF pelabuhan tujuan dan harga ekspor", "Harga domestik dan harga internasional", "Nilai buku dan nilai pasar"], "c": 0, "e": "Harga Patokan ditentukan dari basis FOB vessel dan lokasi tambang; selain cara itu (batubara jenis/keperluan tertentu) formulanya ditetapkan Kementerian ESDM.", "p": 0, "topic": "NJOP P5L", "id": "pengawasan_q_77"}, {"q": "Biaya Produksi Minerba yang dapat diakui harus memenuhi kriteria berikut, KECUALI...", "o": ["Sesuai dengan ketentuan PPh", "Sesuai prinsip kewajaran dan kelaziman usaha", "Merupakan biaya yang langsung berkaitan dengan kegiatan produksi tertentu", "Disetujui terlebih dahulu oleh pemegang saham"], "c": 3, "e": "Tiga kriteria Biaya Produksi Minerba (Pasal 32): sesuai PPh, sesuai kewajaran-kelaziman usaha, dan berkaitan langsung dengan kegiatan produksi (pengupasan tanah, pengambilan hasil, pengolahan/pemurnian, pengangkutan). Persetujuan pemegang saham bukan kriteria.", "p": 0, "topic": "NJOP P5L", "id": "pengawasan_q_78"}, {"q": "NJOP Bangunan pada sektor PBB P5L dihitung dari...", "o": ["Nilai Jual Pengganti seperti NJOP Bumi hutan alam", "Nilai Perolehan Baru dikurangi penyusutan berdasarkan kondisi fisik", "Harga pasar bangunan sejenis di sekitarnya", "Nilai buku akuntansi perusahaan"], "c": 1, "e": "NJOP Bangunan = Nilai Perolehan Baru (seluruh biaya perolehan objek) dikurangi penyusutan berdasarkan kondisi fisik — berlaku sama di semua sektor P5L.", "p": 0, "topic": "NJOP P5L", "id": "pengawasan_q_79"}, {"q": "Perbedaan utama siklus penetapan NJOP PBB (sistem baru) dibanding sistem lama adalah...", "o": ["NJOP kini ditetapkan Kepala KPP langsung melalui SPPT, tanpa usulan KMK ke Kanwil", "NJOP kini harus melalui Menteri Keuangan langsung", "NJOP ditetapkan setiap bulan, bukan tahunan", "Tidak ada lagi penerbitan SPPT"], "c": 0, "e": "Sistem lama: NJOP → usulan KMK ke Kanwil → SK Kanwil → SPPT. Sistem baru: NJOP → langsung ditetapkan Kepala KPP via penerbitan SPPT, lebih sederhana.", "p": 0, "topic": "Administrasi PBB P5L", "id": "pengawasan_q_80"}, {"q": "Untuk WP pemegang Kontrak Karya/PKP2B/IUPK-OP, penghitungan NJOP PBB mengikuti...", "o": ["Tabel umum PBB sesuai sektor", "Ketentuan dalam kontrak karya/PKP2B/IUPK-OP yang bersangkutan", "Rata-rata NJOP nasional", "Kesepakatan dengan DPRD setempat"], "c": 1, "e": "Pasal 13, 37, 38: penghitungan NJOP PBB bagi pemegang Kontrak Karya/PKP2B/IUPK-OP mengikuti ketentuan dalam kontrak/perjanjian/izin tersebut, bukan tabel umum.", "p": 0, "topic": "Administrasi PBB P5L", "id": "pengawasan_q_81"}, {"q": "Penetapan PBB terutang dapat dilakukan melalui dua instrumen berikut, yaitu...", "o": ["SPPT dan SKP PBB", "STP dan SP2DK", "SPOP dan SKT", "Faktur Pajak dan Bukti Potput"], "c": 0, "e": "Pasal 38: penetapan PBB terutang dilakukan melalui SPPT (paling lama 5 tahun setelah berakhirnya Tahun Pajak terutang) atau SKP PBB sesuai PMK tata cara penerbitan SKP PBB.", "p": 0, "topic": "Administrasi PBB P5L", "id": "pengawasan_q_82"}, {"q": "SPPT hasil penerbitan kembali (karena ada SK Keberatan/Putusan Banding, dll) memiliki konsekuensi hukum berupa...", "o": ["Dapat diajukan keberatan kembali", "Tidak dapat diajukan keberatan oleh WP", "Otomatis dibatalkan dalam 30 hari", "Harus disetujui ulang oleh Kanwil"], "c": 1, "e": "Pasal 39: SPPT sebelumnya dinyatakan tidak berlaku, dan SPPT hasil penerbitan kembali TIDAK dapat diajukan keberatan oleh WP.", "p": 0, "topic": "Administrasi PBB P5L", "id": "pengawasan_q_83"}, {"q": "Jangka waktu pelunasan PBB (SPPT) oleh Wajib Pajak adalah...", "o": ["Selambat-lambatnya 1 bulan sejak SPPT diterima", "Selambat-lambatnya 3 bulan sejak SPPT diterima", "Selambat-lambatnya 6 bulan sejak SPPT diterima", "Selambat-lambatnya 1 tahun sejak SPPT diterima"], "c": 2, "e": "Pasal 40: WP wajib melunasi PBB selambat-lambatnya 6 bulan sejak tanggal diterimanya SPPT; jika tidak/kurang dibayar setelah jatuh tempo, diterbitkan STP PBB.", "p": 0, "topic": "Administrasi PBB P5L", "id": "pengawasan_q_84"}, {"q": "Permohonan pengembalian seluruh Wilayah Kerja Migas/Panas Bumi oleh WP diajukan dan diputuskan oleh...", "o": ["Direktorat Jenderal Pajak", "SKK Migas/Kementerian ESDM", "Badan Koordinasi Penanaman Modal", "Kementerian Keuangan"], "c": 1, "e": "Pasal 41: WP mengajukan surat pengembalian WK ke SKK Migas/Kementerian ESDM (bukan DJP); jika ditolak, Dirjen Pajak menetapkan PBB terutang sejak Tahun Pajak setelah penolakan.", "p": 0, "topic": "Administrasi PBB P5L", "id": "pengawasan_q_85"}, {"q": "WP wajib mendaftarkan Objek Pajak PBB ke KPP paling lama berapa lama setelah terpenuhinya persyaratan subjektif?", "o": ["7 hari", "1 bulan", "3 bulan", "6 bulan"], "c": 1, "e": "Setiap WP wajib mendaftar paling lama 1 bulan setelah saat terpenuhinya persyaratan subjektif, dan diberikan SKT Objek Pajak PBB memuat NOP.", "p": 0, "topic": "Pendaftaran Objek PBB", "id": "pengawasan_q_86"}, {"q": "Jika Kepala KPP tidak menerbitkan keputusan dalam 10 hari kerja atas permohonan pendaftaran Objek Pajak PBB, maka...", "o": ["Permohonan dianggap ditolak otomatis", "Permohonan dianggap dikabulkan dan SKT diterbitkan maks. 1 hari kerja setelahnya", "WP harus mengajukan permohonan ulang", "Jangka waktu diperpanjang otomatis 10 hari lagi"], "c": 1, "e": "Jika 10 hari kerja terlampaui tanpa keputusan, permohonan dianggap dikabulkan dan SKT Objek Pajak PBB diterbitkan paling lama 1 hari kerja setelah jangka waktu berakhir.", "p": 0, "topic": "Pendaftaran Objek PBB", "id": "pengawasan_q_87"}, {"q": "Pencabutan SKT Objek Pajak PBB dilakukan terhadap Objek Pajak yang...", "o": ["Nilainya di bawah NJOPTKP", "Sudah tidak memenuhi persyaratan subjektif", "Dimiliki oleh WP badan asing", "Berada di luar Pulau Jawa"], "c": 1, "e": "Kepala KPP dapat mencabut SKT Objek Pajak PBB terhadap Objek Pajak yang sudah tidak memenuhi persyaratan subjektif sesuai ketentuan PBB.", "p": 0, "topic": "Pendaftaran Objek PBB", "id": "pengawasan_q_88"}, {"q": "Surat Pemberitahuan Objek Pajak PBB disampaikan DJP kepada WP pada tanggal 1 Februari Tahun Pajak terutang untuk sektor-sektor berikut, KECUALI...", "o": ["Perkebunan", "Pertambangan Minyak dan Gas Bumi", "Pertambangan untuk Pengusahaan Panas Bumi", "Perhutanan"], "c": 3, "e": "Tanggal 1 Februari berlaku untuk sektor Perkebunan, Migas, dan Panas Bumi. Sektor Perhutanan, Minerba, dan Lainnya menggunakan tanggal 31 Maret.", "p": 0, "topic": "Pelaporan Objek PBB", "id": "pengawasan_q_89"}, {"q": "Berapa lama batas waktu penyampaian SPOP setelah tanggal diterimanya Surat Pemberitahuan Objek Pajak?", "o": ["7 hari", "15 hari", "30 hari", "60 hari"], "c": 2, "e": "SPOP wajib disampaikan paling lama 30 hari setelah tanggal diterimanya Surat Pemberitahuan Objek Pajak, diisi jelas/benar/lengkap dan ditandatangani.", "p": 0, "topic": "Pelaporan Objek PBB", "id": "pengawasan_q_90"}, {"q": "Jika WP tidak dapat menyampaikan SPOP dalam 30 hari, WP dapat mengajukan penundaan dengan jangka waktu tambahan paling lama...", "o": ["3 hari", "7 hari", "15 hari", "30 hari"], "c": 1, "e": "Pengajuan penundaan harus diterima sebelum 30 hari berakhir; penundaan dilakukan paling lama 7 hari setelah jangka waktu 30 hari penyampaian berakhir.", "p": 0, "topic": "Pelaporan Objek PBB", "id": "pengawasan_q_91"}, {"q": "Apabila SPOP belum disampaikan setelah jangka waktu penyampaian/penundaan berakhir, Kepala KPP akan menerbitkan...", "o": ["SKPKB PBB langsung", "Surat Teguran", "STP PBB langsung", "Surat Paksa"], "c": 1, "e": "Kepala KPP menerbitkan Surat Teguran via Akun WP; WP wajib menyampaikan SPOP dalam 7 hari sejak teguran diterima, jika tidak maka dilakukan analisis risiko untuk usulan Pemeriksaan.", "p": 0, "topic": "Pelaporan Objek PBB", "id": "pengawasan_q_92"}, {"q": "Jika SPOP tidak memenuhi Penelitian Formal (misal tidak ditandatangani WP/kuasa), maka konsekuensinya adalah...", "o": ["SPOP dianggap tidak disampaikan", "SPOP tetap diproses dengan catatan", "Diberikan waktu 60 hari tambahan", "Langsung dilakukan Pemeriksaan"], "c": 0, "e": "Jika Penelitian Formal tidak terpenuhi (kelengkapan, tanda tangan, dokumen pendukung, batas waktu), SPOP dianggap tidak disampaikan.", "p": 0, "topic": "Pelaporan Objek PBB", "id": "pengawasan_q_93"}, {"q": "Pembetulan SPOP yang sudah disampaikan harus dilakukan paling lama...", "o": ["7 hari setelah SPOP awal disampaikan", "15 hari setelah berakhirnya 30 hari penyampaian SPOP awal", "30 hari setelah SPOP awal disampaikan", "60 hari setelah SPOP awal disampaikan"], "c": 1, "e": "Pembetulan SPOP disampaikan paling lama 15 hari setelah berakhirnya jangka waktu 30 hari penyampaian SPOP awal; jika melewati, dianggap tidak disampaikan.", "p": 0, "topic": "Pelaporan Objek PBB", "id": "pengawasan_q_94"}, {"q": "Pendataan Objek Pajak PBB yang dilakukan dengan cara mengolah data SPOP dan sistem administrasi DJP tanpa peninjauan lokasi disebut...", "o": ["Pendataan Lapangan", "Pendataan Kantor", "Pendataan Satelit", "Pendataan Material"], "c": 1, "e": "Pendataan Kantor dilakukan dengan mengolah data Objek Pajak dari SPOP dan/atau sistem administrasi DJP, meliputi pengumpulan data dan pemetaan — berbeda dari Pendataan Lapangan yang meninjau lokasi fisik.", "p": 0, "topic": "Pelaporan Objek PBB", "id": "pengawasan_q_95"}, {"q": "Jika WP menolak Pendataan Lapangan dan menolak tanda tangan berita acara penolakan, maka Petugas Pendataan akan...", "o": ["Membatalkan Pendataan", "Tetap melakukan Pendataan berdasarkan data yang dimiliki/diperoleh DJP", "Menunggu persetujuan WP tanpa batas waktu", "Melaporkan WP ke penyidik langsung"], "c": 1, "e": "Jika WP menolak tanda tangan surat pernyataan penolakan, Petugas Pendataan membuat berita acara penolakan, dan tetap melakukan Pendataan berdasarkan data yang dimiliki/diperoleh DJP, dilaporkan dalam Laporan Hasil Pendataan.", "p": 0, "topic": "Pelaporan Objek PBB", "id": "pengawasan_q_96"}, {"q": "PMK-81 Tahun 2024 mengatur Ketentuan Perpajakan dalam rangka Pelaksanaan apa?", "o": ["Sistem Inti Administrasi Perpajakan (Coretax/SIAP)", "Pemeriksaan Bukti Permulaan", "Penilaian Properti Nasional", "Reformasi Perpajakan Daerah"], "c": 0, "e": "PMK-81/2024 mengatur Ketentuan Perpajakan dalam rangka Pelaksanaan Sistem Inti Administrasi Perpajakan (SIAP/Coretax), berdasar amanah Pasal 9 Perpres 40/2018.", "p": 0, "topic": "PMK 81/2024 SIAP", "id": "pengawasan_q_97"}, {"q": "Penyesuaian ketentuan PMK 63/PMK.03/2021 merupakan pengaturan lebih lanjut dari amanah...", "o": ["Pasal 6 angka 18, Pasal 63A ayat (6), dan Pasal 63B ayat (5) PP 9/2021", "UU HPP semata", "UU Cipta Kerja Pasal 1 ayat (1)", "PMK 147/2017"], "c": 0, "e": "Dibutuhkan pengaturan lanjut atas amanah Pasal 6 Angka 18, Pasal 63A ayat (6), dan Pasal 63B ayat (5) PP 9/2021 tentang Perlakuan Perpajakan untuk Mendukung Kemudahan Berusaha, pelaksanaan UU Cipta Kerja.", "p": 0, "topic": "Elektronik Perpajakan", "id": "pengawasan_q_98"}, {"q": "Jika 1 dokumen elektronik dikirimkan WP melalui lebih dari satu kanal (Portal WP, laman terintegrasi, Contact Center), bukti penerimaan yang diakui adalah...", "o": ["Yang terakhir dikirim", "Yang pertama terekam sistem DJP", "Rata-rata waktu dari semua kanal", "Yang dipilih oleh WP secara manual"], "c": 1, "e": "Apabila 1 dokumen dikirimkan melalui beberapa kanal, bukti penerimaan yang diakui adalah yang pertama terekam sistem DJP.", "p": 0, "topic": "Elektronik Perpajakan", "id": "pengawasan_q_99"}, {"q": "Pengajuan aktivasi Akun WP disetujui apabila...", "o": ["WP membayar biaya aktivasi", "Alamat pos elektronik dan nomor telepon seluler WP telah tervalidasi", "WP mendatangi KPP secara langsung", "NPWP WP berstatus badan"], "c": 1, "e": "Pengajuan aktivasi Akun WP disetujui apabila alamat pos elektronik dan nomor telepon seluler WP telah tervalidasi.", "p": 0, "topic": "Elektronik Perpajakan", "id": "pengawasan_q_100"}, {"q": "Dua jenis Tanda Tangan Elektronik (TTE) yang dapat digunakan WP dalam penandatanganan dokumen elektronik adalah...", "o": ["TTE Tersertifikasi dan TTE Tidak Tersertifikasi", "TTE Pemerintah dan TTE Swasta", "TTE Nasional dan TTE Internasional", "TTE Sementara dan TTE Permanen"], "c": 0, "e": "TTE Tersertifikasi menggunakan Sertifikat Elektronik dari PSrE (opsional), sedangkan TTE Tidak Tersertifikasi menggunakan Kode Otorisasi DJP yang diterbitkan saat aktivasi Akun WP (juga opsional).", "p": 0, "topic": "Elektronik Perpajakan", "id": "pengawasan_q_101"}, {"q": "Untuk WP Instansi Pemerintah yang diwakili ASN/TNI/Polri, jenis PSrE (Penyelenggara Sertifikasi Elektronik) yang digunakan adalah...", "o": ["PSrE noninstansi", "PSrE instansi", "PSrE internasional", "PSrE swasta murni"], "c": 1, "e": "PSrE instansi (diakui Kominfo/ditunjuk Menteri) digunakan untuk WP Instansi Pemerintah yang diwakili ASN/TNI/Polri; PSrE noninstansi untuk WP selain itu.", "p": 0, "topic": "Elektronik Perpajakan", "id": "pengawasan_q_102"}, {"q": "Menteri Keuangan dapat bekerja sama dengan Instansi Pemerintah/lembaga/asosiasi/pihak lain untuk menyediakan fasilitas elektronik mencakup hal-hal berikut, KECUALI...", "o": ["Pemberian NPWP", "Pemberian KSWP", "Penyelenggaraan Faktur Pajak elektronik", "Penetapan tarif pajak baru"], "c": 3, "e": "Kerja sama Menkeu mencakup: pemberian NPWP, pemberian KSWP, penyelenggaraan bukti potput & Faktur Pajak elektronik, penyelenggaraan pembayaran/pelaporan SPT elektronik — bukan penetapan tarif pajak (itu kewenangan legislasi).", "p": 0, "topic": "Elektronik Perpajakan", "id": "pengawasan_q_103"}, {"q": "Berdasarkan ketentuan peralihan PMK 63/2021 (via PMK 81/2024), penggunaan sertifikat elektronik/EFIN/kode verifikasi lama dari DJP masih dapat digunakan sampai dengan...", "o": ["Masa Pajak Desember 2023", "Masa Pajak Desember 2024/Tahun Pajak 2024", "Masa Pajak Desember 2025", "Tanpa batas waktu"], "c": 1, "e": "Sertel/EFIN/kode verifikasi (dari DJP) serta TTE tidak tersertifikasi dapat digunakan s.d. Masa Pajak Desember 2024 atau Tahun Pajak 2024.", "p": 0, "topic": "Elektronik Perpajakan", "id": "pengawasan_q_104"}, {"q": "Sejak kapan Segel Elektronik pada Keputusan DJP dan sarana Aktivasi Akun WP wajib mulai digunakan menurut ketentuan peralihan?", "o": ["Paling lambat mulai 1 Januari 2025", "Paling lambat mulai 1 Juli 2024", "Paling lambat mulai 1 Januari 2024", "Tidak diatur batas waktunya"], "c": 0, "e": "Penggunaan Segel Elektronik pada Keputusan DJP, serta sarana Aktivasi Akun WP/Sertifikat Elektronik/Kode Otorisasi untuk WP, berlaku paling lambat mulai 1 Januari 2025.", "p": 0, "topic": "Elektronik Perpajakan", "id": "pengawasan_q_105"}, {"q": "Dirjen Pajak berwenang menetapkan hal-hal berikut terkait tempat pendaftaran WP, KECUALI...", "o": ["Tempat tinggal/kedudukan WP jika memiliki lebih dari satu", "Tempat terdaftar bagi WP dengan kriteria tertentu", "Tempat pendaftaran tertentu sebagai tempat pendaftaran WP", "Besaran tarif pajak WP tersebut"], "c": 3, "e": "Dirjen Pajak berwenang menetapkan tempat tinggal/kedudukan ganda, tempat terdaftar kriteria tertentu, dan tempat pendaftaran tertentu — bukan menetapkan tarif pajak.", "p": 0, "topic": "Pendaftaran WP", "id": "pengawasan_q_106"}, {"q": "WP Orang Pribadi Penduduk menggunakan identitas perpajakan berupa...", "o": ["Nomor 16 digit buatan sistem DJP", "NIK yang telah divalidasi/diaktivasi sebagai NPWP", "Nomor paspor", "Nomor Kartu Keluarga"], "c": 1, "e": "WP OP Penduduk menggunakan NIK yang telah diaktivasi sebagai NPWP; WP OP Bukan Penduduk menggunakan nomor identitas perpajakan format 16 digit dari sistem DJP.", "p": 0, "topic": "Pendaftaran WP", "id": "pengawasan_q_107"}, {"q": "WP OP yang melakukan kegiatan usaha atau pekerjaan bebas wajib mendaftarkan diri paling lama...", "o": ["7 hari sejak kegiatan dimulai", "1 bulan setelah kegiatan usaha/pekerjaan bebas mulai dilakukan", "Akhir bulan berikutnya setelah penghasilan melebihi PTKP", "1 tahun sejak kegiatan dimulai"], "c": 1, "e": "WP OP yang melakukan kegiatan usaha/pekerjaan bebas (termasuk Pengusaha Tertentu) wajib mendaftar paling lama 1 bulan setelah kegiatan mulai dilakukan.", "p": 0, "topic": "Pendaftaran WP", "id": "pengawasan_q_108"}, {"q": "WP OP yang tidak melakukan kegiatan usaha namun memperoleh penghasilan di atas PTKP wajib mendaftar paling lambat...", "o": ["1 bulan sejak penghasilan diterima", "Akhir bulan berikutnya setelah akumulasi penghasilan mencapai/melebihi PTKP", "Akhir tahun pajak berjalan", "3 bulan sejak penghasilan diterima"], "c": 1, "e": "WP OP yang tidak usaha namun menerima penghasilan dengan akumulasi mencapai/melebihi PTKP pada tahun berjalan wajib mendaftar paling lambat akhir bulan berikutnya.", "p": 0, "topic": "Pendaftaran WP", "id": "pengawasan_q_109"}, {"q": "WP OP Bukan Penduduk yang mendaftarkan diri wajib melampirkan dokumen berikut, KECUALI...", "o": ["Salinan paspor", "Pasfoto berwarna WP", "Pasfoto WP sedang memegang paspor", "Surat keterangan domisili dari kelurahan Indonesia"], "c": 3, "e": "Dokumen WP OP Bukan Penduduk: salinan paspor, pasfoto berwarna, dan pasfoto memegang paspor — bukan surat keterangan domisili dari kelurahan Indonesia (karena bukan penduduk).", "p": 0, "topic": "Pendaftaran WP", "id": "pengawasan_q_110"}, {"q": "NPWP Secara Jabatan untuk WP OP diterbitkan Kepala KPP berdasarkan...", "o": ["Permintaan WP secara lisan", "Hasil penelitian administrasi sesuai data/informasi yang dimiliki/diperoleh DJP, termasuk dari ekstensifikasi", "Hasil voting di kantor pajak", "Rekomendasi dari perusahaan tempat WP bekerja"], "c": 1, "e": "NPWP Secara Jabatan diterbitkan jika WP tidak melaksanakan kewajiban pendaftaran, berdasarkan hasil penelitian administrasi sesuai data/informasi DJP, termasuk data dari kegiatan ekstensifikasi.", "p": 0, "topic": "Pendaftaran WP", "id": "pengawasan_q_111"}, {"q": "Perubahan data WP OP yang menyebabkan pemindahan wilayah kerja KPP diterbitkan keputusannya dalam waktu...", "o": ["1 hari kerja", "5 hari kerja", "10 hari kerja", "30 hari kerja"], "c": 1, "e": "Perubahan data biasa diterbitkan 1 hari kerja; namun perubahan yang menyebabkan pemindahan wilayah kerja KPP terdaftar diterbitkan dalam 5 hari kerja.", "p": 0, "topic": "Pendaftaran WP", "id": "pengawasan_q_112"}, {"q": "Manakah dari berikut yang BUKAN termasuk kriteria WP OP dapat ditetapkan sebagai WP Nonaktif?", "o": ["Melakukan usaha namun menghentikan usahanya", "Memiliki penghasilan di bawah PTKP dan tidak melakukan usaha", "Memiliki utang pajak yang belum dibayar", "WNI Penduduk yang berniat menjadi subjek pajak luar negeri namun belum memenuhi syarat"], "c": 2, "e": "Memiliki utang pajak BUKAN kriteria penetapan WP Nonaktif — justru menjadi salah satu syarat yang MENGHALANGI penghapusan NPWP. Kriteria Nonaktif mencakup penghentian usaha, penghasilan di bawah PTKP, dan niat menjadi SPLN yang belum terpenuhi syaratnya.", "p": 0, "topic": "WP Nonaktif", "id": "pengawasan_q_113"}, {"q": "Jika WP OP WNI Penduduk yang telah ditetapkan Nonaktif (karena berniat menjadi SPLN) ternyata kemudian tidak mengajukan permohonan Surat Keterangan WNI memenuhi syarat SPLN, maka...", "o": ["Tetap berstatus Nonaktif selamanya", "Penetapan Nonaktif batal, WP tetap SPDN, dan dikenai pajak sesuai ketentuan SPDN", "NPWP langsung dihapus", "WP otomatis menjadi SPLN"], "c": 1, "e": "Jika kemudian tidak memenuhi syarat atau tidak mengajukan permohonan, penetapan Nonaktif menjadi batal, WP tetap merupakan subjek pajak dalam negeri, dan dikenai pajak sesuai ketentuan yang berlaku bagi SPDN.", "p": 0, "topic": "WP Nonaktif", "id": "pengawasan_q_114"}, {"q": "Penghapusan NPWP WP OP hanya dapat dilakukan sepanjang WP memenuhi syarat berikut, KECUALI...", "o": ["Tidak mempunyai utang pajak", "Tidak sedang dilakukan pemeriksaan bukti permulaan/penyidikan", "Tidak sedang dalam proses MAP atau APA", "Telah menyampaikan SPT Tahunan terakhir"], "c": 3, "e": "Syarat penghapusan NPWP: tidak punya utang pajak, tidak sedang diperiksa/bukper/penyidikan/penuntutan, tidak proses MAP/APA, dan tidak proses upaya administratif/hukum — bukan soal penyampaian SPT Tahunan terakhir.", "p": 0, "topic": "Penghapusan NPWP", "id": "pengawasan_q_115"}, {"q": "Keputusan atas permohonan penghapusan NPWP WP OP diterbitkan paling lama...", "o": ["1 bulan", "3 bulan", "6 bulan", "1 tahun"], "c": 2, "e": "Keputusan penghapusan NPWP diterbitkan paling lama 6 bulan sejak permohonan diterima lengkap; jika terlampaui, dianggap dikabulkan dan surat keputusan harus terbit maks. 1 bulan setelahnya.", "p": 0, "topic": "Penghapusan NPWP", "id": "pengawasan_q_116"}, {"q": "WP Warisan Belum Terbagi menggunakan NPWP...", "o": ["NPWP baru yang didaftarkan khusus untuk warisan", "NPWP WP Orang Pribadi pewaris", "NPWP salah satu ahli waris yang dipilih", "Tidak memerlukan NPWP"], "c": 1, "e": "WP Warisan Belum Terbagi menggunakan NPWP dari WP Orang Pribadi yang meninggalkan warisan (pewaris), bukan NPWP baru atau NPWP ahli waris.", "p": 0, "topic": "Warisan Belum Terbagi", "id": "pengawasan_q_117"}, {"q": "Jika pewaris belum memiliki NPWP dan dari warisan diperoleh penghasilan, siapa yang wajib mendaftarkan NPWP atas nama Warisan Belum Terbagi?", "o": ["Notaris yang mengurus warisan", "Wakil (ahli waris/pelaksana wasiat/pengurus harta peninggalan)", "Kantor Urusan Agama", "Pengadilan Negeri"], "c": 1, "e": "Wakil dari Warisan Belum Terbagi — meliputi salah seorang ahli waris, pelaksana wasiat, atau pihak yang mengurus harta peninggalan — wajib mendaftarkan diri paling lambat akhir bulan berikutnya setelah WP OP meninggal.", "p": 0, "topic": "Warisan Belum Terbagi", "id": "pengawasan_q_118"}, {"q": "WP Badan wajib mendaftarkan diri pada KPP paling lama...", "o": ["7 hari setelah didirikan", "1 bulan setelah didirikan/bertempat kedudukan di Indonesia", "3 bulan setelah didirikan", "1 tahun setelah mulai beroperasi"], "c": 1, "e": "WP Badan wajib mendaftar paling lama 1 bulan setelah saat pendirian atau bertempat kedudukan di Indonesia.", "p": 0, "topic": "Pendaftaran WP Badan", "id": "pengawasan_q_119"}, {"q": "Badan yang tidak memenuhi persyaratan subjektif atau tidak termasuk subjek pajak sesuai Pasal 3 UU PPh tetap dapat diberikan NPWP untuk tujuan...", "o": ["Mendapatkan insentif pajak khusus", "Kepentingan administrasi perpajakan", "Menghindari sanksi pidana", "Memperoleh fasilitas kredit bank"], "c": 1, "e": "Badan yang tidak memenuhi syarat subjektif atau bukan subjek pajak dapat tetap diberi NPWP semata-mata untuk kepentingan administrasi perpajakan.", "p": 0, "topic": "Pendaftaran WP Badan", "id": "pengawasan_q_120"}, {"q": "WP Instansi Pemerintah Daerah didaftarkan oleh...", "o": ["Kepala IP Daerah, PA, atau Kepala BLUD", "Gubernur secara langsung", "DPRD setempat", "Kementerian Dalam Negeri"], "c": 0, "e": "Pendaftaran WP IP Daerah dilakukan oleh Kepala Instansi Pemerintah Daerah, Pengguna Anggaran (PA), atau Kepala BLUD.", "p": 0, "topic": "Pendaftaran WP Instansi Pemerintah", "id": "pengawasan_q_121"}, {"q": "WP Instansi Pemerintah wajib melaporkan subunit organisasinya ke KPP untuk tujuan apa?", "o": ["Memperoleh Nomor Identitas Tempat Kegiatan Usaha (NITKU)", "Memperoleh izin usaha baru", "Mendaftar sebagai PKP otomatis", "Mendapatkan subsidi anggaran"], "c": 0, "e": "WP Instansi Pemerintah wajib melaporkan subunit organisasinya ke KPP tempat WP IP terdaftar untuk memperoleh NITKU bagi setiap subunit organisasi.", "p": 0, "topic": "Pendaftaran WP Instansi Pemerintah", "id": "pengawasan_q_122"}, {"q": "Pengusaha Kecil dikecualikan dari kewajiban melaporkan usahanya untuk dikukuhkan sebagai PKP, KECUALI jika...", "o": ["Pengusaha tersebut sejak semula bermaksud melakukan penyerahan dan/atau ekspor BKP/JKP, atau memilih secara sukarela", "Pengusaha berlokasi di ibu kota provinsi", "Pengusaha memiliki lebih dari 10 karyawan", "Pengusaha berbentuk badan hukum PT"], "c": 0, "e": "Pengusaha Kecil tetap dapat/boleh memilih dikukuhkan sebagai PKP jika sejak semula bermaksud melakukan penyerahan/ekspor BKP/JKP, atau secara sukarela memilih dikukuhkan.", "p": 0, "topic": "Pengukuhan PKP", "id": "pengawasan_q_123"}, {"q": "Penyedia Jasa Kantor Virtual yang digunakan sebagai tempat pelaporan usaha harus memenuhi syarat berikut, KECUALI...", "o": ["Telah dikukuhkan sebagai PKP", "Menyediakan ruang fisik untuk kegiatan usaha Pengusaha yang akan dikukuhkan", "Secara nyata melakukan layanan pendukung kantor", "Berlokasi di gedung bertingkat minimal 10 lantai"], "c": 3, "e": "Syarat Penyedia Jasa Kantor Virtual: telah PKP, menyediakan ruang fisik, dan secara nyata melayani kegiatan pendukung kantor — tidak ada syarat jumlah lantai gedung.", "p": 0, "topic": "Pengukuhan PKP", "id": "pengawasan_q_124"}, {"q": "Setelah permohonan pengukuhan PKP diterima lengkap, Kepala KPP melakukan penelitian dalam jangka waktu...", "o": ["1 hari kerja", "5 hari kerja", "10 hari kerja", "30 hari kerja"], "c": 2, "e": "Setelah menerbitkan Surat Keterangan Permohonan Pengukuhan PKP (1 hari kerja), Kepala KPP melakukan Penelitian selama 10 hari kerja.", "p": 0, "topic": "Pengukuhan PKP", "id": "pengawasan_q_125"}, {"q": "Jika permohonan pengukuhan PKP diterima, Pengusaha diberikan akses pembuatan Faktur Pajak sejak...", "o": ["Tanggal permohonan diajukan", "Tanggal dimulainya kewajiban sebagai PKP sebagaimana tercantum dalam SPPKP", "Tanggal SPPKP dicetak fisik", "1 tahun setelah pengukuhan"], "c": 1, "e": "Akses pembuatan Faktur Pajak diberikan sejak tanggal dimulainya kewajiban sebagai PKP sebagaimana tercantum dalam Surat Pengukuhan Pengusaha Kena Pajak (SPPKP).", "p": 0, "topic": "Pengukuhan PKP", "id": "pengawasan_q_126"}, {"q": "Akses pembuatan Faktur Pajak PKP dapat dinonaktifkan apabila PKP...", "o": ["Terindikasi menyalahgunakan atau menggunakan tanpa hak pengukuhan PKP", "Mengganti alamat kantor", "Berpindah KPP terdaftar", "Melaporkan SPT Masa PPN Nihil"], "c": 0, "e": "Penonaktifan akses pembuatan Faktur Pajak dilakukan jika PKP terindikasi menyalahgunakan/menggunakan tanpa hak pengukuhan PKP, dan/atau tidak melaksanakan kewajiban sesuai kriteria Dirjen Pajak.", "p": 0, "topic": "Pengukuhan PKP", "id": "pengawasan_q_127"}, {"q": "Jika PKP yang akses pembuatan Faktur Pajaknya dinonaktifkan tidak menyampaikan klarifikasi dalam jangka waktu 30 hari, konsekuensinya adalah...", "o": ["Diberikan perpanjangan otomatis 30 hari lagi", "Pengukuhan PKP dicabut", "Dikenai denda administrasi saja tanpa pencabutan", "Diberikan surat peringatan tertulis pertama"], "c": 1, "e": "Jika PKP tidak menyampaikan klarifikasi dalam 30 hari sejak penonaktifan akses Faktur Pajak (atau klarifikasinya ditolak), Pengukuhan PKP dicabut.", "p": 0, "topic": "Pengukuhan PKP", "id": "pengawasan_q_128"}, {"q": "Pencabutan Pengukuhan PKP, baik berdasarkan permohonan maupun jabatan, melalui pemeriksaan dilakukan dalam jangka waktu paling lama...", "o": ["1 bulan", "3 bulan", "6 bulan", "12 bulan"], "c": 2, "e": "Pencabutan PKP melalui pemeriksaan dilakukan paling lama 6 bulan; jika terlampaui tanpa keputusan, dianggap dikabulkan dan Surat Pencabutan diterbitkan maks. 1 bulan setelahnya.", "p": 0, "topic": "Pengukuhan PKP", "id": "pengawasan_q_129"}, {"q": "Manakah berikut yang BUKAN termasuk kriteria Pencabutan PKP secara jabatan melalui penelitian administrasi?", "o": ["PKP berstatus WP Nonaktif", "PKP OP meninggal dunia tanpa warisan", "PKP BUT menghentikan kegiatan usaha di Indonesia", "PKP mengajukan permohonan kredit investasi baru"], "c": 3, "e": "Kriteria pencabutan PKP secara jabatan meliputi status WP Nonaktif, akses Faktur Pajak dinonaktifkan tanpa klarifikasi, penyalahgunaan pengukuhan (putusan inkracht), WP OP meninggal tanpa warisan, dan BUT menghentikan usaha — bukan pengajuan kredit investasi.", "p": 0, "topic": "Pengukuhan PKP", "id": "pengawasan_q_130"}, {"q": "Penerbitan SKP dan/atau STP terkait kewajiban PPN TIDAK mengharuskan Pengusaha dikukuhkan sebagai PKP, KECUALI dalam hal...", "o": ["Penghitungan PPN dalam SKPKB/SKPKBT menerapkan pedoman pengkreditan Pajak Masukan sesuai Pasal 9 ayat (9a) UU PPN", "Pengusaha berdomisili di luar Jakarta", "Nilai SKP di atas Rp1 miliar", "PKP sudah pernah dicabut sebelumnya"], "c": 0, "e": "Pengecualian: jika penghitungan PPN dalam SKPKB/SKPKBT menerapkan pedoman pengkreditan Pajak Masukan sesuai Pasal 9 ayat (9a) UU PPN, Pengusaha harus dikukuhkan PKP terlebih dahulu.", "p": 0, "topic": "Pengukuhan PKP", "id": "pengawasan_q_131"}, {"q": "Penghapusan NPWP dan/atau Pencabutan Pengukuhan PKP dimaksudkan untuk...", "o": ["Menghapus seluruh hak dan kewajiban perpajakan WP secara permanen", "Kepentingan administrasi perpajakan tanpa menghilangkan hak dan kewajiban perpajakan WP", "Memberikan amnesti pajak kepada WP", "Mencabut status kewarganegaraan WP"], "c": 1, "e": "Penghapusan NPWP dan/atau Pencabutan PKP dimaksudkan untuk kepentingan administrasi perpajakan serta TIDAK menghilangkan hak dan kewajiban perpajakan yang harus dilaksanakan oleh WP/PKP yang bersangkutan.", "p": 0, "topic": "Pengukuhan PKP", "id": "pengawasan_q_132"}, {"q": "Berdasarkan Pasal 94 PMK 242/2014 (sebagaimana diubah), PPh Pasal 21, 22, 23, 25, dan 26 yang dipotong/dipungut wajib disetorkan paling lama...", "o": ["Tanggal 10 bulan berikutnya", "Tanggal 15 bulan berikutnya", "Akhir bulan berikutnya", "Tanggal 20 bulan berikutnya"], "c": 1, "e": "Jatuh tempo penyetoran berbagai jenis PPh (Pasal 4(2), 15, 21, 22, 23, 25, 26) kini paling lama tanggal 15 bulan berikutnya (sebelumnya tanggal 10).", "p": 0, "topic": "Pembayaran & Penyetoran Pajak", "id": "pengawasan_q_133"}, {"q": "PPh Pasal 25 bagi WP dengan kriteria tertentu sesuai Pasal 3 ayat (3b) UU KUP disetor paling lama...", "o": ["Tanggal 10 bulan berikutnya", "Tanggal 15 bulan berikutnya setelah berakhirnya Masa Pajak terakhir", "Akhir Masa Pajak terakhir (tanpa batas tambahan)", "Tanggal 20 bulan berikutnya"], "c": 1, "e": "PPh Pasal 25 bagi WP kriteria tertentu (Pasal 3 ayat 3b UU KUP) kini disetor paling lama tanggal 15 bulan berikutnya setelah berakhirnya Masa Pajak terakhir — sebelumnya pada akhir masa pajak terakhir.", "p": 0, "topic": "Pembayaran & Penyetoran Pajak", "id": "pengawasan_q_134"}, {"q": "Kekurangan pembayaran pajak yang terutang berdasarkan SPT Tahunan (PPh dan Pajak Karbon) harus dilunasi...", "o": ["Sebelum SPT Tahunan disampaikan dan tidak melebihi batas waktu penyampaian SPT Tahunan", "Setelah SPT Tahunan disampaikan", "Dalam waktu 1 bulan setelah SPT disampaikan", "Sebelum tahun pajak berakhir"], "c": 0, "e": "Pasal 95: kekurangan pembayaran pajak terutang berdasar SPT Tahunan untuk PPh dan Pajak Karbon harus dilunasi sebelum SPT Tahunan disampaikan, tetapi tidak melebihi batas waktu penyampaian SPT Tahunan.", "p": 0, "topic": "Pembayaran & Penyetoran Pajak", "id": "pengawasan_q_135"}, {"q": "Jika WP tidak mengajukan keberatan atas SKP, batas waktu pelunasan SKP tersebut adalah...", "o": ["1 bulan sejak tanggal diterbitkan", "3 bulan sejak tanggal diterbitkan", "6 bulan sejak tanggal diterbitkan", "1 tahun sejak tanggal diterbitkan"], "c": 0, "e": "Atas SKP yang tidak disetujui/tidak diajukan keberatan, WP wajib melunasi paling lama 1 bulan sejak tanggal diterbitkan (demikian pula untuk SK Keberatan/Putusan Banding/PK yang tidak dikabulkan).", "p": 0, "topic": "Pembayaran & Penyetoran Pajak", "id": "pengawasan_q_136"}, {"q": "Jika dalam Pembahasan Akhir Hasil Pemeriksaan WP menyetujui seluruh jumlah pajak yang masih harus dibayar, pelunasan dilakukan paling lama...", "o": ["1 bulan sejak tanggal diterbitkan ketetapan", "7 hari sejak pembahasan selesai", "3 bulan sejak pembahasan selesai", "Sebelum SPHP diterbitkan"], "c": 0, "e": "Jika WP menyetujui seluruh jumlah pajak yang masih harus dibayar dalam Pembahasan Akhir Hasil Pemeriksaan, pelunasan dilakukan paling lama 1 bulan sejak tanggal diterbitkannya ketetapan.", "p": 0, "topic": "Pembayaran & Penyetoran Pajak", "id": "pengawasan_q_137"}, {"q": "Jangka waktu pelunasan STP/ketetapan bagi WP usaha kecil dan WP di daerah tertentu dapat diperpanjang menjadi paling lama...", "o": ["2 bulan sejak tanggal penerbitan", "3 bulan sejak tanggal penerbitan", "6 bulan sejak tanggal penerbitan", "1 tahun sejak tanggal penerbitan"], "c": 0, "e": "Bagi WP usaha kecil dan WP di daerah tertentu, jangka waktu pelunasan 1 bulan dapat diperpanjang menjadi paling lama 2 bulan sejak tanggal penerbitan ketetapan.", "p": 0, "topic": "Pembayaran & Penyetoran Pajak", "id": "pengawasan_q_138"}, {"q": "Kriteria WP Badan Usaha Kecil menurut PMK 242/2014 (sebagaimana diubah) mencakup peredaran bruto tidak melebihi...", "o": ["Rp1.800.000.000 setahun", "Rp4.800.000.000 setahun", "Rp10.000.000.000 setahun", "Rp50.000.000.000 setahun"], "c": 1, "e": "WP badan usaha kecil adalah WP Badan (bukan BUT) yang menerima penghasilan dari usaha (tidak termasuk penghasilan jasa sehubungan pekerjaan bebas) dengan peredaran bruto tidak melebihi Rp4.800.000.000 dalam 1 Tahun Pajak.", "p": 0, "topic": "Pembayaran & Penyetoran Pajak", "id": "pengawasan_q_139"}, {"q": "Pembayaran pajak ke Kas Negara dilakukan melalui layanan/kanal pembayaran yang disediakan oleh...", "o": ["Bank Indonesia langsung", "Collecting Agent sesuai ketentuan sistem penerimaan negara secara elektronik", "Kantor Pos saja", "Kantor Pelayanan Pajak langsung"], "c": 1, "e": "Pembayaran pajak disetorkan ke Kas Negara melalui layanan atau kanal pembayaran yang disediakan oleh Collecting Agent sesuai ketentuan sistem penerimaan negara secara elektronik.", "p": 0, "topic": "Pembayaran & Penyetoran Pajak", "id": "pengawasan_q_140"}, {"q": "Jenis pajak yang BARU ditambahkan dalam cakupan pembayaran menurut penyesuaian PMK 242/2014 adalah...", "o": ["Pajak Penghasilan", "Pajak Pertambahan Nilai", "Pajak Karbon", "Bea Meterai"], "c": 2, "e": "Pajak Karbon merupakan jenis pajak baru yang ditambahkan dalam cakupan Surat Setoran Pajak/sarana pembayaran — sebelumnya belum diatur.", "p": 0, "topic": "Pembayaran & Penyetoran Pajak", "id": "pengawasan_q_141"}, {"q": "Sarana administrasi lain yang digunakan untuk membuktikan pembayaran dengan metode pemindahbukuan adalah...", "o": ["Bukti Penerimaan Negara (BPN)", "Bukti Pbk (Pemindahbukuan)", "Surat Setoran Pabean, Cukai, dan Pajak", "Surat Perintah Pencairan Dana (SP2D)"], "c": 1, "e": "Pembayaran dan penyetoran menggunakan Deposit Pajak dilakukan melalui Pemindahbukuan, dibuktikan dengan Bukti Pbk, sah apabila ditandatangani pejabat berwenang.", "p": 0, "topic": "Pembayaran & Penyetoran Pajak", "id": "pengawasan_q_142"}, {"q": "Bukti Penerimaan Negara (BPN) dan Surat Setoran Pabean, Cukai, dan Pajak dinyatakan sah apabila...", "o": ["Divalidasi dengan Nomor Transaksi Penerimaan Negara (NTPN)", "Ditandatangani oleh Kepala KPP", "Dicap basah oleh bank", "Diserahkan langsung ke loket pajak"], "c": 0, "e": "BPN dan Surat Setoran Pabean/Cukai/Pajak sah apabila divalidasi dengan Nomor Transaksi Penerimaan Negara (NTPN).", "p": 0, "topic": "Pembayaran & Penyetoran Pajak", "id": "pengawasan_q_143"}, {"q": "Surat Perintah Pencairan Dana (SP2D), sebagai sarana administrasi lain pembayaran pajak, dinyatakan sah ap
